        ### Tipo 4: Falha de Deploy (Erro de Código)
        **Definição:** Erro causado por bug no código ou configuração incorreta.

        **Exemplos:**
        - NullPointerException em transformação
        - Divisão por zero em cálculo
        - Índice fora de intervalo em array
        - Configuração incorreta (ex: caminho de arquivo errado)
        - Incompatibilidade de versão de biblioteca

        **Detecção:**
        ```python
        # Erro é de deploy se:
        # 1. Mensagem contém "NullPointerException", "IndexOutOfBoundsException", "ZeroDivisionError"
        # 2. Erro é de lógica (não de I/O)
        # 3. Afeta todos os eventos (não apenas alguns)
        def is_deploy_error(exception):
            msg = str(exception).lower()
            deploy_keywords = ["nullpointer", "indexoutofbounds", "zerodivision", "attributeerror", "keyerror"]
            return any(keyword in msg for keyword in deploy_keywords)
        ```

        **Métrica:**
        ```
        forge_deploy_errors_total (counter)
        forge_deploy_errors_by_type (histogram: nullpointer, indexoutofbounds, zerodivision, etc)
        ```

        **Resposta Automática:**
        1. Parar processamento imediatamente (não continuar, pois vai falhar em todos os eventos)
        2. Alertar on-call com severidade CRITICAL
        3. Não enviar para DLQ (pois reprocessamento também falhará)
        4. Não fazer commit de offsets (para reprocessar depois de fix)

        **Resposta Manual (On-Call):**
        1. Verificar logs de erro para entender causa
        2. Fazer rollback para versão anterior (se possível)
        3. Ou fazer fix rápido e redeploy
        4. Após fix: job de streaming retoma automaticamente (offsets não foram commitados)

        **Exemplo de Implementação:**
        ```python
        def safe_transform(df, transform_func):
            """Executar transformação com detecção de erro de deploy"""
            try:
                return transform_func(df)
            except Exception as e:
                if is_deploy_error(e):
                    logger.critical(f"Deploy error detectado: {e}")
                    # Alertar on-call
                    send_alert("CRITICAL", f"Deploy error: {e}")
                    # Parar processamento
                    raise
                else:
                    # Outro tipo de erro, continuar
                    logger.warning(f"Erro não-crítico: {e}")
                    return df
        ```

        ---

        ### Tipo 5: Falha de Lógica de Negócio (Erro de Regra)
        **Definição:** Evento viola regra de negócio (ex: tenant não existe, métrica não é conhecida).

        **Exemplos:**
        - Tenant não existe no banco de dados de configuração
        - Métrica não é conhecida (não está em lista de métricas válidas)
        - Valor de métrica viola SLA (ex: latência > 1 hora)
        - Evento é duplicado (mesmo `event_id` já foi processado)

        **Detecção:**
        ```python
        # Erro é de lógica de negócio se:
        # 1. Validação de regra falha (ex: tenant não existe)
        # 2. Evento é duplicado
        # 3. Valor viola SLA
        def validate_business_logic(event, config):
            """Validar regras de negócio"""
            # Verificar se tenant existe
            if event["tenant_id"] not in config["valid_tenants"]:
                return False, "UNKNOWN_TENANT"
            
            # Verificar se métrica é conhecida
            if event["metric_name"] not in config["valid_metrics"]:
                return False, "UNKNOWN_METRIC"
            
            # Verificar se valor viola SLA
            if event["timestamp"] < (time.time() - 3600):  # > 1 hora atrás
                return False, "EVENT_TOO_OLD"
            
            return True, None
        ```

        **Métrica:**
        ```
        forge_business_logic_errors_total (counter)
        forge_business_logic_errors_by_reason (histogram: unknown_tenant, unknown_metric, event_too_old, duplicate)
        ```

        **Resposta Automática:**
        1. Enviar evento para DLQ (`forge-events-business-logic-error`)
        2. Incrementar métrica
        3. Continuar processando próximos eventos
        4. Alertar se taxa > 1000 eventos/min (possível problema de configuração)

        **Resposta Manual (On-Call):**
        1. Inspecionar DLQ para entender padrão de erro
        2. Se tenant desconhecido: verificar se tenant foi criado corretamente
        3. Se métrica desconhecida: verificar se métrica foi registrada no config
        4. Se evento muito antigo: verificar se há atraso no pipeline
        5. Reprocessar DLQ após correção (ver seção 3: Replay)

        ---

        ## Resumo de Classificação

        | Tipo | Causa | Detecção | Resposta Automática | Resposta Manual |
        |------|-------|----------|-------------------|-----------------|
        | **1. Evento Inválido** | Dados ruins | Schema validation | → DLQ | Inspecionar, corrigir origem, replay |
        | **2. Falha Transitória** | Erro temporário | Timeout, unavailable | Retry com backoff | Verificar infraestrutura, replay |
        | **3. Falha de Dependência** | Serviço externo offline | Connection refused | Aguardar, não commit | Verificar serviço, aguardar recuperação |
        | **4. Falha de Deploy** | Bug no código | NullPointer, IndexError | Parar, alertar CRITICAL | Rollback ou fix, redeploy |
        | **5. Falha de Lógica** | Regra de negócio | Validação falha | → DLQ | Inspecionar, corrigir config, replay |

        ---

        ## Matriz de Decisão

        ```python
        def classify_and_respond_to_failure(exception, event, config):
            """Classificar falha e executar resposta automática"""
            
            # Tipo 1: Evento Inválido
            if is_invalid_event(event):
                send_to_dlq(event, "forge-events-invalid", "INVALID_EVENT")
                increment_metric("forge_invalid_events_total")
                return "SKIP"  # Continuar processando
            
            # Tipo 2: Falha Transitória
            if is_transient_error(exception):
                try:
                    return retry_with_backoff(lambda: process_event(event))
                except:
                    send_to_dlq(event, "forge-events-retry-exhausted", "TRANSIENT_ERROR")
                    increment_metric("forge_transient_errors_total")
                    return "SKIP"
            
            # Tipo 3: Falha de Dependência
            if is_dependency_error(exception):
                if wait_for_dependency(get_service_name(exception)):
                    return retry_with_backoff(lambda: process_event(event))
                else:
                    logger.error("Dependência não recuperou, não commitando offsets")
                    return "STOP"  # Parar processamento
            
            # Tipo 4: Falha de Deploy
            if is_deploy_error(exception):
                send_alert("CRITICAL", f"Deploy error: {exception}")
                return "STOP"  # Parar processamento
            
            # Tipo 5: Falha de Lógica de Negócio
            if is_business_logic_error(event, config):
                send_to_dlq(event, "forge-events-business-logic-error", "BUSINESS_LOGIC_ERROR")
                increment_metric("forge_business_logic_errors_total")
                return "SKIP"
            
            # Erro desconhecido
            logger.error(f"Erro desconhecido: {exception}")
            send_to_dlq(event, "forge-events-unknown-error", "UNKNOWN_ERROR")
            return "SKIP"
        ```

