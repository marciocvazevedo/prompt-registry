        ### Categoria 4: Frescor dos Dados (Latência de Ponta a Ponta)

        #### Métrica 4.1: Latência de Ponta a Ponta (p95)
        **Definição:** Tempo decorrido desde a chegada do evento no Relay até estar consultável no DW.
        **Tipo:** Histogram (distribuição de valores)
        **Fórmula:**
        ```
        latência_e2e = timestamp_consultável_dw - timestamp_chegada_relay
        ```
        **Granularidade:** Por tenant, por tabela, percentis (p50, p95, p99)
        **Retenção:** 15 dias
        **Ponto de Instrumentação:** 
        - Relay: timestamp de chegada (nativo)
        - DW: timestamp de escrita (instrumentado)
        **Métrica Prometheus:**
        ```
        forge_latency_e2e_seconds_bucket{tenant="t1", table="aggregated", le="1"}
        forge_latency_e2e_seconds_bucket{tenant="t1", table="aggregated", le="30"}
        forge_latency_e2e_seconds_bucket{tenant="t1", table="aggregated", le="120"}
        forge_latency_e2e_seconds_bucket{tenant="t1", table="aggregated", le="+Inf"}
        ```
        **Alerta:**
        ```
        ForgeLatencyE2EHigh: p95 > 120 s por 5 min
        Severidade: CRITICAL
        Ação: Verificar lag, taxa de consumo, latência de processamento
        ```
        **Validação:**
        - [ ] Métrica é coletada a cada evento
        - [ ] p95 é < 120 s em produção (SLO de Etapa 2)
        - [ ] p95 aumenta quando há problema em qualquer etapa

        ---

        #### Métrica 4.2: Watermark Latency
        **Definição:** Atraso do watermark em relação ao tempo atual.
        **Tipo:** Gauge (valor instantâneo)
        **Fórmula:**
        ```
        watermark_latency = tempo_atual - watermark_timestamp
        ```
        **Granularidade:** Por consumer group
        **Retenção:** 15 dias
        **Ponto de Instrumentação:** Código de streaming (após cada micro-lote)
        **Métrica Prometheus:**
        ```
        forge_watermark_latency_seconds
        ```
        **Alerta:**
        ```
        ForgeWatermarkLate: watermark_latency > 120 s por 5 min
        Severidade: WARNING
        Ação: Verificar taxa de consumo, latência de processamento
        ```
        **Validação:**
        - [ ] Métrica é coletada a cada 30 s
        - [ ] Watermark latency é < 60 s em produção
        - [ ] Watermark latency aumenta quando há atraso

        ---

        ### Categoria 5: Dead Letter Queue (DLQ)

        #### Métrica 5.1: Taxa de Eventos em DLQ
        **Definição:** Número de eventos enviados para DLQ por segundo.
        **Tipo:** Counter (incrementa monotonicamente)
        **Fórmula:**
        ```
        taxa_dlq = rate(forge_dlq_events_total[5m])
        ```
        **Granularidade:** Por tópico DLQ (INVALID_EVENT, TRANSIENT_ERROR, etc)
        **Retenção:** 15 dias
        **Ponto de Instrumentação:** Código de streaming (ao enviar para DLQ)
        **Métrica Prometheus:**
        ```
        forge_dlq_events_total{topic="forge-events-invalid"}
        forge_dlq_events_total{topic="forge-events-retry-exhausted"}
        forge_dlq_events_total{topic="forge-events-business-logic-error"}
        ```
        **Alerta:**
        ```
        ForgeDLQRateHigh: taxa_dlq > 100 evt/s por 5 min
        Severidade: WARNING
        Ação: Inspecionar DLQ, verificar tipo de erro
        ```
        **Validação:**
        - [ ] Métrica é coletada a cada evento enviado para DLQ
        - [ ] Taxa de DLQ é < 10 evt/s em produção
        - [ ] Taxa de DLQ aumenta quando há erro

        ---

        #### Métrica 5.2: Tamanho de DLQ (eventos)
        **Definição:** Número total de eventos em cada tópico DLQ.
        **Tipo:** Gauge (valor instantâneo)
        **Fórmula:**
        ```
        tamanho_dlq = número_de_eventos_em_dlq
        ```
        **Granularidade:** Por tópico DLQ
        **Retenção:** 15 dias
        **Ponto de Instrumentação:** Kafka (nativo, via offset)
        **Métrica Prometheus:**
        ```
        kafka_topic_partition_current_offset{topic="forge-events-invalid"}
        kafka_topic_partition_current_offset{topic="forge-events-retry-exhausted"}
        ```
        **Alerta:**
        ```
        ForgeDLQSizeHigh: tamanho_dlq > 1M eventos por 5 min
        Severidade: WARNING
        Ação: Inspecionar DLQ, executar replay
        ```
        **Validação:**
        - [ ] Métrica é coletada a cada 30 s
        - [ ] Tamanho de DLQ é < 100k eventos em produção
        - [ ] Tamanho de DLQ cresce quando há erro

        ---

        ### Categoria 6: Custo Operacional

        #### Métrica 6.1: Custo por Hora
        **Definição:** Custo estimado de executar o Forge por hora.
        **Tipo:** Gauge (valor instantâneo)
        **Fórmula:**
        ```
        custo_por_hora = (número_de_nós * custo_por_nó_por_hora) + (armazenamento_gb * custo_por_gb_por_hora)
        ```
        **Granularidade:** Por hora
        **Retenção:** 90 dias
        **Ponto de Instrumentação:** Código de streaming (a cada hora)
        **Métrica Prometheus:**
        ```
        forge_cost_per_hour_usd
        ```
        **Alerta:**
        ```
        ForgeCostHigh: custo_por_hora > $50 por 1 hora
        Severidade: INFO
        Ação: Revisar utilização de recursos
        ```
        **Validação:**
        - [ ] Métrica é coletada a cada hora
        - [ ] Custo por hora é < $30 em produção (baseado em Etapa 5)
        - [ ] Custo por hora é comparável com batch

        ---

        #### Métrica 6.2: Custo Acumulado (Streaming vs Batch)
        **Definição:** Custo total acumulado de streaming vs batch.
        **Tipo:** Counter (incrementa monotonicamente)
        **Fórmula:**
        ```
        custo_acumulado_streaming = SUM(custo_por_hora) para todas as horas
        custo_acumulado_batch = (número_de_lotes * custo_por_lote)
        ```
        **Granularidade:** Diária
        **Retenção:** 90 dias
        **Ponto de Instrumentação:** Código de streaming e batch
        **Métrica Prometheus:**
        ```
        forge_cost_accumulated_usd{mode="streaming"}
        forge_cost_accumulated_usd{mode="batch"}
        ```
        **Alerta:**
        ```
        ForgeCostStreamingHigherThanBatch: custo_streaming > custo_batch * 1.5 por 7 dias
        Severidade: INFO
        Ação: Revisar ROI de migração
        ```
        **Validação:**
        - [ ] Métrica é coletada a cada hora
        - [ ] Custo acumulado de streaming é < 1.2× custo de batch (Etapa 5)
        - [ ] Custo acumulado é comparável com expectativa

        ---

        ## Resumo de Métricas Mínimas

        | Categoria | Métrica | Tipo | Granularidade | Alerta | Validação |
        |-----------|---------|------|---------------|--------|-----------|
        | **Consumo** | Consumer Lag | Gauge | Por partição | > 100k | Lag diminui quando processando |
        | | Throughput | Counter | Por consumer group | < 100 evt/s | Throughput > 1000 evt/s |
        | | Offset Commit Success | Counter | Por consumer group | < 95% | Success rate > 99% |
        | **Processamento** | Latência por Micro-lote | Histogram | p50, p95, p99 | p95 > 60 s | p95 < 60 s |
        | | Taxa de Erro | Counter | Por tipo | > 1% | Taxa < 0.1% |
        | | Tamanho do Estado | Gauge | Por executor | > 5 GB | Tamanho < 2 GB |
        | **Escrita** | Taxa de Escrita | Counter | Por tabela | < 100 evt/s | Taxa > 1000 evt/s |
        | | Latência de Escrita | Histogram | p50, p95, p99 | p95 > 10 s | p95 < 5 s |
        | | Taxa de Duplicatas | Counter | Por tabela | > 10 evt/s | Taxa < 1 evt/s |
        | **Frescor** | Latência E2E (p95) | Histogram | Por tenant, tabela | > 120 s | p95 < 120 s (SLO) |
        | | Watermark Latency | Gauge | Por consumer group | > 120 s | Latency < 60 s |
        | **DLQ** | Taxa de DLQ | Counter | Por tópico | > 100 evt/s | Taxa < 10 evt/s |
        | | Tamanho de DLQ | Gauge | Por tópico | > 1M eventos | Tamanho < 100k |
        | **Custo** | Custo por Hora | Gauge | Por hora | > $50 | Custo < $30 |
        | | Custo Acumulado | Counter | Diária | > 1.5× batch | Custo < 1.2× batch |

        **Verificação:**
        ```bash
        # Confirmar que matriz de métricas está documentada
        grep -E "Métrica [0-9]|Tipo:|Granularidade:|Alerta:" forge/config/metrics-instrumentation.md | wc -l
        # Esperado: > 50 linhas
        ```

