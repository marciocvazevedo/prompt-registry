        ### Etapa 10: Agregação por Versão
        **Tipo:** Agregação por janela (stateful)
        **Entrada:** Tabela `forge_events_with_deployment`
        **Saída:** Tabela `forge_events_by_version`
        **Lógica:**
        - Agrupar por `tenant_id`, `service_id`, `version`, `hour`
        - Calcular: `SUM(metric_value)`, `COUNT(*)`, `AVG(metric_value)`
