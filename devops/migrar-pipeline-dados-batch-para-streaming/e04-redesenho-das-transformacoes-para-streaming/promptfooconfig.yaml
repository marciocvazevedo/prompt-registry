        ## 4. Defina orçamento de erro e gatilho de rollback

        **Ação:** Formalize limites de erro aceitáveis e condições que disparam rollback automático.

        **Onde:** Arquivo `forge/docs/error-budget-and-rollback.md` (novo) no repositório do Forge.

        **Procedimento:**

        ### 4.1 Orçamento de erro

        **Ação:** Defina quanto de erro é aceitável antes de rollback.

        **Comando/Configuração:**

        ```markdown
        # Orçamento de Erro e Gatilho de Rollback

        ## Orçamento de Erro (Error Budget)

        ### Definição
        Quantidade máxima de erro aceitável em uma métrica antes de disparar rollback.

        ### Métricas e Orçamentos

        #### 1. Completude (Completeness Error Budget)
        **Métrica:** Percentual de eventos perdidos.

        **Orçamento:**
        ```
        Alvo: ≥ 99.9% completude
        Orçamento: ≤ 0.1% perda
        Período: Por hora
        Gatilho: Se completude < 99.9% em 2 horas consecutivas
        ```

        **Cálculo:**
        ```python
        completude_hora_1 = 99.85%  # ❌ Abaixo do alvo
        completude_hora_2 = 99.88%  # ❌ Abaixo do alvo (2 consecutivas)
        # → GATILHO ACIONADO: Rollback para batch
        ```

        #### 2. Corretude (Correctness Error Budget)
        **Métrica:** Percentual de linhas com valores incorretos.

        **Orçamento:**
        ```
        Alvo: 100% corretude
        Orçamento: ≤ 0.1% de mismatches
        Período: Por hora
        Gatilho: Se corretude < 99.9% em 1 hora
        ```

        **Cálculo:**
        ```python
        mismatches_hora_1 = 150  # em 1M linhas = 0.015%
        corretude = 99.985%  # ✅ Acima do alvo
        # → Sem gatilho

        mismatches_hora_2 = 2000  # em 1M linhas = 0.2%
        corretude = 99.8%  # ❌ Abaixo do alvo
        # → GATILHO ACIONADO: Rollback para batch
        ```

        #### 3. Latência (Latency Error Budget)
        **Métrica:** Percentual de eventos que violam SLO de latência.

        **Orçamento:**
        ```
        Alvo: p95 ≤ 120 s
        Orçamento: ≤ 5% de eventos com latência > 120 s
        Período: Por hora
        Gatilho: Se > 5% de eventos violam SLO em 1 hora
        ```

        **Cálculo:**
        ```python
        eventos_hora_1 = 100000
        eventos_violando_slo = 3000  # 3%
        violacao_pct = 3%  # ✅ Abaixo do orçamento
        # → Sem gatilho

        eventos_hora_2 = 100000
        eventos_violando_slo = 7000  # 7%
        violacao_pct = 7%  # ❌ Acima do orçamento
        # → GATILHO ACIONADO: Rollback para batch
        ```

        #### 4. Disponibilidade (Availability Error Budget)
        **Métrica:** Percentual de tempo com erro.

        **Orçamento:**
        ```
        Alvo: ≥ 99.5% disponibilidade
        Orçamento: ≤ 0.5% downtime
        Período: Por dia
        Gatilho: Se disponibilidade < 99.0% em 1 dia
        ```

        **Cálculo:**
        ```python
        uptime_dia_1 = 99.2%  # ✅ Acima do alvo
        # → Sem gatilho

        uptime_dia_2 = 98.8%  # ❌ Abaixo do alvo
        # → GATILHO ACIONADO: Rollback para batch
        ```

        ### Resumo de Orçamentos

        | Métrica | Alvo | Orçamento | Período | Gatilho |
        |---------|------|----------|---------|---------|
        | **Completude** | ≥ 99.9% | ≤ 0.1% perda | Por hora | < 99.9% em 2h consecutivas |
        | **Corretude** | 100% | ≤ 0.1% mismatches | Por hora | < 99.9% em 1h |
        | **Latência (p95)** | ≤ 120 s | ≤ 5% violação | Por hora | > 5% violação em 1h |
        | **Disponibilidade** | ≥ 99.5% | ≤ 0.5% downtime | Por dia | < 99.0% em 1 dia |

        ```

        **Verificação:** Arquivo criado com orçamentos de erro documentados; gatilhos definidos.

