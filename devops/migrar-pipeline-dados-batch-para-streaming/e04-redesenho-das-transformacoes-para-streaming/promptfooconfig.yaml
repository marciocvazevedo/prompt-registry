        ## 11. Documente contrato de consumo final

        **Ação:** Consolide toda a documentação de contrato de consumo em um arquivo único.

        **Onde:** Arquivo `forge/docs/relay-consumption-contract.md` (novo) no repositório do Forge.

        **Comando/Configuração:**

        ```markdown
        # Contrato de Consumo do Relay — Forge Streaming

        ## Resumo Executivo
        O Forge consome eventos continuamente do Relay em blocos de 30 s, processando ~1000 eventos/s em média e até 2000 eventos/s em pico. O contrato garante que eventos são processados com latência p95 ≤ 120 s, completude ≥ 99.9% e sem impacto no Relay (throughput < 500 MB/s).

        ## 1. Tópico de Entrada
        | Propriedade | Valor |
        |---|---|
        | **Nome** | `forge-events-raw` |
        | **Partições** | 32 |
        | **Replication Factor** | 3 |
        | **Compressão** | snappy |
        | **Retenção** | 7 dias |
        | **Chave de particionamento** | `tenant_id` |

        ## 2. Consumer Group
        | Propriedade | Valor |
        |---|---|
        | **Nome** | `forge-streaming-v1` |
        | **Offset management** | Automático (commit a cada 30 s) |
        | **Offset reset** | earliest (reprocessar do início em caso de falha) |
        | **Retenção de offset** | 7 dias |

        ## 3. Paralelismo e Throughput
        | Métrica | Valor |
        |---|---|
        | **Tasks/Executores** | 16 (1 executor por 2 partições) |
        | **Taxa média** | 1000 eventos/s (0.5 MB/s) |
        | **Taxa pico** | 2000 eventos/s (1.0 MB/s) |
        | **Limite de consumo** | 500 MB/s (50% da capacidade do Relay) |
        | **Status** | ✅ Dentro do limite |

        ## 4. Garantias de Ordem
        | Garantia | Status | Implicação |
        |---|---|---|
        | **Por chave (tenant_id)** | ✅ Garantida | Eventos do mesmo tenant mantêm ordem |
        | **Global** | ❌ Não garantida | Eventos de tenants diferentes podem ser processados fora de ordem |

        ## 5. Tratamento de Eventos Atrasados
        | Propriedade | Valor |
        |---|---|
        | **Watermark** | 45 s (timestamp máximo - 45 s) |
        | **Allowed lateness** | 60 s (eventos atrasados são processados com atualização retroativa) |
        | **Late drop** | > 105 s (eventos muito atrasados são descartados) |
        | **Impacto em completude** | ~0.1% de eventos perdidos (aceitável) |

        ## 6. Configurações de Kafka Consumer
        ```properties
        # Fetch
        fetch.max.bytes=1000000
        fetch.min.bytes=1
        fetch.max.wait.ms=500

        # Poll
        max.poll.records=2000
        max.poll.interval.ms=300000

        # Session
        session.timeout.ms=30000
        heartbeat.interval.ms=10000

        # Offset
        auto.offset.reset=earliest
        enable.auto.commit=true
        auto.commit.interval.ms=30000
        ```

        ## 7. Versionamento de Schema
        | Propriedade | Valor |
        |---|---|
        | **Versão atual** | 1.0 |
        | **Compatibilidade** | BACKWARD (novos campos com default são permitidos) |
        | **Processo de evolução** | ADR → Validação → Registro → Teste → Deploy |

        ## 8. Monitoramento e Alertas
        | Alerta | Condição | Ação |
        |---|---|---|
        | **Consumer Lag Alto** | > 100k eventos | Investigar atraso; aumentar paralelismo se necessário |
        | **Taxa de Consumo Baixa** | < 100 evt/s | Investigar lentidão; verificar CPU/memória |
        | **Offset Commit Failure** | Taxa = 0 | Rollback imediato; investigar causa |
        | **Rebalancing Frequente** | > 1× a cada 10 min | Investigar instabilidade; aumentar session timeout |
        | **Throughput Excedido** | > 500 MB/s | Alertar time de Relay; reduzir taxa se necessário |
        | **Desserialização Falhando** | > 10 erros/s | Investigar schema mismatch; validar dados |
        | **Watermark Atrasado** | > 120 s | Investigar lentidão; aumentar paralelismo |
        | **Checkpoint Falhando** | Taxa > 0 | Rollback imediato; investigar causa |

        ## 9. Mudanças Necessárias no Relay
