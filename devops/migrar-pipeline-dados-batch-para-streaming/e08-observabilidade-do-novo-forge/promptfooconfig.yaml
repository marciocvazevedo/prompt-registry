        ```python
        def test_equivalence_streaming_vs_batch():
            # Ler dados históricos (últimas 24 horas)
            df_historical = spark.read.parquet("/data/relay/events_24h")
            
            # Executar em batch (modo atual)
            df_batch_output = run_batch_pipeline(df_historical)
            
            # Executar em streaming (modo novo)
            df_streaming_output = run_streaming_pipeline(df_historical)
            
            # Comparar
            batch_count = df_batch_output.count()
            streaming_count = df_streaming_output.count()
            
            assert batch_count == streaming_count, f"Row count mismatch: batch={batch_count}, streaming={streaming_count}"
            
            # Comparar agregações
            batch_agg = df_batch_output.groupBy("tenant_id", "service_id").agg(
                sum("total_value").alias("batch_sum"),
                count("*").alias("batch_count")
            )
            streaming_agg = df_streaming_output.groupBy("tenant_id", "service_id").agg(
                sum("total_value").alias("streaming_sum"),
                count("*").alias("streaming_count")
            )
            
            comparison = batch_agg.join(streaming_agg, on=["tenant_id", "service_id"], how="outer")
            mismatches = comparison.filter(
                (col("batch_sum") != col("streaming_sum")) |
                (col("batch_count") != col("streaming_count"))
            ).count()
            
            assert mismatches == 0, f"Mismatches encontrados: {mismatches}"
            print("✅ Teste de equivalência passou")

        # Executar
        test_equivalence_streaming_vs_batch()
        ```

