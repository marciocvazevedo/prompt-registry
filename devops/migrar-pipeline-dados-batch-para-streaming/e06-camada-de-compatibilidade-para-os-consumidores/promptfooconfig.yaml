        ## 4. Implemente estratégia de compactação de arquivos

        **Ação:** Defina política de compactação para evitar problema de arquivos pequenos.

        **Onde:** Arquivo `forge/config/compaction-strategy.md` (novo) no repositório do Forge.

        **Procedimento:**

        ```markdown
        # Estratégia de Compactação — Problema de Arquivos Pequenos

        ## Problema
        Streaming escreve a cada 30 s, criando muitos arquivos pequenos (~10–50 MB cada).
        Isso causa:
        - **Overhead de metadados:** Cada arquivo tem overhead (inode, índice)
        - **Lentidão de queries:** Ler 1000 arquivos pequenos é mais lento que ler 10 arquivos grandes
        - **Custo de armazenamento:** Fragmentação aumenta custo
        - **Custo de compactação:** Compactar muitos arquivos é caro

        **Exemplo:**
        ```
        Sem compactação (30 s × 120 = 3600 s = 1 hora):
        - 120 arquivos por hora
        - Tamanho: 120 × 20 MB = 2.4 GB
        - Overhead: 120 × 1 MB (metadados) = 120 MB

        Com compactação (1 arquivo por hora):
        - 1 arquivo por hora
        - Tamanho: 2.4 GB
        - Overhead: 1 × 1 MB (metadados) = 1 MB
        ```

        ## Estratégia: Compactação Incremental por Hora

        ### Política
        1. **Escrita:** Escrever a cada 30 s (sem compactação)
        2. **Compactação:** Compactar partição 1× por hora (após fechamento)
        3. **Frequência:** Executar compactação em janela de manutenção (02:00–04:00 UTC)
        4. **Retenção:** Manter dados por 90 dias

        ### Implementação

        #### Opção 1: Usar Delta Lake (Recomendado)
        ```python
        # Delta Lake suporta OPTIMIZE nativamente
        spark.sql("""
        OPTIMIZE delta.`/data/forge/aggregated`
        WHERE hour = '2024-01-15-10'
        ZORDER BY (tenant_id, service_id)
        """)
        ```

        **Vantagens:**
        - Compactação automática
        - ZORDER para otimizar queries
        - Versionamento de dados

        **Desvantagens:**
        - Requer Delta Lake (custo adicional)

        #### Opção 2: Usar Parquet + Rewrite (Sem Delta)
        ```python
        def compact_partition(spark, table_name, hour_str):
            """Compactar partição por hora"""
            # Ler partição
            df = spark.read.parquet(f"/data/forge/{table_name}/hour={hour_str}")
            
            # Reescrever com menos partições (ex: 1 arquivo)
            df.coalesce(1).write.mode("overwrite") \
                .parquet(f"/data/forge/{table_name}/hour={hour_str}")
            
            print(f"Partição {hour_str} compactada")

        # Agendar compactação 1× por hora (após fechamento)
        # Usar Airflow/cron para executar em 02:00–04:00 UTC
        ```

        **Vantagens:**
        - Sem dependência de Delta Lake
        - Simples de implementar

        **Desvantagens:**
        - Rewrite é caro (relê e reescreve dados)
        - Sem versionamento

        #### Opção 3: Usar Spark Structured Streaming com Compactação Automática
        ```python
        # Configurar Spark para compactar automaticamente
        spark.conf.set("spark.sql.streaming.fileStore.compactInterval", "3600")  # 1 hora
        spark.conf.set("spark.sql.streaming.fileStore.minBatchesToRetain", "2")

        # Escrever com compactação automática
        query = df_aggregated.writeStream \
            .format("parquet") \
            .option("path", "/data/forge/aggregated") \
            .option("checkpointLocation", "/data/forge/checkpoint/aggregated") \
            .outputMode("update") \
            .trigger(processingTime="30 seconds") \
            .start()
        ```

        **Vantagens:**
        - Automático
        - Sem overhead manual

        **Desvantagens:**
        - Menos controle
        - Pode compactar em horários ruins

