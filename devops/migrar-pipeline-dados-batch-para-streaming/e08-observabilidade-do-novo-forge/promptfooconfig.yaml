        ### Etapa 9: Enriquecimento com Contexto de Deployment
        **Tipo:** Enriquecimento por lookup (stateful)
        **Entrada:** Tabela `forge_events_enriched`
        **Saída:** Tabela `forge_events_with_deployment`
        **Lógica:**
