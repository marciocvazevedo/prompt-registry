        Se nenhuma ação acima resolver o problema:

        1. **Contatar time de Relay** (se problema é com Relay)
          - Slack: #relay-oncall
          - PagerDuty: Relay On-Call

        2. **Contatar time de Infraestrutura** (se problema é com cluster Spark)
          - Slack: #infra-oncall
          - PagerDuty: Infra On-Call

        3. **Contatar time de Dados** (se problema é com dados)
          - Slack: #data-oncall
          - PagerDuty: Data On-Call

        4. **Fazer rollback para batch** (último recurso)
          - Ver seção Y: Rollback
        ```

