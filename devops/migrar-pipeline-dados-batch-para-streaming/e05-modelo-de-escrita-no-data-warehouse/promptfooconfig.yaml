            current_timestamp, lit
        )
        from pyspark.sql.types import StructType, StructField, StringType, LongType, DoubleType, MapType
        import logging

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        # Configuração
        RELAY_BROKER = "<relay-broker>"  # [SUPOSIÇÃO]
        RELAY_TOPIC = "forge-events-raw"
        CONSUMER_GROUP = "forge-streaming-v1"
        CHECKPOINT_BASE_DIR = "/data/forge/checkpoint"
        OUTPUT_BASE_DIR = "/data/forge"

        # Schema do evento
        EVENT_SCHEMA = StructType([
            StructField("event_id", StringType(), False),
            StructField("tenant_id", StringType(), False),
            StructField("timestamp", LongType(), False),
            StructField("service_id", StringType(), False),
            StructField("metric_name", StringType(), False),
            StructField("metric_value", DoubleType(), False),
            StructField("tags", MapType(StringType(), StringType()), True),
        ])

        class ForgeStreamingTransform:
            def __init__(self, spark):
                self.spark = spark
                self.logger = logger
            
            # ========== Etapa 1: Parsing ==========
            def stage_1_parsing(self, df_raw):
                """Etapa 1: Parsing e validação de eventos"""
                self.logger.info("Etapa 1: Parsing")
                
                df_parsed = df_raw.select(
                    col("key").cast(StringType()).alias("partition_key"),
                    from_json(col("value").cast(StringType()), EVENT_SCHEMA).alias("event"),
                    col("timestamp").alias("kafka_timestamp")
                ).select(
                    col("event.event_id"),
                    col("event.tenant_id"),
                    col("event.timestamp"),
                    col("event.service_id"),
                    col("event.metric_name"),
                    col("event.metric_value"),
                    col("event.tags"),
                    col("kafka_timestamp")
                ).filter(
                    (col("event_id").isNotNull()) &
                    (col("tenant_id").isNotNull()) &
                    (col("timestamp").isNotNull())
                )
                
                # Deduplicar por event_id
                df_deduplicated = df_parsed.dropDuplicates(["event_id"])
                
                return df_deduplicated
            
            # ========== Etapa 2: Enriquecimento Tenant ==========
            def stage_2_enrich_tenant(self, df_parsed, broadcast_tenant_meta):
                """Etapa 2: Enriquecimento com metadados de tenant"""
                self.logger.info("Etapa 2: Enriquecimento Tenant")
                
                df_enriched = df_parsed.join(
                    broadcast_tenant_meta,
                    on="tenant_id",
                    how="left"
                ).select(
                    col("event_id"),
                    col("tenant_id"),
                    col("tenant_name"),
                    col("tenant_tier"),
                    col("region"),
                    col("timestamp"),
                    col("service_id"),
                    col("metric_name"),
                    col("metric_value"),
                    col("tags")
                ).filter(col("tenant_name").isNotNull())
                
                # Deduplicar
                df_deduplicated = df_enriched.dropDuplicates(["event_id"])
                
                return df_deduplicated
            
            # ========== Etapa 3: Normalização ==========
            def stage_3_normalize(self, df_enriched):
                """Etapa 3: Normalização de métrica"""
                self.logger.info("Etapa 3: Normalização")
                
                df_normalized = df_enriched.withColumn(
                    "metric_name_normalized",
                    regexp_replace(col("metric_name"), r"[.-]", "_")
                ).withColumn(
                    "metric_value_normalized",
                    when(col("metric_name").contains("latency"), col("metric_value") / 1000)
                    .otherwise(col("metric_value"))
                ).select(
                    col("event_id"),
                    col("tenant_id"),
                    col("tenant_name"),
                    col("tenant_tier"),
                    col("region"),
                    col("timestamp"),
                    col("service_id"),
                    col("metric_name_normalized").alias("metric_name"),
                    col("metric_value_normalized").alias("metric_value"),
                    col("tags")
                )
                
                # Deduplicar
                df_deduplicated = df_normalized.dropDuplicates(["event_id"])
                
                return df_deduplicated
            
            # ========== Etapa 4: Agregação por Serviço ==========
            def stage_4_aggregate_by_service(self, df_normalized):
                """Etapa 4: Agregação por serviço (janela 30 s)"""
                self.logger.info("Etapa 4: Agregação por Serviço")
                
                # Converter timestamp (ms) para timestamp Spark
                df_with_ts = df_normalized.withColumn(
                    "event_timestamp",
                    to_timestamp(col("timestamp") / 1000)
                )
                
                # Aplicar watermark
                df_watermarked = df_with_ts.withWatermark("event_timestamp", "45 seconds")
                
                # Agregar
                df_by_service = df_watermarked.groupBy(
                    window(col("event_timestamp"), "30 seconds"),
                    col("tenant_id"),
                    col("service_id")
                ).agg(
                    spark_sum("metric_value").alias("total_value"),
                    count("*").alias("event_count"),
                    expr("avg(metric_value)").alias("avg_value"),
                    expr("stddev(metric_value)").alias("stddev_value")
                ).select(
                    col("window.start").alias("window_start"),
                    col("window.end").alias("window_end"),
                    col("tenant_id"),
                    col("service_id"),
                    col("total_value"),
                    col("event_count"),
                    col("avg_value"),
                    col("stddev_value")
                )
                
                return df_by_service
            
            # ========== Etapa 5: Agregação Global ==========
            def stage_5_aggregate_global(self, df_normalized):
                """Etapa 5: Agregação global (janela 30 s)"""
                self.logger.info("Etapa 5: Agregação Global")
                
                # Converter timestamp
                df_with_ts = df_normalized.withColumn(
                    "event_timestamp",
                    to_timestamp(col("timestamp") / 1000)
                )
                
                # Aplicar watermark
                df_watermarked = df_with_ts.withWatermark("event_timestamp", "45 seconds")
                
                # Agregar
                df_aggregated = df_watermarked.groupBy(
                    window(col("event_timestamp"), "30 seconds"),
                    col("tenant_id")
                ).agg(
                    spark_sum("metric_value").alias("total_value"),
                    count("*").alias("event_count"),
                    expr("avg(metric_value)").alias("avg_value")
                ).select(
                    col("window.start").alias("window_start"),
                    col("window.end").alias("window_end"),
                    col("tenant_id"),
                    col("total_value"),
                    col("event_count"),
                    col("avg_value")
                )
                
                return df_aggregated
            
            # ========== Etapa 6: Taxa de Erro ==========
            def stage_6_error_rates(self, df_by_service, broadcast_sla):
                """Etapa 6: Cálculo de taxa de erro"""
                self.logger.info("Etapa 6: Taxa de Erro")
                
                df_error_rates = df_by_service.filter(
                    col("metric_name") == "error"
                ).join(
                    broadcast_sla,
                    on=["tenant_id", "service_id"],
                    how="left"
                ).withColumn(
                    "error_rate",
                    col("total_value") / col("event_count")
                ).withColumn(
                    "sla_breached",
                    col("error_rate") > col("sla_threshold")
                )
                
                return df_error_rates
            
            # ========== Etapa 9: Enriquecimento Deployment ==========
            def stage_9_enrich_deployment(self, df_enriched, broadcast_deployment):
                """Etapa 9: Enriquecimento com deployment info"""
                self.logger.info("Etapa 9: Enriquecimento Deployment")
                
                df_with_deployment = df_enriched.join(
                    broadcast_deployment,
                    on=["tenant_id", "service_id"],
                    how="left"
                ).select(
                    col("event_id"),
                    col("tenant_id"),
                    col("service_id"),
                    col("version"),
                    col("region"),
                    col("environment"),
                    col("timestamp"),
                    col("metric_name"),
                    col("metric_value")
                )
                
                # Deduplicar
                df_deduplicated = df_with_deployment.dropDuplicates(["event_id"])
                
                return df_deduplicated
            
            # ========== Etapa 10: Agregação por Versão ==========
            def stage_10_aggregate_by_version(self, df_with_deployment):
                """Etapa 10: Agregação por versão (janela 30 s)"""
                self.logger.info("Etapa 10: Agregação por Versão")
                
                # Converter timestamp
                df_with_ts = df_with_deployment.withColumn(
                    "event_timestamp",
                    to_timestamp(col("timestamp") / 1000)
                )
                
                # Aplicar watermark
                df_watermarked = df_with_ts.withWatermark("event_timestamp", "45 seconds")
                
                # Agregar
                df_by_version = df_watermarked.groupBy(
                    window(col("event_timestamp"), "30 seconds"),
                    col("tenant_id"),
                    col("service_id"),
                    col("version")
                ).agg(
                    spark_sum("metric_value").alias("total_value"),
                    count("*").alias("event_count"),
                    expr("avg(metric_value)").alias("avg_value")
                ).select(
                    col("window.start").alias("window_start"),
                    col("window.end").alias("window_end"),
                    col("tenant_id"),
                    col("service_id"),
                    col("version"),
                    col("total_value"),
                    col("event_count"),
                    col("avg_value")
                )
                
                return df_by_version
            
            # ========== Etapa 11: Cálculo de Percentis ==========
            def stage_11_percentiles(self, df_aggregated):
                """Etapa 11: Cálculo de percentis (janela 30 s)"""
                self.logger.info("Etapa 11: Cálculo de Percentis")
                
                # Converter timestamp
                df_with_ts = df_aggregated.withColumn(
                    "event_timestamp",
                    to_timestamp(col("timestamp") / 1000)
                )
                
                # Aplicar watermark
                df_watermarked = df_with_ts.withWatermark("event_timestamp", "45 seconds")
                
                # Calcular percentis
                df_percentiles = df_watermarked.groupBy(
                    window(col("event_timestamp"), "30 seconds"),
                    col("tenant_id")
                ).agg(
                    percentile_approx("metric_value", 0.5).alias("p50"),
                    percentile_approx("metric_value", 0.95).alias("p95"),
                    percentile_approx("metric_value", 0.99).alias("p99")
                ).select(
                    col("window.start").alias("window_start"),
                    col("window.end").alias("window_end"),
                    col("tenant_id"),
                    col("p50"),
                    col("p95"),
                    col("p99")
                )
                
                return df_percentiles
            
            # ========== Etapa 13: Agregação para Billing ==========
            def stage_13_billing(self, df_normalized):
                """Etapa 13: Agregação para billing (janela 1 dia)"""
                self.logger.info("Etapa 13: Agregação para Billing")
                
                # Deduplicar por event_id ANTES de contar
                df_deduplicated = df_normalized.dropDuplicates(["event_id"])
                
                # Converter timestamp
                df_with_ts = df_deduplicated.withColumn(
                    "event_timestamp",
                    to_timestamp(col("timestamp") / 1000)
                )
                
                # Aplicar watermark (24 horas)
                df_watermarked = df_with_ts.withWatermark("event_timestamp", "24 hours")
                
                # Agregar por dia
                df_billing = df_watermarked.groupBy(
                    window(col("event_timestamp"), "1 day"),
                    col("tenant_id")
                ).agg(
                    count(distinct("event_id")).alias("unique_event_count"),
                    count("*").alias("total_event_count")
                ).select(
                    col("window.start").alias("day_start"),
                    col("window.end").alias("day_end"),
                    col("tenant_id"),
                    col("unique_event_count"),
                    col("total_event_count")
                )
                
                return df_billing
            
            # ========== Etapa 14: Exportação Cerebro ==========
            def stage_14_export_cerebro(self, df_enriched):
                """Etapa 14: Exportação para Cerebro"""
                self.logger.info("Etapa 14: Exportação Cerebro")
                
                df_for_cerebro = df_enriched.select(
                    col("event_id"),
                    col("tenant_id"),
                    col("service_id"),
                    col("timestamp"),
                    col("metric_name"),
                    col("metric_value"),
                    col("tags"),
                    to_json(struct("*")).alias("json_payload")
                )
                
                # Deduplicar
                df_deduplicated = df_for_cerebro.dropDuplicates(["event_id"])
                
                return df_deduplicated
            
            # ========== Pipeline Completo ==========
            def run_pipeline(self, df_raw, broadcast_tenant_meta, broadcast_sla, broadcast_deployment):
                """Executa pipeline completo"""
                self.logger.info("Iniciando pipeline de transformação")
                
                # Etapa 1: Parsing
                df_parsed = self.stage_1_parsing(df_raw)
                
                # Etapa 2: Enriquecimento Tenant
                df_enriched = self.stage_2_enrich_tenant(df_parsed, broadcast_tenant_meta)
                
                # Etapa 3: Normalização
                df_normalized = self.stage_3_normalize(df_enriched)
                
                # Etapa 4: Agregação por Serviço
                df_by_service = self.stage_4_aggregate_by_service(df_normalized)
                
                # Etapa 5: Agregação Global
                df_aggregated = self.stage_5_aggregate_global(df_normalized)
                
                # Etapa 6: Taxa de Erro
                df_error_rates = self.stage_6_error_rates(df_by_service, broadcast_sla)
                
                # Etapa 9: Enriquecimento Deployment
                df_with_deployment = self.stage_9_enrich_deployment(df_enriched, broadcast_deployment)
                
                # Etapa 10: Agregação por Versão
                df_by_version = self.stage_10_aggregate_by_version(df_with_deployment)
                
                # Etapa 11: Cálculo de Percentis
                df_percentiles = self.stage_11_percentiles(df_aggregated)
                
                # Etapa 13: Agregação para Billing
                df_billing = self.stage_13_billing(df_normalized)
                
                # Etapa 14: Exportação Cerebro
                df_for_cerebro = self.stage_14_export_cerebro(df_enriched)
                
                self.logger.info("Pipeline de transformação concluído")
                
                return {
                    "by_service": df_by_service,
                    "aggregated": df_aggregated,
                    "error_rates": df_error_rates,
                    "by_version": df_by_version,
                    "percentiles": df_percentiles,
                    "billing": df_billing,
                    "cerebro": df_for_cerebro
                }

        def create_spark_session():
            """Cria sessão Spark com configurações otimizadas"""
            return SparkSession.builder \
                .appName("forge-streaming-transform") \
                .config("spark.streaming.kafka.maxRatePerPartition", "2000") \
                .config("spark.streaming.kafka.maxOffsetsPerTrigger", "2000") \
                .config("spark.sql.streaming.checkpointLocation", CHECKPOINT_BASE_DIR) \
                .config("spark.sql.streaming.schemaInference", "false") \
                .getOrCreate()

        def main():
            """Função principal"""
            spark = create_spark_session()
            
            # Ler do Relay
            df_raw = spark.readStream \
                .format("kafka") \
                .option("kafka.bootstrap.servers", RELAY_BROKER) \
                .option("subscribe", RELAY_TOPIC) \
                .option("startingOffsets", "earliest") \
                .option("kafka.group.id", CONSUMER_GROUP) \
                .load()
            
            # Carregar broadcasts (snapshots diários)
            df_tenant_meta = spark.read.parquet("/data/tenant_metadata")
            broadcast_tenant_meta = broadcast(df_tenant_meta)
            
            df_sla = spark.read.parquet("/data/sla_config")
            broadcast_sla = broadcast(df_sla)
            
            df_deployment = spark.read.parquet("/data/deployment_info")
            broadcast_deployment = broadcast(df_deployment)
            
            # Executar pipeline
            transformer = ForgeStreamingTransform(spark)
            outputs = transformer.run_pipeline(df_raw, broadcast_tenant_meta, broadcast_sla, broadcast_deployment)
            
            # Escrever saídas
            queries = []
            
            # Escrever by_service
            query_by_service = outputs["by_service"].writeStream \
                .format("parquet") \
                .option("path", f"{OUTPUT_BASE_DIR}/by_service") \
                .option("checkpointLocation", f"{CHECKPOINT_BASE_DIR}/by_service") \
                .outputMode("update") \
                .trigger(processingTime="30 seconds") \
                .start()
            queries.append(query_by_service)
            
            # Escrever aggregated
            query_aggregated = outputs["aggregated"].writeStream \
                .format("parquet") \
                .option("path", f"{OUTPUT_BASE_DIR}/aggregated") \
                .option("checkpointLocation", f"{CHECKPOINT_BASE_DIR}/aggregated") \
                .outputMode("update") \
                .trigger(processingTime="30 seconds") \
                .start()
            queries.append(query_aggregated)
            
            # Escrever by_version
            query_by_version = outputs["by_version"].writeStream \
                .format("parquet") \
                .option("path", f"{OUTPUT_BASE_DIR}/by_version") \
                .option("checkpointLocation", f"{CHECKPOINT_BASE_DIR}/by_version") \
                .outputMode("update") \
                .trigger(processingTime="30 seconds") \
                .start()
            queries.append(query_by_version)
            
            # Escrever percentiles
            query_percentiles = outputs["percentiles"].writeStream \
                .format("parquet") \
                .option("path", f"{OUTPUT_BASE_DIR}/percentiles") \
                .option("checkpointLocation", f"{CHECKPOINT_BASE_DIR}/percentiles") \
                .outputMode("update") \
                .trigger(processingTime="30 seconds") \
                .start()
            queries.append(query_percentiles)
            
            # Escrever billing
            query_billing = outputs["billing"].writeStream \
                .format("parquet") \
                .option("path", f"{OUTPUT_BASE_DIR}/billing_events") \
                .option("checkpointLocation", f"{CHECKPOINT_BASE_DIR}/billing") \
                .outputMode("update") \
                .trigger(processingTime="1 hour") \
                .start()
            queries.append(query_billing)
            
            # Escrever cerebro
            query_cerebro = outputs["cerebro"].writeStream \
                .format("kafka") \
                .option("kafka.bootstrap.servers", RELAY_BROKER) \
                .option("topic", "forge-events-indexed") \
                .option("checkpointLocation", f"{CHECKPOINT_BASE_DIR}/cerebro") \
                .outputMode("append") \
                .trigger(processingTime="30 seconds") \
                .start()
            queries.append(query_cerebro)
            
            # Aguardar término
            spark.streams.awaitAnyTermination()

        if __name__ == "__main__":
            main()
        ```

