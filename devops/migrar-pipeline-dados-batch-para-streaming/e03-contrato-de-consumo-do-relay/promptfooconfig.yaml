                ## 9. Calcule baseline de custo

                **Ação:** Quantifique custo atual de computação, armazenamento e transferência de dados.

                **Onde:** Fatura de cloud, console de custos, logs de billing.

                **Comando/Configuração:**

                ```bash
                # AWS (se aplicável)
                aws ce get-cost-and-usage \
                  --time-period Start=2024-01-01,End=2024-01-31 \
                  --granularity MONTHLY \
                  --metrics "UnblendedCost" \
                  --group-by Type=DIMENSION,Key=SERVICE \
                  --filter file://filter.json

                # GCP (se aplicável)
                bq query --use_legacy_sql=false << 'EOF'
                SELECT 
                  service.description,
                  SUM(cost) AS total_cost,
                  SUM(usage.amount) AS total_usage
                FROM `<project>.billing_export.gcp_billing_export_v1`
                WHERE DATE(usage_start_time) >= '2024-01-01'
                  AND DATE(usage_start_time) <= '2024-01-31'
                GROUP BY service.description
                ORDER BY total_cost DESC;
                EOF
                ```

                **Cálculos:**

                ```python
                # Componentes de custo
                spark_compute_cost_monthly = <valor em USD>
                dw_storage_cost_monthly = <valor em USD>
                dw_query_cost_monthly = <valor em USD>
                relay_ingestion_cost_monthly = <valor em USD>

                total_monthly = spark_compute_cost_monthly + dw_storage_cost_monthly + dw_query_cost_monthly + relay_ingestion_cost_monthly

                print(f"Custo mensal do Forge:")
                print(f"  Spark (compute): ${spark_compute_cost_monthly:,.2f}")
                print(f"  DW (storage): ${dw_storage_cost_monthly:,.2f}")
                print(f"  DW (queries): ${dw_query_cost_monthly:,.2f}")
                print(f"  Relay (ingestion): ${relay_ingestion_cost_monthly:,.2f}")
                print(f"  TOTAL: ${total_monthly:,.2f}")
                print(f"  Custo por evento: ${total_monthly * 1e6 / (total_events_24h * 30):.6f}")
                ```

                **Preencha a tabela:**

                | Componente | Custo mensal (USD) | % do total | Métrica de escala |
                |---|---|---|---|
                | Spark (compute) | ? | ? % | CPU-hours |
                | DW (storage) | ? | ? % | GB-months |
                | DW (queries) | ? | ? % | Bytes scanned |
                | Relay (ingestion) | ? | ? % | GB ingested |
                | **TOTAL** | **?** | **100%** | — |

                **Verificação:** Custo total > $1k/mês (típico para SaaS de observabilidade).

