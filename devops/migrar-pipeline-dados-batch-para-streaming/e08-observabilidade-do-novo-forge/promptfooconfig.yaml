        ## X. Ponto de não-retorno

        **Ponto de não-retorno:** Após o passo 6 (deploy de alertas em produção), o sistema começa a monitorar e alertar sobre falhas.

        **Por quê:** Uma vez que alertas estão ativos, desativá-los requer:
        1. Parar o Prometheus
        2. Remover regras de alerta
        3. Perder histórico de alertas
        4. Possível downtime não detectado

        **Mitigação:** Antes do passo 6, testar alertas em staging (passos 1–5).

        ---

        ## Y. Rollback

        **Procedimento de rollback (se necessário após passo 6):**

        ```bash
        #!/bin/bash
        # Script de rollback: desativar monitoramento de falhas
        set -e
        echo "=== Rollback: Desativar Monitoramento de Falhas ==="

        # 1. Remover alertas
        echo "1. Removendo alertas..."
        kubectl delete prometheusrule forge-failure-detection -n forge

        # 2. Remover dashboard
        echo "2. Removendo dashboard..."
        curl -X DELETE http://grafana:3000/api/dashboards/uid/forge-failure-detection

        # 3. Remover tópicos DLQ (opcional, manter para investigação)
        echo "3. Removendo tópicos DLQ (opcional)..."
        # kafka-topics --bootstrap-server <relay-broker> --delete --topic forge-events-invalid
        # kafka-topics --bootstrap-server <relay-broker> --delete --topic forge-events-retry-exhausted
        # kafka-topics --bootstrap-server <relay-broker> --delete --topic forge-events-business-logic-error
        # kafka-topics --bootstrap-server <relay-broker> --delete --topic forge-events-unknown-error

        # 4. Remover jobs de replay/backfill
        echo "4. Removendo jobs de replay/backfill..."
        rm -f forge/jobs/replay_events.py
        rm -f forge/jobs/backfill_historical.py

        # 5. Remover código de DLQ
        echo "5. Removendo código de DLQ..."
        git revert HEAD~5..HEAD  # Reverter últimos 5 commits

        echo "=== Rollback concluído ==="
        ```

