                """Executar transformação de batch"""
                # Ler do Relay
                df_raw = spark.read.parquet("/data/relay/events")
                
                # Transformar
                df_aggregated = transform(df_raw)
                
                # Escrever em /data/forge/batch/ (sem mudança)
                df_aggregated.write.mode("append").parquet("/data/forge/batch/aggregated")
                
                logger.info("Batch escrito em /data/forge/batch/aggregated")
            ```

            #### Passo 3: Modificar Job de Streaming
            ```python
            # forge/jobs/streaming_transform.py (modificado para dual-run)
            def run_streaming_transform():
                """Executar transformação de streaming"""
                # Ler do Relay
                df_raw = spark.readStream.format("kafka") \
                    .option("kafka.bootstrap.servers", RELAY_BROKER) \
                    .option("subscribe", RELAY_TOPIC) \
                    .load()
                
                # Transformar
                df_aggregated = transform(df_raw)
                
                # Escrever em /data/forge/streaming/ (novo)
                query = df_aggregated.writeStream \
                    .format("parquet") \
                    .option("path", "/data/forge/streaming/aggregated") \
                    .option("checkpointLocation", "/data/forge/checkpoint/streaming/aggregated") \
                    .outputMode("append") \
                    .trigger(processingTime="30 seconds") \
                    .start()
                
                logger.info("Streaming escrito em /data/forge/streaming/aggregated")
                query.awaitTermination()
