        ```markdown
        # Mapeamento das 14 Etapas de Transformação — Forge Batch → Streaming

        ## Resumo
        O Forge batch executa 14 etapas de transformação em sequência, totalizando ~40 min.
        Cada etapa é um job Spark que lê de uma tabela, transforma e escreve em outra.

        ## Etapas Mapeadas

        ### Etapa 1: Ingestão e Parsing
        **Tipo:** Sem estado (stateless)
        **Entrada:** Tópico Relay `forge-events-raw`
        **Saída:** Tabela `forge_events_parsed`
        **Lógica:**
        - Desserializar JSON/Avro
        - Validar schema
        - Adicionar timestamp de ingestão
        - Filtrar eventos inválidos

        **Código (batch):**
        \`\`\`python
        df_raw = spark.read.parquet("/data/relay/events")
        df_parsed = df_raw.select(
            col("event_id"),
            col("tenant_id"),
            col("timestamp"),
            col("service_id"),
            col("metric_name"),
            col("metric_value"),
            col("tags"),
            current_timestamp().alias("ingestion_time")
        ).filter(col("event_id").isNotNull())
        df_parsed.write.mode("overwrite").parquet("/data/forge/parsed")
        \`\`\`

        **Classificação:** ✅ Sem estado → Adequado para streaming

        ---

        ### Etapa 2: Enriquecimento com Metadados de Tenant
        **Tipo:** Enriquecimento por lookup (stateful)
        **Entrada:** Tabela `forge_events_parsed`
        **Saída:** Tabela `forge_events_enriched`
        **Lógica:**
        - Fazer join com tabela de metadados de tenant (ex: `tenant_metadata`)
        - Adicionar campos: `tenant_name`, `tenant_tier`, `region`
        - Filtrar tenants inativos

        **Código (batch):**
        \`\`\`python
        df_parsed = spark.read.parquet("/data/forge/parsed")
        df_tenant_meta = spark.read.parquet("/data/tenant_metadata")  # Snapshot diário
        df_enriched = df_parsed.join(
            df_tenant_meta,
            on="tenant_id",
            how="left"
        ).select(
            col("event_id"),
            col("tenant_id"),
            col("tenant_name"),
            col("tenant_tier"),
            col("region"),
            col("timestamp"),
            col("service_id"),
            col("metric_name"),
            col("metric_value"),
            col("tags")
        ).filter(col("tenant_name").isNotNull())
        df_enriched.write.mode("overwrite").parquet("/data/forge/enriched")
        \`\`\`

        **Classificação:** ⚠️ Enriquecimento por lookup → Requer estado (cache de metadados)

        ---

        ### Etapa 3: Normalização de Métrica
        **Tipo:** Sem estado (stateless)
        **Entrada:** Tabela `forge_events_enriched`
        **Saída:** Tabela `forge_events_normalized`
        **Lógica:**
        - Normalizar nome de métrica (ex: `http.requests` → `http_requests`)
        - Converter unidades (ex: ms → s)
        - Aplicar regras de transformação por tenant

        **Código (batch):**
        \`\`\`python
        df_enriched = spark.read.parquet("/data/forge/enriched")
        df_normalized = df_enriched.withColumn(
            "metric_name_normalized",
            regexp_replace(col("metric_name"), r"[.-]", "_")
        ).withColumn(
            "metric_value_normalized",
            when(col("metric_name").contains("latency"), col("metric_value") / 1000)
            .otherwise(col("metric_value"))
        )
        df_normalized.write.mode("overwrite").parquet("/data/forge/normalized")
        \`\`\`

        **Classificação:** ✅ Sem estado → Adequado para streaming

