        ## 10. Crie monitoramento e alertas para contrato de consumo

        **Ação:** Defina métricas e alertas para validar que contrato de consumo está sendo respeitado.

        **Onde:** Arquivo `forge/monitoring/relay-contract-alerts.yaml` (novo) no repositório do Forge.

        **Comando/Configuração:**

        ```yaml
        {% raw %}
        # forge/monitoring/relay-contract-alerts.yaml
        apiVersion: monitoring.coreos.com/v1
        kind: PrometheusRule
        metadata:
          name: forge-relay-contract
          namespace: forge
        spec:
          groups:
          - name: forge.relay.contract
            interval: 30s
            rules:
            # Métrica 1: Lag do Consumer Group
            - alert: ForgeRelayConsumerLagHigh
              expr: |
                kafka_consumergroup_lag{group="forge-streaming-v1"} > 100000
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Forge Relay consumer lag é alto (> 100k eventos)"
                description: "Consumer group {{ $labels.group }} está atrasado {{ $value }} eventos"
            
            # Métrica 2: Taxa de Consumo
            - alert: ForgeRelayConsumptionRateLow
              expr: |
                rate(kafka_consumergroup_lag{group="forge-streaming-v1"}[5m]) < 100
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Forge Relay consumption rate é baixa (< 100 evt/s)"
                description: "Taxa de consumo está abaixo do esperado"
            
            # Métrica 3: Offset Commit Failure
            - alert: ForgeRelayOffsetCommitFailure
              expr: |
                rate(kafka_consumergroup_commit_latency_total{group="forge-streaming-v1"}[5m]) == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Forge Relay offset commit está falhando"
                description: "Consumer group não consegue fazer commit de offsets"
            
            # Métrica 4: Rebalancing Frequente
            - alert: ForgeRelayRebalancingFrequent
              expr: |
                rate(kafka_consumergroup_rebalance_total{group="forge-streaming-v1"}[5m]) > 0.1
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Forge Relay está rebalanceando frequentemente"
                description: "Consumer group está rebalanceando mais de 1× a cada 10 min"
            
            # Métrica 5: Throughput Excedido
            - alert: ForgeRelayThroughputExceeded
              expr: |
                rate(kafka_consumergroup_bytes_consumed_total{group="forge-streaming-v1"}[5m]) > 500e6
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Forge Relay throughput excedeu limite (> 500 MB/s)"
                description: "Throughput atual: {{ $value | humanize }}B/s"
            
            # Métrica 6: Desserialização Falhando
            - alert: ForgeRelayDeserializationError
              expr: |
                rate(forge_deserialization_errors_total[5m]) > 10
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Forge Relay desserialização está falhando"
                description: "Taxa de erro: {{ $value | humanize }} erros/s"
            
            # Métrica 7: Watermark Atrasado
            - alert: ForgeRelayWatermarkLate
