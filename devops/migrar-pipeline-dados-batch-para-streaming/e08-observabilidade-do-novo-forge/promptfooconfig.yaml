        ## 4. Implemente estratégia de compactação de arquivos

        **Ação:** Defina política de compactação para evitar problema de arquivos pequenos.

        **Onde:** Arquivo `forge/config/compaction-strategy.md` (novo) no repositório do Forge.

        **Procedimento:**

        ```markdown
        # Estratégia de Compactação — Problema de Arquivos Pequenos

        ## Problema
        Streaming escreve a cada 30 s, criando muitos arquivos pequenos (~10–50 MB cada).
        Isso causa:
        - **Overhead de metadados:** Cada arquivo tem overhead (inode, índice)
        - **Lentidão de queries:** Ler 1000 arquivos pequenos é mais lento que ler 10 arquivos grandes
        - **Custo de armazenamento:** Fragmentação aumenta custo
        - **Custo de compactação:** Compactar muitos arquivos é caro

        **Exemplo:**
        ```
        Sem compactação (30 s × 120 = 3600 s = 1 hora):
        - 120 arquivos por hora
        - Tamanho: 120 × 20 MB = 2.4 GB
        - Overhead: 120 × 1 MB (metadados) = 120 MB

        Com compactação (1 arquivo por hora):
        - 1 arquivo por hora
        - Tamanho: 2.4 GB
        - Overhead: 1 × 1 MB (metadados) = 1 MB
        ```

        ## Estratégia: Compactação Incremental por Hora

        ### Política
        1. **Escrita:** Escrever a cada 30 s (sem compactação)
        2. **Compactação:** Compactar partição 1× por hora (após fechamento)
        3. **Frequência:** Executar compactação em janela de manutenção (02:00–04:00 UTC)
        4. **Retenção:** Manter dados por 90 dias

        ### Implementação

        #### Opção 1: Usar Delta Lake (Recomendado)
        ```python
        # Delta Lake suporta OPTIMIZE nativamente
        spark.sql("""
        OPTIMIZE delta.`/data/forge/aggregated`
        WHERE hour = '2024-01-15-10'
        ZORDER BY (tenant_id, service_id)
        """)
        ```

        **Vantagens:**
        - Compactação automática
        - ZORDER para otimizar queries
        - Versionamento de dados

        **Desvantagens:**
        - Requer Delta Lake (custo adicional)

        #### Opção 2: Usar Parquet + Rewrite (Sem Delta)
        ```python
        def compact_partition(spark, table_name, hour_str):
            """Compactar partição por hora"""
            # Ler partição
            df = spark.read.parquet(f"/data/forge/{table_name}/hour={hour_str}")
            
            # Reescrever com menos partições (ex: 1 arquivo)
            df.coalesce(1).write.mode("overwrite") \
                .parquet(f"/data/forge/{table_name}/hour={hour_str}")
            
            print(f"Partição {hour_str} compactada")

        # Agendar compactação 1× por hora (após fechamento)
        # Usar Airflow/cron para executar em 02:00–04:00 UTC
        ```

        **Vantagens:**
        - Sem dependência de Delta Lake
        - Simples de implementar

        **Desvantagens:**
        - Rewrite é caro (relê e reescreve dados)
        - Sem versionamento

        #### Opção 3: Usar Spark Structured Streaming com Compactação Automática
        ```python
        # Configurar Spark para compactar automaticamente
        spark.conf.set("spark.sql.streaming.fileStore.compactInterval", "3600")  # 1 hora
        spark.conf.set("spark.sql.streaming.fileStore.minBatchesToRetain", "2")

        # Escrever com compactação automática
        query = df_aggregated.writeStream \
            .format("parquet") \
            .option("path", "/data/forge/aggregated") \
            .option("checkpointLocation", "/data/forge/checkpoint/aggregated") \
            .outputMode("update") \
            .trigger(processingTime="30 seconds") \
            .start()
        ```

        **Vantagens:**
        - Automático
        - Sem overhead manual

        **Desvantagens:**
        - Menos controle
        - Pode compactar em horários ruins

        ---

        ## Cronograma de Compactação

        ### Janela de Manutenção: 02:00–04:00 UTC

        **Razão:** Fora do horário de pico de queries (08:00–18:00 UTC)

        **Procedimento:**
        ```python
        # Job de compactação (executar 1× por dia em 02:00 UTC)
        def daily_compaction_job():
            """Compactar partições do dia anterior"""
            from datetime import datetime, timedelta
            
            spark = SparkSession.builder.appName("forge-compaction").getOrCreate()
            
            # Compactar partições de 24 horas atrás
            yesterday = (datetime.utcnow() - timedelta(days=1)).strftime("%Y-%m-%d")
            
            tables = ["aggregated", "by_service", "by_version", "percentiles"]
            
            for table in tables:
                for hour in range(24):
                    hour_str = f"{yesterday}-{hour:02d}"
                    try:
                        spark.sql(f"""
                        OPTIMIZE parquet.`/data/forge/{table}`
                        WHERE hour = '{hour_str}'
                        """)
                        print(f"✅ {table}/{hour_str} compactado")
                    except Exception as e:
                        print(f"❌ {table}/{hour_str} falhou: {e}")
            
            # Compactar billing (1× por dia)
            spark.sql(f"""
            OPTIMIZE parquet.`/data/forge/billing_events`
            WHERE day = '{yesterday}'
            """)
            print(f"✅ billing_events/{yesterday} compactado")

        # Agendar com Airflow
        # DAG: forge-daily-compaction
        # Schedule: 02:00 UTC
        # Timeout: 2 horas
        ```

        ---

        ## Monitoramento de Compactação

        ```python
        def monitor_file_sizes(spark, table_name):
            """Monitorar tamanho de arquivos"""
            import os
            
            path = f"/data/forge/{table_name}"
            
            # Contar arquivos
            files = []
            for root, dirs, filenames in os.walk(path):
                for filename in filenames:
                    if filename.endswith(".parquet"):
                        filepath = os.path.join(root, filename)
                        size = os.path.getsize(filepath)
                        files.append((filepath, size))
            
            # Estatísticas
            total_size = sum(size for _, size in files)
            avg_size = total_size / len(files) if files else 0
            min_size = min(size for _, size in files) if files else 0
            max_size = max(size for _, size in files) if files else 0
            
            print(f"Tabela: {table_name}")
            print(f"  Arquivos: {len(files)}")
            print(f"  Tamanho total: {total_size / 1e9:.2f} GB")
            print(f"  Tamanho médio: {avg_size / 1e6:.2f} MB")
            print(f"  Tamanho mín: {min_size / 1e6:.2f} MB")
            print(f"  Tamanho máx: {max_size / 1e6:.2f} MB")
            
            # Alertar se muitos arquivos pequenos
            small_files = [f for _, s in files if s < 10e6]  # < 10 MB
            if len(small_files) > 100:
                print(f"⚠️  {len(small_files)} arquivos pequenos (< 10 MB)")

        # Executar monitoramento
        spark = SparkSession.builder.appName("forge-monitor").getOrCreate()
        for table in ["aggregated", "by_service", "by_version", "percentiles"]:
            monitor_file_sizes(spark, table)
        ```

        ---

        ## Impacto de Compactação

        ### Custo de Armazenamento
        ```
        Sem compactação:
        - 120 arquivos/hora × 24 horas = 2880 arquivos/dia
        - Overhead: 2880 × 1 MB = 2.88 GB/dia
        - Custo: 2.88 GB × $0.023/GB/mês = $0.07/dia

        Com compactação:
        - 24 arquivos/dia (1 por hora)
        - Overhead: 24 × 1 MB = 24 MB/dia
        - Custo: 24 MB × $0.023/GB/mês = $0.0006/dia

        Economia: $0.07 - $0.0006 = $0.069/dia = $25/ano
        ```

        ### Custo de Compactação
        ```
        Rewrite de 1 hora de dados:
        - Tamanho: 2.4 GB
        - Tempo: ~5 min (em cluster de 4 nós)
        - Custo: 4 nós × 5 min × $0.50/hora = $0.017

        Compactação diária (24 horas):
        - Custo: 24 × $0.017 = $0.41/dia = $150/ano

        ROI: Economia ($25/ano) < Custo ($150/ano)
        Conclusão: Compactação não é viável para todas as partições
        ```

        ### Recomendação
        - **Compactar:** Apenas partições > 7 dias (dados "frios")
        - **Não compactar:** Partições < 7 dias (dados "quentes", ainda sendo atualizadas)

        ```python
        def smart_compaction(spark):
            """Compactar apenas partições antigas"""
            from datetime import datetime, timedelta
            
            # Compactar partições > 7 dias
            cutoff_date = (datetime.utcnow() - timedelta(days=7)).strftime("%Y-%m-%d")
            
            spark.sql(f"""
            OPTIMIZE parquet.`/data/forge/aggregated`
            WHERE hour < '{cutoff_date}'
            """)
        ```

        ---

        ## Validação

        - [ ] Compactação reduz número de arquivos
        - [ ] Queries em dados compactados são mais rápidas
        - [ ] Custo de compactação é menor que economia de armazenamento
        - [ ] Dados compactados são idênticos aos originais

        ```

        **Verificação:**

        ```bash
        # Monitorar tamanho de arquivos antes e depois
        spark-submit \
        --master local[4] \
        forge/jobs/monitor_compaction.py
        # Esperado: tamanho médio de arquivo aumenta após compactação
        ```

