        **Características:**
        - Chave natural: `(window_start, tenant_id, service_id, violation_id)`
        - Modo de saída: Batch (1× por hora)
        - Frequência de escrita: A cada 1 hora
        - Tamanho de linha: ~250 bytes

        **Estratégia:** **Append com Deduplicação**
