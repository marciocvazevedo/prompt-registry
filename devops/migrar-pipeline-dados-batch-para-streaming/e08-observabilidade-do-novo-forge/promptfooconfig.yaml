        ## W. Riscos e mitigação

        | Risco | Probabilidade | Impacto | Mitigação |
        |-------|---------------|--------|-----------|
        | Classificação de falha incorreta (falso positivo) | Média | Médio | Testar com dados reais; ajustar critérios |
        | DLQ fica cheio (muitos eventos inválidos) | Média | Médio | Monitorar tamanho de DLQ; alertar se > 1M eventos |
        | Replay cria duplicatas (reprocessamento sem dedup) | Média | Alto | Implementar deduplicação; validar com testes |
        | Backfill é muito lento (reprocessar 90 dias) | Média | Médio | Paralelizar backfill; usar múltiplos jobs |
        | Runbook é incompleto (ação não resolve problema) | Média | Médio | Testar runbook com falhas simuladas; atualizar |
        | Alertas geram muitos falsos positivos | Alta | Médio | Ajustar thresholds; usar múltiplas condições |
        | Alertas não disparam (falha não é detectada) | Baixa | Alto | Testar alertas com falhas simuladas; validar |
        | Rollback é muito lento (downtime prolongado) | Baixa | Alto | Testar rollback em staging; documentar passos |
        | Dados históricos são perdidos (backfill falha) | Baixa | Alto | Manter backup de dados; validar backfill |
        | On-call não consegue seguir runbook (falta contexto) | Média | Médio | Documentar bem; treinar on-call; ter contatos |

        ---

        ## Dados faltantes e confirmações necessárias

        ### Dados que faltam:

        1. **Taxa real de eventos inválidos:** Qual é a taxa esperada de eventos inválidos? (Necessário para threshold de alerta)
        2. **Taxa real de erro transitório:** Qual é a taxa esperada de erros transitórios? (Necessário para threshold de retry)
        3. **Tempo de recuperação esperado:** Quanto tempo leva para Relay/DW recuperar? (Necessário para timeout de wait)
        4. **Tamanho máximo de DLQ:** Qual é o tamanho máximo aceitável de DLQ? (Necessário para alerta)
        5. **Frequência de backfill:** Com que frequência backfill será executado? (Necessário para agendamento)
        6. **Retenção de DLQ:** Quanto tempo manter eventos em DLQ? (Necessário para configuração)
        7. **Contatos de on-call:** Quem é responsável por cada tipo de falha? (Necessário para escalação)
        8. **SLA de resolução:** Qual é o SLA para resolver cada tipo de falha? (Necessário para alerta)

        ### Confirmações que derrubariam/validariam escolhas futuras:

        - Se **taxa de eventos inválidos > 1000/min**, aumentar threshold de alerta
        - Se **tempo de recuperação > 10 min**, aumentar timeout de wait
        - Se **tamanho de DLQ > 10M eventos**, aumentar retenção ou limpar mais frequentemente
        - Se **backfill é muito lento**, paralelizar ou usar batch
        - Se **runbook não resolve problema**, adicionar mais passos de diagnóstico
        - Se **alertas geram muitos falsos positivos**, ajustar thresholds ou usar múltiplas condições
        - Se **on-call não consegue seguir runbook**, simplificar ou adicionar mais contexto

