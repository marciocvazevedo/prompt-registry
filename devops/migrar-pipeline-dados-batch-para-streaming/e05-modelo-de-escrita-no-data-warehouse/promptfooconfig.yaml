        ### Etapa 5: Agregação Global
        **Janela:** 30 segundos (em vez de 1 hora no batch)
        **Watermark:** 45 segundos (de Etapa 3)
        **Allowed lateness:** 60 segundos
        **Late drop:** > 105 segundos
        **Modo de saída:** `update`

        **Justificativa:** Idêntica à Etapa 4

        **Implementação:**
        ```python
        df_watermarked = df_normalized.withWatermark("timestamp", "45 seconds")
        df_aggregated = df_watermarked.groupBy(
            window(col("timestamp"), "30 seconds"),
            col("tenant_id")
        ).agg(
            sum("metric_value").alias("total_value"),
            count("*").alias("event_count"),
            avg("metric_value").alias("avg_value")
        )
        query = df_aggregated.writeStream \
            .format("parquet") \
            .option("path", "/data/forge/aggregated") \
            .option("checkpointLocation", "/data/forge/checkpoint/aggregated") \
            .outputMode("update") \
            .trigger(processingTime="30 seconds") \
            .start()
        ```

