            WHEN status = 'closed' THEN 'Partição fechada, dados finais'
            WHEN status = 'open' THEN 'Partição aberta, dados podem ser atualizados'
            ELSE 'Status desconhecido'
        END AS description
        FROM forge.partition_metadata
        ORDER BY
        hour DESC;

