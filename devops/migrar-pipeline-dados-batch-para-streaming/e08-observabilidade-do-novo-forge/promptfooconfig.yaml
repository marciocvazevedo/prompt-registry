        ```python
        #!/usr/bin/env python3
        """
        Testes de Escrita e Leitura Consistente
        Valida que escrita incremental não cria duplicatas e leitura é consistente.
        """
        import pytest
        from pyspark.sql import SparkSession
        from pyspark.sql.functions import col, count, sum as spark_sum
        from datetime import datetime, timedelta
        import time
        import logging

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        @pytest.fixture(scope="session")
        def spark():
            """Cria sessão Spark para testes"""
            return SparkSession.builder \
                .appName("forge-write-consistency-tests") \
                .master("local[4]") \
                .getOrCreate()

        class TestWriteConsistency:
            """Testes de escrita e leitura consistente"""
            
            def test_no_duplicates_after_write(self, spark):
                """Teste: Escrita não cria duplicatas"""
                logger.info("Teste: No Duplicates After Write")
                
                # Dados de entrada
                input_data = [
                    {"window_start": "2024-01-15-10", "tenant_id": "t1", "total_value": 100},
                    {"window_start": "2024-01-15-10", "tenant_id": "t1", "total_value": 110},  # Duplicata
                    {"window_start": "2024-01-15-10", "tenant_id": "t2", "total_value": 200},
                ]
                df_input = spark.createDataFrame(input_data)
                
                # Deduplicar (simular escrita com merge)
                df_deduplicated = df_input.dropDuplicates(["window_start", "tenant_id"])
                
                # Validar
                assert df_deduplicated.count() == 2, "Deve remover duplicatas"
                logger.info("✅ Teste passou")
            
            def test_idempotent_write(self, spark):
                """Teste: Escrita é idempotente (2× escrita = 1× escrita)"""
                logger.info("Teste: Idempotent Write")
                
                # Dados de entrada
                input_data = [
                    {"window_start": "2024-01-15-10", "tenant_id": "t1", "total_value": 100},
                    {"window_start": "2024-01-15-10", "tenant_id": "t2", "total_value": 200},
                ]
                df_input = spark.createDataFrame(input_data)
                
                # Escrever 1×
                df_result_1 = df_input.dropDuplicates(["window_start", "tenant_id"])
                count_1 = df_result_1.count()
                
