        ## Teste de Reexecutabilidade

        ```python
        # Teste: Executar etapa 2× com mesmos dados, validar que resultado é idêntico
        def test_idempotency(etapa_func, input_df):
            result_1 = etapa_func(input_df)
            result_2 = etapa_func(input_df)
            
            # Comparar
            assert result_1.count() == result_2.count(), "Row count mismatch"
            assert result_1.exceptAll(result_2).count() == 0, "Data mismatch"
            print("✅ Idempotência validada")

        # Teste: Executar etapa com dados duplicados, validar que resultado é idêntico
        def test_deduplication(etapa_func, input_df):
            # Duplicar dados
            input_df_duplicated = input_df.union(input_df)
            
            result_original = etapa_func(input_df)
            result_duplicated = etapa_func(input_df_duplicated)
            
            # Comparar
            assert result_original.count() == result_duplicated.count(), "Deduplication failed"
            print("✅ Deduplicação validada")
        ```

