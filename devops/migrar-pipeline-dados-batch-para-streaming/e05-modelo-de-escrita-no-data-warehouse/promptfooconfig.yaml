        ## Dados faltantes e confirmações necessárias

        ### Dados que faltam:
        1. **Código exato do batch:** Qual é o código atual das 14 etapas? (Necessário para validar equivalência)
        2. **Schema das tabelas de saída:** Qual é o schema exato de cada tabela? (Necessário para validar corretude)
        3. **Tamanho real de estado por tenant:** Qual é o maior tenant em termos de volume? (Necessário para dimensionar RocksDB)
        4. **Distribuição de latência real:** Qual é a distribuição real de latência de eventos? (Necessário para ajustar watermark)
        5. **Custo de RocksDB:** Qual é o custo de manter 1 GB de estado em RocksDB? (Necessário para trade-off streaming vs batch)
        6. **Frequência de atualização de lookup:** Com que frequência metadados de tenant/SLA/deployment mudam? (Necessário para definir TTL)
        7. **Capacidade de Sentinel/Cerebro/Pepper:** Conseguem processar dados a cada 30 s? (Necessário para validar com consumidores)

        ### Confirmações que derrubariam/validariam escolhas futuras:
        - Se **tamanho de estado > 10 GB**, manter Etapas 7, 8, 12 em batch (confirmado)
        - Se **latência p95 > 120 s**, aumentar paralelismo ou otimizar transformações
        - Se **completude < 99.9%**, investigar causa raiz e ajustar deduplicação
        - Se **consumidores não conseguem lidar com modo `update`**, usar modo `append` com reprocessamento
        - Se **broadcast > 100 MB**, particionar ou usar state store
        - Se **snapshot fica desatualizado**, implementar recarregamento automático
        - Se **testes de equivalência falham**, investigar e ajustar transformações

