        - [ ] **SLOs:** Frescor (p95 = 120 s), completude (≥ 99.9%), disponibilidade (≥ 99.5%), RTO (≤ 5 min), RPO (0 eventos) documentados.
        - [ ] **Semântica:** At-Least-Once com idempotência escolhida e justificada; implicações por consumidor documentadas.
        - [ ] **Equivalência:** Critérios de completude (≥ 99.9%), corretude (100%), schema (100%) definidos; script de validação criado.
