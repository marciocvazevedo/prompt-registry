        ---

        ## W. Riscos e mitigação

        | Risco | Probabilidade | Impacto | Mitigação |
        |-------|---------------|--------|-----------|
        | SLOs são muito agressivos (2 min p95 não é alcançável) | Média | Alto | Validar com protótipo (Etapa 3); ajustar SLOs se necessário |
        | Consumidores não conseguem lidar com duplicatas | Média | Alto | Testar com dados reais; implementar deduplicação em consumidores |
        | Orçamento de erro é muito restritivo (gatilhos disparam frequentemente) | Média | Médio | Ajustar orçamentos após prototipagem; validar com dados históricos |
        | SLAs herdados não são confirmados com consumidores | Baixa | Alto | Enviar questionário agora; agendar reunião de alinhamento |
        | Gatilhos de rollback não funcionam corretamente | Baixa | Alto | Testar gatilhos em staging; validar com simulação de falhas |
        | Custo de operação aumenta significativamente | Média | Médio | Estimar custo na Etapa 3; comparar com batch |
        | Equivalência não é alcançada (streaming ≠ batch) | Média | Alto | Investigar causa raiz; ajustar transformações se necessário |

        ---

        ## Dados faltantes e confirmações necessárias

        ### Dados que faltam:

        1. **Confirmação de SLAs com consumidores:** Sentinel, Cerebro e Pepper confirmaram os SLOs propostos?
        2. **Capacidade de Sentinel:** Consegue processar dados a cada 30 s sem overhead?
        3. **Capacidade de Cerebro:** Consegue ingerir dados a cada 30 s sem fragmentação?
        4. **Capacidade de Pepper:** Query de billing consegue deduplicar corretamente?
        5. **Custo de streaming:** Qual é o custo estimado de streaming vs batch?
        6. **Retenção no Relay:** Quantos dias de eventos estão disponíveis para replay?
        7. **Tamanho de estado por tenant:** Qual é o maior tenant em termos de volume?

        ### Confirmações que derrubariam/validariam escolhas futuras:

        - Se **SLO de 2 min p95 não for alcançável**, aumentar para 5 min ou 10 min.
        - Se **consumidores não conseguem lidar com duplicatas**, usar exactly-once em vez de at-least-once.
        - Se **custo de streaming > 2× custo de batch**, reconsiderar viabilidade econômica.
        - Se **retenção no Relay < 24h**, implementar buffer local para replay.
        - Se **tamanho de estado por tenant > 10 GB**, usar state store distribuído.

