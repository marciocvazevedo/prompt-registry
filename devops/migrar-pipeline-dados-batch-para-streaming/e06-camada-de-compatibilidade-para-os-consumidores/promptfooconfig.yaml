        ## Monitoramento de Compactação

        ```python
        def monitor_file_sizes(spark, table_name):
            """Monitorar tamanho de arquivos"""
            import os
            
            path = f"/data/forge/{table_name}"
            
            # Contar arquivos
            files = []
            for root, dirs, filenames in os.walk(path):
                for filename in filenames:
                    if filename.endswith(".parquet"):
                        filepath = os.path.join(root, filename)
                        size = os.path.getsize(filepath)
                        files.append((filepath, size))
            
            # Estatísticas
            total_size = sum(size for _, size in files)
            avg_size = total_size / len(files) if files else 0
            min_size = min(size for _, size in files) if files else 0
            max_size = max(size for _, size in files) if files else 0
            
            print(f"Tabela: {table_name}")
            print(f"  Arquivos: {len(files)}")
            print(f"  Tamanho total: {total_size / 1e9:.2f} GB")
            print(f"  Tamanho médio: {avg_size / 1e6:.2f} MB")
            print(f"  Tamanho mín: {min_size / 1e6:.2f} MB")
            print(f"  Tamanho máx: {max_size / 1e6:.2f} MB")
            
            # Alertar se muitos arquivos pequenos
            small_files = [f for _, s in files if s < 10e6]  # < 10 MB
            if len(small_files) > 100:
                print(f"⚠️  {len(small_files)} arquivos pequenos (< 10 MB)")

        # Executar monitoramento
        spark = SparkSession.builder.appName("forge-monitor").getOrCreate()
        for table in ["aggregated", "by_service", "by_version", "percentiles"]:
            monitor_file_sizes(spark, table)
        ```

