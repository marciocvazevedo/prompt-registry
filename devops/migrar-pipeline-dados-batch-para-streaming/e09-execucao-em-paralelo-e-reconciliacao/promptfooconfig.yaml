        ## W. Riscos e mitigação

        | Risco | Probabilidade | Impacto | Mitigação |
        |-------|---------------|--------|-----------|
        | Métrica não é coletada (erro de instrumentação) | Média | Médio | Testar coleta em staging; validar com curl |
        | Alerta dispara muito frequentemente (ruído) | Alta | Médio | Ajustar thresholds; usar múltiplas condições; silenciar durante migração |
        | Alerta não dispara (falha de detecção) | Baixa | Alto | Testar alertas com provocação; validar em staging |
        | Latência E2E não é medida corretamente (timestamp incorreto) | Média | Alto | Validar timestamps com dados reais; comparar com batch |
        | Dashboard fica lento (muitas métricas) | Média | Médio | Limitar número de séries; usar agregação |
        | Prometheus fica sem espaço (muitas métricas) | Média | Médio | Configurar retenção; limpar dados antigos |
        | Consumidores não conseguem usar alertas (integração falha) | Média | Médio | Testar integração com Sentinel; validar webhook |
        | Custo de monitoramento aumenta (muitas métricas) | Baixa | Médio | Limitar granularidade; usar sampling |
        | Instrumentação degrada performance (overhead) | Baixa | Médio | Medir overhead; otimizar coleta de métricas |
        | Testes de alertas causam falsos positivos em produção | Média | Alto | Executar testes apenas em staging; usar labels para separar |

