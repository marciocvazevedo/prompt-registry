        ## 3. Defina critérios de equivalência: "streaming ≡ batch"

        **Ação:** Formalize como validar que o Forge em streaming produz os mesmos resultados que o batch.

        **Onde:** Arquivo `forge/docs/equivalence-criteria.md` (novo) no repositório do Forge.

        **Procedimento:**

        ### 3.1 Definição de equivalência

        **Ação:** Defina o que significa "streaming é equivalente ao batch".

        **Comando/Configuração:**

        ```markdown
        # Critérios de Equivalência: Streaming ≡ Batch

        ## Definição
        Streaming é equivalente ao batch se, para um período de tempo T:
        1. Ambos processam o mesmo conjunto de eventos (completude).
        2. Ambos produzem o mesmo resultado final (corretude).
        3. Ambos produzem resultados no mesmo formato (schema).

        ## Período de validação
        - **Janela:** Últimas 24 horas (1 dia completo).
        - **Granularidade:** Por hora (24 períodos de 1 hora).
        - **Frequência:** Diária (após cada execução do batch).

        ## Métricas de equivalência

        ### 1. Completude (Row Count)
        **Métrica:** Número de linhas em cada tabela.

        **Fórmula:**
        ```
        completude = (linhas_streaming / linhas_batch) * 100
        ```

        **Alvo:**
        - Completude ≥ 99.9% (diferença ≤ 0.1%)
        - Diferença absoluta ≤ 0.1% das linhas por hora

        **Exemplo:**
        ```
        Hora: 2024-01-15 10:00 UTC
        Tabela: forge_events_aggregated
        Linhas (batch): 1,000,000
        Linhas (streaming): 999,900
        Completude: 99.99% ✅ (diferença = 100 linhas = 0.01%)
        ```

        ### 2. Corretude (Value Comparison)
        **Métrica:** Valores de agregações críticas.

        **Fórmula:**
        ```
        corretude = (valores_streaming == valores_batch) ? 100% : 0%
        ```

        **Validação por tabela:**

        #### Tabela: `forge_events_aggregated`
        ```sql
        -- Comparar SUM, COUNT, AVG, MIN, MAX por tenant/hora
        SELECT
          hour,
          tenant_id,
          SUM(request_count) AS sum_requests_batch,
          COUNT(*) AS count_rows_batch,
          AVG(error_rate) AS avg_error_rate_batch
        FROM forge_events_aggregated_batch
        WHERE hour >= CURRENT_TIMESTAMP() - INTERVAL '24 hours'
        GROUP BY hour, tenant_id
        ORDER BY hour, tenant_id;

        -- Comparar com streaming
        SELECT
          hour,
          tenant_id,
          SUM(request_count) AS sum_requests_streaming,
          COUNT(*) AS count_rows_streaming,
          AVG(error_rate) AS avg_error_rate_streaming
        FROM forge_events_aggregated_streaming
        WHERE hour >= CURRENT_TIMESTAMP() - INTERVAL '24 hours'
        GROUP BY hour, tenant_id
        ORDER BY hour, tenant_id;

        -- Diferença
        SELECT
          b.hour,
          b.tenant_id,
          b.sum_requests_batch,
          s.sum_requests_streaming,
          ABS(b.sum_requests_batch - s.sum_requests_streaming) AS diff_sum,
          CASE
            WHEN ABS(b.sum_requests_batch - s.sum_requests_streaming) = 0 THEN '✅ OK'
            ELSE '❌ MISMATCH'
          END AS status
        FROM batch_agg b
        FULL OUTER JOIN streaming_agg s
          ON b.hour = s.hour AND b.tenant_id = s.tenant_id
        WHERE b.hour >= CURRENT_TIMESTAMP() - INTERVAL '24 hours'
        ORDER BY b.hour, b.tenant_id;
        ```

        **Alvo:**
        - Corretude = 100% (sem mismatches)
        - Diferença absoluta ≤ 0.1% do valor

        #### Tabela: `forge_events_by_service`
