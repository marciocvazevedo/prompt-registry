            ## Apêndice: Script de Coleta de Métricas de Aprovação

            ```python
            #!/usr/bin/env python3
            """
            Script de Coleta de Métricas de Aprovação
            Coleta todas as métricas necessárias para avaliar critérios de aprovação.
            """
            import json
            from datetime import datetime, timedelta
            import subprocess
            import requests
            import logging

            logging.basicConfig(level=logging.INFO)
            logger = logging.getLogger(__name__)

            class ApprovalMetricsCollector:
                """Coleta métricas de aprovação"""
                
                def __init__(self, prometheus_url, dw_host, dw_user, dw_db):
                    self.prometheus_url = prometheus_url
                    self.dw_host = dw_host
                    self.dw_user = dw_user
                    self.dw_db = dw_db
                    self.metrics = {
                        "timestamp": datetime.utcnow().isoformat(),
                        "equivalence": {},
                        "latency": {},
                        "completeness": {},
                        "availability": {},
                        "load": {},
                        "consumers": {}
                    }
                
                def query_prometheus(self, query):
                    """Executar query no Prometheus"""
                    try:
                        response = requests.get(
                            f"{self.prometheus_url}/api/v1/query",
                            params={"query": query}
                        )
                        result = response.json()
                        if result["status"] == "success" and result["data"]["result"]:
                            return float(result["data"]["result"][0]["value"][1])
                        return None
                    except Exception as e:
                        logger.error(f"Erro ao executar query Prometheus: {e}")
                        return None
                
                def query_dw(self, query):
                    """Executar query no DW"""
                    try:
                        result = subprocess.run(
                            ["psql", "-h", self.dw_host, "-U", self.dw_user,
                            "-d", self.dw_db, "-c", query],
                            capture_output=True,
                            text=True,
                            timeout=60
                        )
                        if result.returncode == 0:
                            # Parse resultado
                            lines = result.stdout.strip().split("\n")
                            if len(lines) >= 3:
                                return float(lines[2].strip())
                        return None
                    except Exception as e:
                        logger.error(f"Erro ao executar query DW: {e}")
                        return None
                
                def collect_all(self):
                    """Coletar todas as métricas"""
                    logger.info("Coletando métricas de aprovação...")
                    
                    # Equivalência
                    self.metrics["equivalence"]["divergence_rate"] = self.query_dw(
                        "SELECT (SUM(CASE WHEN divergence_type IS NOT NULL THEN 1 ELSE 0 END) / COUNT(*)) * 100 "
                        "FROM forge.reconciliation.divergences WHERE timestamp >= CURRENT_DATE - 7;"
                    )
                    
                    # Latência
                    self.metrics["latency"]["p95"] = self.query_prometheus(
                        "histogram_quantile(0.95, rate(forge_latency_e2e_seconds_bucket[7d]))"
                    )
                    self.metrics["latency"]["p99"] = self.query_prometheus(
                        "histogram_quantile(0.99, rate(forge_latency_e2e_seconds_bucket[7d]))"
                    )
                    
                    # Completude
                    self.metrics["completeness"]["completeness"] = self.query_dw(
                        "SELECT (SUM(events_written) / SUM(events_consumed)) * 100 "
                        "FROM forge.monitoring.metrics WHERE timestamp >= CURRENT_DATE - 7 AND mode = 'streaming';"
                    )
                    
                    # Carga
                    self.metrics["load"]["relay_production_rate"] = self.query_prometheus(
                        "rate(kafka_topic_partition_append_total[7d])"
                    )
                    
                    logger.info(f"Métricas coletadas: {json.dumps(self.metrics, indent=2)}")
                    return self.metrics
                
                def save(self, output_file):
                    """Salvar métricas em arquivo"""
                    with open(output_file, "w") as f:
                        json.dump(self.metrics, f, indent=2)
                    logger.info(f"Métricas salvas em: {output_file}")

            def main():
                """Função principal"""
                collector = ApprovalMetricsCollector(
                    prometheus_url="http://prometheus:9090",
                    dw_host="<dw-host>",
                    dw_user="<dw-user>",
                    dw_db="forge"
                )
                
                metrics = collector.collect_all()
                collector.save("approval_metrics_day14.json")

            if __name__ == "__main__":
                main()
            ```
