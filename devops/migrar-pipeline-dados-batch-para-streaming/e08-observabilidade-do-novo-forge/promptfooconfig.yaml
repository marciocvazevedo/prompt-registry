        ## 3. Defina estado, tamanho estimado e política de expiração

        **Ação:** Para cada etapa com lookup ou histórico, defina onde fica o estado, tamanho e expiração.

        **Onde:** Arquivo `forge/config/state-management.md` (novo) no repositório do Forge.

        **Procedimento:**

        ```markdown
        # Gerenciamento de Estado — Forge Streaming

        ## Definições
        - **Estado:** Dados mantidos em memória ou disco para suportar operações stateful (lookup, histórico)
        - **Tamanho:** Quantidade de dados em estado (bytes, GB)
        - **TTL (Time To Live):** Tempo máximo que um estado é mantido antes de expiração
        - **Expiração:** Política de limpeza de estado expirado

        ## Estado por Etapa

        ### Etapa 2: Enriquecimento com Metadados de Tenant
        **Tipo de estado:** Cache de lookup (broadcast)
        **Dados:** Tabela `tenant_metadata` (tenant_id → tenant_name, tenant_tier, region)
        **Tamanho estimado:** [SUPOSIÇÃO] 10 MB (1000 tenants × 10 KB por tenant)
        **Fonte:** Snapshot diário de `tenant_metadata` (atualizar 1× por dia)
        **TTL:** 24 horas
        **Política de expiração:** Recarregar snapshot a cada 24 horas

        **Implementação:**
        ```python
        # Carregar snapshot de tenant_metadata
        df_tenant_meta = spark.read.parquet("/data/tenant_metadata")
        broadcast_tenant_meta = broadcast(df_tenant_meta)

        # Usar em join
        df_enriched = df_parsed.join(
            broadcast_tenant_meta,
            on="tenant_id",
            how="left"
        )
        ```

        **Validação:**
        - [ ] Snapshot é carregado corretamente
        - [ ] Tamanho do broadcast é < 100 MB (limite típico)
        - [ ] Recarregamento a cada 24 h funciona sem interrupção

