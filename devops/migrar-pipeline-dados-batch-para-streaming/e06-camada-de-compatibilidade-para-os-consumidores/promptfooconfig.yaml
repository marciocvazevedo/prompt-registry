        ## W. Riscos e mitigação

        | Risco | Probabilidade | Impacto | Mitigação |
        |-------|---------------|--------|-----------|
        | Duplicatas em escrita (modo `update` escreve múltiplas vezes) | Alta | Alto | Implementar deduplicação por chave natural; validar com testes |
        | Leitura suja (consumidor lê dados de partição aberta) | Média | Médio | Usar marcador de fechamento; documentar para consumidores |
        | Inconsistência de billing (eventos perdidos ou duplicados) | Média | Alto | Usar staging+merge; validar completude; testes de equivalência |
        | Problema de arquivos pequenos (muitos arquivos, queries lentas) | Alta | Médio | Implementar compactação; monitorar tamanho de arquivo |
        | Custo de compute aumenta (streaming 24/7 vs batch 1h/dia) | Alta | Médio | Aceitar custo adicional (13%); ROI é positivo |
        | Compactação é muito cara (rewrite de dados) | Média | Médio | Compactar apenas dados antigos (> 7 dias); usar Delta Lake se possível |
        | Consumidores não conseguem lidar com modo `update` | Média | Médio | Testar com Sentinel, Cerebro, Pepper; ajustar queries se necessário |
        | Partição não fecha (marcador não é criado) | Baixa | Médio | Implementar verificação de fechamento; alertar se partição não fecha |
        | Escrita falha (erro de I/O, disco cheio) | Baixa | Alto | Implementar retry; monitorar espaço em disco; alertar se falha |
        | Testes de escrita falham (deduplicação não funciona) | Média | Alto | Investigar causa raiz; ajustar lógica de deduplicação; revalidar |

