        ### Etapa 5: Agregação Global (Janela de 1 Hora)
        **Tipo:** Agregação por janela (stateful)
        **Entrada:** Tabela `forge_events_normalized`
        **Saída:** Tabela `forge_events_aggregated`
        **Lógica:**
        - Agrupar por `tenant_id`, `hour`
        - Calcular: `SUM(metric_value)`, `COUNT(*)`, `AVG(metric_value)`
        - Particionar por hora

        **Código (batch):**
        \`\`\`python
        df_normalized = spark.read.parquet("/data/forge/normalized")
        df_aggregated = df_normalized.groupBy(
            date_trunc("hour", col("timestamp")).alias("hour"),
            col("tenant_id")
        ).agg(
            sum("metric_value").alias("total_value"),
            count("*").alias("event_count"),
            avg("metric_value").alias("avg_value")
        )
        df_aggregated.write.mode("overwrite").partitionBy("hour").parquet("/data/forge/aggregated")
        \`\`\`

        **Classificação:** ✅ Agregação por janela → Adequado para streaming (com watermark)

