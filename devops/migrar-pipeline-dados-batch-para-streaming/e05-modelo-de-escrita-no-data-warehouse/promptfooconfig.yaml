        ## 5. Indique quais etapas não fazem sentido em streaming

        **Ação:** Justifique por que Etapas 7, 8, 12 permanecem em batch.

        **Onde:** Arquivo `forge/docs/batch-vs-streaming-decision.md` (novo) no repositório do Forge.

        **Procedimento:**

        ```markdown
        # Decisão: Quais Etapas Permanecem em Batch

        ## Resumo Executivo
        Das 14 etapas, 11 são adequadas para streaming (latência de 30 s).
        3 etapas (7, 8, 12) permanecem em batch (1× por hora ou 1× por dia) porque requerem estado histórico grande.

        ## Análise Detalhada

        ### Etapas Adequadas para Streaming (11 etapas)

        #### Etapas 1, 3, 14: Sem Estado
        - **Razão:** Não dependem de histórico ou lookup
        - **Latência:** < 1 s por evento
        - **Estado:** Nenhum
        - **Decisão:** ✅ Streaming

        #### Etapas 4, 5, 10, 11, 13: Agregação por Janela
        - **Razão:** Janelas de 30 s (ou 1 dia para billing) são viáveis em streaming
        - **Latência:** 30 s (ou 1 dia para billing)
        - **Estado:** Pequeno (buffer de 30 s de eventos)
        - **Decisão:** ✅ Streaming

        #### Etapas 2, 6, 9: Enriquecimento por Lookup
        - **Razão:** Lookup é feito via broadcast de snapshot diário
        - **Latência:** < 1 s por evento
        - **Estado:** Pequeno (10–100 MB de broadcast)
        - **Decisão:** ✅ Streaming (com snapshot atualizado 1× por dia)

        ---

        ### Etapas Inadequadas para Streaming (3 etapas)

        #### Etapa 7: Detecção de Anomalia
        **Problema:** Requer histórico de 24 horas
        - **Tamanho de estado:** ~1 GB (1000 tenants × 24 horas × 50 KB/hora)
        - **Latência de estado:** Manter 24 horas de dados em RocksDB é caro
        - **Custo:** CPU/memória para manter estado grande
        - **Alternativa:** Executar em batch 1× por hora (ou 1× por dia)

        **Análise de Trade-off:**
        ```
        Streaming:
        - Latência: 30 s (anomalias detectadas em tempo real)
        - Custo: Alto (1 GB de estado, CPU para manter)
        - Complexidade: Alta (gerenciar estado em RocksDB)

        Batch (1× por hora):
        - Latência: 60 min (anomalias detectadas a cada hora)
        - Custo: Baixo (job rápido, sem estado persistente)
        - Complexidade: Baixa (lógica simples)

        Batch (1× por dia):
        - Latência: 24 horas (anomalias detectadas 1× por dia)
        - Custo: Muito baixo (job rápido)
        - Complexidade: Muito baixa

        Decisão: ❌ Batch 1× por hora (trade-off entre latência e custo)
        ```

        **Justificativa:**
        - Anomalias são alertas; latência de 1 hora é aceitável
        - Custo de manter 1 GB de estado em streaming é alto
        - Batch 1× por hora é mais simples e barato

        ---

        #### Etapa 8: SLA Violations
        **Problema:** Requer histórico de 24 horas + deduplicação
        - **Tamanho de estado:** ~500 MB (1000 tenants × 100 serviços × 24 horas × 20 bytes)
        - **Latência de estado:** Manter 24 horas de dados em RocksDB é caro
        - **Custo:** CPU/memória para manter estado grande
        - **Alternativa:** Executar em batch 1× por hora (ou 1× por dia)

        **Análise de Trade-off:**
        ```
        Streaming:
        - Latência: 30 s (violações detectadas em tempo real)
        - Custo: Alto (500 MB de estado, CPU para manter)
        - Complexidade: Alta (gerenciar estado em RocksDB)

        Batch (1× por hora):
        - Latência: 60 min (violações detectadas a cada hora)
        - Custo: Baixo (job rápido, sem estado persistente)
        - Complexidade: Baixa (lógica simples)

        Decisão: ❌ Batch 1× por hora (trade-off entre latência e custo)
        ```

        **Justificativa:**
        - SLA violations são alertas; latência de 1 hora é aceitável
        - Custo de manter 500 MB de estado em streaming é alto
        - Batch 1× por hora é mais simples e barato

        ---

        #### Etapa 12: Detecção de Mudança de Comportamento
        **Problema:** Requer histórico de 7 dias
        - **Tamanho de estado:** ~7 GB (1000 tenants × 7 dias × 1 MB/dia)
        - **Latência de estado:** Manter 7 dias de dados em RocksDB é muito caro
        - **Custo:** CPU/memória para manter estado muito grande
        - **Alternativa:** Executar em batch 1× por dia

        **Análise de Trade-off:**
        ```
        Streaming:
        - Latência: 30 s (mudanças detectadas em tempo real)
        - Custo: Muito alto (7 GB de estado, CPU para manter)
        - Complexidade: Muito alta (gerenciar estado em RocksDB)

        Batch (1× por dia):
        - Latência: 24 horas (mudanças detectadas 1× por dia)
        - Custo: Muito baixo (job rápido, sem estado persistente)
        - Complexidade: Muito baixa

        Decisão: ❌ Batch 1× por dia (estado é muito grande para streaming)
        ```

        **Justificativa:**
        - Detecção de mudança é análise; latência de 24 horas é aceitável
        - Custo de manter 7 GB de estado em streaming é proibitivo
        - Batch 1× por dia é a única opção viável

        ---

        ## Resumo de Decisão

        | Etapa | Tipo | Streaming? | Razão | Alternativa |
        |-------|------|-----------|-------|-------------|
        | 1 | Parsing | ✅ Sim | Sem estado | — |
        | 2 | Lookup | ✅ Sim | Broadcast pequeno (10 MB) | — |
        | 3 | Normalização | ✅ Sim | Sem estado | — |
        | 4 | Agregação | ✅ Sim | Janela de 30 s | — |
        | 5 | Agregação | ✅ Sim | Janela de 30 s | — |
        | 6 | Lookup | ✅ Sim | Broadcast pequeno (50 MB) | — |
        | 7 | Anomalia | ❌ Não | Estado de 1 GB | Batch 1× por hora |
        | 8 | SLA Violations | ❌ Não | Estado de 500 MB | Batch 1× por hora |
        | 9 | Lookup | ✅ Sim | Broadcast pequeno (100 MB) | — |
        | 10 | Agregação | ✅ Sim | Janela de 30 s | — |
        | 11 | Percentis | ✅ Sim | Janela de 30 s | — |
        | 12 | Mudança | ❌ Não | Estado de 7 GB | Batch 1× por dia |
        | 13 | Billing | ✅ Sim | Janela de 1 dia | — |
        | 14 | Exportação | ✅ Sim | Sem estado | — |

