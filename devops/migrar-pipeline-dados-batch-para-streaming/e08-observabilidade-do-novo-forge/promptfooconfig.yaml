        ### Etapa 7: Detecção de Anomalia (Histórico de 24h)
        **Tipo de estado:** Histórico em estado (RocksDB ou equivalente)
        **Dados:** Agregações dos últimos 24 horas (tenant_id, hour → mean, stddev)
        **Tamanho estimado:** [SUPOSIÇÃO] 1 GB (1000 tenants × 24 horas × 50 KB por hora)
        **Fonte:** Leitura contínua de `forge_events_aggregated` (últimas 24h)
        **TTL:** 24 horas
        **Política de expiração:** Remover dados > 24 horas automaticamente

        **Implementação (Spark Structured Streaming com state store):**
        ```python
        def detect_anomalies(df):
            # Usar mapGroupsWithState para manter histórico de 24h
            def state_func(key, values, state):
                tenant_id = key
                current_values = list(values)
                
                # Recuperar estado anterior
                if state.exists:
                    historical_data = state.get
                else:
                    historical_data = []
                
                # Adicionar valores atuais
                historical_data.extend(current_values)
                
                # Remover dados > 24h
                cutoff_time = current_time - timedelta(hours=24)
                historical_data = [v for v in historical_data if v['timestamp'] > cutoff_time]
                
                # Calcular média e desvio padrão
                mean = np.mean([v['metric_value'] for v in historical_data])
                stddev = np.std([v['metric_value'] for v in historical_data])
                
                # Detectar anomalias
                anomalies = [v for v in current_values if abs((v['metric_value'] - mean) / stddev) > 3]
                
                # Atualizar estado
                state.update(historical_data)
                
                return anomalies
            
            df_anomalies = df.groupByKey("tenant_id").mapGroupsWithState(
                outputMode="update",
                timeoutConf="event time",
                func=state_func
            )
            return df_anomalies
        ```

        **Validação:**
        - [ ] Estado é mantido em RocksDB (ou equivalente)
        - [ ] Tamanho do estado não excede 10 GB (limite típico)
        - [ ] Dados > 24h são removidos automaticamente
        - [ ] Detecção de anomalia funciona corretamente

