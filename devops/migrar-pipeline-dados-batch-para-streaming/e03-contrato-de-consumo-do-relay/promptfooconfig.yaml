        **Procedimento:**

        ### 1.1 Frescor (Freshness)

        **Definição:** Tempo máximo entre a chegada de um evento no Relay e sua disponibilidade para consulta no DW.

        **Comando/Configuração:**

        ```markdown
        # SLO: Frescor (Freshness)

        ## Definição
        Tempo decorrido desde a chegada de um evento no Relay até estar consultável 
        (SELECT retorna resultado) em uma tabela do DW.

        ## Métrica
        - **Nome:** `forge_event_latency_p95_seconds`
        - **Fórmula:** P95 de (timestamp_consultado_no_dw - timestamp_chegada_no_relay)
        - **Granularidade:** Por tenant, por hora
        - **Coleta:** Instrumentação no Relay (timestamp de entrada) e no Forge (timestamp de escrita no DW)

        ## SLO
        | Percentil | Latência alvo | Justificativa |
        |-----------|---------------|---------------|
        | p50       | 30 s          | Mediana: processamento rápido para dashboards |
        | p95       | 120 s (2 min) | Alvo do projeto; suficiente para alertas em tempo real |
        | p99       | 300 s (5 min) | Cauda: permite processamento de picos sem violar p95 |

        ## Baseline (Etapa 1)
        - p50: ~60 min (batch)
        - p95: ~105 min (batch)
        - p99: ~120 min (batch)

        ## Melhoria esperada
        - p95: 105 min → 2 min (52× mais rápido)
        - Impacto: Sentinel pode atualizar dashboards a cada 30 s em vez de 60 min
        ```

        **Verificação:** Arquivo criado com SLO de frescor documentado; p95 = 120 s confirmado.

