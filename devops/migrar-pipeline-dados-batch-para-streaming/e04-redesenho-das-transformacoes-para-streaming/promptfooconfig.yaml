        Crie arquivo `forge/config/backpressure-and-limits.md`:

        ```markdown
        # Controle de Vazão (Backpressure) e Proteção do Relay

        ## Limites de Consumo
        - **Throughput máximo:** 500 MB/s (50% da capacidade do Relay)
        - **Throughput esperado (pico):** 1.0 MB/s
        - **Status:** ✅ Dentro do limite

        ## Configurações de Kafka Consumer
        ```properties
        # Fetch
        fetch.max.bytes=1000000
        fetch.min.bytes=1
        fetch.max.wait.ms=500

        # Poll
        max.poll.records=2000
        max.poll.interval.ms=300000

        # Session
        session.timeout.ms=30000
        heartbeat.interval.ms=10000

        # Offset
        auto.offset.reset=earliest
        enable.auto.commit=true
        auto.commit.interval.ms=30000
        ```

        ## Backpressure (Controle de Vazão)
        ### Cenário 1: Processamento lento
        Se o Forge não conseguir processar eventos tão rápido quanto chegam:
        1. Buffer em memória cresce
        2. Kafka Consumer pausa automaticamente (não busca novos dados)
        3. Relay não é sobrecarregado
        4. Latência aumenta (até SLO de 120 s p95)

        ### Cenário 2: Processamento muito lento
        Se o buffer crescer além de 30 s de dados:
        1. Alertar time de on-call
        2. Aumentar paralelismo (mais tasks)
        3. Otimizar transformações Spark
        4. Se não resolver, rollback para batch

        ## Proteção do Relay
        - **Limite de consumo:** Forge não consome mais de 50% da capacidade do Relay
        - **Monitoramento:** Alertar se Forge consome > 40% da capacidade
        - **Isolamento:** Consumer group separado (`forge-streaming-v1`) para não impactar outros consumidores

        ## Validação
        - [ ] Testar com carga de pico (2000 evt/s) por 5 min
        - [ ] Confirmar que Relay não fica sobrecarregado (CPU < 80%)
        - [ ] Confirmar que latência permanece < 120 s p95
        ```

