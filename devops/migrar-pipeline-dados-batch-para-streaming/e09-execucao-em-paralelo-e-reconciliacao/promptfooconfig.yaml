        ## 2. Documente contrato de leitura para Sentinel (tabelas agregadas com lag)

        **Ação:** Crie documento que especifica como Sentinel deve ler dados de streaming sem gerar alertas falsos.

        **Onde:** Arquivo `forge/docs/sentinel-compatibility.md` (novo) no repositório do Forge.

        **Procedimento:**

        ```markdown
        # Compatibilidade com Sentinel — Contrato de Leitura

        ## Resumo Executivo
        Sentinel continua funcionando sem alterações. Dados chegam com **5 min de lag** em vez de 60 min.
        Alertas disparam **52× mais rápido** (2 min vs 105 min).

        ## Mudanças Visíveis para Sentinel

        ### Antes (Batch)
        ```
        10:00 — Evento chega no Relay
        11:00 — Batch processa (60 min de latência)
        11:05 — Sentinel lê dados
        11:10 — Dashboard atualiza
        11:15 — Alerta dispara (se SLA violado)
        ```

        ### Depois (Streaming)
        ```
        10:00 — Evento chega no Relay
        10:02 — Streaming processa (2 min de latência p95)
        10:07 — Sentinel lê dados (5 min de lag para garantir partição fechada)
        10:08 — Dashboard atualiza
        10:10 — Alerta dispara (se SLA violado)
        ```

        **Diferença:** Alerta dispara 65 min mais rápido (11:15 → 10:10)

        ---

        ## Contrato de Leitura: Regras para Sentinel

        ### Regra 1: Ler Apenas Partições Fechadas
        **Definição:** Partição está fechada quando `window_end < CURRENT_TIMESTAMP() - INTERVAL '5 minutes'`

        **Razão:** Janelas abertas podem ser atualizadas retroativamente (modo `update`). Ler dados abertos causa:
        - Leitura suja (dados parciais)
        - Inconsistência (agregações mudam)
        - Alertas falsos (SLA parece violado, depois se recupera)

        **Implementação:**
        ```sql
        -- ❌ ANTES (batch, sem lag)
        SELECT tenant_id, SUM(error_count) as total_errors
        FROM forge_events_aggregated
        WHERE hour = DATE_TRUNC('hour', CURRENT_TIMESTAMP())
        GROUP BY tenant_id;

        -- ✅ DEPOIS (streaming, com lag de 5 min)
        SELECT tenant_id, SUM(error_count) as total_errors
        FROM forge.aggregated_hourly  -- Use view, não tabela subjacente
        WHERE window_end < CURRENT_TIMESTAMP() - INTERVAL '5 minutes'
        GROUP BY tenant_id;
        ```

        ### Regra 2: Usar Views de Compatibilidade
        **Definição:** Sentinel deve ler de views (`aggregated_hourly`, `by_service_hourly`, etc.), não de tabelas subjacentes.

        **Razão:** Views aplicam lag automaticamente. Ler tabelas subjacentes causa leitura suja.

        **Implementação:**
        ```python
        # ❌ ANTES (lê tabela subjacente)
        df = spark.read.parquet("/data/forge/aggregated")
        df.filter(col("window_end") >= CURRENT_TIMESTAMP() - INTERVAL '1 hour').show()

        # ✅ DEPOIS (lê view)
        df = spark.sql("SELECT * FROM forge.aggregated_hourly")
        df.show()
        ```

        ### Regra 3: Deduplicar em Agregações
        **Definição:** Se evento é reprocessado, agregação pode ter +1. Usar `DISTINCT` ou `GROUP BY` com `MAX(timestamp)`.

        **Razão:** Semântica at-least-once permite duplicatas. Deduplicação no DW garante idempotência.

        **Implementação:**
        ```sql
        -- ❌ ANTES (sem deduplicação)
        SELECT
        tenant_id,
        SUM(error_count) as total_errors,
        SUM(request_count) as total_requests
        FROM forge.aggregated_hourly
        GROUP BY tenant_id;

        -- ✅ DEPOIS (com deduplicação)
        SELECT
        tenant_id,
        SUM(error_count) as total_errors,
        SUM(request_count) as total_requests
        FROM (
        SELECT DISTINCT ON (window_start, window_end, tenant_id)
            tenant_id,
            error_count,
            request_count,
            ingestion_timestamp
        FROM forge.aggregated_hourly
        ORDER BY window_start, window_end, tenant_id, ingestion_timestamp DESC
        ) dedup
        GROUP BY tenant_id;
        ```

        ### Regra 4: Alertas Não Disparam em Dados Abertos
        **Definição:** Alertas devem usar mesma lógica de lag que dashboards.

        **Razão:** Dados abertos podem mudar. Alerta que dispara em dados abertos pode ser falso.

        **Implementação:**
        ```python
        # ❌ ANTES (alerta em dados abertos)
        def check_error_rate_alert():
        df = spark.sql("SELECT * FROM forge.aggregated")
        df_high_error = df.filter(col("error_rate") > 0.05)
        if df_high_error.count() > 0:
            send_alert("High error rate detected")

        # ✅ DEPOIS (alerta em dados fechados)
        def check_error_rate_alert():
        df = spark.sql("SELECT * FROM forge.aggregated_hourly")  # View com lag
        df_high_error = df.filter(col("error_rate") > 0.05)
        if df_high_error.count() > 0:
            send_alert("High error rate detected")
        ```

        ### Regra 5: Dashboard Atualiza a Cada 30 s (Opcional)
        **Definição:** Dashboard pode atualizar a cada 30 s (frequência de escrita), mas mostra dados com lag de 5 min.

        **Razão:** Dados chegam a cada 30 s, mas são finais apenas após 5 min.

        **Implementação:**
        ```python
        # Dashboard query (executar a cada 30 s)
        def refresh_dashboard():
        df = spark.sql("""
            SELECT
            window_end,
            tenant_id,
            service_id,
            error_rate,
            p95_latency
            FROM forge.aggregated_hourly
            ORDER BY window_end DESC
            LIMIT 100
        """)
        # Renderizar dashboard com dados
        render_dashboard(df)

        # Agendar refresh a cada 30 s
        schedule_job(refresh_dashboard, interval_seconds=30)
        ```

