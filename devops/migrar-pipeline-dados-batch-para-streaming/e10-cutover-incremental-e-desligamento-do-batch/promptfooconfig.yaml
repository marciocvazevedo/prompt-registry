            ## 3. Crie relatório de divergências: classificação, escalação, runbook

            **Ação:** Implementar script que classifica divergências e escala quando passar de 0,1% das linhas por hora.

            **Onde:** Arquivo `forge/jobs/divergence_classifier.py` (novo) no repositório do Forge.

            **Procedimento:**

            ```python
            #!/usr/bin/env python3
            """
            Classificador de Divergências — Dual-Run Batch vs Streaming
            Classifica divergências como esperadas, por timing ou por bug.
            Escala quando taxa de divergência > 0,1%.
            """
            from pyspark.sql import SparkSession
            from pyspark.sql.functions import (
                col, when, lit, current_timestamp, datediff, abs as spark_abs
            )
            import logging
            from datetime import datetime, timedelta
            import json
            import requests

            logging.basicConfig(level=logging.INFO)
            logger = logging.getLogger(__name__)

            class DivergenceClassifier:
                """Classificador de divergências"""
                
                def __init__(self, spark, slack_webhook=None):
                    self.spark = spark
                    self.slack_webhook = slack_webhook
                    self.logger = logger
                    self.report = {
                        "timestamp": datetime.utcnow().isoformat(),
                        "divergences": [],
                        "classification": {
                            "expected": 0,
                            "timing": 0,
                            "bug": 0,
                            "unknown": 0
                        },
                        "escalation": {
                            "triggered": False,
                            "reason": None,
                            "threshold": 0.001,  # 0,1%
                            "actual_rate": 0
                        }
                    }
                
                def classify_divergence(self, divergence_row, table_name, strategy):
                    """
                    Classificar uma divergência.
                    
                    Retorna: {"type": "expected|timing|bug|unknown", "reason": "..."}
                    """
                    
                    # Extrair campos
                    batch_data = divergence_row.get("batch_data", {})
                    streaming_data = divergence_row.get("streaming_data", {})
                    
                    # Classificação 1: Divergência Esperada (Timing)
                    # Se batch e streaming têm timestamps diferentes, é esperado
                    if "ingestion_timestamp" in batch_data and "ingestion_timestamp" in streaming_data:
                        batch_ts = batch_data["ingestion_timestamp"]
                        streaming_ts = streaming_data["ingestion_timestamp"]
                        
                        # Se diferença é < 5 min, é timing (esperado durante dual-run)
                        if abs(batch_ts - streaming_ts) < 300000:  # 5 min em ms
                            return {
                                "type": "timing",
                                "reason": f"Timestamps diferem por {abs(batch_ts - streaming_ts)}ms (< 5 min)",
                                "severity": "LOW"
                            }
                    
                    # Classificação 2: Divergência Esperada (Deduplicação)
                    # Se batch tem duplicatas e streaming não, é esperado
                    if table_name in ["aggregated", "by_service", "billing_events"]:
                        batch_count = batch_data.get("event_count", 0)
                        streaming_count = streaming_data.get("event_count", 0)
                        
                        # Se streaming tem menos eventos, pode ser deduplicação
                        if streaming_count < batch_count and (batch_count - streaming_count) / batch_count < 0.01:
                            return {
                                "type": "expected",
                                "reason": f"Streaming deduplicou {batch_count - streaming_count} eventos (< 1%)",
                                "severity": "LOW"
                            }
                    
                    # Classificação 3: Divergência Esperada (Watermark)
                    # Se streaming tem menos dados, pode ser watermark
                    if "window_end" in batch_data and "window_end" in streaming_data:
                        batch_window_end = batch_data["window_end"]
                        streaming_window_end = streaming_data["window_end"]
                        
                        # Se streaming está atrasado por < 2 min, é watermark
                        if batch_window_end > streaming_window_end:
                            lag_ms = batch_window_end - streaming_window_end
                            if lag_ms < 120000:  # 2 min em ms
                                return {
                                    "type": "timing",
                                    "reason": f"Streaming está {lag_ms}ms atrás (watermark)",
                                    "severity": "LOW"
                                }
                    
                    # Classificação 4: Divergência por Bug
                    # Se valores são muito diferentes (> 10%), é bug
                    if "request_count" in batch_data and "request_count" in streaming_data:
                        batch_count = batch_data["request_count"]
                        streaming_count = streaming_data["request_count"]
                        
                        if batch_count > 0:
                            diff_percent = abs(batch_count - streaming_count) / batch_count * 100
                            if diff_percent > 10:
                                return {
                                    "type": "bug",
                                    "reason": f"Request count diferem por {diff_percent:.1f}% (batch={batch_count}, streaming={streaming_count})",
                                    "severity": "HIGH"
                                }
                    
                    # Classificação 5: Desconhecida
                    return {
                        "type": "unknown",
                        "reason": "Não conseguiu classificar divergência",
                        "severity": "MEDIUM"
                    }
                
                def classify_all_divergences(self, table_name, strategy):
                    """Classificar todas as divergências de uma tabela"""
                    self.logger.info(f"Classificando divergências: {table_name} ({strategy})")
                    
                    try:
                        # Ler divergências
                        df_divergences = self.spark.read.parquet(
                            f"/data/forge/reconciliation/divergences/{table_name}_{strategy}"
                        )
                        
                        # Classificar cada linha
                        classifications = []
                        for row in df_divergences.collect():
                            classification = self.classify_divergence(row.asDict(), table_name, strategy)
                            classifications.append({
                                "table": table_name,
                                "strategy": strategy,
                                "row": row.asDict(),
                                "classification": classification
                            })
                            
                            # Atualizar contadores
                            self.report["classification"][classification["type"]] += 1
                        
                        self.report["divergences"].extend(classifications)
                        
                        return classifications
                    
                    except Exception as e:
                        self.logger.error(f"Erro ao classificar divergências: {e}")
                        return []
                
                def check_escalation(self, total_rows, divergence_count):
                    """
                    Verificar se taxa de divergência passou do threshold.
                    Threshold: 0,1% das linhas por hora
                    """
                    self.logger.info(f"Verificando escalação: {divergence_count}/{total_rows} divergências")
                    
                    if total_rows == 0:
                        return False
                    
                    divergence_rate = divergence_count / total_rows
                    self.report["escalation"]["actual_rate"] = divergence_rate
                    
                    if divergence_rate > self.report["escalation"]["threshold"]:
                        self.report["escalation"]["triggered"] = True
                        self.report["escalation"]["reason"] = f"Taxa de divergência {divergence_rate:.2%} > {self.report['escalation']['threshold']:.2%}"
                        self.logger.error(f"⚠️  ESCALAÇÃO DISPARADA: {self.report['escalation']['reason']}")
                        return True
                    
                    self.logger.info(f"✅ Taxa de divergência {divergence_rate:.2%} < {self.report['escalation']['threshold']:.2%}")
                    return False
                
                def send_escalation_alert(self, reason):
                    """Enviar alerta de escalação para Slack"""
                    if not self.slack_webhook:
                        self.logger.warning("Slack webhook não configurado, não enviando alerta")
                        return
                    
                    message = f"""
            🚨 ESCALAÇÃO: Dual-Run Batch vs Streaming

            Razão: {reason}

            Taxa de divergência: {self.report['escalation']['actual_rate']:.2%}
            Threshold: {self.report['escalation']['threshold']:.2%}

            Classificação:
            - Esperadas: {self.report['classification']['expected']}
            - Por timing: {self.report['classification']['timing']}
            - Por bug: {self.report['classification']['bug']}
            - Desconhecidas: {self.report['classification']['unknown']}

            Ação: Investigar divergências em /data/forge/reconciliation/divergences/
            Runbook: https://wiki.internal/forge/runbook#dual-run-divergences
            """
                    
                    try:
                        response = requests.post(
                            self.slack_webhook,
                            json={"text": message}
                        )
                        self.logger.info(f"Alerta enviado para Slack (status={response.status_code})")
                    except Exception as e:
                        self.logger.error(f"Erro ao enviar alerta para Slack: {e}")
                
                def run_classification(self):
                    """Executar classificação completa"""
                    self.logger.info("Iniciando classificação de divergências")
                    
                    # Tabelas e estratégias
                    tables_strategies = [
                        ("aggregated", "exact"),
                        ("aggregated", "agg"),
                        ("aggregated", "dist"),
                        ("by_service", "exact"),
                        ("by_service", "agg"),
                        ("billing_events", "exact"),
                        ("billing_events", "agg"),
                    ]
                    
                    total_divergences = 0
                    total_rows = 0
                    
                    for table_name, strategy in tables_strategies:
                        try:
                            # Ler divergências
                            df_divergences = self.spark.read.parquet(
                                f"/data/forge/reconciliation/divergences/{table_name}_{strategy}"
                            )
                            divergence_count = df_divergences.count()
                            
                            # Ler tabela original para contar total de linhas
                            df_batch = self.spark.read.parquet(f"/data/forge/batch/{table_name}")
                            batch_count = df_batch.count()
                            
                            # Classificar
                            self.classify_all_divergences(table_name, strategy)
                            
                            total_divergences += divergence_count
                            total_rows += batch_count
                            
                        except Exception as e:
                            self.logger.warning(f"Tabela {table_name} ({strategy}) não encontrada: {e}")
                    
                    # Verificar escalação
                    if self.check_escalation(total_rows, total_divergences):
                        self.send_escalation_alert(self.report["escalation"]["reason"])
                    
                    return self.report
                
                def save_report(self, output_file):
                    """Salvar relatório em JSON"""
                    with open(output_file, "w") as f:
                        json.dump(self.report, f, indent=2, default=str)
                    self.logger.info(f"Relatório salvo em: {output_file}")

            def create_spark_session():
                """Cria sessão Spark"""
                return SparkSession.builder \
                    .appName("forge-divergence-classifier") \
                    .getOrCreate()

            def main():
                """Função principal"""
                import os
                
                spark = create_spark_session()
                slack_webhook = os.getenv("SLACK_WEBHOOK")
                
                classifier = DivergenceClassifier(spark, slack_webhook)
                
                # Executar classificação
                report = classifier.run_classification()
                
                # Salvar relatório
                output_file = f"divergence_report_{datetime.utcnow().strftime('%Y%m%d_%H%M%S')}.json"
                classifier.save_report(output_file)
                
                # Imprimir resumo
                print("\n=== Resumo de Classificação ===")
                print(f"Esperadas: {report['classification']['expected']}")
                print(f"Por timing: {report['classification']['timing']}")
                print(f"Por bug: {report['classification']['bug']}")
                print(f"Desconhecidas: {report['classification']['unknown']}")
                print(f"Escalação: {'SIM' if report['escalation']['triggered'] else 'NÃO'}")
                
                # Retornar código de saída
                exit(0 if not report['escalation']['triggered'] else 1)

            if __name__ == "__main__":
                main()
            ```

