        ## 5. Implemente testes de alertas (provocar condições em staging)

        **Ação:** Criar scripts para provocar cada condição de alerta em staging e validar que alerta dispara.

        **Onde:** Arquivo `forge/tests/test_alerts.py` (novo) no repositório do Forge.

        **Procedimento:**

        ```python
        #!/usr/bin/env python3
        """
        Testes de Alertas
        Provoca condições de alerta em staging e valida que alerta dispara.
        """
        import pytest
        import time
        import subprocess
        import requests
        import logging
        from datetime import datetime, timedelta

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        # Configuração
        PROMETHEUS_URL = "http://prometheus:9090"
        ALERTMANAGER_URL = "http://alertmanager:9093"
        RELAY_BROKER = "<relay-broker>"
        SPARK_MASTER = "spark://spark-master:7077"

        class AlertTester:
            """Tester para alertas"""
            
            def __init__(self):
                self.logger = logger
            
            def wait_for_alert(self, alert_name, timeout_seconds=300):
                """
                Aguardar que um alerta dispare.
                Args:
                    alert_name: Nome do alerta (ex: "ForgeLatencyE2EHigh")
                    timeout_seconds: Timeout em segundos
                Returns:
                    True se alerta disparou, False se timeout
                """
                self.logger.info(f"Aguardando alerta: {alert_name}")
                start_time = time.time()
                
                while time.time() - start_time < timeout_seconds:
                    try:
                        # Verificar alertas ativos
                        response = requests.get(
                            f"{ALERTMANAGER_URL}/api/v1/alerts",
                            params={"filter": f'alertname="{alert_name}"'}
                        )
                        alerts = response.json().get("data", [])
                        
                        if alerts:
                            self.logger.info(f"✅ Alerta disparou: {alert_name}")
                            return True
                        
                        time.sleep(10)
                    except Exception as e:
                        self.logger.error(f"Erro ao verificar alerta: {e}")
                        time.sleep(10)
                
                self.logger.error(f"❌ Timeout aguardando alerta: {alert_name}")
                return False
            
            def test_latency_e2e_high(self):
                """
                Teste 1: Provocar ForgeLatencyE2EHigh
                Ação: Parar job de streaming para aumentar latência
                """
                self.logger.info("Teste 1: ForgeLatencyE2EHigh")
                
                # Parar job de streaming
                self.logger.info("Parando job de streaming...")
                subprocess.run([
                    "kubectl", "scale", "deployment", "forge-streaming-ingest",
                    "-n", "forge-staging", "--replicas=0"
                ], check=True)
                
                # Aguardar que latência aumente
                time.sleep(120)
                
                # Verificar que alerta disparou
                assert self.wait_for_alert("ForgeLatencyE2EHigh"), "Alerta não disparou"
                
                # Reiniciar job
                self.logger.info("Reiniciando job de streaming...")
                subprocess.run([
                    "kubectl", "scale", "deployment", "forge-streaming-ingest",
                    "-n", "forge-staging", "--replicas=1"
                ], check=True)
                
                self.logger.info("✅ Teste 1 passou")
            
            def test_consumer_lag_high(self):
                """
                Teste 2: Provocar ForgeConsumerLagHigh
                Ação: Parar job de streaming para aumentar lag
                """
                self.logger.info("Teste 2: ForgeConsumerLagHigh")
                
                # Parar job de streaming
                self.logger.info("Parando job de streaming...")
                subprocess.run([
                    "kubectl", "scale", "deployment", "forge-streaming-ingest",
                    "-n", "forge-staging", "--replicas=0"
                ], check=True)
                
                # Enviar eventos para Relay
                self.logger.info("Enviando eventos para Relay...")
                for i in range(200000):  # 200k eventos
                    subprocess.run([
                        "kafka-console-producer", "--broker-list", RELAY_BROKER,
                        "--topic", "forge-events-raw"
                    ], input=f'{{"event_id": "evt-{i}", "tenant_id": "t1", "timestamp": {int(time.time() * 1000)}, "service_id": "s1", "metric_name": "http.requests", "metric_value": 42}}'.encode(),
                    check=True)
                
                # Aguardar que lag aumente
                time.sleep(60)
                
                # Verificar que alerta disparou
                assert self.wait_for_alert("ForgeConsumerLagHigh"), "Alerta não disparou"
                
                # Reiniciar job
                self.logger.info("Reiniciando job de streaming...")
                subprocess.run([
                    "kubectl", "scale", "deployment", "forge-streaming-ingest",
                    "-n", "forge-staging", "--replicas=1"
                ], check=True)
                
                self.logger.info("✅ Teste 2 passou")
            
            def test_consumption_rate_low(self):
                """
                Teste 3: Provocar ForgeConsumptionRateLow
                Ação: Reduzir paralelismo do job para diminuir taxa de consumo
                """
                self.logger.info("Teste 3: ForgeConsumptionRateLow")
                
                # Reduzir paralelismo
                self.logger.info("Reduzindo paralelismo...")
                subprocess.run([
                    "kubectl", "set", "env", "deployment/forge-streaming-ingest",
                    "-n", "forge-staging",
                    "SPARK_EXECUTOR_CORES=1",
                    "SPARK_EXECUTOR_MEMORY=1g"
                ], check=True)
                
                # Aguardar que taxa de consumo diminua
                time.sleep(300)
                
                # Verificar que alerta disparou
                assert self.wait_for_alert("ForgeConsumptionRateLow"), "Alerta não disparou"
                
                # Restaurar paralelismo
                self.logger.info("Restaurando paralelismo...")
                subprocess.run([
                    "kubectl", "set", "env", "deployment/forge-streaming-ingest",
                    "-n", "forge-staging",
                    "SPARK_EXECUTOR_CORES=4",
                    "SPARK_EXECUTOR_MEMORY=8g"
                ], check=True)
                
                self.logger.info("✅ Teste 3 passou")
            
            def test_error_rate_high(self):
                """
                Teste 4: Provocar ForgeErrorRateHigh
                Ação: Enviar eventos inválidos para aumentar taxa de erro
                """
                self.logger.info("Teste 4: ForgeErrorRateHigh")
                
                # Enviar eventos inválidos
                self.logger.info("Enviando eventos inválidos...")
                for i in range(10000):  # 10k eventos inválidos
                    subprocess.run([
                        "kafka-console-producer", "--broker-list", RELAY_BROKER,
                        "--topic", "forge-events-raw"
                    ], input=b'{"invalid": "event"}',  # Evento sem campos obrigatórios
                    check=True)
                
                # Aguardar que taxa de erro aumente
                time.sleep(60)
                
                # Verificar que alerta disparou
                assert self.wait_for_alert("ForgeErrorRateHigh"), "Alerta não disparou"
                
                self.logger.info("✅ Teste 4 passou")
            
            def test_offset_commit_failure(self):
                """
                Teste 5: Provocar ForgeOffsetCommitFailure
                Ação: Parar Relay para fazer commit falhar
                """
                self.logger.info("Teste 5: ForgeOffsetCommitFailure")
                
                # Parar Relay (simular indisponibilidade)
                self.logger.info("Parando Relay...")
                subprocess.run([
                    "kubectl", "scale", "statefulset", "kafka",
                    "-n", "relay", "--replicas=0"
                ], check=True)
                
                # Aguardar que commit falhe
                time.sleep(60)
                
                # Verificar que alerta disparou
                assert self.wait_for_alert("ForgeOffsetCommitFailure"), "Alerta não disparou"
                
                # Reiniciar Relay
                self.logger.info("Reiniciando Relay...")
                subprocess.run([
                    "kubectl", "scale", "statefulset", "kafka",
                    "-n", "relay", "--replicas=3"
                ], check=True)
                
                self.logger.info("✅ Teste 5 passou")
            
            def test_dlq_size_high(self):
                """
                Teste 6: Provocar ForgeDLQSizeHigh
                Ação: Enviar muitos eventos inválidos para encher DLQ
                """
                self.logger.info("Teste 6: ForgeDLQSizeHigh")
                
                # Enviar muitos eventos inválidos
                self.logger.info("Enviando muitos eventos inválidos...")
                for i in range(1000000):  # 1M eventos inválidos
                    subprocess.run([
                        "kafka-console-producer", "--broker-list", RELAY_BROKER,
                        "--topic", "forge-events-raw"
                    ], input=b'{"invalid": "event"}',
                    check=True)
                
                # Aguardar que DLQ cresça
                time.sleep(120)
                
                # Verificar que alerta disparou
                assert self.wait_for_alert("ForgeDLQSizeHigh"), "Alerta não disparou"
                
                self.logger.info("✅ Teste 6 passou")
            
            def test_state_size_high(self):
                """
                Teste 7: Provocar ForgeStateSizeHigh
                Ação: Aumentar retenção de estado para aumentar tamanho
                """
                self.logger.info("Teste 7: ForgeStateSizeHigh")
                
                # Aumentar retenção de estado
                self.logger.info("Aumentando retenção de estado...")
                subprocess.run([
                    "kubectl", "set", "env", "deployment/forge-streaming-ingest",
                    "-n", "forge-staging",
                    "STATE_RETENTION_DAYS=30"  # Aumentar de 7 para 30 dias
                ], check=True)
                
                # Aguardar que estado cresça
                time.sleep(300)
                
                # Verificar que alerta disparou
                assert self.wait_for_alert("ForgeStateSizeHigh"), "Alerta não disparou"
                
                # Restaurar retenção
                self.logger.info("Restaurando retenção de estado...")
                subprocess.run([
                    "kubectl", "set", "env", "deployment/forge-streaming-ingest",
                    "-n", "forge-staging",
                    "STATE_RETENTION_DAYS=7"
                ], check=True)
                
                self.logger.info("✅ Teste 7 passou")
            
            def test_write_latency_high(self):
                """
                Teste 8: Provocar ForgeWriteLatencyHigh
                Ação: Parar DW para fazer escrita ficar lenta
                """
                self.logger.info("Teste 8: ForgeWriteLatencyHigh")
                
                # Parar DW (simular indisponibilidade)
                self.logger.info("Parando DW...")
                subprocess.run([
                    "kubectl", "scale", "deployment", "dw-server",
                    "-n", "dw", "--replicas=0"
                ], check=True)
                
                # Aguardar que escrita fique lenta
                time.sleep(60)
                
                # Verificar que alerta disparou
                assert self.wait_for_alert("ForgeWriteLatencyHigh"), "Alerta não disparou"
                
                # Reiniciar DW
                self.logger.info("Reiniciando DW...")
                subprocess.run([
                    "kubectl", "scale", "deployment", "dw-server",
                    "-n", "dw", "--replicas=1"
                ], check=True)
                
                self.logger.info("✅ Teste 8 passou")
            
            def test_duplicate_rate_high(self):
                """
                Teste 9: Provocar ForgeDuplicateRateHigh
                Ação: Executar replay para criar duplicatas
                """
                self.logger.info("Teste 9: ForgeDuplicateRateHigh")
                
                # Executar replay
                self.logger.info("Executando replay...")
                subprocess.run([
                    "spark-submit",
                    "--master", SPARK_MASTER,
                    "forge/jobs/replay_events.py",
                    "--mode", "timestamp",
                    "--start-timestamp", (datetime.utcnow() - timedelta(hours=1)).isoformat() + "Z",
                    "--end-timestamp", datetime.utcnow().isoformat() + "Z"
                ], check=True)
                
                # Aguardar que duplicatas sejam detectadas
                time.sleep(120)
                
                # Verificar que alerta disparou
                assert self.wait_for_alert("ForgeDuplicateRateHigh"), "Alerta não disparou"
                
                self.logger.info("✅ Teste 9 passou")
            
            def test_cost_per_hour_high(self):
                """
                Teste 10: Provocar ForgeCostPerHourHigh
                Ação: Aumentar número de nós para aumentar custo
                """
                self.logger.info("Teste 10: ForgeCostPerHourHigh")
                
                # Aumentar número de nós
                self.logger.info("Aumentando número de nós...")
                subprocess.run([
                    "kubectl", "scale", "deployment", "forge-streaming-ingest",
                    "-n", "forge-staging", "--replicas=10"
                ], check=True)
                
                # Aguardar que custo aumente
                time.sleep(60)
                
                # Verificar que alerta disparou
                assert self.wait_for_alert("ForgeCostPerHourHigh"), "Alerta não disparou"
                
                # Restaurar número de nós
                self.logger.info("Restaurando número de nós...")
                subprocess.run([
                    "kubectl", "scale", "deployment", "forge-streaming-ingest",
                    "-n", "forge-staging", "--replicas=1"
                ], check=True)
                
                self.logger.info("✅ Teste 10 passou")

        def main():
            """Função principal"""
            tester = AlertTester()
            
            # Executar testes
            tests = [
                tester.test_latency_e2e_high,
                tester.test_consumer_lag_high,
                tester.test_consumption_rate_low,
                tester.test_error_rate_high,
                tester.test_offset_commit_failure,
                tester.test_dlq_size_high,
                tester.test_state_size_high,
                tester.test_write_latency_high,
                tester.test_duplicate_rate_high,
                tester.test_cost_per_hour_high,
            ]
            
            passed = 0
            failed = 0
            
            for test in tests:
                try:
                    test()
                    passed += 1
                except AssertionError as e:
                    logger.error(f"❌ Teste falhou: {e}")
                    failed += 1
                except Exception as e:
                    logger.error(f"❌ Erro ao executar teste: {e}")
                    failed += 1
            
            logger.info(f"\n=== Resumo de Testes ===")
            logger.info(f"Passou: {passed}")
            logger.info(f"Falhou: {failed}")
            logger.info(f"Total: {passed + failed}")
            
            return 0 if failed == 0 else 1

        if __name__ == "__main__":
            exit(main())
