        ## 7. Crie script de rollback automático por consumidor

        **Ação:** Implemente script que detecta problemas com consumidores e faz rollback automático.

        **Onde:** Arquivo `forge/scripts/auto_rollback_on_consumer_failure.py` (novo) no repositório do Forge.

        **Procedimento:**

        ```python
        #!/usr/bin/env python3
        """
        Rollback Automático por Falha de Consumidor
        Monitora compatibilidade com consumidores e faz rollback se necessário.
        """
        import sys
        import json
        import time
        import logging
        from datetime import datetime, timedelta
        from typing import Dict, List
        import subprocess
        import os

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        class AutoRollbackOnConsumerFailure:
            """Detecta falhas de consumidor e faz rollback automático"""
            
            def __init__(self, dw_connection_string: str, slack_webhook: str = None):
                """Inicializa"""
                self.dw_conn_string = dw_conn_string
                self.slack_webhook = slack_webhook
                self.rollback_triggered = False
            
            def check_sentinel_health(self) -> Dict:
                """Verificar saúde de Sentinel"""
                logger.info("Verificando saúde de Sentinel...")
                
                checks = {
                    "views_exist": False,
                    "lag_is_5min": False,
                    "aggregations_correct": False,
                    "alerts_firing": False,
                    "no_false_alerts": False
                }
                
                try:
                    # Check 1: Views existem
                    result = subprocess.run(
                        ["psql", "-h", os.getenv("DW_HOST"), "-U", os.getenv("DW_USER"),
                        "-d", "forge", "-c", "SELECT COUNT(*) FROM forge.aggregated_hourly"],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    checks["views_exist"] = result.returncode == 0
                    
                    # Check 2: Lag é 5 min
                    result = subprocess.run(
                        ["psql", "-h", os.getenv("DW_HOST"), "-U", os.getenv("DW_USER"),
                        "-d", "forge", "-c",
                        "SELECT MAX(window_end) < CURRENT_TIMESTAMP() - INTERVAL '5 minutes' FROM forge.aggregated_hourly"],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    checks["lag_is_5min"] = "t" in result.stdout
                    
                    # Check 3: Agregações estão corretas
                    result = subprocess.run(
                        ["psql", "-h", os.getenv("DW_HOST"), "-U", os.getenv("DW_USER"),
                        "-d", "forge", "-c",
                        "SELECT COUNT(*) > 0 FROM forge.aggregated_hourly WHERE window_end >= CURRENT_TIMESTAMP() - INTERVAL '24 hours'"],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    checks["aggregations_correct"] = "t" in result.stdout
                    
                    # Check 4: Alertas estão disparando
                    # [SUPOSIÇÃO] Sentinel tem endpoint de health check
                    result = subprocess.run(
                        ["curl", "-s", "http://sentinel-api/health"],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    checks["alerts_firing"] = result.returncode == 0
                    
                    # Check 5: Sem alertas falsos
                    # [SUPOSIÇÃO] Sentinel tem métrica de alertas falsos
                    result = subprocess.run(
                        ["curl", "-s", "http://sentinel-api/metrics/false_alerts"],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    false_alerts = int(result.stdout) if result.stdout.isdigit() else 0
                    checks["no_false_alerts"] = false_alerts < 10
                    
                except Exception as e:
                    logger.error(f"Erro ao verificar Sentinel: {e}")
                    return {"status": "ERROR", "checks": checks}
                
                # Determinar status
                status = "PASS" if all(checks.values()) else "FAIL"
                return {"status": status, "checks": checks}
            
            def check_cerebro_health(self) -> Dict:
                """Verificar saúde de Cerebro"""
                logger.info("Verificando saúde de Cerebro...")
                
                checks = {
                    "kafka_topic_exists": False,
                    "kafka_has_events": False,
                    "enriched_events_exist": False,
                    "no_duplicates": False,
                    "indexation_lag_ok": False
                }
                
                try:
                    # Check 1: Kafka topic existe
                    result = subprocess.run(
                        ["kafka-topics.sh", "--list", "--bootstrap-server", os.getenv("KAFKA_BROKER")],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    checks["kafka_topic_exists"] = "forge-events-indexed" in result.stdout
                    
                    # Check 2: Kafka tem eventos
                    result = subprocess.run(
                        ["kafka-console-consumer.sh",
                        "--bootstrap-server", os.getenv("KAFKA_BROKER"),
                        "--topic", "forge-events-indexed",
                        "--max-messages", "1",
                        "--from-beginning"],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    checks["kafka_has_events"] = bool(result.stdout)
                    
                    # Check 3: Enriched events existem
                    result = subprocess.run(
                        ["psql", "-h", os.getenv("DW_HOST"), "-U", os.getenv("DW_USER"),
                        "-d", "forge", "-c",
                        "SELECT COUNT(*) > 0 FROM forge.enriched WHERE ingestion_timestamp >= CURRENT_TIMESTAMP() - INTERVAL '1 hour'"],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    checks["enriched_events_exist"] = "t" in result.stdout
                    
                    # Check 4: Sem duplicatas
                    result = subprocess.run(
                        ["psql", "-h", os.getenv("DW_HOST"), "-U", os.getenv("DW_USER"),
                        "-d", "forge", "-c",
                        "SELECT COUNT(*) = COUNT(DISTINCT event_id) FROM forge.enriched WHERE ingestion_timestamp >= CURRENT_TIMESTAMP() - INTERVAL '1 hour'"],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    checks["no_duplicates"] = "t" in result.stdout
                    
                    # Check 5: Lag de indexação OK
                    # [SUPOSIÇÃO] Elasticsearch tem endpoint de health check
                    result = subprocess.run(
                        ["curl", "-s", "http://elasticsearch:9200/_cluster/health"],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    checks["indexation_lag_ok"] = '"status":"green"' in result.stdout or '"status":"yellow"' in result.stdout
                    
                except Exception as e:
                    logger.error(f"Erro ao verificar Cerebro: {e}")
                    return {"status": "ERROR", "checks": checks}
                
                # Determinar status
                status = "PASS" if all(checks.values()) else "FAIL"
                return {"status": status, "checks": checks}
            
            def check_pepper_health(self) -> Dict:
                """Verificar saúde de Pepper"""
                logger.info("Verificando saúde de Pepper...")
                
                checks = {
                    "billing_view_exists": False,
                    "completude_ok": False,
                    "no_duplicates": False,
                    "data_from_previous_days": False,
                    "reconciliation_ok": False
                }
                
                try:
                    # Check 1: Billing view existe
                    result = subprocess.run(
                        ["psql", "-h", os.getenv("DW_HOST"), "-U", os.getenv("DW_USER"),
                        "-d", "forge", "-c", "SELECT COUNT(*) FROM forge.billing_events_daily LIMIT 1"],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    checks["billing_view_exists"] = result.returncode == 0
                    
                    # Check 2: Completude >= 99.9%
                    result = subprocess.run(
                        ["psql", "-h", os.getenv("DW_HOST"), "-U", os.getenv("DW_USER"),
                        "-d", "forge", "-c",
                        "SELECT (COUNT(DISTINCT event_id) / (SELECT COUNT(*) FROM relay_events WHERE day = CURRENT_DATE - 1)) * 100 >= 99.9 FROM forge.billing_events_daily WHERE day_start < CURRENT_DATE()"],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    checks["completude_ok"] = "t" in result.stdout
                    
                    # Check 3: Sem duplicatas
                    result = subprocess.run(
                        ["psql", "-h", os.getenv("DW_HOST"), "-U", os.getenv("DW_USER"),
                        "-d", "forge", "-c",
                        "SELECT COUNT(*) = COUNT(DISTINCT event_id) FROM forge.billing_events_daily WHERE day_start < CURRENT_DATE()"],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    checks["no_duplicates"] = "t" in result.stdout
                    
                    # Check 4: Dados são de dias anteriores
                    result = subprocess.run(
                        ["psql", "-h", os.getenv("DW_HOST"), "-U", os.getenv("DW_USER"),
                        "-d", "forge", "-c",
                        "SELECT MAX(day_start) < CURRENT_DATE() FROM forge.billing_events_daily"],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    checks["data_from_previous_days"] = "t" in result.stdout
                    
                    # Check 5: Reconciliação OK
                    # [SUPOSIÇÃO] Pepper tem endpoint de reconciliation status
                    result = subprocess.run(
                        ["curl", "-s", "http://pepper-api/reconciliation/status"],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    checks["reconciliation_ok"] = '"status":"OK"' in result.stdout
                    
                except Exception as e:
                    logger.error(f"Erro ao verificar Pepper: {e}")
                    return {"status": "ERROR", "checks": checks}
                
                # Determinar status
                status = "PASS" if all(checks.values()) else "FAIL"
                return {"status": status, "checks": checks}
            
            def send_alert(self, message: str):
                """Enviar alerta para Slack"""
                if not self.slack_webhook:
                    logger.warning(f"Slack webhook não configurado, não enviando alerta: {message}")
                    return
                
                try:
                    result = subprocess.run(
                        ["curl", "-X", "POST", self.slack_webhook,
                        "-H", "Content-Type: application/json",
                        "-d", json.dumps({"text": message})],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    logger.info(f"Alerta enviado para Slack")
                except Exception as e:
                    logger.error(f"Erro ao enviar alerta para Slack: {e}")
            
            def trigger_rollback(self, reason: str):
                """Disparar rollback automático"""
                logger.error(f"DISPARANDO ROLLBACK: {reason}")
                self.rollback_triggered = True
                
                # Enviar alerta
                self.send_alert(f"🚨 ROLLBACK AUTOMÁTICO DISPARADO: {reason}")
                
                # Executar script de rollback
                try:
                    result = subprocess.run(
                        ["bash", "forge/scripts/rollback.sh"],
                        capture_output=True,
                        text=True,
                        timeout=300
                    )
                    if result.returncode == 0:
                        logger.info("Rollback concluído com sucesso")
                        self.send_alert("✅ Rollback concluído com sucesso")
                    else:
                        logger.error(f"Rollback falhou: {result.stderr}")
                        self.send_alert(f"❌ Rollback falhou: {result.stderr}")
                except Exception as e:
                    logger.error(f"Erro ao executar rollback: {e}")
                    self.send_alert(f"❌ Erro ao executar rollback: {e}")
            
            def run_health_checks(self) -> Dict:
                """Executar verificações de saúde"""
                logger.info("Executando verificações de saúde...")
                
                report = {
                    "timestamp": datetime.utcnow().isoformat(),
                    "sentinel": self.check_sentinel_health(),
                    "cerebro": self.check_cerebro_health(),
                    "pepper": self.check_pepper_health()
                }
                
                # Determinar se rollback é necessário
                if report["sentinel"]["status"] == "FAIL":
                    self.trigger_rollback("Sentinel health check failed")
                elif report["cerebro"]["status"] == "FAIL":
                    self.trigger_rollback("Cerebro health check failed")
                elif report["pepper"]["status"] == "FAIL":
                    self.trigger_rollback("Pepper health check failed")
                
                return report
            
            def save_report(self, output_file: str):
                """Salvar relatório"""
                report = self.run_health_checks()
                with open(output_file, "w") as f:
                    json.dump(report, f, indent=2)
                logger.info(f"Relatório salvo em: {output_file}")
                return report

        def main():
            """Função principal"""
            # [SUPOSIÇÃO] Variáveis de ambiente configuradas
            dw_conn_string = os.getenv("DW_CONNECTION_STRING")
            slack_webhook = os.getenv("SLACK_WEBHOOK")
            
            if not dw_conn_string:
                print("Erro: DW_CONNECTION_STRING não definida")
                sys.exit(1)
            
            monitor = AutoRollbackOnConsumerFailure(dw_conn_string, slack_webhook)
            
            # Executar verificações
            output_file = f"consumer_health_report_{datetime.utcnow().strftime('%Y%m%d_%H%M%S')}.json"
            report = monitor.save_report(output_file)
            
            # Retornar código de saída
            sys.exit(1 if monitor.rollback_triggered else 0)

        if __name__ == "__main__":
            main()
        ```

