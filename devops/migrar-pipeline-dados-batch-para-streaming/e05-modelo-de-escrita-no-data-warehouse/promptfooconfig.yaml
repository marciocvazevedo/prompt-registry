        | 4 | 30 s | 45 s | 60 s | > 105 s | update |
        | 5 | 30 s | 45 s | 60 s | > 105 s | update |
        | 10 | 30 s | 45 s | 60 s | > 105 s | update |
        | 11 | 30 s | 45 s | 60 s | > 105 s | update |
        | 13 | 1 dia | 24 h | 48 h | > 72 h | update |

