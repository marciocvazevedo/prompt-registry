        ## 3. Defina consumer group e estratégia de offset

        **Ação:** Crie consumer group para o Forge e defina como offsets serão gerenciados.

        **Onde:** Configuração do Forge e console do Relay.

        **Comando/Configuração:**

        ```bash
        # Criar consumer group (será criado automaticamente na primeira conexão)
        CONSUMER_GROUP="forge-streaming-v1"  # [SUPOSIÇÃO] nome versionado
        echo "Consumer group: $CONSUMER_GROUP"

        # Configurar consumer group (offset management)
        kafka-configs --bootstrap-server <relay-broker> \
          --entity-type groups \
          --entity-name $CONSUMER_GROUP \
          --alter \
          --add-config offsets.retention.minutes=10080  # 7 dias, alinhado com retenção do tópico

        # Verificar configuração
        kafka-configs --bootstrap-server <relay-broker> \
          --entity-type groups \
          --entity-name $CONSUMER_GROUP \
          --describe
        ```

        **Estratégia de offset:**

        Crie arquivo `forge/config/offset-strategy.md`:

        ```markdown
        # Estratégia de Offset — Forge Streaming

        ## Consumer Group
        - **Nome:** `forge-streaming-v1`
        - **Versão:** 1 (incrementar se houver mudança incompatível)
        - **Retenção de offset:** 7 dias (alinhado com retenção do tópico)

        ## Gerenciamento de Offset
        ### Opção 1: Offset Automático (Recomendado)
        - **Estratégia:** Commit automático a cada 30 s (intervalo de processamento)
        - **Implementação:** `enable.auto.commit=true`, `auto.commit.interval.ms=30000`
        - **Vantagem:** Simples; recuperação automática após falha
        - **Desvantagem:** Possível reprocessamento se falha entre commit e escrita no DW
        - **Mitigação:** Deduplicação no DW (INSERT ... ON CONFLICT DO NOTHING)

        ### Opção 2: Offset Manual (Alternativa)
        - **Estratégia:** Commit manual após escrita bem-sucedida no DW
        - **Implementação:** `enable.auto.commit=false`, commit após `INSERT` no DW
        - **Vantagem:** Garantia de exactly-once (sem reprocessamento)
        - **Desvantagem:** Complexidade; latência adicional (2-phase commit)
        - **Decisão:** ❌ REJEITADO — Semântica ALO é suficiente (Etapa 2)

        ## Decisão: Offset Automático
        - **Commit interval:** 30 s (alinhado com intervalo de processamento)
        - **Earliest offset:** Usar `auto.offset.reset=earliest` para reprocessamento em caso de falha
        - **Checkpoint:** Spark Structured Streaming gerencia checkpoint automaticamente

        ## Implicações
        - Possível reprocessamento de até 30 s de eventos em caso de falha.
        - Deduplicação no DW garante idempotência.
        - Latência é minimizada (sem overhead de 2-phase commit).
        ```

        **Verificação:**

        ```bash
        # Confirmar que consumer group foi criado
        kafka-consumer-groups --bootstrap-server <relay-broker> \
          --list | grep $CONSUMER_GROUP

        # Esperado: forge-streaming-v1

        # Descrever consumer group (antes de primeira conexão)
        kafka-consumer-groups --bootstrap-server <relay-broker> \
          --group $CONSUMER_GROUP \
          --describe

        # Esperado: (vazio, pois nenhum consumer conectou ainda)
        ```

