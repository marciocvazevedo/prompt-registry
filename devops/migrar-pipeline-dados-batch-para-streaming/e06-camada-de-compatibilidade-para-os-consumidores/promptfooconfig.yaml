        # Etapa 2 de 10: Metas, SLOs e Critérios de Equivalência — Procedimento Técnico

        ---

        ## 0. Pré-requisitos

        - [ ] Acesso de leitura ao repositório de SLAs e políticas da Aegis (ex: `aegis/docs/slas/`, Confluence, etc.)
        - [ ] Acesso ao código-fonte de Sentinel, Cerebro e Pepper para entender semântica de leitura esperada
        - [ ] Acesso a logs de queries e erros dos consumidores (últimos 30 dias)
        - [ ] Contato técnico confirmado em cada time consumidor (Sentinel, Cerebro, Pepper) para validar SLAs herdados
        - [ ] Acesso ao repositório de configuração do Forge para documentar SLOs propostos
        - [ ] Ferramentas: editor de texto, SQL client, `git`, planilha colaborativa (para alinhamento com stakeholders)
        - [ ] Resultado da Etapa 1 disponível: baseline de latência, volume, taxa de falha, consumidores mapeados
        - [ ] Permissão para criar documentos de design (ADR — Architecture Decision Record) no repositório

        ---

        ## 1. Defina SLOs do novo Forge (frescor, completude, disponibilidade, recuperação)

        **Ação:** Formalize os objetivos de nível de serviço para o Forge em streaming, baseado no objetivo de 2 min (p95) e nas necessidades dos consumidores.

        **Onde:** Arquivo `forge/docs/slos.md` (novo ou atualizado) no repositório do Forge.

        **Procedimento:**

        ### 1.1 Frescor (Freshness)

        **Definição:** Tempo máximo entre a chegada de um evento no Relay e sua disponibilidade para consulta no DW.

        **Comando/Configuração:**

        ```markdown
        # SLO: Frescor (Freshness)

        ## Definição
        Tempo decorrido desde a chegada de um evento no Relay até estar consultável 
        (SELECT retorna resultado) em uma tabela do DW.

        ## Métrica
        - **Nome:** `forge_event_latency_p95_seconds`
        - **Fórmula:** P95 de (timestamp_consultado_no_dw - timestamp_chegada_no_relay)
        - **Granularidade:** Por tenant, por hora
        - **Coleta:** Instrumentação no Relay (timestamp de entrada) e no Forge (timestamp de escrita no DW)

        ## SLO
        | Percentil | Latência alvo | Justificativa |
        |-----------|---------------|---------------|
        | p50       | 30 s          | Mediana: processamento rápido para dashboards |
        | p95       | 120 s (2 min) | Alvo do projeto; suficiente para alertas em tempo real |
        | p99       | 300 s (5 min) | Cauda: permite processamento de picos sem violar p95 |

        ## Baseline (Etapa 1)
        - p50: ~60 min (batch)
        - p95: ~105 min (batch)
        - p99: ~120 min (batch)

        ## Melhoria esperada
        - p95: 105 min → 2 min (52× mais rápido)
        - Impacto: Sentinel pode atualizar dashboards a cada 30 s em vez de 60 min
        ```

        **Verificação:** Arquivo criado com SLO de frescor documentado; p95 = 120 s confirmado.

        ---

        ### 1.2 Completude (Completeness)

        **Definição:** Percentual de eventos que chegam no Relay e são processados até o DW sem perda.

        **Comando/Configuração:**

        ```markdown
        # SLO: Completude (Completeness)

        ## Definição
        Percentual de eventos que chegam no Relay e aparecem no DW dentro do SLO de frescor.

        ## Métrica
        - **Nome:** `forge_completeness_percent`
        - **Fórmula:** (eventos_no_dw / eventos_no_relay) * 100
        - **Granularidade:** Por tenant, por hora
        - **Coleta:** 
          - Relay: contar mensagens consumidas (offset)
          - DW: contar linhas inseridas (com deduplicação por event_id)

        ## SLO
        | Métrica | Alvo | Justificativa |
        |---------|------|---------------|
        | Completude geral | ≥ 99.9% | Perda < 0.1% é aceitável para observabilidade |
        | Completude por tenant | ≥ 99.5% | Tenants pequenos podem ter variação maior |
        | Completude por hora | ≥ 99.0% | Horas de pico podem ter reprocessamento |

        ## Baseline (Etapa 1)
        - Completude geral: ~99.5% (falhas causam perda de 1 lote = ~0.5%)
        - Causa de perda: falhas de job, timeouts, deadlocks

        ## Melhoria esperada
        - Streaming com idempotência: ≥ 99.9% (reprocessamento automático sem perda)
        ```

        **Verificação:** Arquivo atualizado com SLO de completude; alvo ≥ 99.9% documentado.

        ---

        ### 1.3 Disponibilidade (Availability)

        **Definição:** Percentual de tempo em que o Forge está processando eventos e os consumidores podem consultar dados atualizados.

        **Comando/Configuração:**

        ```markdown
        # SLO: Disponibilidade (Availability)

        ## Definição
        Percentual de tempo em que:
        1. O Forge está consumindo eventos do Relay sem interrupção
        2. O DW está aceitando escritas
        3. Os consumidores podem executar queries sem erro

        ## Métrica
        - **Nome:** `forge_availability_percent`
        - **Fórmula:** (tempo_sem_erro / tempo_total) * 100
        - **Granularidade:** Por hora
        - **Coleta:** Heartbeat do job de streaming; status de queries no DW

        ## SLO
        | Métrica | Alvo | Justificativa |
        |---------|------|---------------|
        | Disponibilidade geral | ≥ 99.5% | ~3.6 horas de downtime/mês aceitável |
        | Disponibilidade de Relay | ≥ 99.9% | Relay é crítico; gerenciado por time separado |
        | Disponibilidade de DW | ≥ 99.9% | DW é crítico; gerenciado por time separado |
        | Disponibilidade do Forge | ≥ 99.0% | Forge pode falhar; recuperação automática esperada |

        ## Baseline (Etapa 1)
        - Disponibilidade: ~99.0% (taxa de falha ~1%, MTBF ~1440 min)
        - Causa de indisponibilidade: falhas de job, OOM, timeouts

        ## Melhoria esperada
        - Streaming com auto-recovery: ≥ 99.5% (recuperação em < 5 min)
        ```

        **Verificação:** Arquivo atualizado com SLO de disponibilidade; alvo ≥ 99.5% documentado.

        ---

        ### 1.4 Tempo de Recuperação (Recovery Time Objective — RTO)

        **Definição:** Tempo máximo para o Forge recuperar-se de uma falha e voltar a processar eventos.

        **Comando/Configuração:**

        ```markdown
        # SLO: Tempo de Recuperação (RTO — Recovery Time Objective)

        ## Definição
        Tempo decorrido desde a detecção de uma falha até o Forge voltar a processar 
        eventos e reduzir o lag (atraso) para < 1 min.

        ## Métrica
        - **Nome:** `forge_recovery_time_seconds`
        - **Fórmula:** timestamp_lag_reduzido - timestamp_falha_detectada
        - **Granularidade:** Por incidente
        - **Coleta:** Logs de job; métrica de lag do consumer group

        ## SLO
        | Cenário | RTO alvo | Justificativa |
        |---------|----------|---------------|
        | Falha de task (1 de N) | 30 s | Auto-restart rápido |
        | Falha de job (todos os tasks) | 5 min | Redeploy + rebalance |
        | Falha de DW (indisponibilidade) | 15 min | Fora do escopo do Forge; SLA do DW |
        | Falha de Relay (indisponibilidade) | 15 min | Fora do escopo do Forge; SLA do Relay |

        ## Baseline (Etapa 1)
        - RTO atual: ~60 min (próximo lote batch)
        - Causa: job falha, aguarda próximo agendamento

        ## Melhoria esperada
        - RTO: 60 min → 5 min (12× mais rápido)
        - Impacto: Sentinel não fica sem dados por > 5 min
        ```

        **Verificação:** Arquivo atualizado com SLO de RTO; alvo ≤ 5 min documentado.

        ---

        ### 1.5 Objetivo de Ponto de Recuperação (RPO — Recovery Point Objective)

        **Definição:** Quantidade máxima de dados que podem ser perdidos em caso de falha.

        **Comando/Configuração:**

        ```markdown
        # SLO: Objetivo de Ponto de Recuperação (RPO — Recovery Point Objective)

        ## Definição
        Quantidade máxima de eventos que podem ser perdidos entre a última escrita 
        bem-sucedida no DW e uma falha.

        ## Métrica
        - **Nome:** `forge_data_loss_events`
        - **Fórmula:** eventos_no_buffer_nao_confirmados
        - **Granularidade:** Por falha
        - **Coleta:** Offset do consumer group; checkpoint do Forge

        ## SLO
        | Cenário | RPO alvo | Justificativa |
        |---------|----------|---------------|
        | Falha de task | 0 eventos | Streaming com checkpoint; sem perda |
        | Falha de job | ≤ 30 s de eventos | Buffer em memória; reprocessamento automático |
        | Falha de Relay | Fora do escopo | Relay gerencia sua própria retenção |

        ## Baseline (Etapa 1)
        - RPO atual: ~60 min de eventos (1 lote inteiro perdido se falha antes de escrita)
        - Causa: batch sem checkpoint intermediário

        ## Melhoria esperada
        - RPO: 60 min → 0 eventos (streaming com checkpoint)
        - Impacto: Nenhuma perda de dados; reprocessamento automático
        ```

        **Verificação:** Arquivo atualizado com SLO de RPO; alvo = 0 eventos documentado.

        ---

        ### 1.6 Consolidação de SLOs

        **Ação:** Crie tabela consolidada de SLOs.

        **Comando/Configuração:**

        ```markdown
        # Tabela Consolidada de SLOs do Forge (Streaming)

        | Dimensão | Métrica | Alvo | Baseline | Melhoria |
        |----------|---------|------|----------|----------|
        | **Frescor** | p50 latência | 30 s | 60 min | 120× |
        | | p95 latência | 120 s | 105 min | 52× |
        | | p99 latência | 300 s | 120 min | 24× |
        | **Completude** | Completude geral | ≥ 99.9% | ~99.5% | +0.4% |
        | | Completude por tenant | ≥ 99.5% | ~99.0% | +0.5% |
        | **Disponibilidade** | Disponibilidade geral | ≥ 99.5% | ~99.0% | +0.5% |
        | | Disponibilidade Forge | ≥ 99.0% | ~99.0% | — |
        | **Recuperação** | RTO (falha de task) | 30 s | 60 min | 120× |
        | | RTO (falha de job) | 5 min | 60 min | 12× |
        | | RPO | 0 eventos | 60 min | ∞ |

        ## Notas
        - Frescor é a métrica mais crítica; impacta Sentinel (dashboards) e Cerebro (indexação).
        - Completude é crítica para Pepper (billing); perda de dados = perda de receita.
        - Disponibilidade é crítica para todos os consumidores; downtime = impacto em cascata.
        - RTO é crítico para SLA de Sentinel; > 5 min viola SLA de latência.
        ```

        **Verificação:** Tabela consolidada criada; todos os SLOs documentados com alvo, baseline e melhoria esperada.

        ---

        ## 2. Defina semântica de entrega alvo e implicações por consumidor

        **Ação:** Formalize a semântica de entrega (at-least-once, exactly-once, etc.) e mapeie implicações para cada consumidor.

        **Onde:** Arquivo `forge/docs/delivery-semantics.md` (novo) no repositório do Forge.

        **Procedimento:**

        ### 2.1 Escolha da semântica de entrega

        **Ação:** Analise trade-offs entre semânticas e escolha a mais apropriada.

        **Comando/Configuração:**

        ```markdown
        # Semântica de Entrega do Forge (Streaming)

        ## Opções e Trade-offs

        ### 1. At-Most-Once (AMO)
        - **Definição:** Cada evento é processado 0 ou 1 vez.
        - **Implementação:** Sem checkpoint; sem retry.
        - **Vantagens:** Latência mínima; simplicidade.
        - **Desvantagens:** Perda de dados em falhas; viola SLO de completude (99.9%).
        - **Adequado para:** Métricas aproximadas (ex: amostragem).
        - **Decisão:** ❌ REJEITADO — Completude é crítica para billing (Pepper).

        ### 2. At-Least-Once (ALO)
        - **Definição:** Cada evento é processado ≥ 1 vez.
        - **Implementação:** Checkpoint + retry; sem deduplicação.
        - **Vantagens:** Sem perda de dados; latência baixa; simples.
        - **Desvantagens:** Duplicatas possíveis; requer idempotência no consumidor.
        - **Adequado para:** Agregações (SUM, COUNT com deduplicação).
        - **Decisão:** ✅ ACEITO — Semântica padrão com idempotência.

        ### 3. Exactly-Once (EXO)
        - **Definição:** Cada evento é processado exatamente 1 vez.
        - **Implementação:** Checkpoint + transação atômica (Forge + DW).
        - **Vantagens:** Sem duplicatas; sem perda.
        - **Desvantagens:** Latência maior; complexidade (2-phase commit); custo.
        - **Adequado para:** Billing, contabilidade.
        - **Decisão:** ⚠️ CONDICIONAL — Usar apenas para tabelas críticas (ex: `forge_sla_violations`).

        ## Semântica Escolhida: At-Least-Once com Idempotência

        **Justificativa:**
        - Completude ≥ 99.9% é alcançável com ALO + retry.
        - Idempotência é simples: deduplicar por `event_id` no DW.
        - Latência é baixa: sem overhead de 2-phase commit.
        - Custo é menor: sem transações distribuídas.

        **Implementação:**
        1. Forge consome do Relay com checkpoint a cada 30 s.
        2. Forge processa eventos em blocos de 30 s.
        3. Forge escreve no DW com `INSERT ... ON CONFLICT DO NOTHING` (ou equivalente).
        4. Se falha antes de checkpoint, reprocessa bloco (duplicatas possíveis).
        5. Deduplicação no DW garante idempotência.

        **Garantias:**
        - ✅ Sem perda de dados (checkpoint + retry).
        - ✅ Sem duplicatas visíveis (deduplicação no DW).
        - ✅ Latência baixa (sem 2-phase commit).
        - ✅ Custo baixo (sem transações distribuídas).
        ```

        **Verificação:** Arquivo criado com semântica ALO + idempotência escolhida e justificada.

        ---

        ### 2.2 Implicações por consumidor

        **Ação:** Mapeie como cada consumidor deve lidar com a semântica ALO.

        **Comando/Configuração:**

        ```markdown
        # Implicações da Semântica At-Least-Once por Consumidor

        ## 1. Sentinel (Dashboards e Alertas)

        ### Expectativa atual (Batch)
        - Dados chegam a cada 60 min.
        - Sem duplicatas (batch é idempotente por natureza).
        - Sem perda (falha = pula 1 lote, próximo lote processa o dobro).

        ### Expectativa nova (Streaming ALO)
        - Dados chegam a cada 30 s.
        - Possíveis duplicatas em caso de reprocessamento (ex: 2 eventos com mesmo event_id).
        - Sem perda (checkpoint + retry).

        ### Implicações para Sentinel
        | Aspecto | Impacto | Ação necessária |
        |--------|--------|-----------------|
        | **Latência** | ↓ 52× (105 min → 2 min) | Atualizar SLA de dashboard de 5 min para 2 min |
        | **Duplicatas** | Possíveis em reprocessamento | Queries devem usar `DISTINCT` ou `GROUP BY` com `MAX(timestamp)` |
        | **Agregações** | SUM, COUNT podem ter +1 em reprocessamento | Usar `SUM(DISTINCT event_id)` ou deduplicar antes de agregar |
        | **Alertas** | Podem disparar 2× se evento reprocessado | Adicionar deduplicação por `event_id` + `timestamp` em alertas |

        ### Validação necessária
        - [ ] Sentinel consegue lidar com duplicatas em queries?
        - [ ] Alertas disparam corretamente com duplicatas?
        - [ ] Dashboard atualiza a cada 30 s sem overhead?

        ### Exemplo de query compatível
        ```sql
        -- ❌ ANTES (batch, sem duplicatas)
        SELECT
          tenant_id,
          SUM(error_count) AS total_errors,
          SUM(error_count) / SUM(request_count) AS error_rate
        FROM forge_events_by_service
        WHERE hour = DATE_TRUNC('hour', CURRENT_TIMESTAMP())
        GROUP BY tenant_id;

        -- ✅ DEPOIS (streaming, com deduplicação)
        SELECT
          tenant_id,
          SUM(error_count) AS total_errors,
          SUM(error_count) / SUM(request_count) AS error_rate
        FROM (
          SELECT DISTINCT ON (event_id)
            tenant_id,
            error_count,
            request_count,
            timestamp
          FROM forge_events_by_service
          WHERE hour = DATE_TRUNC('hour', CURRENT_TIMESTAMP())
          ORDER BY event_id, timestamp DESC
        ) dedup
        GROUP BY tenant_id;
        ```

        ---

        ## 2. Cerebro (Indexação de Logs)

        ### Expectativa atual (Batch)
        - Índice atualizado a cada 60 min.
        - Sem duplicatas (batch é idempotente).
        - Sem perda (falha = pula 1 lote).

        ### Expectativa nova (Streaming ALO)
        - Índice atualizado a cada 30 s.
        - Possíveis duplicatas em caso de reprocessamento.
        - Sem perda (checkpoint + retry).

        ### Implicações para Cerebro
        | Aspecto | Impacto | Ação necessária |
        |--------|--------|-----------------|
        | **Latência** | ↓ 52× (105 min → 2 min) | Índice fica mais fresco; queries retornam dados mais recentes |
        | **Duplicatas** | Possíveis em reprocessamento | Indexador deve deduplicar por `event_id` antes de indexar |
        | **Tamanho do índice** | Pode crescer 2× se duplicatas não forem removidas | Implementar deduplicação no indexador |
        | **Queries** | Podem retornar duplicatas se não deduplicadas | Queries devem usar `DISTINCT` ou filtro por `timestamp DESC` |

        ### Validação necessária
        - [ ] Cerebro consegue ingerir dados a cada 30 s?
        - [ ] Deduplicação funciona corretamente?
        - [ ] Tamanho do índice não explode?

        ### Exemplo de ingestão compatível
        ```python
        # ❌ ANTES (batch, sem deduplicação)
        def ingest_batch(events):
            for event in events:
                index.add(event)

        # ✅ DEPOIS (streaming, com deduplicação)
        def ingest_stream(events):
            seen = set()
            for event in events:
                if event['event_id'] not in seen:
                    index.add(event)
                    seen.add(event['event_id'])
        ```

        ---

        ## 3. Pepper (Billing)

        ### Expectativa atual (Batch)
        - Relatório de billing roda 1× por dia (02:00 UTC).
        - Dados são finais (batch processou tudo).
        - Sem duplicatas (batch é idempotente).
        - Sem perda (falha = pula 1 lote, próximo lote processa o dobro).

        ### Expectativa nova (Streaming ALO)
        - Relatório de billing roda 1× por dia (02:00 UTC).
        - Dados podem ter duplicatas até o momento da query.
        - Sem perda (checkpoint + retry).

        ### Implicações para Pepper
        | Aspecto | Impacto | Ação necessária |
        |--------|--------|-----------------|
        | **Timing** | Relatório roda no mesmo horário (02:00 UTC) | Sem mudança; Pepper não é afetado por latência |
        | **Duplicatas** | Possíveis até 02:00 UTC | Query de billing deve deduplicar por `event_id` |
        | **Completude** | Crítica: perda de dados = perda de receita | Validar que completude ≥ 99.9% antes de cada relatório |
        | **Reconciliação** | Pode ser necessária se duplicatas causarem overcharging | Implementar validação de duplicatas antes de faturar |

        ### Validação necessária
        - [ ] Query de billing deduplica corretamente?
        - [ ] Completude é ≥ 99.9% no momento do relatório?
        - [ ] Reconciliação detecta e corrige duplicatas?

        ### Exemplo de query compatível
        ```sql
        -- ❌ ANTES (batch, sem deduplicação)
        SELECT
          tenant_id,
          SUM(request_count) AS total_requests,
          SUM(request_count) * 0.001 AS billing_amount_usd
        FROM forge_events_aggregated
        WHERE DATE(hour) = CURRENT_DATE - INTERVAL '1 day'
        GROUP BY tenant_id;

        -- ✅ DEPOIS (streaming, com deduplicação)
        SELECT
          tenant_id,
          SUM(request_count) AS total_requests,
          SUM(request_count) * 0.001 AS billing_amount_usd
        FROM (
          SELECT DISTINCT ON (event_id)
            tenant_id,
            request_count,
            timestamp
          FROM forge_events_aggregated
          WHERE DATE(hour) = CURRENT_DATE - INTERVAL '1 day'
          ORDER BY event_id, timestamp DESC
        ) dedup
        GROUP BY tenant_id;
        ```

        ---

        ## Resumo de Implicações

        | Consumidor | Semântica | Ação necessária | Risco | Mitigação |
        |-----------|-----------|-----------------|-------|-----------|
        | **Sentinel** | ALO | Deduplicar em queries; atualizar SLA | Duplicatas em alertas | Testar com reprocessamento |
        | **Cerebro** | ALO | Deduplicar no indexador | Índice cresce 2× | Monitorar tamanho do índice |
        | **Pepper** | ALO | Deduplicar em query de billing | Overcharging | Validar completude antes de faturar |

        ```

        **Verificação:** Arquivo criado com implicações por consumidor documentadas; ações necessárias listadas.

