            ## 5. Defina critério objetivo de "aprovado para cutover" ao fim de 14 dias

            **Ação:** Criar documento com critérios mensuráveis para aprovação de streaming.

            **Onde:** Arquivo `forge/config/cutover-approval-criteria.md` (novo) no repositório do Forge.

            **Procedimento:**

            ```markdown
            # Critérios de Aprovação para Cutover — Dual-Run 14 Dias

            ## Objetivo
            Definir critérios objetivos e mensuráveis para decidir se streaming está pronto para cutover.

            ## Critérios de Aprovação

            ### Categoria 1: Equivalência de Dados (Reconciliação)

            #### Critério 1.1: Taxa de Divergência < 0,1%
            **Definição:** Percentual de linhas que divergem entre batch e streaming.
            **Métrica:** `divergence_count / total_rows * 100`
            **Threshold:** < 0,1%
            **Período de Medição:** Últimos 7 dias de dual-run
            **Verificação:**
            ```sql
            SELECT
            COUNT(*) as total_rows,
            SUM(CASE WHEN divergence_type IS NOT NULL THEN 1 ELSE 0 END) as divergence_count,
            (SUM(CASE WHEN divergence_type IS NOT NULL THEN 1 ELSE 0 END) / COUNT(*)) * 100 as divergence_rate
            FROM forge.reconciliation.divergences
            WHERE timestamp >= CURRENT_DATE - 7
            GROUP BY table_name;
            ```
            **Aprovação:** Todas as tabelas têm `divergence_rate < 0.1%`

            #### Critério 1.2: Divergências Classificadas como "Esperadas" ou "Timing" > 90%
            **Definição:** Percentual de divergências que são esperadas (timing, deduplicação, watermark).
            **Métrica:** `(expected_count + timing_count) / total_divergence_count * 100`
            **Threshold:** > 90%
            **Período de Medição:** Últimos 7 dias de dual-run
            **Verificação:**
            ```sql
            SELECT
            COUNT(*) as total_divergences,
            SUM(CASE WHEN classification IN ('expected', 'timing') THEN 1 ELSE 0 END) as expected_timing_count,
            (SUM(CASE WHEN classification IN ('expected', 'timing') THEN 1 ELSE 0 END) / COUNT(*)) * 100 as expected_timing_rate
            FROM forge.reconciliation.divergences
            WHERE timestamp >= CURRENT_DATE - 7;
            ```
            **Aprovação:** `expected_timing_rate > 90%`

            #### Critério 1.3: Divergências por Bug < 10
            **Definição:** Número absoluto de divergências classificadas como "bug".
            **Métrica:** `COUNT(*) WHERE classification = 'bug'`
            **Threshold:** < 10
            **Período de Medição:** Últimos 7 dias de dual-run
            **Verificação:**
            ```sql
            SELECT
            COUNT(*) as bug_count
            FROM forge.reconciliation.divergences
            WHERE timestamp >= CURRENT_DATE - 7
            AND classification = 'bug';
            ```
            **Aprovação:** `bug_count < 10`

            ### Categoria 2: Latência (SLO)

            #### Critério 2.1: Latência E2E p95 < 120 s
            **Definição:** Latência de ponta a ponta (Relay → DW) no percentil 95.
            **Métrica:** `histogram_quantile(0.95, forge_latency_e2e_seconds)`
            **Threshold:** < 120 s (SLO de Etapa 2)
            **Período de Medição:** Últimos 7 dias de dual-run
            **Verificação:**
            ```
            curl -s http://prometheus:9090/api/v1/query \
            --data-urlencode 'query=histogram_quantile(0.95, rate(forge_latency_e2e_seconds_bucket[7d]))' | \
            jq '.data.result[0].value[1]'
            ```
            **Aprovação:** Resultado < 120

            #### Critério 2.2: Latência E2E p99 < 180 s
            **Definição:** Latência de ponta a ponta (Relay → DW) no percentil 99.
            **Métrica:** `histogram_quantile(0.99, forge_latency_e2e_seconds)`
            **Threshold:** < 180 s (1,5× SLO)
            **Período de Medição:** Últimos 7 dias de dual-run
            **Verificação:**
            ```
            curl -s http://prometheus:9090/api/v1/query \
            --data-urlencode 'query=histogram_quantile(0.99, rate(forge_latency_e2e_seconds_bucket[7d]))' | \
            jq '.data.result[0].value[1]'
            ```
            **Aprovação:** Resultado < 180

            ### Categoria 3: Completude (SLO)

            #### Critério 3.1: Completude ≥ 99,9%
            **Definição:** Percentual de eventos que chegaram ao DW.
            **Métrica:** `events_written / events_consumed * 100`
            **Threshold:** ≥ 99,9% (SLO de Etapa 2)
            **Período de Medição:** Últimos 7 dias de dual-run
            **Verificação:**
            ```sql
            SELECT
            SUM(events_consumed) as total_consumed,
            SUM(events_written) as total_written,
            (SUM(events_written) / SUM(events_consumed)) * 100 as completeness
            FROM forge.monitoring.metrics
            WHERE timestamp >= CURRENT_DATE - 7
            AND mode = 'streaming';
            ```
            **Aprovação:** `completeness >= 99.9`

            #### Critério 3.2: Taxa de Erro < 0,1%
            **Definição:** Percentual de eventos que falharam.
            **Métrica:** `errors_total / events_consumed * 100`
            **Threshold:** < 0,1%
            **Período de Medição:** Últimos 7 dias de dual-run
            **Verificação:**
            ```sql
            SELECT
            SUM(events_consumed) as total_consumed,
            SUM(errors_total) as total_errors,
            (SUM(errors_total) / SUM(events_consumed)) * 100 as error_rate
            FROM forge.monitoring.metrics
            WHERE timestamp >= CURRENT_DATE - 7
            AND mode = 'streaming';
            ```
            **Aprovação:** `error_rate < 0.1`

            ### Categoria 4: Disponibilidade (SLO)

            #### Critério 4.1: Disponibilidade ≥ 99,5%
            **Definição:** Percentual de tempo que streaming estava disponível.
            **Métrica:** `(total_time - downtime) / total_time * 100`
            **Threshold:** ≥ 99,5% (SLO de Etapa 2)
            **Período de Medição:** Últimos 7 dias de dual-run
            **Verificação:**
            ```sql
            SELECT
            (1 - (SUM(downtime_seconds) / (7 * 24 * 3600))) * 100 as availability
            FROM forge.monitoring.metrics
            WHERE timestamp >= CURRENT_DATE - 7
            AND mode = 'streaming';
            ```
            **Aprovação:** `availability >= 99.5`

            #### Critério 4.2: Nenhum Alerta Crítico Não Resolvido
            **Definição:** Alertas críticos devem ser resolvidos em < 1 hora.
            **Métrica:** `COUNT(*) WHERE severity = 'CRITICAL' AND resolution_time > 3600`
            **Threshold:** = 0
            **Período de Medição:** Últimos 7 dias de dual-run
            **Verificação:**
            ```sql
            SELECT
            COUNT(*) as unresolved_critical_alerts
            FROM forge.monitoring.alerts
            WHERE timestamp >= CURRENT_DATE - 7
            AND severity = 'CRITICAL'
            AND resolution_time > 3600;
            ```
            **Aprovação:** `unresolved_critical_alerts = 0`

            ### Categoria 5: Carga (Não Degradação)

            #### Critério 5.1: Taxa de Produção no Relay < 1500 evt/s
            **Definição:** Dual-run não deve aumentar carga no Relay em > 50%.
            **Métrica:** `rate(kafka_topic_partition_append_total[7d])`
            **Threshold:** < 1500 evt/s
            **Período de Medição:** Últimos 7 dias de dual-run
            **Verificação:**
            ```
            curl -s http://prometheus:9090/api/v1/query \
            --data-urlencode 'query=rate(kafka_topic_partition_append_total[7d])' | \
            jq '.data.result[0].value[1]'
            ```
            **Aprovação:** Resultado < 1500

            #### Critério 5.2: Espaço em Disco no DW < 750 GB
            **Definição:** Dual-run não deve aumentar espaço em disco em > 50%.
            **Métrica:** `node_filesystem_avail_bytes{mountpoint="/data/forge"} / 1e9`
            **Threshold:** < 750 GB
            **Período de Medição:** Últimos 7 dias de dual-run
            **Verificação:**
            ```bash
            df /data/forge | tail -1 | awk '{print $3 / 1024 / 1024}'
            ```
            **Aprovação:** Resultado < 750

            #### Critério 5.3: CPU do Cluster Spark < 80%
            **Definição:** Dual-run não deve aumentar CPU em > 60%.
            **Métrica:** `rate(process_cpu_seconds_total[7d]) * 100`
            **Threshold:** < 80%
            **Período de Medição:** Últimos 7 dias de dual-run
            **Verificação:**
            ```
            curl -s http://prometheus:9090/api/v1/query \
            --data-urlencode 'query=rate(process_cpu_seconds_total[7d]) * 100' | \
            jq '.data.result[0].value[1]'
            ```
            **Aprovação:** Resultado < 80

            ### Categoria 6: Compatibilidade com Consumidores

            #### Critério 6.1: Sentinel Consegue Ler Dados
            **Definição:** Views de compatibilidade funcionam sem erro.
            **Métrica:** `COUNT(*) FROM forge.aggregated_hourly`
            **Threshold:** > 0
            **Período de Medição:** Últimos 7 dias de dual-run
            **Verificação:**
            ```sql
            SELECT COUNT(*) FROM forge.aggregated_hourly;
            ```
            **Aprovação:** Resultado > 0

            #### Critério 6.2: Cerebro Consegue Ingerir Dados
            **Definição:** Tópico Kafka tem eventos.
            **Métrica:** `kafka_topic_partition_current_offset{topic="forge-events-indexed"}`
            **Threshold:** > 0
            **Período de Medição:** Últimos 7 dias de dual-run
            **Verificação:**
            ```bash
            kafka-consumer-groups.sh --bootstrap-server <relay-broker> \
            --group forge-cerebro-v1 --describe | grep forge-events-indexed
            ```
            **Aprovação:** Offset > 0

            #### Critério 6.3: Pepper Consegue Gerar Relatório de Billing
            **Definição:** Relatório de billing é gerado sem erro.
            **Métrica:** `COUNT(*) FROM forge.billing_events_daily`
            **Threshold:** > 0
            **Período de Medição:** Últimos 7 dias de dual-run
            **Verificação:**
            ```sql
            SELECT COUNT(*) FROM forge.billing_events_daily;
            ```
            **Aprovação:** Resultado > 0

