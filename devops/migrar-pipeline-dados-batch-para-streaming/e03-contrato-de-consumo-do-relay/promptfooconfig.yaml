        ### 2.2 Implicações por consumidor

        **Ação:** Mapeie como cada consumidor deve lidar com a semântica ALO.

        **Comando/Configuração:**

        ```markdown
        # Implicações da Semântica At-Least-Once por Consumidor

        ## 1. Sentinel (Dashboards e Alertas)

        ### Expectativa atual (Batch)
        - Dados chegam a cada 60 min.
        - Sem duplicatas (batch é idempotente por natureza).
        - Sem perda (falha = pula 1 lote, próximo lote processa o dobro).

        ### Expectativa nova (Streaming ALO)
        - Dados chegam a cada 30 s.
        - Possíveis duplicatas em caso de reprocessamento (ex: 2 eventos com mesmo event_id).
        - Sem perda (checkpoint + retry).

        ### Implicações para Sentinel
        | Aspecto | Impacto | Ação necessária |
        |--------|--------|-----------------|
        | **Latência** | ↓ 52× (105 min → 2 min) | Atualizar SLA de dashboard de 5 min para 2 min |
        | **Duplicatas** | Possíveis em reprocessamento | Queries devem usar `DISTINCT` ou `GROUP BY` com `MAX(timestamp)` |
        | **Agregações** | SUM, COUNT podem ter +1 em reprocessamento | Usar `SUM(DISTINCT event_id)` ou deduplicar antes de agregar |
        | **Alertas** | Podem disparar 2× se evento reprocessado | Adicionar deduplicação por `event_id` + `timestamp` em alertas |

        ### Validação necessária
        - [ ] Sentinel consegue lidar com duplicatas em queries?
        - [ ] Alertas disparam corretamente com duplicatas?
        - [ ] Dashboard atualiza a cada 30 s sem overhead?

        ### Exemplo de query compatível
        ```sql
        -- ❌ ANTES (batch, sem duplicatas)
        SELECT
          tenant_id,
          SUM(error_count) AS total_errors,
          SUM(error_count) / SUM(request_count) AS error_rate
        FROM forge_events_by_service
        WHERE hour = DATE_TRUNC('hour', CURRENT_TIMESTAMP())
        GROUP BY tenant_id;

        -- ✅ DEPOIS (streaming, com deduplicação)
        SELECT
          tenant_id,
          SUM(error_count) AS total_errors,
          SUM(error_count) / SUM(request_count) AS error_rate
        FROM (
          SELECT DISTINCT ON (event_id)
            tenant_id,
            error_count,
            request_count,
            timestamp
          FROM forge_events_by_service
          WHERE hour = DATE_TRUNC('hour', CURRENT_TIMESTAMP())
          ORDER BY event_id, timestamp DESC
        ) dedup
        GROUP BY tenant_id;
        ```

        ---

        ## 2. Cerebro (Indexação de Logs)

        ### Expectativa atual (Batch)
        - Índice atualizado a cada 60 min.
        - Sem duplicatas (batch é idempotente).
        - Sem perda (falha = pula 1 lote).

        ### Expectativa nova (Streaming ALO)
        - Índice atualizado a cada 30 s.
        - Possíveis duplicatas em caso de reprocessamento.
        - Sem perda (checkpoint + retry).

        ### Implicações para Cerebro
        | Aspecto | Impacto | Ação necessária |
        |--------|--------|-----------------|
        | **Latência** | ↓ 52× (105 min → 2 min) | Índice fica mais fresco; queries retornam dados mais recentes |
        | **Duplicatas** | Possíveis em reprocessamento | Indexador deve deduplicar por `event_id` antes de indexar |
        | **Tamanho do índice** | Pode crescer 2× se duplicatas não forem removidas | Implementar deduplicação no indexador |
        | **Queries** | Podem retornar duplicatas se não deduplicadas | Queries devem usar `DISTINCT` ou filtro por `timestamp DESC` |

        ### Validação necessária
        - [ ] Cerebro consegue ingerir dados a cada 30 s?
        - [ ] Deduplicação funciona corretamente?
        - [ ] Tamanho do índice não explode?

        ### Exemplo de ingestão compatível
        ```python
        # ❌ ANTES (batch, sem deduplicação)
        def ingest_batch(events):
            for event in events:
                index.add(event)

        # ✅ DEPOIS (streaming, com deduplicação)
        def ingest_stream(events):
            seen = set()
            for event in events:
                if event['event_id'] not in seen:
                    index.add(event)
                    seen.add(event['event_id'])
        ```

        ---

        ## 3. Pepper (Billing)

        ### Expectativa atual (Batch)
        - Relatório de billing roda 1× por dia (02:00 UTC).
        - Dados são finais (batch processou tudo).
        - Sem duplicatas (batch é idempotente).
        - Sem perda (falha = pula 1 lote, próximo lote processa o dobro).

        ### Expectativa nova (Streaming ALO)
        - Relatório de billing roda 1× por dia (02:00 UTC).
        - Dados podem ter duplicatas até o momento da query.
        - Sem perda (checkpoint + retry).

        ### Implicações para Pepper
        | Aspecto | Impacto | Ação necessária |
        |--------|--------|-----------------|
        | **Timing** | Relatório roda no mesmo horário (02:00 UTC) | Sem mudança; Pepper não é afetado por latência |
        | **Duplicatas** | Possíveis até 02:00 UTC | Query de billing deve deduplicar por `event_id` |
        | **Completude** | Crítica: perda de dados = perda de receita | Validar que completude ≥ 99.9% antes de cada relatório |
        | **Reconciliação** | Pode ser necessária se duplicatas causarem overcharging | Implementar validação de duplicatas antes de faturar |

        ### Validação necessária
        - [ ] Query de billing deduplica corretamente?
        - [ ] Completude é ≥ 99.9% no momento do relatório?
        - [ ] Reconciliação detecta e corrige duplicatas?

        ### Exemplo de query compatível
        ```sql
        -- ❌ ANTES (batch, sem deduplicação)
        SELECT
          tenant_id,
          SUM(request_count) AS total_requests,
          SUM(request_count) * 0.001 AS billing_amount_usd
        FROM forge_events_aggregated
        WHERE DATE(hour) = CURRENT_DATE - INTERVAL '1 day'
        GROUP BY tenant_id;

        -- ✅ DEPOIS (streaming, com deduplicação)
        SELECT
          tenant_id,
          SUM(request_count) AS total_requests,
          SUM(request_count) * 0.001 AS billing_amount_usd
        FROM (
          SELECT DISTINCT ON (event_id)
            tenant_id,
            request_count,
            timestamp
          FROM forge_events_aggregated
          WHERE DATE(hour) = CURRENT_DATE - INTERVAL '1 day'
          ORDER BY event_id, timestamp DESC
        ) dedup
        GROUP BY tenant_id;
        ```

        ---

        ## Resumo de Implicações

        | Consumidor | Semântica | Ação necessária | Risco | Mitigação |
        |-----------|-----------|-----------------|-------|-----------|
        | **Sentinel** | ALO | Deduplicar em queries; atualizar SLA | Duplicatas em alertas | Testar com reprocessamento |
        | **Cerebro** | ALO | Deduplicar no indexador | Índice cresce 2× | Monitorar tamanho do índice |
        | **Pepper** | ALO | Deduplicar em query de billing | Overcharging | Validar completude antes de faturar |

        ```

