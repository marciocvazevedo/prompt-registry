        ## 8. Crie configuração de consumo do Relay (Spark Structured Streaming)

        **Ação:** Implemente código de consumo do Relay no Forge.

        **Onde:** Arquivo `forge/jobs/streaming_ingest.py` (novo) no repositório do Forge.

        **Comando/Configuração:**

        ```python
        #!/usr/bin/env python3
        """
        Forge Streaming Ingest Job
        Consome eventos continuamente do Relay e processa em blocos de 30 s.
        """

        from pyspark.sql import SparkSession
        from pyspark.sql.functions import (
            col, from_json, schema_of_json, window, count, sum as spark_sum,
            from_unixtime, to_timestamp, expr
        )
        from pyspark.sql.types import StructType, StructField, StringType, LongType, DoubleType, MapType

        # Configuração
        RELAY_BROKER = "<relay-broker>"  # [SUPOSIÇÃO] ex: kafka-broker-1:9092,kafka-broker-2:9092
        RELAY_TOPIC = "forge-events-raw"
        CONSUMER_GROUP = "forge-streaming-v1"
        CHECKPOINT_DIR = "/data/forge/checkpoint"
        OUTPUT_DIR = "/data/forge/aggregated"

        # Schema do evento (de Etapa 1)
        EVENT_SCHEMA = StructType([
            StructField("event_id", StringType(), False),
            StructField("tenant_id", StringType(), False),
            StructField("timestamp", LongType(), False),
            StructField("service_id", StringType(), False),
            StructField("metric_name", StringType(), False),
            StructField("metric_value", DoubleType(), False),
            StructField("tags", MapType(StringType(), StringType()), True),
        ])

        def create_spark_session():
            """Cria sessão Spark com configurações otimizadas."""
            return SparkSession.builder \
                .appName("forge-streaming-ingest") \
                .config("spark.streaming.kafka.maxRatePerPartition", "2000") \
                .config("spark.streaming.kafka.maxOffsetsPerTrigger", "2000") \
                .config("spark.sql.streaming.checkpointLocation", CHECKPOINT_DIR) \
                .config("spark.sql.streaming.schemaInference", "false") \
                .getOrCreate()

        def read_from_relay(spark):
            """Lê eventos do Relay (Kafka)."""
            df = spark.readStream \
                .format("kafka") \
                .option("kafka.bootstrap.servers", RELAY_BROKER) \
                .option("subscribe", RELAY_TOPIC) \
                .option("startingOffsets", "earliest") \
                .option("kafka.group.id", CONSUMER_GROUP) \
                .option("kafka.session.timeout.ms", "30000") \
                .option("kafka.heartbeat.interval.ms", "10000") \
                .option("kafka.max.poll.records", "2000") \
                .option("kafka.fetch.max.bytes", "1000000") \
                .option("kafka.fetch.max.wait.ms", "500") \
                .load()
            
            return df

        def parse_events(df):
            """Desserializa e valida eventos."""
            # Desserializar JSON
            df_parsed = df.select(
                col("key").cast(StringType()).alias("partition_key"),
                from_json(col("value").cast(StringType()), EVENT_SCHEMA).alias("event"),
                col("timestamp").alias("kafka_timestamp")
            ).select(
                col("partition_key"),
                col("event.*"),
                col("kafka_timestamp")
            )
            
            # Validar schema
            df_validated = df_parsed.filter(
                (col("event_id").isNotNull()) &
                (col("tenant_id").isNotNull()) &
                (col("timestamp").isNotNull())
            )
            
            return df_validated

        def apply_watermark(df):
            """Aplica watermark para tratamento de eventos atrasados."""
            # Converter timestamp (ms) para timestamp Spark
            df_with_ts = df.withColumn(
                "event_timestamp",
                to_timestamp(col("timestamp") / 1000)
            )
            
            # Aplicar watermark: 45 s de atraso permitido
            df_watermarked = df_with_ts.withWatermark("event_timestamp", "45 seconds")
            
            return df_watermarked

        def aggregate_events(df):
            """Agrega eventos em janelas de 30 s."""
            df_aggregated = df.groupBy(
                window(col("event_timestamp"), "30 seconds"),
                col("tenant_id"),
                col("service_id")
            ).agg(
                count("*").alias("event_count"),
                spark_sum("metric_value").alias("total_value"),
                expr("percentile_approx(metric_value, 0.5)").alias("p50_value"),
                expr("percentile_approx(metric_value, 0.95)").alias("p95_value"),
                expr("percentile_approx(metric_value, 0.99)").alias("p99_value"),
            ).select(
                col("window.start").alias("window_start"),
                col("window.end").alias("window_end"),
                col("tenant_id"),
                col("service_id"),
                col("event_count"),
                col("total_value"),
                col("p50_value"),
                col("p95_value"),
                col("p99_value"),
            )
            
            return df_aggregated

        def write_to_dw(df, checkpoint_dir, output_dir):
            """Escreve agregações no data warehouse."""
            query = df.writeStream \
                .format("parquet") \
                .option("path", output_dir) \
                .option("checkpointLocation", checkpoint_dir) \
                .outputMode("update") \
                .trigger(processingTime="30 seconds") \
                .start()
            
            return query

        def main():
            """Função principal."""
            # Criar sessão Spark
            spark = create_spark_session()
            
            # Ler do Relay
            df_raw = read_from_relay(spark)
            
            # Processar
            df_parsed = parse_events(df_raw)
            df_watermarked = apply_watermark(df_parsed)
            df_aggregated = aggregate_events(df_watermarked)
            
            # Escrever no DW
            query = write_to_dw(df_aggregated, CHECKPOINT_DIR, OUTPUT_DIR)
            
            # Aguardar término
            query.awaitTermination()

        if __name__ == "__main__":
            main()
        ```

