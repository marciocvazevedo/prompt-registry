        ## Dados faltantes e confirmações necessárias

        ### Dados que faltam:

        1. **Taxa real de eventos inválidos:** Qual é a taxa esperada de eventos inválidos em produção? (Necessário para threshold de alerta)
        2. **Taxa real de erro transitório:** Qual é a taxa esperada de erros transitórios? (Necessário para threshold de alerta)
        3. **Tamanho real de estado por tenant:** Qual é o maior tenant em termos de tamanho de estado? (Necessário para threshold de alerta)
        4. **Latência real de escrita no DW:** Qual é a latência p95 esperada de escrita? (Necessário para threshold de alerta)
        5. **Custo real por nó/hora:** Qual é o custo exato de um nó Spark por hora? (Necessário para métrica de custo)
        6. **Retenção de métricas em Prometheus:** Quantos dias de métricas devem ser retidos? (Necessário para configuração)
        7. **Frequência de coleta de métricas:** Com que frequência as métricas devem ser coletadas? (Necessário para granularidade)
        8. **Integração com Sentinel:** Como Sentinel consome alertas? (Webhook, API, Kafka?) (Necessário para roteamento)
        9. **Integração com PagerDuty:** Como alertas são roteados para on-call? (Necessário para escalação)
        10. **SLA de resolução de alerta:** Qual é o SLA para resolver cada tipo de alerta? (Necessário para priorização)

        ### Confirmações que derrubariam/validariam escolhas futuras:

        - Se **taxa de eventos inválidos > 1000/min**, aumentar threshold de alerta
        - Se **latência E2E p95 > 120 s**, investigar causa raiz (consumo, processamento, escrita)
        - Se **tamanho de estado > 10 GB**, aumentar threshold de alerta ou reduzir retenção
        - Se **custo por hora > $50**, revisar utilização de recursos
        - Se **Prometheus fica sem espaço**, reduzir retenção ou limpar dados antigos
        - Se **alertas geram muitos falsos positivos**, ajustar thresholds ou usar múltiplas condições
        - Se **testes de alertas falham**, investigar causa raiz (métrica não coletada, alerta não dispara)
        - Se **dashboard fica lento**, limitar número de séries ou usar agregação
        - Se **instrumentação degrada performance**, otimizar coleta de métricas ou usar sampling

