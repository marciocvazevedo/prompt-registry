        ### 2.2 Implementar Retry com Backoff Exponencial

        ```python
        #!/usr/bin/env python3
        """
        Streaming com Retry e DLQ
        Implementa política de retentativa e envio para DLQ.
        """
        from pyspark.sql import SparkSession
        from pyspark.sql.functions import (
            col, from_json, schema_of_json, current_timestamp, lit, when
        )
        from pyspark.sql.types import StructType, StructField, StringType, LongType, DoubleType, MapType
        import logging
        import time
        from datetime import datetime

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        # Configuração
        RELAY_BROKER = "<relay-broker>"
        RELAY_TOPIC = "forge-events-raw"
        CONSUMER_GROUP = "forge-streaming-v1"
        DLQ_TOPICS = {
            "INVALID_EVENT": "forge-events-invalid",
            "TRANSIENT_ERROR": "forge-events-retry-exhausted",
            "BUSINESS_LOGIC_ERROR": "forge-events-business-logic-error",
            "UNKNOWN_ERROR": "forge-events-unknown-error",
        }

        # Schema do evento
        EVENT_SCHEMA = StructType([
            StructField("event_id", StringType(), False),
            StructField("tenant_id", StringType(), False),
            StructField("timestamp", LongType(), False),
            StructField("service_id", StringType(), False),
            StructField("metric_name", StringType(), False),
            StructField("metric_value", DoubleType(), False),
            StructField("tags", MapType(StringType(), StringType()), True),
        ])

        class StreamingWithDLQ:
            """Streaming com retry e DLQ"""
            
            def __init__(self, spark):
                self.spark = spark
                self.logger = logger
                self.retry_config = {
                    "max_retries": 5,
                    "backoff_base": 2,  # 2^n segundos
                    "max_backoff": 60,  # máximo 60 segundos
                }
            
            def is_invalid_event(self, event):
                """Verificar se evento é inválido"""
                if event is None:
                    return True
                if event.get("event_id") is None or event.get("tenant_id") is None:
                    return True
                if event.get("timestamp") is None:
                    return True
                return False
            
            def is_business_logic_error(self, event, config):
                """Verificar se evento viola regra de negócio"""
                # Verificar se tenant existe
                if event.get("tenant_id") not in config.get("valid_tenants", []):
                    return True
                # Verificar se métrica é conhecida
                if event.get("metric_name") not in config.get("valid_metrics", []):
                    return True
                # Verificar se evento é muito antigo (> 1 hora)
                if event.get("timestamp") < (time.time() * 1000 - 3600000):
                    return True
                return False
            
            def classify_error(self, exception, event, config):
                """Classificar tipo de erro"""
                msg = str(exception).lower()
                
                # Tipo 1: Evento Inválido
                if self.is_invalid_event(event):
                    return "INVALID_EVENT"
                
                # Tipo 2: Falha Transitória
                transient_keywords = ["timeout", "temporarily", "unavailable", "connection refused"]
                if any(keyword in msg for keyword in transient_keywords):
                    return "TRANSIENT_ERROR"
                
                # Tipo 3: Falha de Dependência
                if "connection refused" in msg or "connection timeout" in msg:
                    return "DEPENDENCY_ERROR"
                
                # Tipo 4: Falha de Deploy
                deploy_keywords = ["nullpointer", "indexoutofbounds", "zerodivision", "attributeerror", "keyerror"]
                if any(keyword in msg for keyword in deploy_keywords):
                    return "DEPLOY_ERROR"
                
                # Tipo 5: Falha de Lógica de Negócio
                if self.is_business_logic_error(event, config):
                    return "BUSINESS_LOGIC_ERROR"
                
                return "UNKNOWN_ERROR"
            
            def send_to_dlq(self, df, error_type, dlq_topic):
                """Enviar eventos para DLQ"""
                if df.count() == 0:
                    return
                
                # Adicionar metadados de erro
                df_with_metadata = df.withColumn("error_type", lit(error_type)) \
                    .withColumn("error_timestamp", current_timestamp()) \
                    .withColumn("dlq_topic", lit(dlq_topic))
                
                # Enviar para DLQ
                df_with_metadata.select(
                    col("key"),
                    col("value"),
                    col("error_type"),
                    col("error_timestamp")
                ).write.format("kafka") \
                    .option("kafka.bootstrap.servers", RELAY_BROKER) \
                    .option("topic", dlq_topic) \
                    .mode("append") \
                    .save()
                
                self.logger.warning(f"Enviados {df.count()} eventos para DLQ ({dlq_topic})")
            
            def process_with_retry(self, df, batch_id, config):
                """Processar eventos com retry"""
                self.logger.info(f"Batch {batch_id}: Processando com retry")
                
                # Separar eventos válidos de inválidos
                df_valid = df.filter(~self.is_invalid_event(col("event")))
                df_invalid = df.filter(self.is_invalid_event(col("event")))
                
                # Enviar inválidos para DLQ
                if df_invalid.count() > 0:
                    self.send_to_dlq(df_invalid, "INVALID_EVENT", DLQ_TOPICS["INVALID_EVENT"])
                
                # Separar eventos que violam lógica de negócio
                df_business_logic_error = df_valid.filter(
                    self.is_business_logic_error(col("event"), config)
                )
                df_valid = df_valid.filter(
                    ~self.is_business_logic_error(col("event"), config)
                )
                
                # Enviar erros de lógica para DLQ
                if df_business_logic_error.count() > 0:
                    self.send_to_dlq(df_business_logic_error, "BUSINESS_LOGIC_ERROR", 
                                  DLQ_TOPICS["BUSINESS_LOGIC_ERROR"])
                
                return df_valid
            
            def create_spark_session(self):
                """Cria sessão Spark"""
                return SparkSession.builder \
                    .appName("forge-streaming-with-dlq") \
                    .config("spark.streaming.kafka.maxRatePerPartition", "2000") \
                    .getOrCreate()

        def main():
            """Função principal"""
            spark = SparkSession.builder \
                .appName("forge-streaming-with-dlq") \
                .getOrCreate()
            
            processor = StreamingWithDLQ(spark)
            
            # Ler do Relay
            df = spark.readStream \
                .format("kafka") \
                .option("kafka.bootstrap.servers", RELAY_BROKER) \
                .option("subscribe", RELAY_TOPIC) \
                .option("startingOffsets", "earliest") \
                .option("kafka.group.id", CONSUMER_GROUP) \
                .load()
            
            # Desserializar
            df_parsed = df.select(
                col("key").cast(StringType()).alias("partition_key"),
                from_json(col("value").cast(StringType()), EVENT_SCHEMA).alias("event"),
                col("timestamp").alias("kafka_timestamp")
            ).select(
                col("partition_key"),
                col("event.*"),
                col("kafka_timestamp")
            )
            
            # Processar com retry
            config = {"valid_tenants": ["t1", "t2"], "valid_metrics": ["http.requests", "latency"]}
            df_processed = df_parsed.transform(
                lambda df: processor.process_with_retry(df, 0, config)
            )
            
            # Escrever no DW
            query = df_processed.writeStream \
                .format("parquet") \
                .option("path", "/data/forge/aggregated") \
                .option("checkpointLocation", "/data/forge/checkpoint/aggregated") \
                .outputMode("append") \
                .trigger(processingTime="30 seconds") \
                .start()
            
            query.awaitTermination()

        if __name__ == "__main__":
            main()
        ```

