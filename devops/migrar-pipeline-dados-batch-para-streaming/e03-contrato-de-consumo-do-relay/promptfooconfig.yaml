        ## Suposições marcadas

        | # | Suposição | Razão | Confirmação necessária |
        |---|-----------|-------|------------------------|
        | [SUPOSIÇÃO-1] | SLO de 2 min p95 é alcançável com streaming | Baseado em latência de batch (105 min) | Validar com protótipo (Etapa 3) |
        | [SUPOSIÇÃO-2] | At-Least-Once com idempotência é suficiente | Padrão em streaming; sem overhead de 2-phase commit | Validar com consumidores |
        | [SUPOSIÇÃO-3] | Deduplicação no DW é simples (INSERT ... ON CONFLICT) | Padrão em SQL; suportado por Snowflake, BigQuery, Redshift | Confirmar com time de DW |
        | [SUPOSIÇÃO-4] | Consumidores conseguem lidar com duplicatas | Queries podem usar DISTINCT ou GROUP BY | Testar com dados reais |
        | [SUPOSIÇÃO-5] | Orçamento de erro é realista (0.1% completude, 0.1% corretude) | Baseado em SLA de 99.9% | Validar com dados históricos |
        | [SUPOSIÇÃO-6] | Gatilhos de rollback funcionam corretamente | Implementação simples com alertas e confirmação manual | Testar em staging |
        | [SUPOSIÇÃO-7] | SLAs herdados são confirmados com consumidores | Assumindo comunicação com Sentinel, Cerebro, Pepper | Enviar questionário agora |
