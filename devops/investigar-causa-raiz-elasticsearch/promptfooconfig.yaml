prompts:
  - file://prompt.md
providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    config:
      max_tokens: 16184
      temperature: 0.0
defaultTest:
  options:
    rubricPrompt: file://rubric/judge-rca-elasticsearch.xml
    provider:
      id: openai:gpt-5
      config:
        response_format: { type: json_object }
  assert:
    - type: llm-rubric
      value: >
        Avaliar a RCA conforme a rubrica C1-C4, o gabarito e a regra de
        decisão definidos no rubricPrompt.
      threshold: 0.75
      metric: avaliacao_juiz_llm
tests:
  - vars:
      cluster_config_yaml: | 
        cerebro:
          shards: 12
          replicas_per_shard: 1
          jvm_heap: 8g
          refresh_interval: 1s
          reindex_job:
            schedule: "0 2 * * *"     # roda todo dia às 02:00
            avg_duration_min: 90      # normalmente termina ~03:30
          query_cache:
            enabled: true
            size_mb: 512
      metrics_table: | 
        timestamp              search_p99_ms   indexed_docs_per_s   heap_used_pct   cache_hit_pct
