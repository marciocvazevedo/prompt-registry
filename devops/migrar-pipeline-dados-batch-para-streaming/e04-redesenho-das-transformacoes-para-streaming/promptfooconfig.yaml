        ## X. Ponto de não-retorno

        **Ponto de não-retorno:** Após o passo 9 (deploy em Kubernetes), o Forge começa a consumir do Relay em produção.

        **Por quê:** Uma vez que o job de streaming está rodando e consumindo offsets, voltar atrás requer:
        1. Parar o job de streaming
        2. Resetar offsets do consumer group (perder progresso)
        3. Reprocessar eventos (latência adicional)
        4. Validar equivalência novamente

        **Mitigação:** Antes do passo 9, executar validação completa em staging (passo 11).

        ---

        ## Y. Rollback

        **Procedimento de rollback (se necessário após passo 9):**

        ```bash
        #!/bin/bash
        # Script de rollback: voltar para batch

        set -e

        echo "=== Rollback: Forge Streaming → Batch ==="

        # 1. Parar job de streaming
        echo "1. Parando job de streaming..."
        kubectl delete deployment forge-streaming-ingest -n forge

        # 2. Resetar consumer group (opcional, para reprocessamento)
        echo "2. Resetando consumer group (opcional)..."
        kafka-consumer-groups --bootstrap-server <relay-broker> \
          --group forge-streaming-v1 \
          --reset-offsets \
          --to-earliest \
          --execute

        # 3. Ativar job de batch (se ainda não estiver rodando)
        echo "3. Ativando job de batch..."
        # [SUPOSIÇÃO] job de batch é ativado via Airflow/cron
        airflow dags trigger forge-batch-ingest

        # 4. Validar que batch está processando
        echo "4. Validando que batch está processando..."
        sleep 60
        kafka-consumer-groups --bootstrap-server <relay-broker> \
          --group forge-batch-ingest \
          --describe

        # 5. Confirmar que dados estão chegando no DW
        echo "5. Confirmando que dados estão chegando no DW..."
        # [SUPOSIÇÃO] query no DW para confirmar dados recentes
        # SELECT COUNT(*) FROM forge_events_aggregated WHERE hour >= CURRENT_TIMESTAMP() - INTERVAL '1 hour'

        echo "=== Rollback concluído ==="
        ```

        **Verificação de rollback:**

        ```bash
        # Confirmar que job de streaming foi parado
        kubectl get deployment forge-streaming-ingest -n forge

        # Esperado: deployment não existe

        # Confirmar que job de batch está rodando
        airflow dags list | grep forge-batch-ingest

        # Esperado: forge-batch-ingest está listado
        ```

