        ## 3. Implemente procedimento de replay a partir de offset ou instante

        **Ação:** Criar job de replay que permite reprocessar eventos a partir de um offset ou timestamp específico.

        **Onde:** Arquivo `forge/jobs/replay_events.py` (novo) no repositório do Forge.

        **Procedimento:**

        ```python
        #!/usr/bin/env python3
        """
        Job de Replay
        Reprocessa eventos a partir de um offset ou timestamp específico.
        Suporta replay por tenant, por tópico, por janela.
        """
        from pyspark.sql import SparkSession
        from pyspark.sql.functions import (
            col, from_json, to_timestamp, window, current_timestamp, lit
        )
        from pyspark.sql.types import StructType, StructField, StringType, LongType, DoubleType, MapType
        import logging
        from datetime import datetime, timedelta
        import argparse

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        # Configuração
        RELAY_BROKER = "<relay-broker>"
        RELAY_TOPIC = "forge-events-raw"
        CONSUMER_GROUP_REPLAY = "forge-replay-v1"

        # Schema do evento
        EVENT_SCHEMA = StructType([
            StructField("event_id", StringType(), False),
            StructField("tenant_id", StringType(), False),
            StructField("timestamp", LongType(), False),
            StructField("service_id", StringType(), False),
            StructField("metric_name", StringType(), False),
            StructField("metric_value", DoubleType(), False),
            StructField("tags", MapType(StringType(), StringType()), True),
        ])

        class ReplayJob:
            """Job de replay de eventos"""
            
            def __init__(self, spark):
                self.spark = spark
                self.logger = logger
            
            def replay_from_offset(self, partition, offset, tenant_id=None, duration_minutes=60):
                """
                Replay a partir de um offset específico.
                
                Args:
                    partition: Partição do Relay (0-31)
                    offset: Offset inicial
                    tenant_id: Filtrar por tenant (opcional)
                    duration_minutes: Duração do replay em minutos
                """
                self.logger.info(f"Replay: partition={partition}, offset={offset}, tenant_id={tenant_id}, duration={duration_minutes}min")
                
                # Ler do Relay a partir do offset
                df = self.spark.readStream \
                    .format("kafka") \
                    .option("kafka.bootstrap.servers", RELAY_BROKER) \
                    .option("subscribe", RELAY_TOPIC) \
                    .option("kafka.group.id", CONSUMER_GROUP_REPLAY) \
                    .option("startingOffsets", f'{{"forge-events-raw":{{{partition}:{offset}}}}}') \
                    .load()
                
                # Desserializar
                df_parsed = df.select(
                    col("key").cast(StringType()).alias("partition_key"),
                    from_json(col("value").cast(StringType()), EVENT_SCHEMA).alias("event"),
                    col("timestamp").alias("kafka_timestamp")
                ).select(
                    col("partition_key"),
                    col("event.*"),
                    col("kafka_timestamp")
                )
                
                # Filtrar por tenant (se especificado)
                if tenant_id:
                    df_parsed = df_parsed.filter(col("tenant_id") == tenant_id)
                
                # Adicionar metadados de replay
                df_with_metadata = df_parsed.withColumn("replay_timestamp", current_timestamp()) \
                    .withColumn("replay_partition", lit(partition)) \
                    .withColumn("replay_offset", lit(offset))
                
                # Escrever no DW
                query = df_with_metadata.writeStream \
                    .format("parquet") \
                    .option("path", "/data/forge/aggregated_replay") \
                    .option("checkpointLocation", f"/data/forge/checkpoint/replay_{partition}_{offset}") \
                    .outputMode("append") \
                    .trigger(processingTime="30 seconds") \
                    .start()
                
                # Aguardar duração especificada
                query.awaitTermination(timeout=duration_minutes * 60 * 1000)
                query.stop()
                
                self.logger.info(f"Replay concluído: {query.lastProgress['numInputRows']} eventos processados")
            
            def replay_from_timestamp(self, start_timestamp, end_timestamp=None, tenant_id=None):
                """
                Replay a partir de um timestamp específico.
                
                Args:
                    start_timestamp: Timestamp inicial (ISO 8601, ex: "2024-01-15T10:00:00Z")
                    end_timestamp: Timestamp final (opcional, padrão: agora)
                    tenant_id: Filtrar por tenant (opcional)
                """
                self.logger.info(f"Replay: start={start_timestamp}, end={end_timestamp}, tenant_id={tenant_id}")
                
                # Converter timestamps
                start_ts = int(datetime.fromisoformat(start_timestamp.replace("Z", "+00:00")).timestamp() * 1000)
                if end_timestamp:
                    end_ts = int(datetime.fromisoformat(end_timestamp.replace("Z", "+00:00")).timestamp() * 1000)
                else:
                    end_ts = int(datetime.utcnow().timestamp() * 1000)
                
                # Ler do Relay (usar offsets baseados em timestamp)
                # [SUPOSIÇÃO] Relay suporta busca por timestamp
                df = self.spark.readStream \
                    .format("kafka") \
                    .option("kafka.bootstrap.servers", RELAY_BROKER) \
                    .option("subscribe", RELAY_TOPIC) \
                    .option("kafka.group.id", CONSUMER_GROUP_REPLAY) \
                    .option("startingOffsets", "earliest") \
                    .load()
                
                # Desserializar
                df_parsed = df.select(
                    col("key").cast(StringType()).alias("partition_key"),
                    from_json(col("value").cast(StringType()), EVENT_SCHEMA).alias("event"),
                    col("timestamp").alias("kafka_timestamp")
                ).select(
                    col("partition_key"),
                    col("event.*"),
                    col("kafka_timestamp")
                )
                
                # Filtrar por timestamp
                df_filtered = df_parsed.filter(
                    (col("timestamp") >= start_ts) & (col("timestamp") <= end_ts)
                )
                
                # Filtrar por tenant (se especificado)
                if tenant_id:
                    df_filtered = df_filtered.filter(col("tenant_id") == tenant_id)
                
                # Adicionar metadados de replay
                df_with_metadata = df_filtered.withColumn("replay_timestamp", current_timestamp()) \
                    .withColumn("replay_start_ts", lit(start_ts)) \
                    .withColumn("replay_end_ts", lit(end_ts))
                
                # Escrever no DW
                query = df_with_metadata.writeStream \
                    .format("parquet") \
                    .option("path", "/data/forge/aggregated_replay") \
                    .option("checkpointLocation", f"/data/forge/checkpoint/replay_{start_ts}_{end_ts}") \
                    .outputMode("append") \
                    .trigger(processingTime="30 seconds") \
                    .start()
                
                query.awaitTermination()
                query.stop()
                
                self.logger.info(f"Replay concluído: {query.lastProgress['numInputRows']} eventos processados")
            
            def replay_dlq(self, dlq_topic, limit=None):
                """
                Replay de eventos da DLQ.
                
                Args:
                    dlq_topic: Tópico DLQ (ex: "forge-events-invalid")
                    limit: Limite de eventos a reprocessar (opcional)
                """
                self.logger.info(f"Replay DLQ: topic={dlq_topic}, limit={limit}")
                
                # Ler da DLQ
                df = self.spark.readStream \
                    .format("kafka") \
                    .option("kafka.bootstrap.servers", RELAY_BROKER) \
                    .option("subscribe", dlq_topic) \
                    .option("kafka.group.id", f"{CONSUMER_GROUP_REPLAY}-dlq") \
                    .option("startingOffsets", "earliest") \
                    .load()
                
                # Desserializar
                df_parsed = df.select(
                    col("key").cast(StringType()).alias("partition_key"),
                    from_json(col("value").cast(StringType()), EVENT_SCHEMA).alias("event"),
                    col("timestamp").alias("kafka_timestamp")
                ).select(
                    col("partition_key"),
                    col("event.*"),
                    col("kafka_timestamp")
                )
                
                # Limitar (se especificado)
                if limit:
                    df_parsed = df_parsed.limit(limit)
                
                # Adicionar metadados de replay
                df_with_metadata = df_parsed.withColumn("replay_timestamp", current_timestamp()) \
                    .withColumn("replay_from_dlq", lit(dlq_topic))
                
                # Escrever no DW
                query = df_with_metadata.writeStream \
                    .format("parquet") \
                    .option("path", "/data/forge/aggregated_replay") \
                    .option("checkpointLocation", f"/data/forge/checkpoint/replay_dlq_{dlq_topic}") \
                    .outputMode("append") \
                    .trigger(processingTime="30 seconds") \
                    .start()
                
                query.awaitTermination()
                query.stop()
                
                self.logger.info(f"Replay DLQ concluído: {query.lastProgress['numInputRows']} eventos processados")

        def main():
            """Função principal"""
            parser = argparse.ArgumentParser(description="Replay de eventos do Forge")
            parser.add_argument("--mode", choices=["offset", "timestamp", "dlq"], required=True,
                              help="Modo de replay")
            parser.add_argument("--partition", type=int, help="Partição (para modo offset)")
            parser.add_argument("--offset", type=int, help="Offset (para modo offset)")
            parser.add_argument("--start-timestamp", help="Timestamp inicial (para modo timestamp, ISO 8601)")
            parser.add_argument("--end-timestamp", help="Timestamp final (para modo timestamp, ISO 8601)")
            parser.add_argument("--dlq-topic", help="Tópico DLQ (para modo dlq)")
            parser.add_argument("--tenant-id", help="Filtrar por tenant (opcional)")
            parser.add_argument("--duration-minutes", type=int, default=60, help="Duração do replay em minutos")
            parser.add_argument("--limit", type=int, help="Limite de eventos (para modo dlq)")
            
            args = parser.parse_args()
            
            spark = SparkSession.builder \
                .appName("forge-replay") \
                .getOrCreate()
            
            replay = ReplayJob(spark)
            
            if args.mode == "offset":
                replay.replay_from_offset(args.partition, args.offset, args.tenant_id, args.duration_minutes)
            elif args.mode == "timestamp":
                replay.replay_from_timestamp(args.start_timestamp, args.end_timestamp, args.tenant_id)
            elif args.mode == "dlq":
                replay.replay_dlq(args.dlq_topic, args.limit)

        if __name__ == "__main__":
            main()
        ```

