        ## Z. Critérios de conclusão

        - [ ] **Relay:** Tópico/fila de entrada identificado; schema documentado; amostra de 100+ eventos coletada.
        - [ ] **Volume:** Taxa média (evt/s), taxa pico (evt/s), tamanho médio (bytes), throughput (MB/s) documentados.
        - [ ] **Transformações:** 14 etapas mapeadas com entrada, saída, tipo (sem estado/agregação/junção) e tempo de execução.
        - [ ] **DW:** ≥3 tabelas inventariadas com schema, particionamento, tamanho (GB), linhas, taxa de crescimento (GB/dia).
        - [ ] **Consumidores:** ≥3 consumidores mapeados (Sentinel, Cerebro, Pepper) com frequência de leitura e SLA de latência.
        - [ ] **Latência:** Latência fim a fim (p50, p95) medida em minutos; baseline documentado.
        - [ ] **Falhas:** Taxa de falha (%), MTBF, causa raiz e impacto de catch-up documentados.
        - [ ] **Custo:** Custo mensal total (USD) e custo por evento documentados.
        - [ ] **Dashboard:** Dashboard de baseline criado e acessível.
        - [ ] **Suposições:** Todas as suposições marcadas com `[SUPOSIÇÃO]` e justificadas.
        - [ ] **Dados faltantes:** Lista de dados que faltam para confirmar/derrubar escolhas futuras.

