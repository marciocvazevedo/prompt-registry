        ## 4. Implemente procedimento de backfill histórico

        **Ação:** Criar job de backfill que reprocessa dados históricos sem duplicar com fluxo ao vivo.

        **Onde:** Arquivo `forge/jobs/backfill_historical.py` (novo) no repositório do Forge.

        **Procedimento:**

        ```python
        #!/usr/bin/env python3
        """
        Job de Backfill Histórico
        Reprocessa dados históricos sem duplicar com fluxo ao vivo.
        Usa tabela de staging para evitar conflitos.
        """
        from pyspark.sql import SparkSession
        from pyspark.sql.functions import (
            col, from_json, to_timestamp, window, current_timestamp, lit, row_number
        )
        from pyspark.sql.window import Window
        from pyspark.sql.types import StructType, StructField, StringType, LongType, DoubleType, MapType
        import logging
        from datetime import datetime, timedelta
        import argparse

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        # Configuração
        RELAY_BROKER = "<relay-broker>"
        RELAY_TOPIC = "forge-events-raw"
        CONSUMER_GROUP_BACKFILL = "forge-backfill-v1"

        # Schema do evento
        EVENT_SCHEMA = StructType([
            StructField("event_id", StringType(), False),
            StructField("tenant_id", StringType(), False),
            StructField("timestamp", LongType(), False),
            StructField("service_id", StringType(), False),
            StructField("metric_name", StringType(), False),
            StructField("metric_value", DoubleType(), False),
            StructField("tags", MapType(StringType(), StringType()), True),
        ])

        class BackfillJob:
            """Job de backfill histórico"""
            
            def __init__(self, spark):
                self.spark = spark
                self.logger = logger
            
            def backfill_date_range(self, start_date, end_date, table_name="aggregated"):
                """
                Backfill de um intervalo de datas.
                
                Args:
                    start_date: Data inicial (YYYY-MM-DD)
                    end_date: Data final (YYYY-MM-DD)
                    table_name: Nome da tabela para backfill
                """
                self.logger.info(f"Backfill: start_date={start_date}, end_date={end_date}, table={table_name}")
                
                # Converter datas para timestamps
                start_ts = int(datetime.strptime(start_date, "%Y-%m-%d").timestamp() * 1000)
                end_ts = int(datetime.strptime(end_date, "%Y-%m-%d").timestamp() * 1000) + 86400000  # +1 dia
                
                # Ler do Relay
                df = self.spark.readStream \
                    .format("kafka") \
                    .option("kafka.bootstrap.servers", RELAY_BROKER) \
                    .option("subscribe", RELAY_TOPIC) \
                    .option("kafka.group.id", CONSUMER_GROUP_BACKFILL) \
                    .option("startingOffsets", "earliest") \
                    .load()
                
                # Desserializar
                df_parsed = df.select(
                    col("key").cast(StringType()).alias("partition_key"),
                    from_json(col("value").cast(StringType()), EVENT_SCHEMA).alias("event"),
                    col("timestamp").alias("kafka_timestamp")
                ).select(
                    col("partition_key"),
                    col("event.*"),
                    col("kafka_timestamp")
                )
                
                # Filtrar por intervalo de datas
                df_filtered = df_parsed.filter(
                    (col("timestamp") >= start_ts) & (col("timestamp") < end_ts)
                )
                
                # Agregar
                df_aggregated = df_filtered.groupBy(
                    window(col("timestamp"), "30 seconds"),
                    col("tenant_id"),
                    col("service_id")
                ).agg(
                    col("window.start").alias("window_start"),
                    col("window.end").alias("window_end"),
                    col("tenant_id"),
                    col("service_id"),
                    count("*").alias("event_count"),
                    sum("metric_value").alias("total_value")
                )
                
                # Adicionar metadados de backfill
                df_with_metadata = df_aggregated.withColumn("backfill_timestamp", current_timestamp()) \
                    .withColumn("backfill_start_date", lit(start_date)) \
                    .withColumn("backfill_end_date", lit(end_date))
                
                # Escrever em tabela de staging
                staging_table = f"{table_name}_backfill_staging"
                df_with_metadata.write.mode("append") \
                    .parquet(f"/data/forge/{staging_table}")
                
                self.logger.info(f"Backfill escrito em staging: {staging_table}")
                
                # Merge com tabela principal (após validação)
                self.merge_backfill_to_main(staging_table, table_name)
            
            def merge_backfill_to_main(self, staging_table, main_table):
                """
                Merge de backfill com tabela principal.
                Deduplicar por chave natural e manter última linha.
                
                Args:
                    staging_table: Tabela de staging
                    main_table: Tabela principal
                """
                self.logger.info(f"Merge: {staging_table} → {main_table}")
                
                # Ler staging
                df_staging = self.spark.read.parquet(f"/data/forge/{staging_table}")
                
                # Ler principal
                try:
                    df_main = self.spark.read.parquet(f"/data/forge/{main_table}")
                except:
                    # Se principal não existe, criar
                    df_main = self.spark.createDataFrame([], df_staging.schema)
                
                # Union
                df_merged = df_main.union(df_staging)
                
                # Deduplicar por chave natural (manter última linha)
                key_cols = ["window_start", "window_end", "tenant_id", "service_id"]
                window_spec = Window.partitionBy(*key_cols).orderBy(col("backfill_timestamp").desc())
                df_with_rn = df_merged.withColumn("rn", row_number().over(window_spec))
                df_final = df_with_rn.filter(col("rn") == 1).drop("rn")
                
                # Escrever principal
                df_final.write.mode("overwrite") \
                    .parquet(f"/data/forge/{main_table}")
                
                # Limpar staging
                self.spark.sql(f"DELETE FROM parquet.`/data/forge/{staging_table}`")
                
                self.logger.info(f"Merge concluído: {df_final.count()} linhas em {main_table}")
            
            def validate_backfill(self, start_date, end_date, table_name="aggregated"):
                """
                Validar backfill comparando com batch.
                
                Args:
                    start_date: Data inicial (YYYY-MM-DD)
                    end_date: Data final (YYYY-MM-DD)
                    table_name: Nome da tabela
                """
                self.logger.info(f"Validando backfill: {start_date} a {end_date}")
                
                # Ler dados de backfill
                df_backfill = self.spark.read.parquet(f"/data/forge/{table_name}_backfill_staging")
                df_backfill_filtered = df_backfill.filter(
                    (col("backfill_start_date") == start_date) & (col("backfill_end_date") == end_date)
                )
                
                # Ler dados de batch (se existir)
                try:
                    df_batch = self.spark.read.parquet(f"/data/forge/{table_name}_batch")
                    df_batch_filtered = df_batch.filter(
                        (col("window_start") >= start_date) & (col("window_start") < end_date)
                    )
                except:
                    self.logger.warning("Dados de batch não encontrados, pulando validação")
                    return True
                
                # Comparar contagem
                count_backfill = df_backfill_filtered.count()
                count_batch = df_batch_filtered.count()
                
                if count_backfill != count_batch:
                    self.logger.error(f"Contagem diferente: backfill={count_backfill}, batch={count_batch}")
                    return False
                
                # Comparar valores
                df_diff = df_backfill_filtered.exceptAll(df_batch_filtered)
                if df_diff.count() > 0:
                    self.logger.error(f"Dados diferentes: {df_diff.count()} linhas")
                    return False
                
                self.logger.info("✅ Validação passou")
                return True

        def main():
            """Função principal"""
            parser = argparse.ArgumentParser(description="Backfill histórico do Forge")
            parser.add_argument("--start-date", required=True, help="Data inicial (YYYY-MM-DD)")
            parser.add_argument("--end-date", required=True, help="Data final (YYYY-MM-DD)")
            parser.add_argument("--table", default="aggregated", help="Tabela para backfill")
            parser.add_argument("--validate", action="store_true", help="Validar backfill")
            
            args = parser.parse_args()
            
            spark = SparkSession.builder \
                .appName("forge-backfill") \
                .getOrCreate()
            
            backfill = BackfillJob(spark)
            
            # Executar backfill
            backfill.backfill_date_range(args.start_date, args.end_date, args.table)
            
            # Validar (se especificado)
            if args.validate:
                backfill.validate_backfill(args.start_date, args.end_date, args.table)

        if __name__ == "__main__":
            main()
        ```

        **Exemplos de Uso:**

        ```bash
        # Backfill de 7 dias
        spark-submit \
        --master local[4] \
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.3.0 \
        forge/jobs/backfill_historical.py \
        --start-date "2024-01-08" \
        --end-date "2024-01-15" \
        --table aggregated \
        --validate

        # Backfill com validação
        spark-submit \
        --master local[4] \
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.3.0 \
        forge/jobs/backfill_historical.py \
        --start-date "2024-01-01" \
        --end-date "2024-01-08" \
        --table aggregated \
        --validate
