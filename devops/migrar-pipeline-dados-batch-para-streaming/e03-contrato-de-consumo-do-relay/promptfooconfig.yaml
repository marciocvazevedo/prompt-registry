        Disponibilidade: 99.0% (uptime)
        Completude: 99.5% (sem perda de dados)
        ```

        #### SLA Herdado (Streaming)
        ```
        Latência: Dados disponíveis a cada 30 s (SLA de 2 min p95)
        Disponibilidade: 99.5% (uptime) — AUMENTADO
        Completude: 99.9% (sem perda de dados) — AUMENTADO
        ```

        #### Impacto se SLA for quebrado
        - Dashboards ficam desatualizados.
        - Alertas não disparam no tempo correto.
        - Clientes não conseguem monitorar aplicações em tempo real.
        - **Severidade:** CRÍTICA

        #### Validação necessária
        - [ ] Sentinel consegue processar dados a cada 30 s?
        - [ ] Alertas disparam corretamente com latência de 2 min?
        - [ ] Dashboard não fica sobrecarregado com atualizações frequentes?

        ---

        ### 2. Cerebro (Indexação de Logs)

        #### SLA Atual (Batch)
        ```
        Latência: Índice atualizado a cada 60 min
        Disponibilidade: 99.0% (uptime)
        Completude: 99.5% (sem perda de eventos)
        ```

        #### SLA Herdado (Streaming)
        ```
        Latência: Índice atualizado a cada 30 s (SLA de 2 min p95)
        Disponibilidade: 99.5% (uptime) — AUMENTADO
        Completude: 99.9% (sem perda de eventos) — AUMENTADO
        ```

        #### Impacto se SLA for quebrado
        - Logs não aparecem em buscas em tempo real.
        - Investigação de incidentes fica mais lenta.
        - Clientes não conseguem debugar problemas rapidamente.
        - **Severidade:** ALTA

        #### Validação necessária
        - [ ] Cerebro consegue ingerir dados a cada 30 s?
        - [ ] Índice não fica fragmentado com atualizações frequentes?
        - [ ] Queries de busca não ficam mais lentas?

        ---

        ### 3. Pepper (Billing)

        #### SLA Atual (Batch)
        ```
        Latência: Relatório roda 1× por dia (02:00 UTC)
        Disponibilidade: 99.9% (uptime)
        Completude: 99.9% (sem perda de eventos = sem perda de receita)
        Precisão: 100% (sem duplicatas, sem undercharging/overcharging)
        ```

        #### SLA Herdado (Streaming)
        ```
        Latência: Relatório roda 1× por dia (02:00 UTC) — SEM MUDANÇA
        Disponibilidade: 99.9% (uptime) — MANTIDO
        Completude: 99.9% (sem perda de eventos) — MANTIDO
        Precisão: 100% (sem duplicatas, sem undercharging/overcharging) — CRÍTICO
        ```

        #### Impacto se SLA for quebrado
        - Clientes são faturados incorretamente (overcharging) ou não faturados (undercharging).
        - Perda de receita ou disputa com clientes.
        - Conformidade regulatória em risco.
        - **Severidade:** CRÍTICA

        #### Validação necessária
