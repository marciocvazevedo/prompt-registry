        ## Decisões de Implementação

        ### Etapas que permanecem em streaming (9 etapas):
        1, 3, 4, 5, 10, 11, 13, 14 + Etapa 2, 6, 9 com cache atualizado 1× por dia

        ### Etapas que permanecem em batch (2 etapas):
        7 (Detecção de Anomalia), 8 (SLA Violations), 12 (Detecção de Mudança)

        **Justificativa:** Etapas 7, 8, 12 requerem estado histórico grande (24h–7 dias) que não é viável em streaming com latência de 30 s. Essas etapas serão executadas em batch 1× por hora (ou 1× por dia) e seus resultados serão consumidos por Sentinel/Cerebro.

