        ## 9. Crie testes de equivalência (streaming vs batch)

        **Ação:** Implemente testes que comparam saída de streaming com saída de batch.

        **Onde:** Arquivo `forge/tests/test_equivalence.py` (novo) no repositório do Forge.

        **Procedimento:**

        ```python
        #!/usr/bin/env python3
        """
        Testes de Equivalência: Streaming vs Batch
        Valida que streaming produz mesmos resultados que batch.
        """

        import pytest
        from pyspark.sql import SparkSession
        from pyspark.sql.functions import col, count, sum as spark_sum, avg
        from datetime import datetime, timedelta
        import logging

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        @pytest.fixture(scope="session")
        def spark():
            """Cria sessão Spark para testes"""
            return SparkSession.builder \
                .appName("forge-equivalence-tests") \
                .master("local[4]") \
                .getOrCreate()

        class TestEquivalence:
            """Testes de equivalência entre streaming e batch"""
            
            def test_parsing_equivalence(self, spark):
                """Teste: Parsing (Etapa 1) produz mesmos resultados"""
                logger.info("Teste: Parsing Equivalence")
                
                # Dados de entrada
                input_data = [
                    {"event_id": "evt-1", "tenant_id": "t1", "timestamp": 1000, "service_id": "s1", "metric_name": "http.requests", "metric_value": 42},
                    {"event_id": "evt-2", "tenant_id": "t1", "timestamp": 2000, "service_id": "s1", "metric_name": "http.requests", "metric_value": 50},
                    {"event_id": None, "tenant_id": "t1", "timestamp": 3000, "service_id": "s1", "metric_name": "http.requests", "metric_value": 60},
                ]
                
                df_input = spark.createDataFrame(input_data)
                
                # Executar parsing
                df_output = df_input.filter(col("event_id").isNotNull())
                
                # Validar
                assert df_output.count() == 2, "Deve filtrar eventos inválidos"
                assert df_output.filter(col("event_id").isNull()).count() == 0
                logger.info("✅ Teste de parsing passou")
            
            def test_aggregation_equivalence(self, spark):
                """Teste: Agregação (Etapa 4) produz mesmos resultados"""
                logger.info("Teste: Aggregation Equivalence")
                
                # Dados de entrada
                input_data = [
                    {"event_id": "evt-1", "tenant_id": "t1", "service_id": "s1", "timestamp": 1000, "metric_value": 10},
                    {"event_id": "evt-2", "tenant_id": "t1", "service_id": "s1", "timestamp": 2000, "metric_value": 20},
                    {"event_id": "evt-3", "tenant_id": "t1", "service_id": "s2", "timestamp": 3000, "metric_value": 30},
                ]
                
                df_input = spark.createDataFrame(input_data)
                
                # Agregar
                df_output = df_input.groupBy("tenant_id", "service_id").agg(
                    spark_sum("metric_value").alias("total_value"),
                    count("*").alias("event_count"),
                    avg("metric_value").alias("avg_value")
                )
                
                # Validar
                assert df_output.count() == 2, "Deve ter 2 agregações"
                s1_agg = df_output.filter(col("service_id") == "s1").collect()[0]
                assert s1_agg["total_value"] == 30, "SUM deve ser 30"
                assert s1_agg["event_count"] == 2, "COUNT deve ser 2"
                assert s1_agg["avg_value"] == 15, "AVG deve ser 15"
                logger.info("✅ Teste de agregação passou")
            
            def test_deduplication_equivalence(self, spark):
                """Teste: Deduplicação remove duplicatas"""
                logger.info("Teste: Deduplication Equivalence")
                
                # Dados de entrada (com duplicatas)
                input_data = [
                    {"event_id": "evt-1", "tenant_id": "t1", "metric_value": 10},
                    {"event_id": "evt-1", "tenant_id": "t1", "metric_value": 10},  # Duplicata
                    {"event_id": "evt-2", "tenant_id": "t1", "metric_value": 20},
                ]
                
                df_input = spark.createDataFrame(input_data)
                
                # Deduplicar
                df_output = df_input.dropDuplicates(["event_id"])
                
                # Validar
                assert df_output.count() == 2, "Deve remover duplicatas"
                logger.info("✅ Teste de deduplicação passou")
            
            def test_completeness_equivalence(self, spark):
                """Teste: Completude (nenhum evento é perdido)"""
                logger.info("Teste: Completeness Equivalence")
                
                # Dados de entrada
                input_data = [
                    {"event_id": f"evt-{i}", "tenant_id": "t1", "metric_value": i}
                    for i in range(1000)
                ]
                
                df_input = spark.createDataFrame(input_data)
                
                # Processar
                df_output = df_input.filter(col("event_id").isNotNull())
                
                # Validar
                input_count = df_input.count()
                output_count = df_output.count()
                completeness = (output_count / input_count) * 100
                
                assert completeness >= 99.9, f"Completude {completeness}% abaixo do SLO"
                logger.info(f"✅ Teste de completude passou: {completeness}%")
            
            def test_idempotency_equivalence(self, spark):
                """Teste: Idempotência (executar 2× produz mesmo resultado)"""
                logger.info("Teste: Idempotency Equivalence")
                
                # Dados de entrada
                input_data = [
                    {"event_id": f"evt-{i}", "tenant_id": "t1", "metric_value": i}
                    for i in range(100)
                ]
                
                df_input = spark.createDataFrame(input_data)
                
                # Executar 1×
                df_output_1 = df_input.filter(col("event_id").isNotNull())
                
                # Executar 2×
                df_output_2 = df_input.filter(col("event_id").isNotNull())
                
                # Validar
                assert df_output_1.count() == df_output_2.count(), "Row count mismatch"
                assert df_output_1.exceptAll(df_output_2).count() == 0, "Data mismatch"
                logger.info("✅ Teste de idempotência passou")

        if __name__ == "__main__":
            pytest.main([__file__, "-v"])
        ```

