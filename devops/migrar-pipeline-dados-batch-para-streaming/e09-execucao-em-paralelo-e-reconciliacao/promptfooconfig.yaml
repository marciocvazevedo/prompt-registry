        ## Apêndice: Exemplo de Métrica Prometheus

        ```python
        # Exemplo de como emitir métrica para Prometheus
        from prometheus_client import Counter, Histogram, Gauge, CollectorRegistry, push_to_gateway

        # Criar registry
        registry = CollectorRegistry()

        # Criar métricas
        latency_e2e = Histogram(
            'forge_latency_e2e_seconds',
            'Latência de ponta a ponta (segundos)',
            buckets=(0.1, 1, 10, 30, 60, 120, 300),
            registry=registry
        )

        consumer_lag = Gauge(
            'forge_consumer_lag_events',
            'Consumer lag (eventos)',
            registry=registry
        )

        errors_total = Counter(
            'forge_errors_total',
            'Total de erros',
            ['error_type'],
            registry=registry
        )

        # Usar métricas
        latency_e2e.observe(45.5)  # Registrar latência de 45.5 s
        consumer_lag.set(50000)  # Definir lag para 50k eventos
        errors_total.labels(error_type='INVALID_EVENT').inc()  # Incrementar contador

        # Enviar para Prometheus Pushgateway
        push_to_gateway(
            'prometheus-pushgateway:9091',
            job='forge-streaming',
            registry=registry
        )
        ```
