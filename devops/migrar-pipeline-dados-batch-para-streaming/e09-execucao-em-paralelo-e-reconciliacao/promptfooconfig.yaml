        ## 2. Defina política de particionamento por hora com janelas abertas

        **Ação:** Defina como manter partições coerentes enquanto a hora está aberta e quando declarar "fechada".

        **Onde:** Arquivo `forge/config/partitioning-strategy.md` (novo) no repositório do Forge.

        **Procedimento:**

        ```markdown
        # Estratégia de Particionamento — Janelas Abertas e Fechadas

        ## Problema
        No batch (60 min), a partição da hora é fechada quando o lote termina.
        Em streaming (30 s), a hora está aberta por 60 min, e eventos atrasados podem chegar até 105 s após o fim da janela.

        **Exemplo:**
        ```
        Hora 10:00–11:00
        - 10:00:00: Janela abre
        - 10:30:00: Primeira escrita (eventos 10:00–10:30)
        - 11:00:00: Janela fecha (watermark = 11:00:45)
        - 11:01:45: Último evento atrasado chega (watermark = 11:01:45)
        - 11:02:00: Partição é declarada "fechada"
        ```

        ## Estratégia: Particionamento por Hora + Marcador de Fechamento

        ### Estrutura de Partição
        ```
        /data/forge/aggregated/
        ├── hour=2024-01-15-10/
        │   ├── part-00000.parquet
        │   ├── part-00001.parquet
        │   └── _CLOSED  # Marcador de fechamento
        ├── hour=2024-01-15-11/
        │   ├── part-00000.parquet
        │   └── (ainda aberta, sem _CLOSED)
        ```

        ### Definição de "Fechada"
        Uma partição é declarada **fechada** quando:
        1. Watermark passou do fim da hora + allowed lateness
        2. Nenhum novo evento pode chegar para essa hora
        3. Arquivo marcador `_CLOSED` é criado

        **Cálculo:**
        ```
        Hora: 10:00–11:00
        Watermark: 11:00:45 (45 s após fim da hora)
        Allowed lateness: 60 s
        Fechamento: 11:01:45 (watermark + allowed lateness)
        Marcador: Criar _CLOSED em 11:02:00
        ```

        ### Implementação em Spark Structured Streaming

        ```python
        def close_partition_if_ready(df, batch_id, hour_col="window_start"):
            """Verificar se partição deve ser fechada"""
            from datetime import datetime, timedelta
            import os
            
            # Obter hora mínima no batch
            min_hour = df.agg({hour_col: "min"}).collect()[0][0]
            
            if min_hour is None:
                return
            
            # Calcular tempo de fechamento
            hour_end = min_hour + timedelta(hours=1)
            watermark_time = hour_end + timedelta(seconds=45)
            close_time = watermark_time + timedelta(seconds=60)
            
            # Verificar se agora > close_time
            now = datetime.utcnow()
            if now > close_time:
                # Criar marcador de fechamento
                hour_str = min_hour.strftime("%Y-%m-%d-%H")
                marker_path = f"/data/forge/aggregated/hour={hour_str}/_CLOSED"
                
                # Criar arquivo vazio
                os.makedirs(os.path.dirname(marker_path), exist_ok=True)
                with open(marker_path, "w") as f:
                    f.write(f"Closed at {now.isoformat()}\n")
                
                print(f"Partição {hour_str} fechada")

        # Usar em writeStream
        query = df_aggregated.writeStream \
            .foreachBatch(lambda df, batch_id: close_partition_if_ready(df, batch_id)) \
            .outputMode("update") \
            .trigger(processingTime="30 seconds") \
            .start()
        ```

        ### Alternativa: Usar Tabela de Metadados

        Se o sistema de arquivos não suporta marcadores, usar tabela de metadados:

        ```python
        # Tabela de metadados: /data/forge/partition_metadata
        # Schema: hour (string), status (string: "open" | "closed"), closed_at (timestamp)

        def update_partition_status(spark, hour_str, status):
            """Atualizar status de partição"""
            spark.sql(f"""
            INSERT INTO parquet.`/data/forge/partition_metadata`
            VALUES ('{hour_str}', '{status}', current_timestamp())
            """)

        # Verificar se partição está fechada
        def is_partition_closed(spark, hour_str):
            result = spark.sql(f"""
            SELECT status FROM parquet.`/data/forge/partition_metadata`
            WHERE hour = '{hour_str}' AND status = 'closed'
            LIMIT 1
            """).collect()
            return len(result) > 0
        ```

        ---

        ## Implicações para Consumidores

        ### Sentinel (Dashboards)
        - Queries devem verificar se partição está fechada antes de usar dados
        - Dados de partição aberta podem ser atualizados retroativamente
        - Usar `WHERE hour < current_hour()` para dados finais

        **Query segura:**
        ```sql
        SELECT tenant_id, service_id, SUM(total_value) as total
        FROM aggregated
        WHERE hour < date_trunc('hour', current_timestamp())  -- Apenas partições fechadas
        GROUP BY tenant_id, service_id
        ```

        ### Cerebro (Indexação)
        - Índice pode ter duplicatas de eventos em reprocessamento
        - Indexador deve deduplicar por `event_id`
        - Usar `_CLOSED` para saber quando índice está completo

        ### Pepper (Billing)
        - Relatório roda 1× por dia (02:00 UTC)
        - Nesse horário, todas as partições de dias anteriores estão fechadas
        - Usar `WHERE day < current_date()` para dados finais

        ---

        ## Validação

        - [ ] Partições são criadas por hora
        - [ ] Marcador `_CLOSED` é criado após allowed lateness
        - [ ] Consumidores conseguem verificar se partição está fechada
        - [ ] Dados de partição aberta podem ser atualizados
        - [ ] Dados de partição fechada são imutáveis

        ```

