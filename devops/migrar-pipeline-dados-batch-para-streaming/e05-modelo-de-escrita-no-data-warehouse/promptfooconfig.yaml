        ## 3. Defina estado, tamanho estimado e política de expiração

        **Ação:** Para cada etapa com lookup ou histórico, defina onde fica o estado, tamanho e expiração.

        **Onde:** Arquivo `forge/config/state-management.md` (novo) no repositório do Forge.

        **Procedimento:**

        ```markdown
        # Gerenciamento de Estado — Forge Streaming

        ## Definições
        - **Estado:** Dados mantidos em memória ou disco para suportar operações stateful (lookup, histórico)
        - **Tamanho:** Quantidade de dados em estado (bytes, GB)
        - **TTL (Time To Live):** Tempo máximo que um estado é mantido antes de expiração
        - **Expiração:** Política de limpeza de estado expirado

        ## Estado por Etapa

        ### Etapa 2: Enriquecimento com Metadados de Tenant
        **Tipo de estado:** Cache de lookup (broadcast)
        **Dados:** Tabela `tenant_metadata` (tenant_id → tenant_name, tenant_tier, region)
        **Tamanho estimado:** [SUPOSIÇÃO] 10 MB (1000 tenants × 10 KB por tenant)
        **Fonte:** Snapshot diário de `tenant_metadata` (atualizar 1× por dia)
        **TTL:** 24 horas
        **Política de expiração:** Recarregar snapshot a cada 24 horas

        **Implementação:**
        ```python
        # Carregar snapshot de tenant_metadata
        df_tenant_meta = spark.read.parquet("/data/tenant_metadata")
        broadcast_tenant_meta = broadcast(df_tenant_meta)

        # Usar em join
        df_enriched = df_parsed.join(
            broadcast_tenant_meta,
            on="tenant_id",
            how="left"
        )
        ```

        **Validação:**
        - [ ] Snapshot é carregado corretamente
        - [ ] Tamanho do broadcast é < 100 MB (limite típico)
        - [ ] Recarregamento a cada 24 h funciona sem interrupção

        ---

        ### Etapa 6: Cálculo de Taxa de Erro (Lookup de SLA)
        **Tipo de estado:** Cache de lookup (broadcast)
        **Dados:** Tabela `sla_config` (tenant_id, service_id → sla_threshold)
        **Tamanho estimado:** [SUPOSIÇÃO] 50 MB (1000 tenants × 100 serviços × 50 bytes)
        **Fonte:** Snapshot diário de `sla_config` (atualizar 1× por dia)
        **TTL:** 24 horas
        **Política de expiração:** Recarregar snapshot a cada 24 horas

        **Implementação:**
        ```python
        df_sla = spark.read.parquet("/data/sla_config")
        broadcast_sla = broadcast(df_sla)

        df_error_rates = df_by_service.join(
            broadcast_sla,
            on=["tenant_id", "service_id"],
            how="left"
        ).withColumn(
            "sla_breached",
            col("error_rate") > col("sla_threshold")
        )
        ```

        ---

        ### Etapa 7: Detecção de Anomalia (Histórico de 24h)
        **Tipo de estado:** Histórico em estado (RocksDB ou equivalente)
        **Dados:** Agregações dos últimos 24 horas (tenant_id, hour → mean, stddev)
        **Tamanho estimado:** [SUPOSIÇÃO] 1 GB (1000 tenants × 24 horas × 50 KB por hora)
        **Fonte:** Leitura contínua de `forge_events_aggregated` (últimas 24h)
        **TTL:** 24 horas
        **Política de expiração:** Remover dados > 24 horas automaticamente

        **Implementação (Spark Structured Streaming com state store):**
        ```python
        def detect_anomalies(df):
            # Usar mapGroupsWithState para manter histórico de 24h
            def state_func(key, values, state):
                tenant_id = key
                current_values = list(values)
                
                # Recuperar estado anterior
                if state.exists:
                    historical_data = state.get
                else:
                    historical_data = []
                
                # Adicionar valores atuais
                historical_data.extend(current_values)
                
                # Remover dados > 24h
                cutoff_time = current_time - timedelta(hours=24)
                historical_data = [v for v in historical_data if v['timestamp'] > cutoff_time]
                
                # Calcular média e desvio padrão
                mean = np.mean([v['metric_value'] for v in historical_data])
                stddev = np.std([v['metric_value'] for v in historical_data])
                
                # Detectar anomalias
                anomalies = [v for v in current_values if abs((v['metric_value'] - mean) / stddev) > 3]
                
                # Atualizar estado
                state.update(historical_data)
                
                return anomalies
            
            df_anomalies = df.groupByKey("tenant_id").mapGroupsWithState(
                outputMode="update",
                timeoutConf="event time",
                func=state_func
            )
            return df_anomalies
        ```

        **Validação:**
        - [ ] Estado é mantido em RocksDB (ou equivalente)
        - [ ] Tamanho do estado não excede 10 GB (limite típico)
        - [ ] Dados > 24h são removidos automaticamente
        - [ ] Detecção de anomalia funciona corretamente

        ---

        ### Etapa 8: SLA Violations (Histórico de 24h)
        **Tipo de estado:** Histórico em estado (RocksDB ou equivalente)
        **Dados:** Violações dos últimos 24 horas (tenant_id, service_id, hour → sla_breached)
        **Tamanho estimado:** [SUPOSIÇÃO] 500 MB (1000 tenants × 100 serviços × 24 horas × 20 bytes)
        **Fonte:** Leitura contínua de `forge_error_rates` (últimas 24h)
        **TTL:** 24 horas
        **Política de expiração:** Remover dados > 24 horas automaticamente

        **Implementação:** Idêntica à Etapa 7

        ---

        ### Etapa 9: Enriquecimento com Deployment
        **Tipo de estado:** Cache de lookup (broadcast)
        **Dados:** Tabela `deployment_info` (tenant_id, service_id → version, region, environment)
        **Tamanho estimado:** [SUPOSIÇÃO] 100 MB (1000 tenants × 100 serviços × 1 KB por deployment)
        **Fonte:** Snapshot diário de `deployment_info` (atualizar 1× por dia)
        **TTL:** 24 horas
        **Política de expiração:** Recarregar snapshot a cada 24 horas

        **Implementação:**
        ```python
        df_deployment = spark.read.parquet("/data/deployment_info")
        broadcast_deployment = broadcast(df_deployment)

        df_with_deployment = df_enriched.join(
            broadcast_deployment,
            on=["tenant_id", "service_id"],
            how="left"
        )
        ```

        ---

        ### Etapa 12: Detecção de Mudança de Comportamento (Histórico de 7 dias)
        **Tipo de estado:** Histórico em estado (RocksDB ou equivalente)
        **Dados:** Agregações dos últimos 7 dias (tenant_id, day → baseline_value)
        **Tamanho estimado:** [SUPOSIÇÃO] 7 GB (1000 tenants × 7 dias × 1 MB por dia)
        **Fonte:** Leitura contínua de `forge_events_aggregated` (últimos 7 dias)
        **TTL:** 7 dias
        **Política de expiração:** Remover dados > 7 dias automaticamente

        **Implementação:** Idêntica à Etapa 7, mas com TTL de 7 dias

        **Nota:** Etapa 12 é muito cara em streaming (7 GB de estado). Recomenda-se manter em batch (1× por dia).

        ---

        ## Resumo de Estado

        | Etapa | Tipo | Tamanho | TTL | Fonte | Política |
        |-------|------|--------|-----|-------|----------|
        | 2 | Broadcast | 10 MB | 24 h | Snapshot diário | Recarregar 1× por dia |
        | 6 | Broadcast | 50 MB | 24 h | Snapshot diário | Recarregar 1× por dia |
        | 7 | RocksDB | 1 GB | 24 h | Leitura contínua | Remover > 24h |
        | 8 | RocksDB | 500 MB | 24 h | Leitura contínua | Remover > 24h |
        | 9 | Broadcast | 100 MB | 24 h | Snapshot diário | Recarregar 1× por dia |
