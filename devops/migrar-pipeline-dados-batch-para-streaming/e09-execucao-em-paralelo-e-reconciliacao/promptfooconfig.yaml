        ## 3. Crie alertas com condição, limiar, janela e severidade

        **Ação:** Implementar regras de alerta em Prometheus com evitar ruído durante migração.

        **Onde:** Arquivo `forge/monitoring/alerting-rules.yaml` (novo) no repositório do Forge.

        **Procedimento:**

        ```yaml
        # forge/monitoring/alerting-rules.yaml
        apiVersion: monitoring.coreos.com/v1
        kind: PrometheusRule
        metadata:
        name: forge-streaming-alerts
        namespace: forge
        spec:
        groups:
        - name: forge.streaming.alerts
            interval: 30s
            rules:
            
            # ========== Alerta 1: Latência E2E Alta ==========
            - alert: ForgeLatencyE2EHigh
            expr: |
                histogram_quantile(0.95, rate(forge_latency_e2e_seconds_bucket[5m])) > 120
            for: 5m
            labels:
                severity: critical
                component: forge
                slo: latency
            annotations:
                summary: "Forge: Latência E2E p95 > 120 s"
                description: |
                Latência de ponta a ponta (p95) está {{ $value | humanize }}s.
                SLO: 120 s (2 min)
                Impacto: Sentinel, Cerebro, Pepper recebem dados atrasados
                runbook: "https://wiki.internal/forge/runbook#latency-high"
                dashboard: "http://grafana:3000/d/forge-e2e-latency"
            # Evitar ruído durante migração: desabilitar nos primeiros 7 dias
            # [SUPOSIÇÃO] migração leva ~7 dias
            # Usar label "migration_phase" para controlar
            
            # ========== Alerta 2: Consumer Lag Alto ==========
            - alert: ForgeConsumerLagHigh
            expr: |
                kafka_consumergroup_lag{group="forge-streaming-v1"} > 100000
            for: 10m
            labels:
                severity: warning
                component: forge
                slo: availability
            annotations:
                summary: "Forge: Consumer lag > 100k eventos"
                description: |
                Consumer lag está {{ $value | humanize }} eventos.
                Alvo: < 100k eventos
                Impacto: Dados estão atrasados, latência aumenta
                runbook: "https://wiki.internal/forge/runbook#consumer-lag-high"
                dashboard: "http://grafana:3000/d/forge-consumer-lag"
            
            # ========== Alerta 3: Taxa de Consumo Baixa ==========
            - alert: ForgeConsumptionRateLow
            expr: |
                rate(kafka_consumergroup_offset_committed_total{group="forge-streaming-v1"}[5m]) < 100
            for: 10m
            labels:
                severity: warning
                component: forge
                slo: availability
            annotations:
                summary: "Forge: Taxa de consumo < 100 evt/s"
                description: |
                Taxa de consumo está {{ $value | humanize }} eventos/s.
                Alvo: > 1000 eventos/s
                Impacto: Job pode estar parado ou muito lento
                runbook: "https://wiki.internal/forge/runbook#consumption-rate-low"
                dashboard: "http://grafana:3000/d/forge-throughput"
            
            # ========== Alerta 4: Taxa de Erro Alta ==========
            - alert: ForgeErrorRateHigh
            expr: |
                rate(forge_errors_total[5m]) / rate(forge_events_consumed_total[5m]) > 0.01
            for: 5m
            labels:
                severity: warning
                component: forge
                slo: completeness
            annotations:
                summary: "Forge: Taxa de erro > 1%"
                description: |
                Taxa de erro está {{ $value | humanize }}.
                Alvo: < 0.1%
                Impacto: Eventos estão sendo perdidos ou enviados para DLQ
                runbook: "https://wiki.internal/forge/runbook#error-rate-high"
                dashboard: "http://grafana:3000/d/forge-errors"
            
            # ========== Alerta 5: Offset Commit Falhando ==========
            - alert: ForgeOffsetCommitFailure
            expr: |
                rate(kafka_consumergroup_commit_latency_total{group="forge-streaming-v1"}[5m]) == 0
            for: 5m
            labels:
                severity: critical
                component: forge
                slo: availability
            annotations:
                summary: "Forge: Offset commit falhando"
                description: |
                Consumer group não consegue fazer commit de offsets.
                Impacto: Offsets não são salvos, reprocessamento em caso de falha
                runbook: "https://wiki.internal/forge/runbook#offset-commit-failure"
                dashboard: "http://grafana:3000/d/forge-offset-commit"
            
            # ========== Alerta 6: Tamanho de DLQ Alto ==========
            - alert: ForgeDLQSizeHigh
            expr: |
                kafka_topic_partition_current_offset{topic=~"forge-events-.*"} > 1000000
            for: 5m
            labels:
                severity: warning
                component: forge
                slo: completeness
            annotations:
                summary: "Forge: Tamanho de DLQ > 1M eventos"
                description: |
                DLQ {{ $labels.topic }} tem {{ $value | humanize }} eventos.
                Alvo: < 100k eventos
                Impacto: Muitos eventos inválidos ou com erro
                runbook: "https://wiki.internal/forge/runbook#dlq-size-high"
                dashboard: "http://grafana:3000/d/forge-dlq"
            
            # ========== Alerta 7: Tamanho de Estado Alto ==========
            - alert: ForgeStateSizeHigh
            expr: |
                forge_state_size_bytes > 5368709120  # 5 GB
            for: 5m
            labels:
                severity: warning
                component: forge
                slo: availability
            annotations:
                summary: "Forge: Tamanho de estado > 5 GB"
                description: |
                Tamanho de estado está {{ $value | humanize }}B.
                Alvo: < 2 GB
                Impacto: Memória pode estar vazando, performance degrada
                runbook: "https://wiki.internal/forge/runbook#state-size-high"
                dashboard: "http://grafana:3000/d/forge-state"
            
            # ========== Alerta 8: Latência de Escrita Alta ==========
            - alert: ForgeWriteLatencyHigh
            expr: |
                histogram_quantile(0.95, rate(forge_write_latency_seconds_bucket[5m])) > 10
            for: 5m
            labels:
                severity: warning
                component: forge
                slo: latency
            annotations:
                summary: "Forge: Latência de escrita p95 > 10 s"
                description: |
                Latência de escrita (p95) está {{ $value | humanize }}s.
                Alvo: < 5 s
                Impacto: Latência E2E aumenta
                runbook: "https://wiki.internal/forge/runbook#write-latency-high"
                dashboard: "http://grafana:3000/d/forge-write-latency"
            
            # ========== Alerta 9: Taxa de Duplicatas Alta ==========
            - alert: ForgeDuplicateRateHigh
            expr: |
                rate(forge_duplicates_detected_total[5m]) > 10
            for: 5m
            labels:
                severity: warning
                component: forge
                slo: completeness
            annotations:
                summary: "Forge: Taxa de duplicatas > 10 evt/s"
                description: |
                Taxa de duplicatas está {{ $value | humanize }} eventos/s.
                Alvo: < 1 evento/s
                Impacto: Dados podem estar duplicados no DW
                runbook: "https://wiki.internal/forge/runbook#duplicate-rate-high"
                dashboard: "http://grafana:3000/d/forge-duplicates"
            
            # ========== Alerta 10: Custo por Hora Alto ==========
            - alert: ForgeCostPerHourHigh
            expr: |
                forge_cost_per_hour_usd > 50
            for: 1h
            labels:
                severity: info
                component: forge
                slo: cost
            annotations:
                summary: "Forge: Custo por hora > $50"
                description: |
                Custo por hora está ${{ $value | humanize }}.
                Alvo: < $30
                Impacto: Custo operacional pode estar alto
                runbook: "https://wiki.internal/forge/runbook#cost-high"
                dashboard: "http://grafana:3000/d/forge-cost"
            
            # ========== Alerta 11: Watermark Atrasado ==========
            - alert: ForgeWatermarkLate
            expr: |
                (time() * 1000 - forge_watermark_timestamp_ms) > 120000
            for: 5m
            labels:
                severity: warning
                component: forge
                slo: latency
            annotations:
                summary: "Forge: Watermark atrasado > 120 s"
                description: |
                Watermark está {{ $value | humanize }}ms atrás.
                Alvo: < 60 s
                Impacto: Eventos atrasados podem não ser processados
                runbook: "https://wiki.internal/forge/runbook#watermark-late"
                dashboard: "http://grafana:3000/d/forge-watermark"
            
            # ========== Alerta 12: Checkpoint Falhando ==========
            - alert: ForgeCheckpointFailure
            expr: |
                rate(forge_checkpoint_failures_total[5m]) > 0
            for: 5m
            labels:
                severity: critical
                component: forge
                slo: availability
            annotations:
                summary: "Forge: Checkpoint falhando"
                description: |
                Taxa de falha de checkpoint está {{ $value | humanize }} falhas/s.
                Impacto: Offsets não são salvos, reprocessamento em caso de falha
                runbook: "https://wiki.internal/forge/runbook#checkpoint-failure"
                dashboard: "http://grafana:3000/d/forge-checkpoint"

        # ========== Regras de Silenciamento Durante Migração ==========
        # Usar AlertManager para silenciar alertas durante migração
        # Exemplo: silenciar ForgeLatencyE2EHigh por 7 dias
        # curl -X POST http://alertmanager:9093/api/v1/silences \
        #   -H "Content-Type: application/json" \
        #   -d '{
        #     "matchers": [
        #       {"name": "alertname", "value": "ForgeLatencyE2EHigh", "isRegex": false}
        #     ],
        #     "startsAt": "2024-01-15T00:00:00Z",
        #     "endsAt": "2024-01-22T00:00:00Z",
        #     "createdBy": "migration-automation",
        #     "comment": "Silenciar durante migração de batch para streaming"
        #   }'
        ```

        **Verificação:**

        ```bash
        # Validar regras de alerta
        kubectl apply -f forge/monitoring/alerting-rules.yaml --dry-run=client
        # Esperado: validação passa sem erros

        # Deploy em staging
        kubectl apply -f forge/monitoring/alerting-rules.yaml -n forge-staging

        # Verificar que alertas foram criados
        kubectl get prometheusrule -n forge-staging
        # Esperado: forge-streaming-alerts está listado

        # Verificar que alertas estão ativos
        curl -s http://prometheus:9090/api/v1/rules | jq '.data.groups[].rules[] | select(.name | contains("Forge"))'
        # Esperado: 12 alertas aparecem
        ```

