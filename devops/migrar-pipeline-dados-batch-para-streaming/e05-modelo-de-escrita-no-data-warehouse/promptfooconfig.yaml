        df_with_deployment = df_enriched.join(
            broadcast_deployment,
            on=["tenant_id", "service_id"],
            how="left"
        )

        # Deduplicar por event_id
        df_deduplicated = df_with_deployment.dropDuplicates(["event_id"])
        ```

        ---

        ### Etapa 10: Agregação por Versão
        **Chave de deduplicação:** `event_id` (antes de agregação)
        **Chave natural:** `window_start + window_end + tenant_id + service_id + version`
        **Implementação:** Idêntica à Etapa 4

        ---

        ### Etapa 11: Cálculo de Percentis
        **Chave de deduplicação:** `event_id` (antes de agregação)
        **Chave natural:** `window_start + window_end + tenant_id`
        **Implementação:** Idêntica à Etapa 4

        ---

        ### Etapa 12: Detecção de Mudança
        **Chave de deduplicação:** `event_id` (antes de agregação)
        **Chave natural:** `tenant_id + day + change_id`
        **Implementação:** Idêntica à Etapa 7

        ---

        ### Etapa 13: Agregação para Billing
        **Chave de deduplicação:** `event_id` (antes de agregação)
        **Chave natural:** `day + tenant_id`
        **Implementação:**
        ```python
        # Deduplicar por event_id ANTES de contar
        df_deduplicated = df_normalized.dropDuplicates(["event_id"])

        # Agregar
        df_billing = df_deduplicated.groupBy(
            date_trunc("day", col("timestamp")).alias("day"),
            col("tenant_id")
        ).agg(
            count(distinct("event_id")).alias("unique_event_count"),
            count("*").alias("total_event_count")
        )

        # Escrever com deduplicação
        df_billing.write.mode("overwrite") \
            .partitionBy("day") \
            .parquet("/data/forge/billing_events")
        ```

        **Validação:**
        - [ ] Cada combinação de `(day, tenant_id)` aparece no máximo 1× na saída
        - [ ] `unique_event_count` é exato (sem duplicatas)

        ---

        ### Etapa 14: Exportação Cerebro
        **Chave de deduplicação:** `event_id`
        **Chave natural:** `event_id`
        **Implementação:**
        ```python
        df_for_cerebro = df_enriched.select(
            col("event_id"),
            col("tenant_id"),
            col("service_id"),
            col("timestamp"),
            col("metric_name"),
            col("metric_value"),
            col("tags"),
            to_json(struct("*")).alias("json_payload")
        )

        # Deduplicar por event_id
        df_deduplicated = df_for_cerebro.dropDuplicates(["event_id"])

        # Escrever para Kafka
        df_deduplicated.write.format("kafka") \
            .option("kafka.bootstrap.servers", "<relay-broker>") \
            .option("topic", "forge-events-indexed") \
            .mode("append") \
            .save()
        ```

