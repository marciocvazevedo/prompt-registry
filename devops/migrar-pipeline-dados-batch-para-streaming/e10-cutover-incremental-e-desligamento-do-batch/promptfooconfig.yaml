            ## 4. Implemente monitoramento de carga: Relay e DW

            **Ação:** Criar métricas para monitorar que dual-run não degrada Relay nem DW.

            **Onde:** Arquivo `forge/monitoring/dual-run-load-monitoring.md` (novo) no repositório do Forge.

            **Procedimento:**

            ```markdown
            # Monitoramento de Carga — Dual-Run Batch vs Streaming

            ## Objetivo
            Garantir que rodar batch e streaming em paralelo não degrada Relay nem DW.

            ## Métricas de Carga

            ### Categoria 1: Carga no Relay

            #### Métrica 1.1: Taxa de Produção (eventos/s)
            **Definição:** Número de eventos produzidos no Relay por segundo.
            **Baseline (Batch):** [SUPOSIÇÃO] 1000 eventos/s
            **Limite Aceitável:** < 1500 eventos/s (50% acima do baseline)
            **Monitoramento:** A cada 1 min

            ```
            Taxa de Produção = rate(kafka_topic_partition_append_total[1m])
            ```

            **Alerta:**
            ```
            DualRunRelayProductionHigh: taxa_produção > 1500 evt/s por 5 min
            Severidade: WARNING
            Ação: Verificar se batch e streaming estão consumindo corretamente
            ```

            #### Métrica 1.2: Retenção de Dados no Relay
            **Definição:** Quantidade de dados retidos no Relay (GB).
            **Baseline (Batch):** [SUPOSIÇÃO] 100 GB (1 dia de retenção)
            **Limite Aceitável:** < 150 GB (50% acima do baseline)
            **Monitoramento:** A cada 1 hora

            ```
            Retenção = kafka_topic_partition_size_bytes / 1e9
            ```

            **Alerta:**
            ```
            DualRunRelayRetentionHigh: retenção > 150 GB por 1 hora
            Severidade: WARNING
            Ação: Verificar se batch e streaming estão consumindo, aumentar retenção se necessário
            ```

            #### Métrica 1.3: Latência de Produção
            **Definição:** Tempo entre evento ser produzido e estar disponível no Relay.
            **Baseline (Batch):** [SUPOSIÇÃO] 100 ms
            **Limite Aceitável:** < 200 ms (2× baseline)
            **Monitoramento:** A cada 1 min

            ```
            Latência = histogram_quantile(0.95, rate(kafka_producer_latency_seconds_bucket[1m]))
            ```

            **Alerta:**
            ```
            DualRunRelayLatencyHigh: latência > 200 ms por 5 min
            Severidade: WARNING
            Ação: Verificar performance do Relay, aumentar partições se necessário
            ```

            ### Categoria 2: Carga no Data Warehouse

            #### Métrica 2.1: Taxa de Escrita (eventos/s)
            **Definição:** Número de eventos escritos no DW por segundo.
            **Baseline (Batch):** [SUPOSIÇÃO] 500 eventos/s (durante lote)
            **Limite Aceitável:** < 1000 eventos/s (2× baseline, batch + streaming)
            **Monitoramento:** A cada 1 min

            ```
            Taxa de Escrita = rate(forge_events_written_total[1m])
            ```

            **Alerta:**
            ```
            DualRunDWWriteRateHigh: taxa_escrita > 1000 evt/s por 5 min
            Severidade: WARNING
            Ação: Verificar performance do DW, aumentar paralelismo se necessário
            ```

            #### Métrica 2.2: Espaço em Disco
            **Definição:** Espaço em disco usado no DW (GB).
            **Baseline (Batch):** [SUPOSIÇÃO] 500 GB (dados de 1 dia)
            **Limite Aceitável:** < 750 GB (50% acima do baseline, batch + streaming)
            **Monitoramento:** A cada 1 hora

            ```
            Espaço em Disco = node_filesystem_avail_bytes{mountpoint="/data/forge"} / 1e9
            ```

            **Alerta:**
            ```
            DualRunDWDiskSpaceHigh: espaço_usado > 750 GB por 1 hora
            Severidade: WARNING
            Ação: Verificar se dados estão sendo limpados, aumentar capacidade se necessário
            ```

            #### Métrica 2.3: Latência de Escrita
            **Definição:** Tempo para escrever um lote de dados no DW.
            **Baseline (Batch):** [SUPOSIÇÃO] 10 s
            **Limite Aceitável:** < 20 s (2× baseline)
            **Monitoramento:** A cada 1 min

            ```
            Latência = histogram_quantile(0.95, rate(forge_write_latency_seconds_bucket[1m]))
            ```

            **Alerta:**
            ```
            DualRunDWWriteLatencyHigh: latência > 20 s por 5 min
            Severidade: WARNING
            Ação: Verificar performance do DW, aumentar recursos se necessário
            ```

            #### Métrica 2.4: Número de Arquivos
            **Definição:** Número de arquivos Parquet no DW.
            **Baseline (Batch):** [SUPOSIÇÃO] 1000 arquivos (1 por hora × 24 horas × 11 tabelas)
            **Limite Aceitável:** < 2000 arquivos (2× baseline, batch + streaming)
            **Monitoramento:** A cada 1 hora

            ```
            Número de Arquivos = count(files in /data/forge/)
            ```

            **Alerta:**
            ```
            DualRunDWFileCountHigh: número_arquivos > 2000 por 1 hora
            Severidade: INFO
            Ação: Considerar compactação se performance degradar
            ```

            ### Categoria 3: Carga no Cluster Spark

            #### Métrica 3.1: CPU
            **Definição:** Utilização de CPU do cluster Spark.
            **Baseline (Batch):** [SUPOSIÇÃO] 50% (durante lote)
            **Limite Aceitável:** < 80% (durante dual-run)
            **Monitoramento:** A cada 1 min

            ```
            CPU = rate(process_cpu_seconds_total[1m]) * 100
            ```

            **Alerta:**
            ```
            DualRunSparkCPUHigh: cpu > 80% por 5 min
            Severidade: WARNING
            Ação: Verificar se batch e streaming estão competindo, aumentar cluster se necessário
            ```

            #### Métrica 3.2: Memória
            **Definição:** Utilização de memória do cluster Spark.
            **Baseline (Batch):** [SUPOSIÇÃO] 60% (durante lote)
            **Limite Aceitável:** < 85% (durante dual-run)
            **Monitoramento:** A cada 1 min

            ```
            Memória = (jvm_memory_used_bytes / jvm_memory_max_bytes) * 100
            ```

            **Alerta:**
            ```
            DualRunSparkMemoryHigh: memória > 85% por 5 min
            Severidade: WARNING
            Ação: Verificar se há vazamento de memória, aumentar cluster se necessário
            ```

            #### Métrica 3.3: Número de Tasks
            **Definição:** Número de tasks em execução no cluster Spark.
            **Baseline (Batch):** [SUPOSIÇÃO] 100 tasks (durante lote)
            **Limite Aceitável:** < 200 tasks (2× baseline, batch + streaming)
            **Monitoramento:** A cada 1 min

            ```
            Número de Tasks = spark_executor_task_count
            ```

            **Alerta:**
            ```
            DualRunSparkTaskCountHigh: número_tasks > 200 por 5 min
            Severidade: INFO
            Ação: Verificar se batch e streaming estão competindo
            ```

            ## Validação de Carga

            ### Checklist de Validação

            - [ ] Taxa de produção no Relay < 1500 evt/s
            - [ ] Retenção de dados no Relay < 150 GB
            - [ ] Latência de produção no Relay < 200 ms
            - [ ] Taxa de escrita no DW < 1000 evt/s
            - [ ] Espaço em disco no DW < 750 GB
            - [ ] Latência de escrita no DW < 20 s
            - [ ] Número de arquivos no DW < 2000
            - [ ] CPU do cluster Spark < 80%
            - [ ] Memória do cluster Spark < 85%
            - [ ] Número de tasks no cluster Spark < 200

            ### Teste de Carga

            ```bash
            #!/bin/bash
            # Script para validar que dual-run não degrada carga

            # 1. Verificar taxa de produção no Relay
            RELAY_RATE=$(curl -s http://prometheus:9090/api/v1/query \
            --data-urlencode 'query=rate(kafka_topic_partition_append_total[1m])' | \
            jq '.data.result[0].value[1]' | tr -d '"')

            if (( $(echo "$RELAY_RATE < 1500" | bc -l) )); then
            echo "✅ Taxa de produção no Relay: ${RELAY_RATE} evt/s (< 1500)"
            else
            echo "❌ Taxa de produção no Relay: ${RELAY_RATE} evt/s (> 1500)"
            exit 1
            fi

            # 2. Verificar espaço em disco no DW
            DW_SPACE=$(df /data/forge | tail -1 | awk '{print $3}')
            DW_SPACE_GB=$((DW_SPACE / 1024 / 1024))

            if (( DW_SPACE_GB < 750 )); then
            echo "✅ Espaço em disco no DW: ${DW_SPACE_GB} GB (< 750)"
            else
            echo "❌ Espaço em disco no DW: ${DW_SPACE_GB} GB (> 750)"
            exit 1
            fi

            # 3. Verificar CPU do cluster Spark
            SPARK_CPU=$(curl -s http://prometheus:9090/api/v1/query \
            --data-urlencode 'query=rate(process_cpu_seconds_total[1m]) * 100' | \
            jq '.data.result[0].value[1]' | tr -d '"')

            if (( $(echo "$SPARK_CPU < 80" | bc -l) )); then
            echo "✅ CPU do cluster Spark: ${SPARK_CPU}% (< 80%)"
            else
            echo "❌ CPU do cluster Spark: ${SPARK_CPU}% (> 80%)"
            exit 1
            fi

            echo "=== Validação de Carga Passou ==="
            ```

            ## Impacto Esperado de Dual-Run

            | Métrica | Baseline (Batch) | Dual-Run (Batch + Streaming) | Aumento |
            |---------|------------------|------------------------------|---------|
            | Taxa de Produção (evt/s) | 1000 | 1500 | +50% |
            | Retenção no Relay (GB) | 100 | 150 | +50% |
            | Taxa de Escrita no DW (evt/s) | 500 | 1000 | +100% |
            | Espaço em Disco no DW (GB) | 500 | 750 | +50% |
            | CPU do Cluster Spark (%) | 50% | 80% | +60% |
            | Memória do Cluster Spark (%) | 60% | 85% | +42% |

            **Conclusão:** Dual-run aumenta carga em ~50-100%, mas permanece dentro de limites aceitáveis.

            ## Mitigação de Carga

            Se carga passar dos limites:

            1. **Aumentar Retenção no Relay:** Aumentar de 1 dia para 2 dias
            2. **Aumentar Capacidade do DW:** Adicionar mais nós ou aumentar tamanho de nó
            3. **Aumentar Cluster Spark:** Adicionar mais executores ou aumentar memória
            4. **Reduzir Frequência de Streaming:** Aumentar de 30 s para 60 s (trade-off com latência)
            5. **Reduzir Frequência de Batch:** Aumentar de 60 min para 120 min (trade-off com latência)
            ```

            **Verificação:**

            ```bash
            # Confirmar que monitoramento de carga está documentado
            grep -E "Métrica|Baseline|Limite|Alerta" forge/monitoring/dual-run-load-monitoring.md | wc -l
            # Esperado: > 40 linhas

            # Executar teste de carga
            bash forge/scripts/test_dual_run_load.sh
            # Esperado: "Validação de Carga Passou"
            ```

