        def write_cerebro(df_cerebro, batch_id):
            """Escrever para Cerebro com deduplicação"""
            # Deduplicar por event_id
            df_deduplicated = df_cerebro.dropDuplicates(["event_id"])
            # Escrever para Kafka
            df_deduplicated.write.format("kafka") \
                .option("kafka.bootstrap.servers", "<relay-broker>") \
                .option("topic", "forge-events-indexed") \
                .mode("append") \
                .save()
            print(f"Batch {batch_id}: {df_deduplicated.count()} eventos enviados para Cerebro")

        query = df_for_cerebro.writeStream \
            .foreachBatch(lambda df, batch_id: write_cerebro(df, batch_id)) \
            .outputMode("append") \
            .trigger(processingTime="30 seconds") \
            .start()
        ```

