        ### Etapa 4: Agregação por Serviço (Janela de 1 Hora)
        **Tipo:** Agregação por janela (stateful)
        **Entrada:** Tabela `forge_events_normalized`
        **Saída:** Tabela `forge_events_by_service`
        **Lógica:**
        - Agrupar por `tenant_id`, `service_id`, `hour`
        - Calcular: `SUM(metric_value)`, `COUNT(*)`, `AVG(metric_value)`, `STDDEV(metric_value)`
        - Particionar por hora

        **Código (batch):**
        \`\`\`python
        df_normalized = spark.read.parquet("/data/forge/normalized")
        df_by_service = df_normalized.groupBy(
            date_trunc("hour", col("timestamp")).alias("hour"),
            col("tenant_id"),
            col("service_id")
        ).agg(
            sum("metric_value").alias("total_value"),
            count("*").alias("event_count"),
            avg("metric_value").alias("avg_value"),
            stddev("metric_value").alias("stddev_value")
        )
        df_by_service.write.mode("overwrite").partitionBy("hour").parquet("/data/forge/by_service")
        \`\`\`

        **Classificação:** ✅ Agregação por janela → Adequado para streaming (com watermark)

