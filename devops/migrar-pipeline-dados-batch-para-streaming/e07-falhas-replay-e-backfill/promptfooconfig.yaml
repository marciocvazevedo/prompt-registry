        ## Dados faltantes e confirmações necessárias

        ### Dados que faltam:
        1. **Tamanho real de arquivo por tabela:** Qual é o tamanho médio de arquivo em Parquet? (Necessário para estimar compactação)
        2. **Frequência real de escrita:** Com que frequência streaming escreve? (Necessário para estimar número de arquivos)
        3. **Custo real de compute:** Qual é o custo real por nó/hora? (Necessário para análise de custo)
        4. **Custo real de armazenamento:** Qual é o custo real por GB/mês? (Necessário para análise de custo)
        5. **Capacidade de consumidores:** Conseguem processar dados a cada 30 s? (Necessário para validar com Sentinel, Cerebro, Pepper)
        6. **Política de retenção:** Quantos dias de dados devem ser retidos? (Necessário para estimar armazenamento)
        7. **SLA de latência:** Qual é o SLA de latência para cada consumidor? (Necessário para definir lag de leitura)

        ### Confirmações que derrubariam/validariam escolhas futuras:
        - Se **tamanho de arquivo < 10 MB**, compactação é necessária
        - Se **número de arquivos > 1000/hora**, compactação é urgente
        - Se **custo de compute > $2k/mês**, considerar otimizações
        - Se **consumidores não conseguem lidar com modo `update`**, usar modo `append` com reprocessamento
        - Se **SLA de latência < 5 min**, usar lag de leitura menor
        - Se **política de retenção > 180 dias**, custo de armazenamento é alto

