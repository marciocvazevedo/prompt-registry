            ## W. Riscos e mitigação

            | Risco | Probabilidade | Impacto | Mitigação |
            |-------|---------------|--------|-----------|
            | Batch e streaming competem por recursos (CPU, memória) | Alta | Médio | Monitorar carga; aumentar cluster se necessário; reduzir frequência de streaming |
            | Relay fica sem espaço (retenção aumenta) | Média | Alto | Monitorar retenção; aumentar capacidade; reduzir retenção se necessário |
            | DW fica sem espaço (tabelas espelho) | Média | Alto | Monitorar espaço em disco; aumentar capacidade; limpar dados antigos |
            | Divergências são maiores que esperado (> 0,1%) | Média | Alto | Investigar causa raiz; corrigir bug em streaming; estender dual-run |
            | Consumidores são afetados (leem de streaming por engano) | Baixa | Crítico | Usar views que apontam para batch; testar consumidores; validar queries |
            | Reconciliação é muito lenta (não termina em 1 hora) | Média | Médio | Otimizar queries; aumentar paralelismo; reduzir granularidade |
            | Classificador de divergências escala falso (ruído) | Média | Médio | Ajustar threshold de escalação; validar classificações; testar em staging |
            | Dados de reconciliação ficam muito grandes (GB) | Baixa | Médio | Limpar dados antigos; usar compactação; reduzir retenção |
            | Dual-run degrada performance de batch | Média | Alto | Monitorar latência de batch; aumentar cluster; reduzir frequência de streaming |
            | Cutover é aprovado mas streaming tem bug não detectado | Baixa | Crítico | Usar critérios rigorosos; testar em staging; validar com consumidores |
            | Streaming falha após cutover (sem batch para fallback) | Baixa | Crítico | Manter batch por 7 dias após cutover; ter runbook de rollback |
            | Dados históricos de batch são perdidos (limpeza acidental) | Muito Baixa | Crítico | Fazer backup de batch antes de cutover; usar retenção de 90 dias |

