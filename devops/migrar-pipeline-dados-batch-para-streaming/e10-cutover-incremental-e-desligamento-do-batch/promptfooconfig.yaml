            ## Y. Rollback

            **Procedimento de rollback (se necessário após passo 3):**

            ```bash
            #!/bin/bash
            # Script de rollback: parar dual-run e voltar para batch
            set -e
            echo "=== Rollback: Parar Dual-Run, Voltar para Batch ==="

            # 1. Parar job de streaming
            echo "1. Parando job de streaming..."
            kubectl delete deployment forge-streaming-transform -n forge
            kubectl delete deployment forge-streaming-write -n forge
            sleep 30

            # 2. Parar job de reconciliação
            echo "2. Parando job de reconciliação..."
            airflow dags pause forge-reconciliation
            airflow dags pause forge-divergence-classifier

            # 3. Remover diretório de streaming
            echo "3. Removendo diretório de streaming..."
            rm -rf /data/forge/streaming/
            rm -rf /data/forge/reconciliation/
            rm -rf /data/forge/checkpoint/streaming/

            # 4. Validar que batch está funcionando
            echo "4. Validando que batch está funcionando..."
            airflow dags trigger forge-batch-transform
            sleep 60
            airflow dags list | grep forge-batch-transform

            # 5. Validar que consumidores estão lendo de batch
            echo "5. Validando que consumidores estão lendo de batch..."
            psql -h <dw-host> -U <user> -d forge -c "SELECT COUNT(*) FROM forge.aggregated_hourly;" | grep -q "^[1-9]"
            if [ $? -eq 0 ]; then
            echo "✅ Consumidores estão lendo de batch"
            else
            echo "❌ Consumidores não conseguem ler de batch"
            exit 1
            fi

            # 6. Notificar consumidores
            echo "6. Notificando consumidores..."
            curl -X POST <slack-webhook> \
            -H "Content-Type: application/json" \
            -d '{"text": "✅ Rollback concluído. Forge voltou para batch."}'

            echo "=== Rollback concluído ==="
            ```

