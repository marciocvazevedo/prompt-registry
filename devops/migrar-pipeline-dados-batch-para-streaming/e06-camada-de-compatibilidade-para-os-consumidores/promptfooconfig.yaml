        ## Impacto de Compactação

        ### Custo de Armazenamento
        ```
        Sem compactação:
        - 120 arquivos/hora × 24 horas = 2880 arquivos/dia
        - Overhead: 2880 × 1 MB = 2.88 GB/dia
        - Custo: 2.88 GB × $0.023/GB/mês = $0.07/dia

        Com compactação:
        - 24 arquivos/dia (1 por hora)
        - Overhead: 24 × 1 MB = 24 MB/dia
        - Custo: 24 MB × $0.023/GB/mês = $0.0006/dia

        Economia: $0.07 - $0.0006 = $0.069/dia = $25/ano
        ```

        ### Custo de Compactação
        ```
        Rewrite de 1 hora de dados:
        - Tamanho: 2.4 GB
        - Tempo: ~5 min (em cluster de 4 nós)
        - Custo: 4 nós × 5 min × $0.50/hora = $0.017

        Compactação diária (24 horas):
        - Custo: 24 × $0.017 = $0.41/dia = $150/ano

        ROI: Economia ($25/ano) < Custo ($150/ano)
        Conclusão: Compactação não é viável para todas as partições
        ```

        ### Recomendação
        - **Compactar:** Apenas partições > 7 dias (dados "frios")
        - **Não compactar:** Partições < 7 dias (dados "quentes", ainda sendo atualizadas)

        ```python
        def smart_compaction(spark):
            """Compactar apenas partições antigas"""
            from datetime import datetime, timedelta
            
            # Compactar partições > 7 dias
            cutoff_date = (datetime.utcnow() - timedelta(days=7)).strftime("%Y-%m-%d")
            
            spark.sql(f"""
            OPTIMIZE parquet.`/data/forge/aggregated`
            WHERE hour < '{cutoff_date}'
            """)
        ```

