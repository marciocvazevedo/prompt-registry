        ## Impacto em Alertas

        ### Alertas Que Disparam Mais Rápido
        | Alerta | Antes (Batch) | Depois (Streaming) | Melhoria |
        |--------|---------------|-------------------|----------|
        | High error rate | 105 min | 7 min | 15× mais rápido |
        | High latency (p95) | 105 min | 7 min | 15× mais rápido |
        | SLA violation | 105 min | 7 min | 15× mais rápido |
        | Service down | 105 min | 7 min | 15× mais rápido |

        ### Alertas Que Podem Ser Falsos (Evitar)
        | Alerta | Razão | Solução |
        |--------|-------|---------|
        | "Error rate spike" em dados abertos | Dados podem mudar | Usar view com lag |
        | "SLA violation" em dados abertos | Dados podem se recuperar | Usar view com lag |
