        ### Etapa 6: Cálculo de Taxa de Erro
        **Tipo:** Sem estado (stateless) + Enriquecimento por lookup
        **Entrada:** Tabela `forge_events_by_service`
        **Saída:** Tabela `forge_error_rates`
        **Lógica:**
        - Filtrar eventos com `metric_name` = "error"
        - Calcular taxa de erro: `error_count / total_count`
        - Fazer join com SLA de tenant para comparar

        **Código (batch):**
        \`\`\`python
        df_by_service = spark.read.parquet("/data/forge/by_service")
        df_sla = spark.read.parquet("/data/sla_config")  # Snapshot diário
        df_error_rates = df_by_service.filter(
            col("metric_name") == "error"
        ).join(
            df_sla,
            on=["tenant_id", "service_id"],
            how="left"
        ).withColumn(
            "error_rate",
            col("total_value") / col("event_count")
        ).withColumn(
            "sla_breached",
            col("error_rate") > col("sla_threshold")
        )
        df_error_rates.write.mode("overwrite").parquet("/data/forge/error_rates")
        \`\`\`

        **Classificação:** ⚠️ Enriquecimento por lookup → Requer estado (cache de SLA)

        ---

        ### Etapa 7: Detecção de Anomalia
        **Tipo:** Agregação por janela + Enriquecimento por lookup (stateful)
        **Entrada:** Tabela `forge_events_aggregated`
        **Saída:** Tabela `forge_anomalies`
        **Lógica:**
        - Calcular média e desvio padrão de `metric_value` para cada tenant (últimas 24h)
        - Detectar valores > 3σ como anomalia
        - Fazer join com histórico de anomalias para evitar duplicatas

        **Código (batch):**
        \`\`\`python
        df_aggregated = spark.read.parquet("/data/forge/aggregated")
        df_history = spark.read.parquet("/data/forge/anomalies")  # Últimas 24h
        df_stats = df_aggregated.groupBy("tenant_id").agg(
            avg("total_value").alias("mean_value"),
            stddev("total_value").alias("stddev_value")
        )
        df_anomalies = df_aggregated.join(
            df_stats,
            on="tenant_id"
        ).withColumn(
            "z_score",
            (col("total_value") - col("mean_value")) / col("stddev_value")
        ).filter(
            abs(col("z_score")) > 3
        ).join(
            df_history,
            on=["tenant_id", "hour"],
            how="left_anti"  # Evitar duplicatas
        )
        df_anomalies.write.mode("overwrite").parquet("/data/forge/anomalies")
        \`\`\`

        **Classificação:** ⚠️ Agregação + Lookup → Requer estado (histórico de anomalias)

        ---

        ### Etapa 8: Cálculo de SLA Violations
        **Tipo:** Agregação por janela + Enriquecimento por lookup (stateful)
        **Entrada:** Tabela `forge_error_rates`
        **Saída:** Tabela `forge_sla_violations`
        **Lógica:**
        - Comparar `error_rate` com `sla_threshold` (de Etapa 6)
        - Registrar violações de SLA
        - Fazer join com histórico para evitar duplicatas

        **Código (batch):**
        \`\`\`python
        df_error_rates = spark.read.parquet("/data/forge/error_rates")
        df_violations_history = spark.read.parquet("/data/forge/sla_violations")  # Últimas 24h
        df_violations = df_error_rates.filter(
            col("sla_breached") == True
        ).join(
            df_violations_history,
            on=["tenant_id", "service_id", "hour"],
            how="left_anti"  # Evitar duplicatas
        ).select(
            col("hour"),
            col("tenant_id"),
            col("service_id"),
            col("error_rate"),
            col("sla_threshold"),
            lit(True).alias("sla_breached")
        )
        df_violations.write.mode("overwrite").parquet("/data/forge/sla_violations")
        \`\`\`

        **Classificação:** ⚠️ Agregação + Lookup → Requer estado (histórico de violações)

