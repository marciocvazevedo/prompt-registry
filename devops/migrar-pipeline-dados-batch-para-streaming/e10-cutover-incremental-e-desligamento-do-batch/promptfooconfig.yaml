        ## W. Riscos e mitigação

        | Risco | Probabilidade | Impacto | Mitigação |
        |-------|---------------|--------|-----------|
        | Classificação de falha incorreta (falso positivo) | Média | Médio | Testar com dados reais; ajustar critérios |
        | DLQ fica cheio (muitos eventos inválidos) | Média | Médio | Monitorar tamanho de DLQ; alertar se > 1M eventos |
        | Replay cria duplicatas (reprocessamento sem dedup) | Média | Alto | Implementar deduplicação; validar com testes |
        | Backfill é muito lento (reprocessar 90 dias) | Média | Médio | Paralelizar backfill; usar múltiplos jobs |
        | Runbook é incompleto (ação não resolve problema) | Média | Médio | Testar runbook com falhas simuladas; atualizar |
        | Alertas geram muitos falsos positivos | Alta | Médio | Ajustar thresholds; usar múltiplas condições |
        | Alertas não disparam (falha não é detectada) | Baixa | Alto | Testar alertas com falhas simuladas; validar |
        | Rollback é muito lento (downtime prolongado) | Baixa | Alto | Testar rollback em staging; documentar passos |
        | Dados históricos são perdidos (backfill falha) | Baixa | Alto | Manter backup de dados; validar backfill |
        | On-call não consegue seguir runbook (falta contexto) | Média | Médio | Documentar bem; treinar on-call; ter contatos |

