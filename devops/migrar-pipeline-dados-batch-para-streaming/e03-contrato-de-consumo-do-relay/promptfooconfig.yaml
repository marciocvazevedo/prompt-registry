      INSUMO_ETAPA_1: |
        # Etapa 1 de 10: Inventário e Baseline — Procedimento Técnico

                ## 0. Pré-requisitos

                - [ ] Acesso de leitura ao cluster Spark que executa `forge-batch-ingest`
                - [ ] Acesso ao data warehouse do Forge (SQL, metastore, ou console de consultas)
                - [ ] Acesso aos logs de execução do job cron (sistema de scheduling, ex: Airflow, cron nativo, etc.)
                - [ ] Acesso ao Relay: tópicos, schemas, métricas de throughput
                - [ ] Acesso aos sistemas consumidores: Sentinel, Cerebro, Pepper (logs de leitura, queries, SLAs)
                - [ ] Ferramentas disponíveis: `spark-submit`, cliente SQL, `curl`/API para métricas, `git`
                - [ ] Permissão para criar tabelas/views temporárias no DW sem impacto em produção
                - [ ] Contato técnico em cada time consumidor (Sentinel, Cerebro, Pepper) para validar dados coletados

                ---

                ## 1. Mapeie o tópico/fila de entrada do Relay

                **Ação:** Identifique e documente a origem dos dados que alimentam `forge-batch-ingest`.

                **Onde:** Console/API do Relay ou repositório de configuração do Forge.

                **Comando/Configuração:**

                ```bash
                # Se Relay é Kafka/Pulsar, liste o tópico
                kafka-topics --bootstrap-server <relay-broker> --list | grep -i forge
                # ou
                pulsar-admin topics list <relay-namespace>

                # Se Relay é fila (SQS, etc.), liste a fila
                aws sqs list-queues --region <region> | grep -i forge
                ```

                **Verificação:** Confirme que existe exatamente um tópico/fila de entrada e anote seu nome.

                ---

                ## 2. Colete schema e amostra de telemetry do Relay

                **Ação:** Extraia o schema Avro/Protobuf/JSON e uma amostra representativa de eventos.

                **Onde:** Relay (tópico/fila) ou repositório de schemas (Schema Registry, etc.).

                **Comando/Configuração:**

                ```bash
                # Se Schema Registry (Confluent/Kafka)
                curl -s http://<schema-registry>:8081/subjects/<relay-topic>-value/versions/latest \
                  | jq '.schema | fromjson' > /tmp/relay_schema.json

                # Se Pulsar Schema
                pulsar-admin schemas get <relay-namespace>/<relay-topic>

                # Amostra de 100 eventos (últimos 5 min)
                kafka-console-consumer --bootstrap-server <relay-broker> \
                  --topic <relay-topic> \
                  --from-beginning \
                  --max-messages 100 \
                  --property print.timestamp=true \
                  --property print.key=true \
                  > /tmp/relay_sample.jsonl
                ```

                **Verificação:** Arquivo `/tmp/relay_schema.json` contém schema válido; `/tmp/relay_sample.jsonl` contém ≥100 eventos com timestamps.

                ---

                ## 3. Meça volume e taxa de chegada do Relay

                **Ação:** Quantifique throughput, tamanho médio de evento e distribuição temporal.

                **Onde:** Métricas do Relay (Prometheus, CloudWatch, Datadog, etc.) ou logs de ingestão.

                **Comando/Configuração:**

                ```bash
                # Via Prometheus (se disponível)
                curl -s 'http://<prometheus>:9090/api/v1/query?query=rate(relay_messages_total[5m])' \
                  | jq '.data.result[] | {metric: .metric, value: .value[1]}'

                # Via Kafka metrics
                kafka-consumer-groups --bootstrap-server <relay-broker> \
                  --group forge-batch-ingest \
                  --describe

                # Via logs de aplicação (últimas 24h)
                grep "messages_consumed\|bytes_consumed" <forge-logs> | tail -100
                ```

                **Cálculos a fazer:**

                ```python
                # Após coletar dados, calcule:
                total_events_24h = <valor coletado>
                avg_event_size_bytes = <tamanho médio da amostra>
                peak_rate_events_per_sec = <pico observado>
                avg_rate_events_per_sec = total_events_24h / 86400

                print(f"Volume 24h: {total_events_24h:,} eventos")
                print(f"Tamanho médio: {avg_event_size_bytes} bytes")
                print(f"Taxa média: {avg_rate_events_per_sec:.1f} evt/s")
                print(f"Taxa pico: {peak_rate_events_per_sec:.1f} evt/s")
                print(f"Throughput médio: {avg_rate_events_per_sec * avg_event_size_bytes / 1e6:.2f} MB/s")
                ```

                **Verificação:** Números plausíveis (ex: 1M–100M eventos/dia para SaaS de observabilidade); taxa pico ≥ 2× taxa média.

                ---

                ## 4. Documente as 14 etapas de transformação Spark

                **Ação:** Extraia do código-fonte do `forge-batch-ingest` cada etapa, entrada, saída, tipo e tempo.

                **Onde:** Repositório do Forge (ex: `forge/jobs/batch_ingest.py` ou `.scala`).

                **Comando/Configuração:**

                ```bash
                # Clone/acesse o repositório
                cd <forge-repo>
                git log --oneline forge/jobs/batch_ingest.py | head -5

                # Extraia o DAG de transformações
                grep -E "\.map\(|\.filter\(|\.groupBy\(|\.join\(|\.window\(|\.write\(" \
                  forge/jobs/batch_ingest.py | head -20
                ```

                **Procedimento manual:**

                1. Abra o arquivo principal do job (ex: `forge/jobs/batch_ingest.py`).
                2. Identifique cada `.map()`, `.filter()`, `.groupBy()`, `.join()`, `.window()`, `.aggregate()`, `.write()`.
                3. Para cada etapa, preencha a tabela abaixo:

                | # | Nome da Etapa | Entrada | Saída | Tipo | Tempo (s) | Notas |
                |---|---|---|---|---|---|---|
                | 1 | Parse JSON | Relay (raw) | DataFrame estruturado | Sem estado | ? | Desserialização |
                | 2 | Validação de schema | DF estruturado | DF validado | Sem estado | ? | Drop inválidos |
                | 3 | Enriquecimento de tenant | DF validado | DF + tenant_id | Junção (lookup) | ? | Lookup em tabela estática |
                | 4 | Normalização de timestamp | DF + tenant | DF normalizado | Sem estado | ? | Conversão de fuso |
                | 5 | Agregação por tenant/hora | DF normalizado | Agregados | Agregação | ? | groupBy(tenant, hour) |
                | 6 | Cálculo de percentis | Agregados | Agregados + p50/p95/p99 | Agregação | ? | approx_percentile |
                | 7 | Junção com metadados | Agregados + p* | DF enriquecido | Junção | ? | Lookup em tabela de metadados |
                | 8 | Deduplicação | DF enriquecido | DF dedupado | Sem estado | ? | dropDuplicates(event_id) |
                | 9 | Filtro de retenção | DF dedupado | DF retido | Sem estado | ? | Descarta eventos antigos |
                | 10 | Agregação por serviço | DF retido | Agregados por serviço | Agregação | ? | groupBy(tenant, service, hour) |
                | 11 | Cálculo de taxa de erro | Agregados/serviço | Agregados + error_rate | Sem estado | ? | Divisão simples |
                | 12 | Junção com SLA | Agregados + error_rate | DF com SLA | Junção | ? | Lookup em tabela de SLA |
                | 13 | Formatação para DW | DF com SLA | Linhas formatadas | Sem estado | ? | Conversão de tipos |
                | 14 | Escrita no DW | Linhas formatadas | Tabelas particionadas | Sem estado | ? | INSERT/UPSERT |

                **Comando para extrair tempos de execução:**

                ```bash
                # Dos logs do Spark (últimas 10 execuções)
                spark-submit --conf spark.eventLog.enabled=true \
                  --conf spark.eventLog.dir=<event-log-dir> \
                  forge/jobs/batch_ingest.py

                # Analise o event log
                python3 << 'EOF'
                import json
                import glob

                for log_file in sorted(glob.glob("<event-log-dir>/*"))[-10:]:
                    with open(log_file) as f:
                        for line in f:
                            event = json.loads(line)
                            if event.get("Event") == "SparkListenerTaskEnd":
                                stage_id = event.get("stageId")
                                duration_ms = event.get("taskInfo", {}).get("duration", 0)
                                print(f"Stage {stage_id}: {duration_ms}ms")
                EOF
                ```

                **Verificação:** Tabela preenchida com ≥12 etapas; soma de tempos ≈ 40 min (2400 s).

                ---

                ## 5. Inventarie as tabelas do data warehouse do Forge

                **Ação:** Liste todas as tabelas gravadas pelo `forge-batch-ingest`, com schema, particionamento e tamanho.

                **Onde:** Data warehouse do Forge (Snowflake, BigQuery, Redshift, Delta Lake, etc.).

                **Comando/Configuração:**

                ```sql
                -- Para Snowflake
                SELECT 
                  table_name,
                  column_name,
                  data_type,
                  is_nullable
                FROM information_schema.columns
                WHERE table_schema = 'FORGE'
                ORDER BY table_name, ordinal_position;

                -- Tamanho das tabelas
                SELECT 
                  table_name,
                  row_count,
                  bytes / 1e9 AS size_gb,
                  CURRENT_TIMESTAMP() - last_altered AS last_modified
                FROM information_schema.tables
                WHERE table_schema = 'FORGE'
                ORDER BY bytes DESC;

                -- Partições (se aplicável)
                SELECT 
                  table_name,
                  partition_expression,
                  COUNT(*) AS num_partitions
                FROM information_schema.table_partitions
                WHERE table_schema = 'FORGE'
                GROUP BY table_name, partition_expression;
                ```

                ```sql
                -- Para BigQuery
                SELECT 
                  table_name,
                  ROUND(size_bytes / 1e9, 2) AS size_gb,
                  row_count,
                  TIMESTAMP_MILLIS(creation_time) AS created,
                  TIMESTAMP_MILLIS(CAST(UNIX_MILLIS(CURRENT_TIMESTAMP()) AS INT64)) AS now
                FROM `<project>.forge.__TABLES__`
                ORDER BY size_bytes DESC;

                -- Schema
                SELECT 
                  column_name,
                  data_type,
                  mode
                FROM `<project>.forge.INFORMATION_SCHEMA.COLUMNS`
                WHERE table_name IN (
                  SELECT table_name FROM `<project>.forge.__TABLES__`
                )
                ORDER BY table_name, ordinal_position;
                ```

                **Preencha a tabela:**

                | Tabela | Schema (colunas principais) | Particionamento | Tamanho (GB) | Linhas | Taxa crescimento (GB/dia) | Última escrita |
                |---|---|---|---|---|---|---|
                | `forge_events_raw` | event_id, tenant_id, timestamp, payload | hour | ? | ? | ? | ? |
                | `forge_events_aggregated` | tenant_id, hour, metric_name, value, p50, p95, p99 | hour | ? | ? | ? | ? |
                | `forge_events_by_service` | tenant_id, service_id, hour, error_count, error_rate | hour | ? | ? | ? | ? |
                | `forge_sla_violations` | tenant_id, service_id, hour, sla_breached | hour | ? | ? | ? | ? |
                | ... | ... | ... | ... | ... | ... | ... |

                **Verificação:** ≥3 tabelas documentadas; tamanho total > 100 GB (típico para SaaS de observabilidade).

                ---

                ## 6. Meça latência fim a fim do lote atual

                **Ação:** Quantifique o tempo desde a chegada de um evento no Relay até estar consultável no DW.

                **Onde:** Logs de `forge-batch-ingest`, métricas do Relay e DW.

                **Procedimento:**

                1. **Identifique um evento de teste:** Injete um evento com timestamp conhecido no Relay.

                ```bash
                # Injete evento com timestamp T0
                T0=$(date +%s%N)
                echo "{\"event_id\": \"test-$(date +%s)\", \"timestamp\": $T0, \"tenant_id\": \"test-tenant\", \"payload\": {}}" \
                  | kafka-console-producer --broker-list <relay-broker> --topic <relay-topic>
                ```

                2. **Aguarde o próximo lote:** O job `forge-batch-ingest` roda a cada 60 min. Aguarde até 60 min + tempo de processamento.

                3. **Consulte no DW:** Verifique quando o evento aparece.

                ```sql
                SELECT 
                  event_id,
                  timestamp,
                  CURRENT_TIMESTAMP() AS query_time,
                  DATEDIFF(second, timestamp, CURRENT_TIMESTAMP()) AS latency_seconds
                FROM forge_events_raw
                WHERE event_id = 'test-<timestamp>'
                LIMIT 1;
                ```

                4. **Calcule latência:**

                ```
                Latência = (query_time - T0) em segundos
                ```

                **Alternativa (análise histórica):**

                ```sql
                -- Calcule latência média dos últimos 10 lotes
                WITH lote_stats AS (
                  SELECT 
                    DATE_TRUNC('hour', timestamp) AS lote_hora,
                    MIN(timestamp) AS evento_mais_antigo,
                    MAX(timestamp) AS evento_mais_novo,
                    COUNT(*) AS num_eventos
                  FROM forge_events_raw
                  WHERE timestamp >= CURRENT_TIMESTAMP() - INTERVAL '10 hours'
                  GROUP BY DATE_TRUNC('hour', timestamp)
                )
                SELECT 
                  lote_hora,
                  num_eventos,
                  DATEDIFF(minute, evento_mais_antigo, lote_hora + INTERVAL '60 minutes') AS latencia_estimada_min
                FROM lote_stats
                ORDER BY lote_hora DESC;
                ```

                **Verificação:** Latência típica = 60 min (intervalo do cron) + 40 min (processamento) + 5 min (escrita) = **~105 min (p50)**. Registre o valor real.

                ---

                ## 7. Mapeie consumidores e suas expectativas de frescor

                **Ação:** Identifique quem lê as tabelas do Forge, com que frequência e qual SLA de latência.

                **Onde:** Repositórios de Sentinel, Cerebro, Pepper; logs de queries no DW.

                **Procedimento:**

                1. **Sentinel (tabelas agregadas):**

                ```sql
                -- Queries mais frequentes em Sentinel
                SELECT 
                  query_text,
                  COUNT(*) AS num_execucoes,
                  AVG(execution_time_ms) AS tempo_medio_ms,
                  MAX(execution_time_ms) AS tempo_maximo_ms
                FROM dw_query_log
                WHERE user_app = 'sentinel'
                  AND query_text LIKE '%forge_events_aggregated%'
                  AND timestamp >= CURRENT_TIMESTAMP() - INTERVAL '7 days'
                GROUP BY query_text
                ORDER BY num_execucoes DESC
                LIMIT 10;
                ```

                2. **Cerebro (índice de eventos transformados):**

                ```bash
                # Verifique logs de ingestão do Cerebro
                grep -i "forge\|index" <cerebro-logs> | grep -E "ingested|indexed|latency" | tail -50
                ```

                3. **Pepper (relatórios de billing):**

                ```bash
                # Verifique agendamento e SLA
                crontab -l | grep -i pepper
                # ou
                airflow dags list | grep -i pepper
                airflow dag-details <pepper-dag-id>
                ```

                **Preencha a tabela:**

                | Consumidor | Tabelas lidas | Frequência de leitura | Latência esperada (SLA) | Tipo de query | Criticidade |
                |---|---|---|---|---|---|
                | Sentinel | `forge_events_aggregated`, `forge_events_by_service` | A cada 30 s (dashboard) | < 5 min (p95) | Agregação em tempo real | Alta |
                | Cerebro | `forge_events_raw` | A cada 60 s (indexação) | < 10 min | Scan sequencial | Alta |
                | Pepper | `forge_events_aggregated`, `forge_sla_violations` | 1× por dia (02:00 UTC) | < 30 min | Relatório batch | Média |

                **Verificação:** ≥3 consumidores mapeados; SLAs documentados.

                ---

                ## 8. Meça taxa de falha e impacto de falhas do lote atual

                **Ação:** Quantifique frequência de falhas, causa raiz e impacto em cascata.

                **Onde:** Logs de `forge-batch-ingest`, alertas, tickets de incidente.

                **Comando/Configuração:**

                ```bash
                # Histórico de execuções (últimos 30 dias)
                grep -E "forge-batch-ingest|FAILED|SUCCESS|ERROR" <scheduler-logs> \
                  | grep -E "2024-01-[0-9]{2}" \
                  | tail -100
                ```

                ```sql
                -- Se há tabela de auditoria de jobs
                SELECT 
                  job_name,
                  execution_date,
                  status,
                  error_message,
                  duration_seconds,
                  rows_processed,
                  rows_failed
                FROM job_execution_log
                WHERE job_name = 'forge-batch-ingest'
                  AND execution_date >= CURRENT_DATE - INTERVAL '30 days'
                ORDER BY execution_date DESC;
                ```

                **Cálculos:**

                ```python
                total_runs = <número de execuções em 30 dias>
                failed_runs = <número de falhas>
                failure_rate = failed_runs / total_runs * 100

                print(f"Taxa de falha: {failure_rate:.2f}%")
                print(f"Falhas em 30 dias: {failed_runs}")
                print(f"MTBF (Mean Time Between Failures): {30 * 24 * 60 / failed_runs:.1f} minutos")
                ```

                **Impacto de falha:**

                ```sql
                -- Verifique se um lote falhado causa atraso no próximo
                SELECT 
                  DATE_TRUNC('hour', execution_date) AS lote_hora,
                  status,
                  rows_processed,
                  LAG(rows_processed) OVER (ORDER BY execution_date) AS rows_prev_lote,
                  CASE 
                    WHEN rows_processed > 2 * LAG(rows_processed) OVER (ORDER BY execution_date)
                    THEN 'POSSÍVEL CATCH-UP'
                    ELSE 'NORMAL'
                  END AS observacao
                FROM job_execution_log
                WHERE job_name = 'forge-batch-ingest'
                  AND execution_date >= CURRENT_DATE - INTERVAL '30 days'
                ORDER BY execution_date DESC
                LIMIT 50;
                ```

                **Preencha a tabela:**

                | Métrica | Valor | Período |
                |---|---|---|
                | Total de execuções | ? | 30 dias |
                | Execuções falhadas | ? | 30 dias |
                | Taxa de falha | ? % | 30 dias |
                | MTBF | ? min | 30 dias |
                | Causa raiz mais comum | ? | (ex: timeout, OOM, deadlock) |
                | Impacto: lotes com catch-up | ? % | 30 dias |
                | Impacto: latência adicional por falha | ? min | (ex: +60 min se pula um lote) |

                **Verificação:** Taxa de falha documentada; causa raiz identificada.

