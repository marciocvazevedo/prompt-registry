                (time() * 1000 - forge_watermark_timestamp_ms) > 120000
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Forge Relay watermark está atrasado (> 120 s)"
                description: "Watermark está {{ $value | humanize }}ms atrás"
            
            # Métrica 8: Checkpoint Falhando
            - alert: ForgeRelayCheckpointFailure
              expr: |
                rate(forge_checkpoint_failures_total[5m]) > 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Forge Relay checkpoint está falhando"
                description: "Taxa de falha de checkpoint: {{ $value | humanize }} falhas/s"

