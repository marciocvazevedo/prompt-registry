        ### Etapa 6: Cálculo de Taxa de Erro (Lookup de SLA)
        **Tipo de estado:** Cache de lookup (broadcast)
        **Dados:** Tabela `sla_config` (tenant_id, service_id → sla_threshold)
        **Tamanho estimado:** [SUPOSIÇÃO] 50 MB (1000 tenants × 100 serviços × 50 bytes)
        **Fonte:** Snapshot diário de `sla_config` (atualizar 1× por dia)
        **TTL:** 24 horas
        **Política de expiração:** Recarregar snapshot a cada 24 horas

        **Implementação:**
