        - [ ] **Documentação Pepper:** Contrato de billing documentado; validação de completude clara
        - [ ] **Script de validação:** Implementado e testado; valida todos os consumidores
        - [ ] **Plano de comunicação:** Definido com timeline, emails, reuniões, checklists
        - [ ] **Script de rollback:** Implementado e testado; detecta falhas e faz rollback automático
        - [ ] **Testes de regressão:** Criados para cada consumidor; passam em staging
        - [ ] **Aprovação de consumidores:** Sentinel, Cerebro e Pepper aprovaram compatibilidade
        - [ ] **Documentação:** Todos os arquivos criados e verificados
        - [ ] **Suposições:** Todas marcadas com `[SUPOSIÇÃO]` e justificadas
        - [ ] **Dados faltantes:** Lista de confirmações necessárias documentada

        ---

        ## W. Riscos e mitigação

        | Risco | Probabilidade | Impacto | Mitigação |
        |-------|---------------|--------|-----------|
        | Views não retornam dados (erro de SQL) | Média | Alto | Testar views em staging; validar schema |
        | Consumidores não conseguem ler views (permissões) | Baixa | Alto | Verificar permissões de DW; testar acesso |
        | Lag de 5 min é muito grande (alertas atrasados) | Baixa | Médio | Aceitar trade-off; validar com Sentinel |
        | Lag de 5 min é muito pequeno (dados abertos) | Média | Alto | Aumentar lag para 10 min; validar com Sentinel |
        | Deduplicação não funciona (duplicatas em consumidores) | Média | Alto | Testar deduplicação; validar com Cerebro e Pepper |
        | Consumidores não conseguem lidar com modo `update` | Média | Alto | Usar views; documentar para consumidores |
        | Rollback automático dispara falso (downtime desnecessário) | Baixa | Alto | Ajustar thresholds; testar em staging |
        | Comunicação é confusa (consumidores não entendem) | Média | Médio | Usar exemplos concretos; fazer reuniões |
        | Consumidores não validam em staging (problemas em produção) | Média | Alto | Fazer checklist obrigatório; acompanhar |
        | Billing perde dados (undercharging) | Baixa | Alto | Validar completude; usar view com filtro de dias |
        | Cerebro indexa 2× (tamanho do índice explode) | Média | Médio | Usar event_id como ID; deduplicar |
        | Sentinel dispara alertas falsos (ruído) | Média | Médio | Usar view com lag; testar alertas |

        ---

        ## Dados faltantes e confirmações necessárias

        ### Dados que faltam:
        1. **Contatos técnicos confirmados:** Quem é o tech lead de cada consumidor? (Necessário para comunicação)
        2. **Endpoints de health check:** Sentinel, Cerebro e Pepper têm endpoints de health check? (Necessário para rollback automático)
        3. **Permissões de DW:** Consumidores têm permissão para ler views? (Necessário para validação)
        4. **Lag aceitável:** Qual é o lag máximo aceitável para cada consumidor? (Necessário para definir views)
        5. **Thresholds de rollback:** Qual é o threshold de erro que dispara rollback? (Necessário para rollback automático)
        6. **Slack webhook:** Qual é o webhook de Slack para alertas? (Necessário para notificações)

        ### Confirmações que derrubariam/validariam escolhas futuras:
        - Se **lag de 5 min é muito grande**, aumentar para 10 min
        - Se **lag de 5 min é muito pequeno**, reduzir para 2 min
        - Se **consumidores não conseguem ler views**, usar tabelas subjacentes com filtro manual
        - Se **deduplicação não funciona**, usar staging+merge em vez de append+dedup
        - Se **rollback automático dispara falso**, aumentar thresholds
        - Se **comunicação é confusa**, fazer mais reuniões e exemplos

