        ## Arquitetura Híbrida: Streaming + Batch

        ```
        Relay (eventos contínuos)
        ↓
        Forge Streaming (11 etapas, latência 30 s)
        ├─ Etapas 1, 3, 14: Parsing, Normalização, Exportação
        ├─ Etapas 2, 6, 9: Enriquecimento (broadcast)
        ├─ Etapas 4, 5, 10, 11, 13: Agregação (janelas)
        ↓
        DW (tabelas: by_service, aggregated, by_version, percentiles, billing_events)
        ↓
        Sentinel, Cerebro, Pepper (consumem dados a cada 30 s)

        Forge Batch (3 etapas, latência 1h–24h)
        ├─ Etapa 7: Detecção de Anomalia (1× por hora)
        ├─ Etapa 8: SLA Violations (1× por hora)
        ├─ Etapa 12: Detecção de Mudança (1× por dia)
        ↓
        DW (tabelas: anomalies, sla_violations, behavior_changes)
        ↓
        Sentinel, Cerebro (consumem dados a cada hora/dia)
        ```

