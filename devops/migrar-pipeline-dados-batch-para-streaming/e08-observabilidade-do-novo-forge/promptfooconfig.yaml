        ## 6. Crie documento de decisão arquitetural (ADR)

        **Ação:** Formalize todas as decisões de SLOs, semântica e equivalência em um ADR.

        **Onde:** Arquivo `forge/docs/adr/0002-streaming-slos-and-semantics.md` (novo) no repositório do Forge.

        **Comando/Configuração:**

        ```markdown
        # ADR 0002: SLOs, Semântica de Entrega e Critérios de Equivalência para Forge Streaming

        ## Status
        PROPOSED (aguardando aprovação de stakeholders)

        ## Contexto
        O Forge está migrando de batch (60 min) para streaming (30 s) para reduzir latência de observabilidade.
        Precisamos formalizar SLOs, semântica de entrega e critérios de equivalência para validar que 
        streaming é seguro e equivalente ao batch.

        ## Decisão

        ### 1. SLOs do Forge Streaming
        - **Frescor (p95):** 120 s (2 min) — 52× mais rápido que batch
        - **Completude:** ≥ 99.9% — sem perda de dados
        - **Disponibilidade:** ≥ 99.5% — ~3.6 horas de downtime/mês
        - **RTO (falha de job):** ≤ 5 min — recuperação rápida
        - **RPO:** 0 eventos — sem perda de dados

        ### 2. Semântica de Entrega
        - **Escolhida:** At-Least-Once (ALO) com idempotência
        - **Justificativa:** Completude ≥ 99.9%, latência baixa, custo baixo
        - **Implementação:** Checkpoint a cada 30 s + deduplicação no DW

        ### 3. Critérios de Equivalência
        - **Completude:** ≥ 99.9% (diferença ≤ 0.1% das linhas por hora)
        - **Corretude:** 100% (sem mismatches em agregações)
        - **Schema:** 100% idêntico (mesmas colunas, tipos, ordem)
        - **Validação:** Diária, comparando batch vs streaming das últimas 24 horas

        ### 4. Orçamento de Erro
        - **Completude:** ≤ 0.1% perda → Gatilho se < 99.9% em 2h consecutivas
        - **Corretude:** ≤ 0.1% mismatches → Gatilho se < 99.9% em 1h
        - **Latência:** ≤ 5% violação → Gatilho se > 5% violação em 1h
        - **Disponibilidade:** ≤ 0.5% downtime → Gatilho se < 99.0% em 1 dia

        ### 5. Gatilhos de Rollback
        - **Automático:** Completude, corretude, latência, disponibilidade críticas
        - **Manual:** Decisão de negócio, incidente crítico
        - **Tempo de confirmação:** 5–15 min antes de rollback automático

        ### 6. SLAs Herdados
        - **Sentinel:** Latência 2 min (p95), disponibilidade 99.5%, completude 99.9%
        - **Cerebro:** Latência 2 min (p95), disponibilidade 99.5%, completude 99.9%
        - **Pepper:** Latência 60 min (sem mudança), disponibilidade 99.9%, completude 99.9%, precisão 100%

        ## Consequências

        ### Positivas
        - ✅ Latência reduzida 52× (105 min → 2 min)
        - ✅ Completude aumentada (99.5% → 99.9%)
        - ✅ Disponibilidade aumentada (99.0% → 99.5%)
        - ✅ Recuperação mais rápida (60 min → 5 min)
        - ✅ Sem perda de dados (RPO = 0)

        ### Negativas
        - ❌ Complexidade aumentada (streaming vs batch)
        - ❌ Possíveis duplicatas em reprocessamento (mitigado com idempotência)
        - ❌ Custo de operação pode aumentar (monitoramento, alertas)
        - ❌ Consumidores precisam lidar com duplicatas

        ### Mitigações
        - Implementar deduplicação no DW (INSERT ... ON CONFLICT DO NOTHING)
        - Validação diária de equivalência (script automatizado)
        - Gatilhos automáticos de rollback (sem intervenção manual)
        - Testes de regressão com consumidores (Sentinel, Cerebro, Pepper)

        ## Aprovação Necessária
        - [ ] Tech Lead do Forge
        - [ ] Tech Lead de Sentinel
        - [ ] Tech Lead de Cerebro
        - [ ] Tech Lead de Pepper
        - [ ] VP de Engenharia

        ## Referências
        - Etapa 1: Inventário e Baseline
        - Etapa 2: Metas, SLOs e Critérios de Equivalência (este documento)
        - Etapa 3: Arquitetura de Streaming
        ```

        **Verificação:** ADR criado; pronto para revisão e aprovação.

