            ## Dados faltantes e confirmações necessárias

            ### Dados que faltam:

            1. **Taxa real de produção no Relay:** Qual é a taxa esperada de eventos/s em produção? (Necessário para threshold de carga)
            2. **Retenção real no Relay:** Quantos dias de dados são retidos no Relay? (Necessário para limite de espaço)
            3. **Capacidade real do DW:** Quanto espaço em disco está disponível? (Necessário para limite de espaço)
            4. **Capacidade real do Cluster Spark:** Quantos nós e qual é a memória total? (Necessário para limite de CPU/memória)
            5. **Taxa real de divergência em staging:** Qual é a taxa de divergência observada em staging? (Necessário para validar threshold de 0,1%)
            6. **Tempo real de reconciliação:** Quanto tempo leva para reconciliar todas as tabelas? (Necessário para frequência de reconciliação)
            7. **Custo real de dual-run:** Qual é o custo adicional de rodar batch e streaming em paralelo? (Necessário para ROI)
            8. **Política de retenção de dados:** Quantos dias de dados devem ser retidos? (Necessário para limpeza de dados)
            9. **Janela de manutenção:** Qual é o melhor horário para rodar reconciliação? (Necessário para agendar jobs)
            10. **Contatos de escalação:** Quem deve ser notificado se divergências passarem do threshold? (Necessário para alertas)

            ### Confirmações que derrubariam/validariam escolhas futuras:

            - Se **taxa de divergência > 0,5%**, aumentar threshold ou investigar bug em streaming
            - Se **reconciliação leva > 2 horas**, reduzir granularidade ou aumentar paralelismo
            - Se **carga no Relay > 2000 evt/s**, aumentar capacidade ou reduzir frequência de streaming
            - Se **espaço em disco < 100 GB**, aumentar capacidade ou limpar dados antigos
            - Se **CPU do Spark > 90%**, aumentar cluster ou reduzir frequência de batch
            - Se **consumidores são afetados**, validar que views apontam para batch
            - Se **cutover é aprovado mas streaming falha**, ter runbook de rollback
            - Se **dual-run custa > 2× batch**, considerar reduzir frequência de streaming

