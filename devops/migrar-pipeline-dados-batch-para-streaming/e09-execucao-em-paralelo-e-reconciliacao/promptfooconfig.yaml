        **Procedimento:**

        ```sql
        -- ============================================================
        -- VIEWS DE COMPATIBILIDADE: Streaming ≡ Batch
        -- ============================================================
        -- Objetivo: Expor dados de streaming com mesma interface que batch
        -- Consumidores leem destas views, não das tabelas subjacentes
        -- ============================================================

        -- ============================================================
        -- 1. VIEW: aggregated_hourly (compatível com batch)
        -- ============================================================
        -- Problema: Tabela subjacente tem modo `update` (janelas abertas)
        -- Solução: View retorna apenas dados de partições fechadas
        -- ============================================================

        CREATE OR REPLACE VIEW forge.aggregated_hourly AS
        SELECT
        window_start,
        window_end,
        tenant_id,
        SUM(request_count) AS request_count,
        SUM(error_count) AS error_count,
        SUM(error_count) / NULLIF(SUM(request_count), 0) AS error_rate,
        MAX(p50_latency) AS p50_latency,
        MAX(p95_latency) AS p95_latency,
        MAX(p99_latency) AS p99_latency,
        MAX(ingestion_timestamp) AS last_updated
        FROM forge.aggregated
        WHERE
        -- Ler apenas partições fechadas (5 min atrás)
        window_end < CURRENT_TIMESTAMP() - INTERVAL '5 minutes'
        GROUP BY
        window_start,
        window_end,
        tenant_id
        ORDER BY
        window_end DESC,
        tenant_id;

