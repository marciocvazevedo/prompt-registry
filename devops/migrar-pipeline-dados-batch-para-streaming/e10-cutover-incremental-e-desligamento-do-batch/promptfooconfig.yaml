            ### Isolamento em Nível de Tabela

            #### Opção 1: Diretórios Separados (Recomendado)
            **Vantagem:** Simples, sem mudanças em schema
            **Desvantagem:** Consumidores precisam saber qual diretório ler

            ```python
            # Batch escreve em /data/forge/batch/aggregated
            df_batch.write.mode("append").parquet("/data/forge/batch/aggregated")

            # Streaming escreve em /data/forge/streaming/aggregated
            df_streaming.write.mode("append").parquet("/data/forge/streaming/aggregated")

            # Consumidores leem de /data/forge/batch/aggregated (sem mudança)
            df_consumer = spark.read.parquet("/data/forge/batch/aggregated")
            ```

            #### Opção 2: Schema Separado (Se usar SQL)
            **Vantagem:** Isolamento completo em nível de banco de dados
            **Desvantagem:** Requer mudanças em queries de consumidores

            ```sql
            -- Batch escreve em schema forge_batch
            CREATE SCHEMA IF NOT EXISTS forge_batch;
            CREATE TABLE forge_batch.aggregated AS SELECT ...;

            -- Streaming escreve em schema forge_streaming
            CREATE SCHEMA IF NOT EXISTS forge_streaming;
            CREATE TABLE forge_streaming.aggregated AS SELECT ...;

            -- Consumidores leem de forge_batch (sem mudança)
            SELECT * FROM forge_batch.aggregated;
            ```

            #### Opção 3: Sufixo de Tabela
            **Vantagem:** Simples, sem mudanças em estrutura de diretórios
            **Desvantagem:** Nomes de tabela ficam longos

            ```python
            # Batch escreve em aggregated_batch
            df_batch.write.mode("append").parquet("/data/forge/aggregated_batch")

            # Streaming escreve em aggregated_streaming
            df_streaming.write.mode("append").parquet("/data/forge/aggregated_streaming")

            # Consumidores leem de aggregated_batch (sem mudança)
            df_consumer = spark.read.parquet("/data/forge/aggregated_batch")
            ```

            ### Recomendação: Opção 1 (Diretórios Separados)

            **Razão:**
            - Simples de implementar (sem mudanças em schema)
            - Fácil de limpar (remover `/data/forge/streaming/` após dual-run)
            - Consumidores não precisam mudar (continuam lendo `/data/forge/batch/`)
            - Reconciliação é simples (comparar dois diretórios)

            ### Implementação

