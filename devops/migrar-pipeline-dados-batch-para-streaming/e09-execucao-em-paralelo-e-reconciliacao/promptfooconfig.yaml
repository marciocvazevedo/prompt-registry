        ## X. Ponto de não-retorno

        **Ponto de não-retorno:** Após o passo 4 (deploy de dashboard em produção), o sistema começa a monitorar e exibir métricas de migração.

        **Por quê:** Uma vez que dashboard está ativo, remover métricas requer:
        1. Parar coleta de métricas em Prometheus
        2. Remover dados históricos de Prometheus
        3. Perder histórico de migração
        4. Impossível comparar batch vs streaming

        **Mitigação:** Antes do passo 4, testar instrumentação em staging (passos 1–3).

        ---

        ## Y. Rollback

        **Procedimento de rollback (se necessário após passo 4):**

        ```bash
        #!/bin/bash
        # Script de rollback: remover instrumentação e alertas
        set -e
        echo "=== Rollback: Remover Instrumentação e Alertas ==="

        # 1. Remover alertas
        echo "1. Removendo alertas..."
        kubectl delete prometheusrule forge-streaming-alerts -n forge

        # 2. Remover dashboard
        echo "2. Removendo dashboard..."
        curl -X DELETE http://grafana:3000/api/dashboards/uid/forge-migration

        # 3. Remover métricas customizadas
        echo "3. Removendo métricas customizadas..."
        # Remover jobs de Prometheus que coletam métricas customizadas
        kubectl delete configmap prometheus-config -n monitoring
        kubectl rollout restart deployment prometheus -n monitoring

        # 4. Remover código de instrumentação
        echo "4. Removendo código de instrumentação..."
        git revert HEAD~3..HEAD  # Reverter últimos 3 commits

        # 5. Remover testes de alertas
        echo "5. Removendo testes de alertas..."
        rm -f forge/tests/test_alerts.py

        echo "=== Rollback concluído ==="
        ```

