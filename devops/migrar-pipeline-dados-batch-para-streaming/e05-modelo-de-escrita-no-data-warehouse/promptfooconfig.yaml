        ## 8. Crie código de transformação batch para Etapas 7, 8, 12

        **Ação:** Implemente código Spark batch para etapas que permanecem em batch.

        **Onde:** Arquivo `forge/jobs/batch_transform_anomalies.py` (novo) no repositório do Forge.

        **Procedimento:**

        ```python
        #!/usr/bin/env python3
        """
        Forge Batch Transformation Job — Anomalies, SLA Violations, Behavior Changes
        Implementa as 3 etapas que permanecem em batch.
        Executado 1× por hora (Etapas 7, 8) ou 1× por dia (Etapa 12).
        """

        from pyspark.sql import SparkSession
        from pyspark.sql.functions import (
            col, window, count, sum as spark_sum, avg, stddev, abs,
            date_trunc, md5, concat_ws, lit, current_timestamp
        )
        import logging
        from datetime import datetime, timedelta

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        # Configuração
        DW_PATH = "/data/forge"
        OUTPUT_PATH = "/data/forge"

        class ForgeAnomalyDetection:
            def __init__(self, spark):
                self.spark = spark
                self.logger = logger
            
            # ========== Etapa 7: Detecção de Anomalia ==========
            def stage_7_anomaly_detection(self, lookback_hours=24):
                """Etapa 7: Detecção de anomalia (histórico de 24h)"""
                self.logger.info(f"Etapa 7: Detecção de Anomalia (últimas {lookback_hours}h)")
                
                # Ler agregações dos últimos 24 horas
                cutoff_time = datetime.utcnow() - timedelta(hours=lookback_hours)
                df_aggregated = self.spark.read.parquet(f"{DW_PATH}/aggregated") \
                    .filter(col("window_start") >= cutoff_time)
                
                # Calcular estatísticas por tenant
                df_stats = df_aggregated.groupBy("tenant_id").agg(
                    avg("total_value").alias("mean_value"),
                    stddev("total_value").alias("stddev_value"),
                    count("*").alias("sample_count")
                )
                
                # Detectar anomalias (z-score > 3)
                df_anomalies = df_aggregated.join(
                    df_stats,
                    on="tenant_id"
                ).withColumn(
                    "z_score",
                    (col("total_value") - col("mean_value")) / col("stddev_value")
                ).filter(
                    abs(col("z_score")) > 3
                ).withColumn(
                    "anomaly_id",
                    md5(concat_ws("|", col("tenant_id"), col("window_start"), col("z_score")))
                ).select(
                    col("window_start"),
                    col("window_end"),
                    col("tenant_id"),
                    col("total_value"),
                    col("mean_value"),
                    col("stddev_value"),
                    col("z_score"),
                    col("anomaly_id"),
                    lit(datetime.utcnow()).alias("detection_time")
                )
                
                # Deduplicar por anomaly_id
                df_deduplicated = df_anomalies.dropDuplicates(["anomaly_id"])
                
                # Escrever
                df_deduplicated.write.mode("overwrite") \
                    .parquet(f"{OUTPUT_PATH}/anomalies")
                
                self.logger.info(f"Anomalias detectadas: {df_deduplicated.count()}")
                return df_deduplicated
            
            # ========== Etapa 8: SLA Violations ==========
            def stage_8_sla_violations(self, lookback_hours=24):
                """Etapa 8: Detecção de SLA violations (histórico de 24h)"""
                self.logger.info(f"Etapa 8: SLA Violations (últimas {lookback_hours}h)")
                
                # Ler agregações por serviço dos últimos 24 horas
                cutoff_time = datetime.utcnow() - timedelta(hours=lookback_hours)
                df_by_service = self.spark.read.parquet(f"{DW_PATH}/by_service") \
                    .filter(col("window_start") >= cutoff_time)
                
                # Ler SLA config
                df_sla = self.spark.read.parquet("/data/sla_config")
                
                # Calcular taxa de erro
                df_error_rates = df_by_service.filter(
                    col("metric_name") == "error"
                ).join(
                    df_sla,
                    on=["tenant_id", "service_id"],
                    how="left"
                ).withColumn(
                    "error_rate",
                    col("total_value") / col("event_count")
                ).withColumn(
                    "sla_breached",
                    col("error_rate") > col("sla_threshold")
                )
                
                # Detectar violações
                df_violations = df_error_rates.filter(
                    col("sla_breached") == True
                ).withColumn(
                    "violation_id",
                    md5(concat_ws("|", col("tenant_id"), col("service_id"), col("window_start")))
                ).select(
                    col("window_start"),
                    col("window_end"),
                    col("tenant_id"),
                    col("service_id"),
                    col("error_rate"),
                    col("sla_threshold"),
                    col("violation_id"),
                    lit(datetime.utcnow()).alias("detection_time")
                )
                
                # Deduplicar por violation_id
                df_deduplicated = df_violations.dropDuplicates(["violation_id"])
                
                # Escrever
                df_deduplicated.write.mode("overwrite") \
                    .parquet(f"{OUTPUT_PATH}/sla_violations")
                
                self.logger.info(f"Violações detectadas: {df_deduplicated.count()}")
                return df_deduplicated
            
            # ========== Etapa 12: Detecção de Mudança de Comportamento ==========
            def stage_12_behavior_changes(self, lookback_days=7):
                """Etapa 12: Detecção de mudança de comportamento (histórico de 7 dias)"""
                self.logger.info(f"Etapa 12: Detecção de Mudança (últimos {lookback_days} dias)")
                
                # Ler agregações dos últimos 7 dias
                cutoff_time = datetime.utcnow() - timedelta(days=lookback_days)
                df_aggregated = self.spark.read.parquet(f"{DW_PATH}/aggregated") \
                    .filter(col("window_start") >= cutoff_time)
                
                # Calcular baseline (média dos últimos 7 dias)
                df_baseline = df_aggregated.groupBy("tenant_id").agg(
                    avg("total_value").alias("baseline_value"),
                    count("*").alias("sample_count")
                )
                
                # Detectar mudanças (> 50% de desvio)
                df_changes = df_aggregated.join(
                    df_baseline,
                    on="tenant_id"
                ).withColumn(
                    "change_pct",
                    abs(col("total_value") - col("baseline_value")) / col("baseline_value") * 100
                ).filter(
                    col("change_pct") > 50
                ).withColumn(
                    "change_id",
                    md5(concat_ws("|", col("tenant_id"), col("window_start"), col("change_pct")))
                ).select(
                    col("window_start"),
                    col("window_end"),
                    col("tenant_id"),
                    col("total_value"),
                    col("baseline_value"),
                    col("change_pct"),
                    col("change_id"),
                    lit(datetime.utcnow()).alias("detection_time")
                )
                
                # Deduplicar por change_id
                df_deduplicated = df_changes.dropDuplicates(["change_id"])
                
                # Escrever
                df_deduplicated.write.mode("overwrite") \
                    .parquet(f"{OUTPUT_PATH}/behavior_changes")
                
                self.logger.info(f"Mudanças detectadas: {df_deduplicated.count()}")
                return df_deduplicated

        def create_spark_session():
            """Cria sessão Spark"""
            return SparkSession.builder \
                .appName("forge-batch-anomalies") \
                .getOrCreate()

        def main():
            """Função principal"""
            spark = create_spark_session()
            
            detector = ForgeAnomalyDetection(spark)
            
            # Executar Etapas 7 e 8 (1× por hora)
            logger.info("Executando Etapas 7 e 8 (1× por hora)")
            detector.stage_7_anomaly_detection(lookback_hours=24)
            detector.stage_8_sla_violations(lookback_hours=24)
            
            # Executar Etapa 12 (1× por dia)
            logger.info("Executando Etapa 12 (1× por dia)")
            detector.stage_12_behavior_changes(lookback_days=7)
            
            logger.info("Batch job concluído")

        if __name__ == "__main__":
            main()
        ```

