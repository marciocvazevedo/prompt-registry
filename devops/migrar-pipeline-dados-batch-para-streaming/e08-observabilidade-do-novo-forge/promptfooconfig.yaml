        ### Etapa 14: Exportação para Cerebro (Índice de Logs)
        **Tipo:** Sem estado (stateless)
        **Entrada:** Tabela `forge_events_enriched`
        **Saída:** Tópico Kafka `forge-events-indexed` (ou índice Elasticsearch)
        **Lógica:**
        - Selecionar campos relevantes para busca
        - Serializar para JSON
        - Enviar para Cerebro (Kafka ou Elasticsearch)

        **Código (batch):**
        \`\`\`python
        df_enriched = spark.read.parquet("/data/forge/enriched")
        df_for_cerebro = df_enriched.select(
            col("event_id"),
            col("tenant_id"),
            col("service_id"),
            col("timestamp"),
            col("metric_name"),
            col("metric_value"),
            col("tags"),
            to_json(struct("*")).alias("json_payload")
        )
        df_for_cerebro.write.format("kafka") \
            .option("kafka.bootstrap.servers", "<relay-broker>") \
            .option("topic", "forge-events-indexed") \
            .mode("append") \
            .save()
        \`\`\`

        **Classificação:** ✅ Sem estado → Adequado para streaming

