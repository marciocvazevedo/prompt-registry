      INSUMO_ETAPA_3: |
        # Etapa 3 de 10: Contrato de Consumo do Relay — Procedimento Técnico

        **Depende de:** Etapas 1 e 2.

        ---

        ## 0. Pré-requisitos

        - [ ] Acesso de leitura/escrita ao repositório de configuração do Relay (ex: `relay/config/`, Terraform, Helm)
        - [ ] Acesso de leitura ao repositório de configuração do Forge (`forge/config/`)
        - [ ] Acesso ao console/API do Relay para inspecionar tópicos, partições, retenção, métricas
        - [ ] Acesso ao cluster Kubernetes/Spark onde o Forge será deployado
        - [ ] Contato técnico confirmado no time de Relay para validar mudanças de retenção e quotas
        - [ ] Resultado da Etapa 1 disponível: tópico de entrada, schema, volume (evt/s), tamanho médio (bytes)
        - [ ] Resultado da Etapa 2 disponível: SLOs (latência p95 = 120 s, completude ≥ 99.9%), semântica ALO, critérios de equivalência
        - [ ] Ferramentas: `kafka-topics`, `kafka-consumer-groups`, `kafka-configs`, `curl`, editor de YAML, `git`
        - [ ] Permissão para criar consumer groups no Relay sem impacto em produção
        - [ ] Permissão para alterar retenção do tópico (coordenar com time de Relay)
        - [ ] Acesso a logs de consumo do Relay (últimos 30 dias) para validar padrões de acesso

        ---

        ## 1. Mapeie o tópico de entrada e valide schema

        **Ação:** Confirme o tópico exato que o Forge consumirá, valide schema e colete metadados.

        **Onde:** Console do Relay ou repositório de configuração.

        **Comando/Configuração:**

        ```bash
        # Listar tópicos relacionados ao Forge
        kafka-topics --bootstrap-server <relay-broker> --list | grep -i forge

        # Exemplo de saída esperada (baseado em Etapa 1):
        # forge-events-raw
        # forge-events-raw-dlq (dead letter queue, se existir)

        # Confirmar tópico de entrada
        RELAY_TOPIC="forge-events-raw"  # [SUPOSIÇÃO] baseado em Etapa 1
        echo "Tópico de entrada: $RELAY_TOPIC"

        # Descrever tópico
        kafka-topics --bootstrap-server <relay-broker> \
          --describe \
          --topic $RELAY_TOPIC

        # Saída esperada:
        # Topic: forge-events-raw
        # PartitionCount: 32
        # ReplicationFactor: 3
        # Configs: retention.ms=604800000, compression.type=snappy, ...
        ```

        **Verificação:**

        ```bash
        # Confirmar que tópico existe e tem partições
        kafka-topics --bootstrap-server <relay-broker> \
          --describe \
          --topic $RELAY_TOPIC | grep -E "PartitionCount|ReplicationFactor"

        # Esperado:
        # PartitionCount: 32 (ou valor similar)
        # ReplicationFactor: 3
        ```

        **Documentação:**

        Crie arquivo `forge/config/relay-contract.md`:

        ```markdown
        # Contrato de Consumo do Relay — Forge Streaming

        ## Tópico de Entrada
        - **Nome:** `forge-events-raw`
        - **Partições:** 32 [SUPOSIÇÃO: baseado em volume de Etapa 1]
        - **Replication Factor:** 3
        - **Compressão:** snappy
        - **Retenção:** 7 dias (604800000 ms) [SUPOSIÇÃO: padrão do Relay]

        ## Schema
        - **Formato:** Avro (ou JSON/Protobuf conforme Etapa 1)
        - **Versão:** 1.0
        - **Localização:** Schema Registry em `http://<schema-registry>:8081/subjects/forge-events-raw-value/versions/latest`

        ## Exemplo de Evento
        ```json
