        ## 5. Implemente isolamento e leitura consistente

        **Ação:** Defina como consumidores leem dados durante escrita sem inconsistências.

        **Onde:** Arquivo `forge/config/read-consistency-strategy.md` (novo) no repositório do Forge.

        **Procedimento:**

        ```markdown
        # Estratégia de Isolamento e Leitura Consistente

        ## Problema
        Enquanto streaming escreve dados (modo `update`), consumidores leem dados.
        Isso pode causar:
        - **Leitura suja:** Ler dados parciais de uma janela ainda aberta
        - **Leitura fantasma:** Ler dados que foram atualizados retroativamente
        - **Inconsistência:** Agregações não batem com eventos

        **Exemplo:**
        ```
        Tempo 10:00–10:30 (janela 1)
        - 10:15: Streaming escreve (window_1, tenant_1, total=100, count=10)
        - 10:20: Sentinel lê (window_1, tenant_1, total=100, count=10) ← Leitura suja!
        - 10:25: Evento atrasado chega, streaming atualiza (window_1, tenant_1, total=110, count=11)
        - 10:30: Sentinel lê novamente (window_1, tenant_1, total=110, count=11) ← Inconsistência!
        ```

        ## Estratégia: Leitura de Partições Fechadas

        ### Definição
        Consumidores devem ler apenas partições **fechadas** (marcadas com `_CLOSED`).

        ### Implementação

        #### Opção 1: Usar Marcador de Fechamento
        ```python
        def read_closed_partitions(spark, table_name):
            """Ler apenas partições fechadas"""
            # Ler tabela de metadados
            df_metadata = spark.read.parquet("/data/forge/partition_metadata")
            closed_hours = df_metadata.filter(col("status") == "closed").select("hour").collect()
            closed_hours_list = [row["hour"] for row in closed_hours]
            
            # Ler apenas partições fechadas
            df = spark.read.parquet(f"/data/forge/{table_name}")
            df_filtered = df.filter(col("hour").isin(closed_hours_list))
            
            return df_filtered

        # Usar em Sentinel
        df_aggregated = read_closed_partitions(spark, "aggregated")
        df_aggregated.show()
        ```

        #### Opção 2: Usar Timestamp de Fechamento
        ```python
        def read_closed_partitions_by_time(spark, table_name, lag_minutes=5):
            """Ler partições que foram fechadas há pelo menos lag_minutes"""
            from datetime import datetime, timedelta
            
            # Calcular hora de corte (5 min atrás)
            cutoff_time = datetime.utcnow() - timedelta(minutes=lag_minutes)
            
            # Ler apenas partições anteriores ao corte
            df = spark.read.parquet(f"/data/forge/{table_name}")
            df_filtered = df.filter(col("window_end") < cutoff_time)
            
            return df_filtered

        # Usar em Sentinel
        df_aggregated = read_closed_partitions_by_time(spark, "aggregated", lag_minutes=5)
        df_aggregated.show()
        ```

        #### Opção 3: Usar Delta Lake (Recomendado)
        ```python
        # Delta Lake suporta time travel e snapshot isolation
        df = spark.read.format("delta") \
            .option("versionAsOf", 0) \
            .load("/data/forge/aggregated")

        # Ou usar timestamp
        df = spark.read.format("delta") \
            .option("timestampAsOf", "2024-01-15 10:00:00") \
            .load("/data/forge/aggregated")
        ```

        ---

        ## Recomendações por Consumidor

        ### Sentinel (Dashboards)
        **Requisito:** Dados finais (partições fechadas)

        **Query:**
        ```sql
        SELECT tenant_id, service_id, SUM(total_value) as total
        FROM aggregated
        WHERE hour < date_trunc('hour', current_timestamp() - interval 5 minutes)
        GROUP BY tenant_id, service_id
        ```

        **Justificativa:** Usar dados de 5 min atrás garante que partição está fechada

        ### Cerebro (Indexação)
        **Requisito:** Dados quase em tempo real (pode ter duplicatas)

        **Implementação:**
        ```python
        # Ler todos os eventos (incluindo partições abertas)
        df_events = spark.read.parquet("/data/forge/enriched")

        # Deduplicar por event_id (Cerebro faz isso)
        df_events_dedup = df_events.dropDuplicates(["event_id"])

        # Enviar para Elasticsearch
        df_events_dedup.write.format("es") \
            .option("es.nodes", "<elasticsearch-nodes>") \
            .option("es.resource", "forge-events") \
            .mode("append") \
            .save()
        ```

        ### Pepper (Billing)
        **Requisito:** Dados finais (partições fechadas)

        **Query:**
        ```sql
        SELECT tenant_id, SUM(unique_event_count) as total_events
        FROM billing_events
        WHERE day < current_date()  -- Apenas dias completos
        GROUP BY tenant_id
        ```

        **Justificativa:** Usar dados de dias anteriores garante que partição está fechada

        ---

        ## Validação de Consistência

        ```python
        def validate_read_consistency(spark):
            """Validar que leituras são consistentes"""
            # Ler dados 2× com 1 min de intervalo
            df_read_1 = read_closed_partitions(spark, "aggregated")
            count_1 = df_read_1.count()
            
            time.sleep(60)
            
            df_read_2 = read_closed_partitions(spark, "aggregated")
            count_2 = df_read_2.count()
            
            # Validar
            if count_1 == count_2:
                print("✅ Leituras são consistentes")
            else:
                print(f"❌ Leituras inconsistentes: {count_1} vs {count_2}")
        ```

        ---

        ## Impacto em Latência

        ```
        Sem lag (ler dados abertos):
        - Latência: 30 s (dados chegam em tempo real)
        - Risco: Leitura suja, inconsistência

        Com lag de 5 min (ler dados fechados):
        - Latência: 5 min (dados chegam com 5 min de atraso)
        - Risco: Nenhum (dados são finais)

        Recomendação: Usar lag de 5 min para dados críticos (billing, SLA)
                    Usar lag de 0 min para dados não-críticos (dashboards)
        ```

        ```

        **Verificação:**

        ```bash
        # Validar que leituras são consistentes
        spark-submit \
        --master local[4] \
        forge/jobs/validate_consistency.py
        # Esperado: leituras são consistentes
        ```

