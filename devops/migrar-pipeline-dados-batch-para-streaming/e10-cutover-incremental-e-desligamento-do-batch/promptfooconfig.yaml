        ## 6. Crie alertas para detecção de falhas

        **Ação:** Implementar alertas em Prometheus para os 5 modos de falha.

        **Onde:** Arquivo `forge/monitoring/failure-detection-alerts.yaml` (novo) no repositório do Forge.

        **Procedimento:**

        ```yaml
        # forge/monitoring/failure-detection-alerts.yaml
        apiVersion: monitoring.coreos.com/v1
        kind: PrometheusRule
        metadata:
          name: forge-failure-detection
          namespace: forge
        spec:
          groups:
          - name: forge.failure.detection
            interval: 30s
            rules:
            # ========== Modo 1: Taxa de Consumo Baixa ==========
            - alert: ForgeConsumptionRateLow
              expr: |
                rate(kafka_consumergroup_lag{group="forge-streaming-v1"}[5m]) < 100
              for: 10m
              labels:
                severity: warning
                mode: "1"
              annotations:
                summary: "Forge: Taxa de consumo baixa (< 100 evt/s)"
                description: "Taxa de consumo está {{ $value | humanize }} eventos/s"
                runbook: "forge/docs/oncall-runbook.md#modo-de-falha-1"
            
            # ========== Modo 2: Muitos Eventos Inválidos ==========
            - alert: ForgeInvalidEventsHigh
              expr: |
                rate(forge_invalid_events_total[5m]) > 100 / 60
              for: 5m
              labels:
                severity: warning
                mode: "2"
              annotations:
                summary: "Forge: Taxa alta de eventos inválidos (> 100/min)"
                description: "Taxa de eventos inválidos: {{ $value | humanize }} eventos/s"
                runbook: "forge/docs/oncall-runbook.md#modo-de-falha-2"
            
            # ========== Modo 3: Offset Commit Falhando ==========
            - alert: ForgeOffsetCommitFailure
              expr: |
                rate(kafka_consumergroup_commit_latency_total{group="forge-streaming-v1"}[5m]) == 0
              for: 5m
              labels:
                severity: critical
                mode: "3"
              annotations:
                summary: "Forge: Offset commit falhando"
                description: "Consumer group não consegue fazer commit de offsets"
                runbook: "forge/docs/oncall-runbook.md#modo-de-falha-3"
            
            # ========== Modo 4: Latência Alta ==========
            - alert: ForgeLatencyHigh
              expr: |
                histogram_quantile(0.95, rate(forge_latency_seconds_bucket[5m])) > 120
              for: 5m
              labels:
                severity: warning
                mode: "4"
              annotations:
                summary: "Forge: Latência p95 alta (> 120 s)"
                description: "Latência p95: {{ $value | humanize }}s"
                runbook: "forge/docs/oncall-runbook.md#modo-de-falha-4"
            
            # ========== Modo 5: Dados Duplicados ==========
            - alert: ForgeDuplicateEventsDetected
              expr: |
                rate(forge_duplicate_events_total[5m]) > 10
              for: 5m
              labels:
                severity: warning
                mode: "5"
              annotations:
                summary: "Forge: Eventos duplicados detectados"
                description: "Taxa de eventos duplicados: {{ $value | humanize }} eventos/s"
                runbook: "forge/docs/oncall-runbook.md#modo-de-falha-5"
            
            # ========== Alertas Adicionais ==========
            - alert: ForgeDeployError
              expr: |
                rate(forge_deploy_errors_total[5m]) > 0
              for: 1m
              labels:
                severity: critical
                mode: "deploy"
              annotations:
                summary: "Forge: Erro de deploy detectado"
                description: "Taxa de erro de deploy: {{ $value | humanize }} erros/s"
                runbook: "forge/docs/oncall-runbook.md"
            
            - alert: ForgeDependencyError
              expr: |
                rate(forge_dependency_errors_total[5m]) > 0
              for: 5m
              labels:
                severity: critical
                mode: "dependency"
              annotations:
                summary: "Forge: Erro de dependência detectado"
                description: "Taxa de erro de dependência: {{ $value | humanize }} erros/s"
                runbook: "forge/docs/oncall-runbook.md"
            
            - alert: ForgeTransientErrorRetryExhausted
              expr: |
                rate(forge_transient_errors_total[5m]) > 10
              for: 5m
              labels:
                severity: warning
                mode: "transient"
              annotations:
                summary: "Forge: Muitos erros transitórios (retry exhausted)"
                description: "Taxa de erro transitório: {{ $value | humanize }} erros/s"
                runbook: "forge/docs/oncall-runbook.md"
            
            - alert: ForgeConsumerLagHigh
              expr: |
                kafka_consumergroup_lag{group="forge-streaming-v1"} > 100000
              for: 5m
              labels:
                severity: warning
                mode: "lag"
              annotations:
                summary: "Forge: Consumer lag alto (> 100k eventos)"
                description: "Consumer lag: {{ $value | humanize }} eventos"
                runbook: "forge/docs/oncall-runbook.md"
            
            - alert: ForgeWatermarkLate
              expr: |
                (time() * 1000 - forge_watermark_timestamp_ms) > 120000
              for: 5m
              labels:
                severity: warning
                mode: "watermark"
              annotations:
                summary: "Forge: Watermark atrasado (> 120 s)"
                description: "Watermark está {{ $value | humanize }}ms atrás"
                runbook: "forge/docs/oncall-runbook.md"
            
            - alert: ForgeCheckpointFailure
              expr: |
                rate(forge_checkpoint_failures_total[5m]) > 0
              for: 5m
              labels:
                severity: critical
                mode: "checkpoint"
              annotations:
                summary: "Forge: Checkpoint falhando"
                description: "Taxa de falha de checkpoint: {{ $value | humanize }} falhas/s"
                runbook: "forge/docs/oncall-runbook.md"
        ```

        **Verificação:**

        ```bash
        # Validar regras de alerta
        kubectl apply -f forge/monitoring/failure-detection-alerts.yaml --dry-run=client
        # Esperado: validação passa sem erros

        # Deploy em staging
        kubectl apply -f forge/monitoring/failure-detection-alerts.yaml -n forge-staging

        # Verificar alertas
        kubectl get prometheusrule -n forge-staging
        # Esperado: forge-failure-detection está listado
        ```

