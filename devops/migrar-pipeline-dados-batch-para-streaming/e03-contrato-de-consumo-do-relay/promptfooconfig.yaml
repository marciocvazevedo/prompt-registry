        ## 2. Defina semântica de entrega alvo e implicações por consumidor

        **Ação:** Formalize a semântica de entrega (at-least-once, exactly-once, etc.) e mapeie implicações para cada consumidor.

        **Onde:** Arquivo `forge/docs/delivery-semantics.md` (novo) no repositório do Forge.

        **Procedimento:**

        ### 2.1 Escolha da semântica de entrega

        **Ação:** Analise trade-offs entre semânticas e escolha a mais apropriada.

        **Comando/Configuração:**

        ```markdown
        # Semântica de Entrega do Forge (Streaming)

        ## Opções e Trade-offs

        ### 1. At-Most-Once (AMO)
        - **Definição:** Cada evento é processado 0 ou 1 vez.
        - **Implementação:** Sem checkpoint; sem retry.
        - **Vantagens:** Latência mínima; simplicidade.
        - **Desvantagens:** Perda de dados em falhas; viola SLO de completude (99.9%).
        - **Adequado para:** Métricas aproximadas (ex: amostragem).
        - **Decisão:** ❌ REJEITADO — Completude é crítica para billing (Pepper).

        ### 2. At-Least-Once (ALO)
        - **Definição:** Cada evento é processado ≥ 1 vez.
        - **Implementação:** Checkpoint + retry; sem deduplicação.
        - **Vantagens:** Sem perda de dados; latência baixa; simples.
        - **Desvantagens:** Duplicatas possíveis; requer idempotência no consumidor.
        - **Adequado para:** Agregações (SUM, COUNT com deduplicação).
        - **Decisão:** ✅ ACEITO — Semântica padrão com idempotência.

        ### 3. Exactly-Once (EXO)
        - **Definição:** Cada evento é processado exatamente 1 vez.
        - **Implementação:** Checkpoint + transação atômica (Forge + DW).
        - **Vantagens:** Sem duplicatas; sem perda.
        - **Desvantagens:** Latência maior; complexidade (2-phase commit); custo.
        - **Adequado para:** Billing, contabilidade.
        - **Decisão:** ⚠️ CONDICIONAL — Usar apenas para tabelas críticas (ex: `forge_sla_violations`).

        ## Semântica Escolhida: At-Least-Once com Idempotência

        **Justificativa:**
        - Completude ≥ 99.9% é alcançável com ALO + retry.
        - Idempotência é simples: deduplicar por `event_id` no DW.
        - Latência é baixa: sem overhead de 2-phase commit.
        - Custo é menor: sem transações distribuídas.

        **Implementação:**
        1. Forge consome do Relay com checkpoint a cada 30 s.
        2. Forge processa eventos em blocos de 30 s.
        3. Forge escreve no DW com `INSERT ... ON CONFLICT DO NOTHING` (ou equivalente).
        4. Se falha antes de checkpoint, reprocessa bloco (duplicatas possíveis).
        5. Deduplicação no DW garante idempotência.

        **Garantias:**
        - ✅ Sem perda de dados (checkpoint + retry).
        - ✅ Sem duplicatas visíveis (deduplicação no DW).
        - ✅ Latência baixa (sem 2-phase commit).
        - ✅ Custo baixo (sem transações distribuídas).
        ```

        **Verificação:** Arquivo criado com semântica ALO + idempotência escolhida e justificada.

