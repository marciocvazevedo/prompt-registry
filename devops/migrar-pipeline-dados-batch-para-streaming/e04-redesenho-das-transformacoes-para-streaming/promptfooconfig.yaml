        ### 3. Schema (Column Comparison)
        **Métrica:** Estrutura das tabelas (colunas, tipos, ordem).

        **Validação:**
        ```sql
        -- Comparar schema de batch vs streaming
        SELECT
          column_name,
          data_type,
          is_nullable
        FROM information_schema.columns
        WHERE table_name = 'forge_events_aggregated_batch'
        ORDER BY ordinal_position;

        SELECT
          column_name,
          data_type,
          is_nullable
        FROM information_schema.columns
        WHERE table_name = 'forge_events_aggregated_streaming'
        ORDER BY ordinal_position;

        -- Diferença
        SELECT
          COALESCE(b.column_name, s.column_name) AS column_name,
          b.data_type AS type_batch,
          s.data_type AS type_streaming,
          CASE
            WHEN b.data_type = s.data_type THEN '✅ OK'
            ELSE '❌ MISMATCH'
          END AS status
        FROM batch_schema b
        FULL OUTER JOIN streaming_schema s
          ON b.column_name = s.column_name
        ORDER BY column_name;
        ```

        **Alvo:**
        - Schema = 100% idêntico (mesmas colunas, tipos, ordem)

