        avg_rate_events_per_sec = 1000  # [SUPOSIÇÃO] eventos/s
        avg_event_size_bytes = 500      # [SUPOSIÇÃO] bytes por evento
        peak_rate_events_per_sec = 2000 # [SUPOSIÇÃO] pico de eventos/s

        # SLO da Etapa 2
        rto_seconds = 300  # 5 min (RTO para falha de job)

        # Cálculo de retenção necessária
        # Cenário 1: Reprocessamento após falha (RTO = 5 min)
        retention_for_rto_seconds = rto_seconds
        retention_for_rto_bytes = peak_rate_events_per_sec * avg_event_size_bytes * retention_for_rto_seconds
        retention_for_rto_gb = retention_for_rto_bytes / 1e9

        print(f"Retenção para RTO ({rto_seconds}s):")
        print(f"  {retention_for_rto_seconds} segundos")
        print(f"  {retention_for_rto_gb:.2f} GB")

        # Cenário 2: Reprocessamento para validação de equivalência (24 horas)
        retention_for_validation_seconds = 24 * 3600
        retention_for_validation_bytes = peak_rate_events_per_sec * avg_event_size_bytes * retention_for_validation_seconds
        retention_for_validation_gb = retention_for_validation_bytes / 1e9

        print(f"\nRetenção para validação de equivalência (24h):")
        print(f"  {retention_for_validation_seconds} segundos")
        print(f"  {retention_for_validation_gb:.2f} GB")

        # Retenção recomendada: máximo dos dois cenários + margem
        recommended_retention_seconds = max(retention_for_rto_seconds, retention_for_validation_seconds) + (24 * 3600)  # +1 dia de margem
        recommended_retention_days = recommended_retention_seconds / (24 * 3600)

        print(f"\nRetenção recomendada:")
        print(f"  {recommended_retention_days:.1f} dias")
        print(f"  {recommended_retention_seconds} segundos")

        # Comparar com retenção atual
        current_retention_ms = 604800000  # 7 dias (de Etapa 1)
        current_retention_seconds = current_retention_ms / 1000
        current_retention_days = current_retention_seconds / (24 * 3600)

        print(f"\nRetenção atual:")
        print(f"  {current_retention_days:.1f} dias")

        if current_retention_seconds >= recommended_retention_seconds:
            print(f"\n✅ Retenção atual é suficiente")
        else:
            print(f"\n❌ Retenção atual é INSUFICIENTE")
            print(f"   Necessário aumentar para {recommended_retention_days:.1f} dias")
        ```

