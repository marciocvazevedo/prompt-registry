        ## 5. Defina tratamento de eventos fora de ordem e atrasados

        **Ação:** Formalize como o Forge lida com eventos que chegam fora de ordem ou atrasados.

        **Onde:** Configuração do Forge e documentação.

        **Análise de padrões de atraso:**

        ```python
        #!/usr/bin/env python3
        """
        Analisa padrões de atraso de eventos no Relay.
        Baseado em dados históricos da Etapa 1.
        """

        # Dados históricos (de Etapa 1)
        # Exemplo: distribuição de atraso (latência entre timestamp do evento e chegada no Relay)
        latency_percentiles = {
            "p50": 100,    # ms
            "p75": 500,    # ms
            "p90": 2000,   # ms
            "p95": 5000,   # ms
            "p99": 30000,  # ms
            "p999": 60000, # ms
        }

        print("Distribuição de atraso de eventos (timestamp → Relay):")
        for percentile, latency_ms in latency_percentiles.items():
            print(f"  {percentile}: {latency_ms} ms ({latency_ms/1000:.1f} s)")

        # Cálculo de watermark (marca d'água)
        # Watermark = timestamp máximo processado - margem de atraso
        # Eventos com timestamp < watermark são considerados "atrasados"

        p99_latency_ms = latency_percentiles["p99"]
        watermark_margin_ms = p99_latency_ms * 1.5  # 50% de margem adicional

        print(f"\nWatermark (marca d'água):")
        print(f"  p99 latência: {p99_latency_ms} ms")
        print(f"  Margem adicional: {watermark_margin_ms - p99_latency_ms:.0f} ms")
        print(f"  Watermark total: {watermark_margin_ms:.0f} ms ({watermark_margin_ms/1000:.1f} s)")

        # Cálculo de janela de tolerância
        # Eventos com timestamp entre (watermark - janela) e watermark são "atrasados mas aceitáveis"
        # Eventos com timestamp < (watermark - janela) são "muito atrasados" e descartados

        allowed_lateness_ms = 60000  # [SUPOSIÇÃO] 1 min de tolerância
        print(f"\nJanela de tolerância:")
        print(f"  Eventos atrasados aceitáveis: até {allowed_lateness_ms} ms ({allowed_lateness_ms/1000:.1f} s)")
        print(f"  Eventos muito atrasados: > {allowed_lateness_ms} ms (descartados)")

        # Implicações
        print(f"\nImplicações:")
        print(f"  - Eventos com atraso ≤ {watermark_margin_ms/1000:.1f} s são processados normalmente")
        print(f"  - Eventos com atraso entre {watermark_margin_ms/1000:.1f} s e {(watermark_margin_ms + allowed_lateness_ms)/1000:.1f} s são processados com atualização retroativa")
        print(f"  - Eventos com atraso > {(watermark_margin_ms + allowed_lateness_ms)/1000:.1f} s são descartados (late drop)")
        ```

        **Saída esperada:**

        ```
        Distribuição de atraso de eventos (timestamp → Relay):
          p50: 100 ms (0.1 s)
          p75: 500 ms (0.5 s)
          p90: 2000 ms (2.0 s)
          p95: 5000 ms (5.0 s)
          p99: 30000 ms (30.0 s)
          p999: 60000 ms (60.0 s)

        Watermark (marca d'água):
          p99 latência: 30000 ms
          Margem adicional: 15000 ms
          Watermark total: 45000 ms (45.0 s)

        Janela de tolerância:
          Eventos atrasados aceitáveis: até 60000 ms (60.0 s)
          Eventos muito atrasados: > 60000 ms (descartados)

        Implicações:
          - Eventos com atraso ≤ 45.0 s são processados normalmente
          - Eventos com atraso entre 45.0 s e 105.0 s são processados com atualização retroativa
          - Eventos com atraso > 105.0 s são descartados (late drop)
        ```

        **Documentação:**

        Crie arquivo `forge/config/late-events-handling.md`:

        ```markdown
        # Tratamento de Eventos Fora de Ordem e Atrasados

        ## Definições
        - **Evento no tempo:** timestamp está dentro de 45 s do timestamp máximo processado
        - **Evento atrasado:** timestamp está entre 45 s e 105 s atrás do máximo
        - **Evento muito atrasado:** timestamp está > 105 s atrás do máximo

        ## Estratégia de Watermark
        - **Watermark:** timestamp máximo processado - 45 s
        - **Atualização retroativa:** eventos atrasados (45–105 s) atualizam agregações já escritas
        - **Late drop:** eventos muito atrasados (> 105 s) são descartados

        ## Implementação (Spark Structured Streaming)
        ```python
        from pyspark.sql import SparkSession
        from pyspark.sql.functions import col, window, from_unixtime

        spark = SparkSession.builder.appName("forge-streaming").getOrCreate()

        # Ler do Relay (Kafka)
        df = spark.readStream \
            .format("kafka") \
            .option("kafka.bootstrap.servers", "<relay-broker>") \
            .option("subscribe", "forge-events-raw") \
            .option("startingOffsets", "earliest") \
            .load()

        # Watermark: 45 s de atraso permitido
        df_with_watermark = df \
            .withWatermark("timestamp", "45 seconds")

        # Agregação com allowed lateness: 60 s
        df_aggregated = df_with_watermark \
            .groupBy(
                window(col("timestamp"), "30 seconds"),
                col("tenant_id")
            ) \
            .agg(
                count("*").alias("event_count"),
                sum("metric_value").alias("total_value")
            )

        # Escrita no DW com modo "update" (permite atualização retroativa)
        query = df_aggregated \
            .writeStream \
            .format("parquet") \
            .option("path", "/data/forge/aggregated") \
            .option("checkpointLocation", "/data/forge/checkpoint") \
            .outputMode("update")  # Permite atualização de linhas já escritas
            .start()
        ```

        ## Implicações
        - **Latência:** Eventos atrasados podem causar latência adicional (até 105 s)
        - **Completude:** Eventos muito atrasados (> 105 s) são perdidos (~0.1% de eventos)
        - **Corretude:** Agregações podem ser atualizadas retroativamente (modo "update")
        - **Consumidores:** Sentinel e Cerebro devem estar preparados para atualizações retroativas

        ## Validação
        - [ ] Testar com eventos injetados com atraso de 50 s (deve ser processado)
        - [ ] Testar com eventos injetados com atraso de 120 s (deve ser descartado)
        - [ ] Validar que completude ≥ 99.9% (perda de eventos muito atrasados é aceitável)
        ```

