        ## 4. Torne cada etapa idempotente e reexecutável

        **Ação:** Defina chave de deduplicação e chave natural para cada etapa.

        **Onde:** Arquivo `forge/config/idempotency-strategy.md` (novo) no repositório do Forge.

        **Procedimento:**

        ```markdown
        # Estratégia de Idempotência e Reexecutabilidade

        ## Definições
        - **Idempotência:** Executar uma operação múltiplas vezes produz o mesmo resultado que executar uma vez
        - **Chave de deduplicação:** Campo único que identifica um evento (ex: `event_id`)
        - **Chave natural:** Combinação de campos que identifica um resultado (ex: `tenant_id + service_id + hour`)
        - **Reexecutabilidade:** Capacidade de reexecutar uma etapa sem perder dados ou criar duplicatas

        ## Estratégia por Etapa

        ### Etapa 1: Parsing
        **Chave de deduplicação:** `event_id`
        **Chave natural:** `event_id` (cada evento é único)
        **Implementação:**
        ```python
        df_parsed = df_raw.select(
            col("event_id"),
            col("tenant_id"),
            col("timestamp"),
            col("service_id"),
            col("metric_name"),
            col("metric_value"),
            col("tags"),
            current_timestamp().alias("ingestion_time")
        ).filter(col("event_id").isNotNull())

        # Deduplicar por event_id (em caso de reprocessamento)
        df_deduplicated = df_parsed.dropDuplicates(["event_id"])
        ```

        **Validação:**
        - [ ] Cada `event_id` aparece no máximo 1× na saída
        - [ ] Nenhum evento é perdido (completude ≥ 99.9%)

        ---

        ### Etapa 2: Enriquecimento Tenant
        **Chave de deduplicação:** `event_id`
        **Chave natural:** `event_id` (cada evento é único)
        **Implementação:**
        ```python
        df_enriched = df_parsed.join(
            broadcast_tenant_meta,
            on="tenant_id",
            how="left"
        ).select(
            col("event_id"),
            col("tenant_id"),
            col("tenant_name"),
            col("tenant_tier"),
            col("region"),
            col("timestamp"),
            col("service_id"),
            col("metric_name"),
            col("metric_value"),
            col("tags")
        ).filter(col("tenant_name").isNotNull())

        # Deduplicar por event_id
        df_deduplicated = df_enriched.dropDuplicates(["event_id"])
        ```

        ---

        ### Etapa 3: Normalização
        **Chave de deduplicação:** `event_id`
        **Chave natural:** `event_id`
        **Implementação:**
        ```python
        df_normalized = df_enriched.withColumn(
            "metric_name_normalized",
            regexp_replace(col("metric_name"), r"[.-]", "_")
        ).withColumn(
            "metric_value_normalized",
            when(col("metric_name").contains("latency"), col("metric_value") / 1000)
            .otherwise(col("metric_value"))
        )

        # Deduplicar por event_id
        df_deduplicated = df_normalized.dropDuplicates(["event_id"])
        ```

        ---

        ### Etapa 4: Agregação por Serviço
        **Chave de deduplicação:** `event_id` (antes de agregação)
        **Chave natural:** `window_start + window_end + tenant_id + service_id`
        **Implementação:**
        ```python
        # Deduplicar antes de agregação
        df_deduplicated = df_normalized.dropDuplicates(["event_id"])

        # Agregar
        df_by_service = df_deduplicated.groupBy(
            window(col("timestamp"), "30 seconds"),
            col("tenant_id"),
            col("service_id")
        ).agg(
            sum("metric_value").alias("total_value"),
            count("*").alias("event_count"),
            avg("metric_value").alias("avg_value"),
            stddev("metric_value").alias("stddev_value")
        ).withColumn(
            "window_start",
            col("window.start")
        ).withColumn(
            "window_end",
            col("window.end")
        ).select(
            col("window_start"),
            col("window_end"),
            col("tenant_id"),
            col("service_id"),
            col("total_value"),
            col("event_count"),
            col("avg_value"),
            col("stddev_value")
        )

        # Escrever com deduplicação no DW
        df_by_service.write.mode("overwrite") \
            .option("mergeSchema", "true") \
            .parquet("/data/forge/by_service")
        ```

        **Validação:**
        - [ ] Cada combinação de `(window_start, window_end, tenant_id, service_id)` aparece no máximo 1× na saída
        - [ ] Agregações são corretas (SUM, COUNT, AVG)

        ---

        ### Etapa 5: Agregação Global
        **Chave de deduplicação:** `event_id` (antes de agregação)
        **Chave natural:** `window_start + window_end + tenant_id`
        **Implementação:** Idêntica à Etapa 4

        ---

        ### Etapa 6: Taxa de Erro
        **Chave de deduplicação:** `event_id` (antes de agregação)
        **Chave natural:** `window_start + window_end + tenant_id + service_id`
        **Implementação:**
        ```python
        # Deduplicar antes de agregação
        df_deduplicated = df_by_service.dropDuplicates(["event_id"])

        # Calcular taxa de erro
        df_error_rates = df_deduplicated.filter(
            col("metric_name") == "error"
        ).join(
            broadcast_sla,
            on=["tenant_id", "service_id"],
            how="left"
        ).withColumn(
            "error_rate",
            col("total_value") / col("event_count")
        ).withColumn(
            "sla_breached",
            col("error_rate") > col("sla_threshold")
        )

        # Escrever com deduplicação
        df_error_rates.write.mode("overwrite") \
            .parquet("/data/forge/error_rates")
        ```

        ---

        ### Etapa 7: Detecção de Anomalia
        **Chave de deduplicação:** `event_id` (antes de agregação)
        **Chave natural:** `tenant_id + hour + anomaly_id` (anomaly_id = hash de (mean, stddev, z_score))
        **Implementação:**
        ```python
        # Deduplicar antes de agregação
        df_deduplicated = df_aggregated.dropDuplicates(["event_id"])

        # Calcular estatísticas
        df_stats = df_deduplicated.groupBy("tenant_id").agg(
            avg("total_value").alias("mean_value"),
            stddev("total_value").alias("stddev_value")
        )

        # Detectar anomalias
        df_anomalies = df_deduplicated.join(
            df_stats,
            on="tenant_id"
        ).withColumn(
            "z_score",
            (col("total_value") - col("mean_value")) / col("stddev_value")
        ).filter(
            abs(col("z_score")) > 3
        ).withColumn(
            "anomaly_id",
            md5(concat_ws("|", col("tenant_id"), col("hour"), col("z_score")))
        )

        # Deduplicar por anomaly_id
        df_deduplicated_anomalies = df_anomalies.dropDuplicates(["anomaly_id"])

        # Escrever
        df_deduplicated_anomalies.write.mode("overwrite") \
            .parquet("/data/forge/anomalies")
        ```

        ---

        ### Etapa 8: SLA Violations
        **Chave de deduplicação:** `event_id` (antes de agregação)
        **Chave natural:** `tenant_id + service_id + hour + violation_id`
        **Implementação:** Idêntica à Etapa 7

        ---

        ### Etapa 9: Enriquecimento Deployment
        **Chave de deduplicação:** `event_id`
        **Chave natural:** `event_id`
        **Implementação:**
