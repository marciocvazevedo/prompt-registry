        ## 2. Defina janelas, watermarks e política de eventos atrasados por etapa

        **Ação:** Para cada etapa de agregação, defina tamanho de janela, watermark e política de late events.

        **Onde:** Arquivo `forge/config/windowing-strategy.md` (novo) no repositório do Forge.

        **Procedimento:**

        ```markdown
        # Estratégia de Janelas, Watermarks e Eventos Atrasados

        ## Definições Gerais
        - **Janela:** Período de tempo em que eventos são agrupados (ex: 30 s, 1 min, 1 hora)
        - **Watermark:** Timestamp máximo processado - margem de atraso (ex: 45 s)
        - **Allowed lateness:** Tempo máximo que um evento pode chegar atrasado e ainda ser processado
        - **Late drop:** Eventos que chegam após allowed lateness são descartados

        ## Estratégia por Etapa

        ### Etapa 4: Agregação por Serviço
        **Janela:** 30 segundos (em vez de 1 hora no batch)
        **Watermark:** 45 segundos (de Etapa 3)
        **Allowed lateness:** 60 segundos
        **Late drop:** > 105 segundos
        **Modo de saída:** `update` (permite atualização retroativa)

        **Justificativa:**
        - Janela de 30 s alinha com intervalo de processamento do Forge
        - Watermark de 45 s permite que 99% dos eventos sejam processados no tempo
        - Allowed lateness de 60 s permite atualização de agregações já escritas
        - Modo `update` permite que eventos atrasados atualizem linhas já no DW

        **Implementação (Spark Structured Streaming):**
        ```python
        df_normalized = spark.readStream.format("kafka")...
        df_watermarked = df_normalized.withWatermark("timestamp", "45 seconds")
        df_by_service = df_watermarked.groupBy(
            window(col("timestamp"), "30 seconds"),
            col("tenant_id"),
            col("service_id")
        ).agg(
            sum("metric_value").alias("total_value"),
            count("*").alias("event_count"),
            avg("metric_value").alias("avg_value"),
            stddev("metric_value").alias("stddev_value")
        )
        query = df_by_service.writeStream \
            .format("parquet") \
            .option("path", "/data/forge/by_service") \
            .option("checkpointLocation", "/data/forge/checkpoint/by_service") \
            .outputMode("update") \
            .trigger(processingTime="30 seconds") \
            .start()
        ```

        **Validação:**
        - [ ] Testar com eventos injetados com atraso de 50 s (deve ser processado)
        - [ ] Testar com eventos injetados com atraso de 120 s (deve ser descartado)
        - [ ] Validar que completude ≥ 99.9%

        ---

        ### Etapa 5: Agregação Global
        **Janela:** 30 segundos (em vez de 1 hora no batch)
        **Watermark:** 45 segundos (de Etapa 3)
        **Allowed lateness:** 60 segundos
        **Late drop:** > 105 segundos
        **Modo de saída:** `update`

        **Justificativa:** Idêntica à Etapa 4

        **Implementação:**
        ```python
        df_watermarked = df_normalized.withWatermark("timestamp", "45 seconds")
        df_aggregated = df_watermarked.groupBy(
            window(col("timestamp"), "30 seconds"),
            col("tenant_id")
        ).agg(
            sum("metric_value").alias("total_value"),
            count("*").alias("event_count"),
            avg("metric_value").alias("avg_value")
        )
        query = df_aggregated.writeStream \
            .format("parquet") \
            .option("path", "/data/forge/aggregated") \
            .option("checkpointLocation", "/data/forge/checkpoint/aggregated") \
            .outputMode("update") \
            .trigger(processingTime="30 seconds") \
            .start()
        ```

        ---

        ### Etapa 10: Agregação por Versão
        **Janela:** 30 segundos (em vez de 1 hora no batch)
        **Watermark:** 45 segundos (de Etapa 3)
        **Allowed lateness:** 60 segundos
        **Late drop:** > 105 segundos
        **Modo de saída:** `update`

        **Justificativa:** Idêntica à Etapa 4

        ---

        ### Etapa 11: Cálculo de Percentis
        **Janela:** 30 segundos (em vez de 1 hora no batch)
        **Watermark:** 45 segundos (de Etapa 3)
        **Allowed lateness:** 60 segundos
        **Late drop:** > 105 segundos
        **Modo de saída:** `update`

        **Justificativa:** Idêntica à Etapa 4

        **Nota:** Percentis são aproximados usando `percentile_approx()` (não exatos)

        ---

        ### Etapa 13: Agregação para Billing
        **Janela:** 1 dia (sem mudança em relação ao batch)
        **Watermark:** 24 horas (permitir eventos do dia anterior)
        **Allowed lateness:** 48 horas (permitir eventos de 2 dias atrás)
        **Late drop:** > 72 horas
        **Modo de saída:** `update`

        **Justificativa:**
        - Billing é crítico; não pode perder eventos
        - Janela de 1 dia alinha com ciclo de faturamento
        - Allowed lateness de 48 h permite que eventos atrasados sejam incluídos antes do relatório (02:00 UTC)

        **Implementação:**
        ```python
        df_watermarked = df_normalized.withWatermark("timestamp", "24 hours")
        df_billing = df_watermarked.groupBy(
            window(col("timestamp"), "1 day"),
            col("tenant_id")
        ).agg(
            count(distinct("event_id")).alias("unique_event_count"),
            count("*").alias("total_event_count")
        )
        query = df_billing.writeStream \
            .format("parquet") \
            .option("path", "/data/forge/billing_events") \
            .option("checkpointLocation", "/data/forge/checkpoint/billing") \
            .outputMode("update") \
            .trigger(processingTime="1 hour") \
            .start()
        ```

        ---

        ## Resumo de Estratégia de Janelas

        | Etapa | Janela | Watermark | Allowed Lateness | Late Drop | Modo |
        |-------|--------|-----------|------------------|-----------|------|
        | 4 | 30 s | 45 s | 60 s | > 105 s | update |
        | 5 | 30 s | 45 s | 60 s | > 105 s | update |
        | 10 | 30 s | 45 s | 60 s | > 105 s | update |
        | 11 | 30 s | 45 s | 60 s | > 105 s | update |
        | 13 | 1 dia | 24 h | 48 h | > 72 h | update |

        ---

        ## Implicações para Consumidores

        ### Sentinel (Dashboards)
        - Dados chegam a cada 30 s (em vez de 60 min)
        - Agregações podem ser atualizadas retroativamente (modo `update`)
        - Queries devem usar `DISTINCT` ou `GROUP BY` para deduplicação

        ### Cerebro (Indexação)
        - Eventos chegam a cada 30 s (em vez de 60 min)
        - Índice pode ter duplicatas em reprocessamento
        - Indexador deve deduplicar por `event_id`

        ### Pepper (Billing)
        - Relatório roda 1× por dia (02:00 UTC)
        - Allowed lateness de 48 h garante que eventos atrasados sejam incluídos
        - Query de billing deve deduplicar por `event_id`

        ```

