        ## 1. Defina estratégia de escrita incremental por tabela

        **Ação:** Escolha entre append, upsert/merge ou staging+merge para cada tabela.

        **Onde:** Arquivo `forge/config/write-strategy.md` (novo) no repositório do Forge.

        **Procedimento:**

        ```markdown
        # Estratégia de Escrita Incremental — Forge Streaming

        ## Definições
        - **Append:** Adicionar novos dados sem modificar existentes (mais rápido, sem deduplicação)
        - **Upsert/Merge:** Atualizar linhas existentes ou inserir novas (mais lento, garante unicidade)
        - **Staging + Merge:** Escrever em tabela temporária, depois fazer merge (mais seguro, mais lento)

        ## Análise por Tabela

        ### Tabelas de Agregação (by_service, aggregated, by_version, percentiles)
        **Características:**
        - Chave natural: `(window_start, window_end, tenant_id, [service_id], [version])`
        - Modo de saída: `update` (eventos atrasados podem atualizar linhas já escritas)
        - Frequência de escrita: A cada 30 s
        - Tamanho de linha: ~200 bytes

        **Problema:** Modo `update` significa que a mesma chave pode ser escrita múltiplas vezes (com valores diferentes) durante a janela.

        **Exemplo:**
        ```
        Tempo 0:00–0:30 (janela 1)
        - 0:15: Escreve (window_1, tenant_1, service_1, total=100, count=10)
        - 0:25: Evento atrasado chega, escreve (window_1, tenant_1, service_1, total=110, count=11)
        - 0:35: Janela fecha, escreve (window_1, tenant_1, service_1, total=115, count=12) [final]
        ```

        **Estratégia:** **Upsert/Merge**
        - Usar `MERGE INTO` (SQL) ou `foreachBatch` com deduplicação
        - Deduplicar por chave natural antes de escrever
        - Garantir que última escrita (após watermark) é a final

        **Implementação:**
        ```python
        # Opção 1: Usar foreachBatch com deduplicação
        def merge_aggregation(df, batch_id, table_name, key_cols):
            """Merge com deduplicação por chave natural"""
            # Deduplicar: manter última linha por chave
            df_deduplicated = df.dropDuplicates(key_cols)
            # Escrever com merge
            df_deduplicated.write.mode("overwrite") \
                .option("mergeSchema", "true") \
                .parquet(f"/data/forge/{table_name}")
            print(f"Batch {batch_id}: {df_deduplicated.count()} linhas escritas")

        # Usar em writeStream
        query = df_aggregated.writeStream \
            .foreachBatch(lambda df, batch_id: merge_aggregation(df, batch_id, "aggregated", ["window_start", "window_end", "tenant_id"])) \
            .outputMode("update") \
            .trigger(processingTime="30 seconds") \
            .start()
        ```

        **Opção 2: Usar Delta Lake (se disponível)**
        ```python
        # Delta Lake suporta MERGE nativamente
        query = df_aggregated.writeStream \
            .format("delta") \
            .mode("append") \
            .option("mergeSchema", "true") \
            .option("checkpointLocation", "/data/forge/checkpoint/aggregated") \
            .trigger(processingTime="30 seconds") \
            .start()

        # Depois, usar MERGE para deduplicação
        spark.sql("""
        MERGE INTO delta.`/data/forge/aggregated` t
        USING (SELECT * FROM delta.`/data/forge/aggregated_staging`) s
        ON t.window_start = s.window_start 
        AND t.window_end = s.window_end 
        AND t.tenant_id = s.tenant_id
        WHEN MATCHED THEN UPDATE SET *
        WHEN NOT MATCHED THEN INSERT *
        """)
        ```

        **Validação:**
        - [ ] Cada chave natural aparece no máximo 1× na saída
        - [ ] Valores são os mais recentes (após watermark)
        - [ ] Nenhuma linha é perdida

        ---

        ### Tabela de Billing (billing_events)
        **Características:**
        - Chave natural: `(day, tenant_id)`
        - Modo de saída: `update` (eventos atrasados podem atualizar linhas já escritas)
        - Frequência de escrita: A cada 1 hora
        - Tamanho de linha: ~100 bytes
        - **Crítico:** Billing não pode ter duplicatas ou perdas

        **Estratégia:** **Staging + Merge**
        - Escrever em tabela de staging (`billing_events_staging`)
        - Fazer merge com tabela principal (`billing_events`) 1× por dia (antes do relatório)
        - Garantir deduplicação por `event_id` antes de contar

        **Implementação:**
        ```python
        def merge_billing(df, batch_id):
            """Merge com deduplicação para billing"""
            # Deduplicar por (day, tenant_id)
            df_deduplicated = df.dropDuplicates(["day_start", "tenant_id"])
            # Escrever em staging
            df_deduplicated.write.mode("append") \
                .parquet("/data/forge/billing_events_staging")
            print(f"Batch {batch_id}: {df_deduplicated.count()} linhas escritas em staging")

        query = df_billing.writeStream \
            .foreachBatch(lambda df, batch_id: merge_billing(df, batch_id)) \
            .outputMode("update") \
            .trigger(processingTime="1 hour") \
            .start()

        # Merge diário (02:00 UTC, antes do relatório)
        def daily_billing_merge():
            """Merge diário de staging para principal"""
            spark.sql("""
            MERGE INTO parquet.`/data/forge/billing_events` t
            USING parquet.`/data/forge/billing_events_staging` s
            ON t.day_start = s.day_start AND t.tenant_id = s.tenant_id
            WHEN MATCHED THEN UPDATE SET 
                unique_event_count = s.unique_event_count,
                total_event_count = s.total_event_count
            WHEN NOT MATCHED THEN INSERT *
            """)
            # Limpar staging
            spark.sql("DELETE FROM parquet.`/data/forge/billing_events_staging`")
        ```

        **Validação:**
        - [ ] Staging é limpo após merge
        - [ ] Nenhuma duplicata em billing_events
        - [ ] Completude ≥ 99.9%

