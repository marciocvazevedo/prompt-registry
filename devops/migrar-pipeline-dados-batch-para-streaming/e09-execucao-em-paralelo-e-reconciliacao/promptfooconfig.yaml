        ## 4. Documente contrato de leitura para Pepper (billing com visão estável e fechada)

        **Ação:** Crie documento que especifica como Pepper deve ler dados de billing sem duplicatas ou perdas.

        **Onde:** Arquivo `forge/docs/pepper-compatibility.md` (novo) no repositório do Forge.

        **Procedimento:**

        ```markdown
        # Compatibilidade com Pepper — Contrato de Billing

        ## Resumo Executivo
        Pepper continua rodando 1× por dia (02:00 UTC) sem mudanças.
        Dados de billing são **finais e imutáveis** no momento do relatório.
        Nenhuma duplicata, nenhuma perda, nenhuma reconciliação necessária.

        ## Mudanças Visíveis para Pepper

        ### Antes (Batch)
        ```
        00:00 — Dia anterior termina
        01:00 — Batch processa (60 min de latência)
        02:00 — Pepper lê dados de billing (finais)
        02:30 — Relatório de billing é gerado
        03:00 — Clientes são faturados
        ```

        ### Depois (Streaming)
        ```
        00:00 — Dia anterior termina
        00:02 — Streaming processa (2 min de latência p95)
        02:00 — Pepper lê dados de billing (finais, com 2h de buffer)
        02:30 — Relatório de billing é gerado
        03:00 — Clientes são faturados
        ```

        **Diferença:** Dados estão prontos 1h58 min mais cedo, mas Pepper espera até 02:00 UTC (sem mudança)

        ---

        ## Contrato de Billing: Regras para Pepper

        ### Regra 1: Ler Apenas Dias Completos (Fechados)
        **Definição:** Pepper deve ler apenas `day_start < CURRENT_DATE()` (dias anteriores).

        **Razão:** Dia atual está aberto (eventos podem chegar até 23:59:59). Ler dia aberto causa:
        - Perda de eventos (eventos chegam depois da leitura)
        - Undercharging (cliente não é faturado por todos os eventos)
        - Reconciliação necessária (detectar e corrigir depois)

        **Implementação:**
        ```sql
        -- ❌ ANTES (lê dia atual, pode perder eventos)
        SELECT
        tenant_id,
        SUM(unique_event_count) as total_events,
        SUM(unique_event_count) * 0.001 as billing_amount_usd
        FROM forge_billing_events
        WHERE day_start >= CURRENT_DATE() - INTERVAL '1 day'
        GROUP BY tenant_id;

        -- ✅ DEPOIS (lê apenas dias anteriores)
        SELECT
        tenant_id,
        SUM(unique_event_count) as total_events,
        SUM(unique_event_count) * 0.001 as billing_amount_usd
        FROM forge.billing_events_daily  -- View com filtro de dias fechados
        WHERE day_start < CURRENT_DATE()
        GROUP BY tenant_id;
        ```

        ### Regra 2: Usar View de Compatibilidade
        **Definição:** Pepper deve ler de view `billing_events_daily`, não de tabela subjacente.

        **Razão:** View garante que dados são finais (dia anterior está 100% fechado).

        **Implementação:**
        ```python
        # ❌ ANTES (lê tabela subjacente)
        df = spark.read.parquet("/data/forge/billing_events")
        df.filter(col("day_start") < current_date()).show()

        # ✅ DEPOIS (lê view)
        df = spark.sql("SELECT * FROM forge.billing_events_daily")
        df.show()
        ```

        ### Regra 3: Deduplicar por `event_id` Antes de Contar
        **Definição:** Se evento é reprocessado, contar apenas 1×. Usar `COUNT(DISTINCT event_id)`.

        **Razão:** Semântica at-least-once permite duplicatas. Deduplicação garante que cada evento é faturado 1×.

        **Implementação:**
        ```sql
        -- ❌ ANTES (sem deduplicação, pode overcharge)
        SELECT
        tenant_id,
        COUNT(*) as total_events,
        COUNT(*) * 0.001 as billing_amount_usd
        FROM forge.billing_events_daily
        WHERE day_start < CURRENT_DATE()
        GROUP BY tenant_id;

        -- ✅ DEPOIS (com deduplicação)
        SELECT
        tenant_id,
        COUNT(DISTINCT event_id) as total_events,
        COUNT(DISTINCT event_id) * 0.001 as billing_amount_usd
        FROM forge.billing_events_daily
        WHERE day_start < CURRENT_DATE()
        GROUP BY tenant_id;
        ```

        ### Regra 4: Validar Completude Antes de Faturar
        **Definição:** Antes de gerar relatório, validar que completude ≥ 99.9%.

        **Razão:** Se completude < 99.9%, há perda de dados. Não faturar até que dados estejam completos.

        **Implementação:**
        ```python
        def validate_billing_completeness():
        """Validar completude antes de faturar"""
        # Comparar eventos no Relay vs eventos em billing_events
        relay_count = get_relay_event_count(day=yesterday)
        billing_count = get_billing_event_count(day=yesterday)
        
        completeness = (billing_count / relay_count) * 100
        
        if completeness < 99.9:
            send_alert(f"Billing completeness: {completeness}% (< 99.9%)")
            return False
        
        return True

        def generate_billing_report():
        """Gerar relatório de billing"""
        # Validar completude
        if not validate_billing_completeness():
            print("Completude insuficiente, aguardando...")
            return
        
        # Gerar relatório
        df = spark.sql("""
            SELECT
            tenant_id,
            COUNT(DISTINCT event_id) as total_events,
            COUNT(DISTINCT event_id) * 0.001 as billing_amount_usd
            FROM forge.billing_events_daily
            WHERE day_start < CURRENT_DATE()
            GROUP BY tenant_id
        """)
        
        # Salvar relatório
        df.write.mode("overwrite").parquet("/data/billing/reports/daily")
        
        print("Relatório de billing gerado")

        # Agendar para 02:00 UTC
        schedule_job(generate_billing_report, cron="0 2 * * *")
        ```

        ### Regra 5: Reconciliação Diária (Opcional)
        **Definição:** Após gerar relatório, validar que não há duplicatas ou perdas.

        **Razão:** Detectar problemas de dados antes de faturar clientes.

        **Implementação:**
        ```python
        def reconcile_billing():
        """Reconciliar billing após gerar relatório"""
        # Ler relatório gerado
        df_report = spark.read.parquet("/data/billing/reports/daily")
        
        # Ler dados brutos
        df_raw = spark.sql("""
            SELECT
            tenant_id,
            COUNT(DISTINCT event_id) as total_events
            FROM forge.billing_events_daily
            WHERE day_start < CURRENT_DATE()
            GROUP BY tenant_id
        """)
        
        # Comparar
        df_diff = df_report.join(df_raw, "tenant_id", "full_outer") \
            .filter(col("total_events") != col("total_events"))
        
        if df_diff.count() > 0:
            send_alert(f"Billing reconciliation failed: {df_diff.count()} mismatches")
            return False
        
        print("Reconciliação passou")
        return True

        # Agendar para 03:00 UTC (1h após gerar relatório)
        schedule_job(reconcile_billing, cron="0 3 * * *")
        ```

