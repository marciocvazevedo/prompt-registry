        ## 5. Crie runbook de plantão para 5 modos de falha mais prováveis

        **Ação:** Criar runbook com sintoma → diagnóstico → ação para os 5 modos de falha mais prováveis.

        **Onde:** Arquivo `forge/docs/oncall-runbook.md` (novo) no repositório do Forge.

        **Procedimento:**

        ```markdown
        # Runbook de Plantão — Forge Streaming

        ## Modo de Falha 1: Taxa de Consumo Baixa (< 100 evt/s)

        ### Sintoma
        - Alerta: `ForgeRelayConsumptionRateLow` (taxa < 100 evt/s por 10 min)
        - Dashboard: Consumer lag está crescendo
        - Latência p95 > 120 s

        ### Diagnóstico

        **Passo 1: Verificar status do job de streaming**
        ```bash
        # Verificar se job está rodando
        kubectl get deployment forge-streaming-ingest -n forge
        # Esperado: 1 réplica READY

        # Verificar logs
        kubectl logs -f deployment/forge-streaming-ingest -n forge | tail -100
        # Procurar por: ERROR, WARN, timeout, exception
        ```

        **Passo 2: Verificar consumer lag**
        ```bash
        # Verificar lag do consumer group
        kafka-consumer-groups --bootstrap-server <relay-broker> \
        --group forge-streaming-v1 \
        --describe
        # Esperado: LAG < 100k eventos

        # Se LAG > 100k: consumer está atrasado
        ```

        **Passo 3: Verificar recursos do cluster**
        ```bash
        # Verificar CPU/memória dos pods
        kubectl top pod -n forge | grep forge-streaming
        # Esperado: CPU < 80%, memória < 80%

        # Se CPU/memória > 80%: aumentar recursos
        ```

        **Passo 4: Verificar taxa de erro**
        ```bash
        # Verificar métrica de erro
        curl -s http://prometheus:9090/api/v1/query?query=rate(forge_errors_total[5m]) | jq
        # Esperado: taxa de erro < 1%

        # Se taxa de erro > 1%: investigar tipo de erro
        ```

        ### Ação

        **Se job não está rodando:**
        ```bash
        # Reiniciar job
        kubectl rollout restart deployment/forge-streaming-ingest -n forge

        # Aguardar 2 min
        sleep 120

        # Verificar se lag está diminuindo
        kafka-consumer-groups --bootstrap-server <relay-broker> \
        --group forge-streaming-v1 \
        --describe
        ```

        **Se CPU/memória está alta:**
        ```bash
        # Aumentar recursos
        kubectl set resources deployment forge-streaming-ingest -n forge \
        --limits=cpu=4,memory=8Gi \
        --requests=cpu=2,memory=4Gi

        # Aguardar 5 min
        sleep 300

        # Verificar se taxa de consumo aumentou
        ```

        **Se taxa de erro está alta:**
        ```bash
        # Verificar tipo de erro
        curl -s http://prometheus:9090/api/v1/query?query=forge_errors_by_type | jq

        # Se erro é "TRANSIENT_ERROR": aguardar recuperação
        # Se erro é "INVALID_EVENT": investigar origem dos dados
        # Se erro é "DEPLOY_ERROR": fazer rollback (ver seção Y)
        ```

        **Se nada funciona:**
        ```bash
        # Fazer rollback para batch
        kubectl delete deployment forge-streaming-ingest -n forge
        airflow dags trigger forge-batch-ingest

        # Aguardar 5 min
        sleep 300

        # Verificar se dados estão chegando no DW
        ```

        ---

        ## Modo de Falha 2: Muitos Eventos Inválidos (> 100 evt/min)

        ### Sintoma
        - Alerta: `ForgeInvalidEventsHigh` (taxa > 100 eventos/min)
        - Dashboard: Métrica `forge_invalid_events_total` está crescendo
        - DLQ `forge-events-invalid` tem muitos eventos

        ### Diagnóstico

        **Passo 1: Inspecionar DLQ**
        ```bash
        # Ler eventos da DLQ
        kafka-console-consumer --bootstrap-server <relay-broker> \
        --topic forge-events-invalid \
        --max-messages 10 \
        --from-beginning | jq

        # Procurar por padrão de erro (ex: campo ausente, tipo incorreto)
        ```

        **Passo 2: Verificar schema**
        ```bash
        # Verificar versão atual do schema
        curl -s http://<schema-registry>:8081/subjects/forge-events-raw-value/versions/latest | jq

        # Comparar com versão anterior
        curl -s http://<schema-registry>:8081/subjects/forge-events-raw-value/versions | jq
        ```

        **Passo 3: Verificar origem dos dados**
        ```bash
        # Verificar qual tenant está enviando dados inválidos
        kafka-console-consumer --bootstrap-server <relay-broker> \
        --topic forge-events-invalid \
        --max-messages 100 \
        --from-beginning | jq '.tenant_id' | sort | uniq -c | sort -rn

        # Procurar por tenant com muitos erros
        ```

        ### Ação

        **Se schema mudou:**
        ```bash
        # Verificar compatibilidade
        curl -s http://<schema-registry>:8081/config/forge-events-raw-value | jq '.compatibilityLevel'
        # Esperado: BACKWARD

        # Se compatibilidade é BACKWARD: novo schema é compatível
        # Se compatibilidade é NONE: novo schema pode quebrar consumidores

        # Coordenar com time de Relay para validar schema
        ```

        **Se tenant está enviando dados ruins:**
        ```bash
        # Contatar tenant para corrigir dados
        # Ou filtrar tenant temporariamente

        # Reprocessar DLQ após correção
        spark-submit \
        --master local[4] \
        forge/jobs/replay_events.py \
        --mode dlq \
        --dlq-topic forge-events-invalid \
        --limit 10000
        ```

        **Se problema persiste:**
        ```bash
        # Aumentar retenção de DLQ para investigação
        kafka-configs --bootstrap-server <relay-broker> \
        --entity-type topics \
        --entity-name forge-events-invalid \
        --alter \
        --add-config retention.ms=604800000  # 7 dias

        # Alertar time de dados para investigar origem
        ```

        ---

        ## Modo de Falha 3: Offset Commit Falhando

        ### Sintoma
        - Alerta: `ForgeRelayOffsetCommitFailure` (taxa de commit = 0)
        - Dashboard: Consumer lag está crescendo (offsets não estão sendo commitados)
        - Logs: "Failed to commit offsets"

        ### Diagnóstico

        **Passo 1: Verificar status do Relay**
        ```bash
        # Verificar saúde do Relay
        curl -s http://<relay-broker>:9092/health | jq

        # Verificar se brokers estão online
        kafka-broker-api-versions --bootstrap-server <relay-broker>
        ```

        **Passo 2: Verificar consumer group**
        ```bash
        # Verificar status do consumer group
        kafka-consumer-groups --bootstrap-server <relay-broker> \
        --group forge-streaming-v1 \
        --describe

        # Procurar por: STABLE (ok) ou REBALANCING (problema)
        ```

        **Passo 3: Verificar logs do job**
        ```bash
        # Verificar logs de erro
        kubectl logs -f deployment/forge-streaming-ingest -n forge | grep -i "commit\|offset"

        # Procurar por: "Failed to commit", "Offset out of range", "Group coordinator not available"
        ```

        ### Ação

        **Se Relay está offline:**
        ```bash
        # Aguardar recuperação do Relay
        # Monitorar status
        watch -n 5 'kafka-broker-api-versions --bootstrap-server <relay-broker>'

        # Após recuperação, job retoma automaticamente
        ```

        **Se consumer group está em REBALANCING:**
        ```bash
        # Aguardar rebalance completar (máximo 5 min)
        sleep 300

        # Verificar se offsets estão sendo commitados
        kafka-consumer-groups --bootstrap-server <relay-broker> \
        --group forge-streaming-v1 \
        --describe
        ```

        **Se problema persiste:**
        ```bash
        # Resetar consumer group (CUIDADO: vai reprocessar dados)
        kafka-consumer-groups --bootstrap-server <relay-broker> \
        --group forge-streaming-v1 \
        --reset-offsets \
        --to-latest \
        --execute

        # Reiniciar job
        kubectl rollout restart deployment/forge-streaming-ingest -n forge
        ```

        ---

        ## Modo de Falha 4: Latência p95 > 120 s

        ### Sintoma
        - Alerta: `ForgeLatencyHigh` (p95 > 120 s)
        - Dashboard: Watermark está atrasado
        - Consumidores (Sentinel, Cerebro) reclamam de dados lentos

        ### Diagnóstico

        **Passo 1: Verificar taxa de consumo**
        ```bash
        # Verificar se taxa de consumo está baixa
        curl -s http://prometheus:9090/api/v1/query?query=rate(forge_events_consumed_total[5m]) | jq

        # Esperado: > 1000 eventos/s
        # Se < 1000 eventos/s: problema é consumo lento (ver Modo 1)
        ```

        **Passo 2: Verificar tempo de processamento**
        ```bash
        # Verificar tempo de processamento por etapa
        curl -s http://prometheus:9090/api/v1/query?query=forge_processing_time_seconds | jq

        # Procurar por etapa com tempo alto
        ```

        **Passo 3: Verificar tamanho de buffer**
        ```bash
        # Verificar tamanho de buffer em memória
        curl -s http://prometheus:9090/api/v1/query?query=forge_buffer_size_events | jq

        # Esperado: < 100k eventos
        # Se > 100k eventos: buffer está crescendo (problema de consumo)
        ```

        ### Ação

        **Se taxa de consumo está baixa:**
        ```bash
        # Ver Modo 1: Taxa de Consumo Baixa
        ```

        **Se tempo de processamento está alto:**
        ```bash
        # Identificar etapa lenta
        # Exemplo: se transformação está lenta

        # Aumentar paralelismo
        kubectl set env deployment/forge-streaming-ingest -n forge \
        SPARK_EXECUTOR_CORES=4 \
        SPARK_EXECUTOR_MEMORY=8g

        # Aguardar 5 min
        sleep 300

        # Verificar se latência diminuiu
        ```

        **Se buffer está crescendo:**
        ```bash
        # Aumentar taxa de escrita
        # Aumentar frequência de trigger (ex: 15 s em vez de 30 s)

        # Ou aumentar paralelismo (ver acima)
        ```

        ---

        ## Modo de Falha 5: Dados Duplicados no DW

        ### Sintoma
        - Alerta: `ForgeDuplicateEventsDetected` (contagem de eventos > esperado)
        - Dashboard: Métrica `forge_duplicate_events_total` está crescendo
        - Queries retornam valores maiores que esperado

        ### Diagnóstico

        **Passo 1: Verificar se há reprocessamento**
        ```bash
        # Verificar se há eventos com mesmo event_id
        spark-sql -e "
        SELECT event_id, COUNT(*) as count
        FROM parquet.`/data/forge/aggregated`
        GROUP BY event_id
        HAVING count > 1
        LIMIT 10
        "

        # Se houver duplicatas: problema é reprocessamento
        ```

        **Passo 2: Verificar se há falha de deduplicação**
        ```bash
        # Verificar se deduplicação está funcionando
        spark-sql -e "
        SELECT COUNT(DISTINCT event_id) as unique_events,
              COUNT(*) as total_events
        FROM parquet.`/data/forge/aggregated`
        "

        # Se unique_events < total_events: há duplicatas
        ```

        **Passo 3: Verificar logs de escrita**
        ```bash
        # Verificar logs de escrita
        kubectl logs -f deployment/forge-streaming-write -n forge | grep -i "duplicate\|merge\|dedup"

        # Procurar por: "Deduplication failed", "Merge error"
        ```

        ### Ação

        **Se há reprocessamento:**
        ```bash
        # Verificar se há replay em andamento
        ps aux | grep replay_events.py

        # Se há replay: aguardar conclusão
        # Depois, validar que dados não foram duplicados

        # Se replay criou duplicatas: limpar dados
        spark-sql -e "
        DELETE FROM parquet.`/data/forge/aggregated`
        WHERE backfill_timestamp > '2024-01-15 10:00:00'
        "
        ```

        **Se deduplicação falhou:**
        ```bash
        # Verificar código de deduplicação
        grep -n "dropDuplicates\|MERGE" forge/jobs/streaming_write.py

        # Se lógica está errada: fazer fix e redeploy
        # Depois, limpar dados duplicados

        spark-sql -e "
        DELETE FROM parquet.`/data/forge/aggregated`
        WHERE ingestion_timestamp > '2024-01-15 10:00:00'
        "

        # Reprocessar dados
        spark-submit \
        --master local[4] \
        forge/jobs/replay_events.py \
        --mode timestamp \
        --start-timestamp "2024-01-15T10:00:00Z" \
        --end-timestamp "2024-01-15T11:00:00Z"
        ```

        **Se problema persiste:**
        ```bash
        # Fazer rollback para batch
        kubectl delete deployment forge-streaming-ingest -n forge
        airflow dags trigger forge-batch-ingest

        # Limpar dados duplicados
        spark-sql -e "
        DELETE FROM parquet.`/data/forge/aggregated`
        WHERE ingestion_timestamp > '2024-01-15 10:00:00'
        "

        # Reprocessar com batch
        ```

