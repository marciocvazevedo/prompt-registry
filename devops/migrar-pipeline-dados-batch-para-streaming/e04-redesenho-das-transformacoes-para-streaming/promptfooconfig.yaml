        ## 4. Defina particionamento e grau de paralelismo

        **Ação:** Calcule número de tasks/workers do Forge baseado em partições do Relay.

        **Onde:** Configuração do Forge (Spark, Kubernetes).

        **Cálculo de paralelismo:**

        ```python
        #!/usr/bin/env python3
        """
        Calcula grau de paralelismo do Forge baseado em partições do Relay.
        """

        # Dados do Relay (de Etapa 1 e passo 1)
        relay_partitions = 32  # [SUPOSIÇÃO] número de partições do tópico

        # Dados de volume (de Etapa 1)
        avg_rate_events_per_sec = 1000  # [SUPOSIÇÃO]
        peak_rate_events_per_sec = 2000 # [SUPOSIÇÃO]
        avg_event_size_bytes = 500      # [SUPOSIÇÃO]

        # Latência de processamento (de Etapa 1)
        processing_time_per_event_ms = 10  # [SUPOSIÇÃO] 10 ms por evento (14 etapas Spark)

        # SLO (de Etapa 2)
        target_latency_p95_seconds = 120  # 2 min

        # Cálculo 1: Paralelismo baseado em partições
        # Regra: 1 task por partição (máximo paralelismo)
        parallelism_from_partitions = relay_partitions

        print(f"Paralelismo baseado em partições:")
        print(f"  Partições do Relay: {relay_partitions}")
        print(f"  Tasks recomendadas: {parallelism_from_partitions}")

        # Cálculo 2: Paralelismo baseado em throughput
        # Regra: cada task processa ~100 eventos/s (conservador)
        events_per_task_per_sec = 100  # [SUPOSIÇÃO] capacidade de 1 task
        parallelism_from_throughput = peak_rate_events_per_sec / events_per_task_per_sec

        print(f"\nParalelismo baseado em throughput:")
        print(f"  Taxa pico: {peak_rate_events_per_sec} evt/s")
        print(f"  Capacidade por task: {events_per_task_per_sec} evt/s")
        print(f"  Tasks recomendadas: {parallelism_from_throughput:.0f}")

        # Cálculo 3: Paralelismo baseado em latência
        # Regra: latência = tempo de processamento + tempo em fila
        # Tempo em fila = (eventos em buffer) / (taxa de processamento)
        # Para latência p95 = 120 s, buffer máximo = 120 s * taxa
        max_buffer_events = target_latency_p95_seconds * peak_rate_events_per_sec
        events_per_task = max_buffer_events / relay_partitions
        parallelism_from_latency = relay_partitions  # 1 task por partição

        print(f"\nParalelismo baseado em latência:")
        print(f"  SLO p95: {target_latency_p95_seconds} s")
        print(f"  Taxa pico: {peak_rate_events_per_sec} evt/s")
        print(f"  Buffer máximo: {max_buffer_events} eventos")
        print(f"  Eventos por task: {events_per_task:.0f}")
        print(f"  Tasks recomendadas: {parallelism_from_latency}")

        # Decisão: máximo dos três cálculos
        recommended_parallelism = max(
            parallelism_from_partitions,
            parallelism_from_throughput,
            parallelism_from_latency
        )

        print(f"\nParalelismo recomendado:")
        print(f"  {int(recommended_parallelism)} tasks")

        # Validação: paralelismo não deve exceder partições
        if recommended_parallelism > relay_partitions:
            print(f"\n⚠️  Paralelismo ({recommended_parallelism}) > partições ({relay_partitions})")
            print(f"   Alguns tasks ficarão ociosos. Considerar aumentar partições do Relay.")
            recommended_parallelism = relay_partitions
            print(f"   Ajustado para: {recommended_parallelism}")
        else:
            print(f"\n✅ Paralelismo ({recommended_parallelism}) ≤ partições ({relay_partitions})")
        ```

        **Saída esperada:**

        ```
        Paralelismo baseado em partições:
          Partições do Relay: 32
          Tasks recomendadas: 32

        Paralelismo baseado em throughput:
          Taxa pico: 2000 evt/s
          Capacidade por task: 100 evt/s
          Tasks recomendadas: 20

        Paralelismo baseado em latência:
          SLO p95: 120 s
          Taxa pico: 2000 evt/s
          Buffer máximo: 240000 eventos
          Eventos por task: 7500
          Tasks recomendadas: 32

        Paralelismo recomendado:
          32 tasks

        ✅ Paralelismo (32) ≤ partições (32)
        ```

