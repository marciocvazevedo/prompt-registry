        ---

        ## 0. Pré-requisitos

        - [ ] Acesso de leitura/escrita ao repositório de configuração do Forge (`forge/config/`, `forge/jobs/`)
        - [ ] Acesso ao console/API do Relay para inspecionar tópicos, partições, offsets, DLQ
        - [ ] Acesso ao cluster Spark em staging e produção
        - [ ] Acesso ao DW (Parquet em `/data/forge/` ou equivalente SQL)
        - [ ] Acesso a logs de streaming (últimos 30 dias) para análise de falhas
        - [ ] Acesso a métricas de Prometheus/Grafana para monitoramento de falhas
        - [ ] Contato técnico confirmado no time de Relay para validar DLQ e reprocessamento
        - [ ] Contato técnico confirmado no time de on-call para runbook de plantão
        - [ ] Resultado da Etapa 3 disponível: contrato de consumo do Relay (tópico, partições, retenção, offsets)
        - [ ] Resultado da Etapa 5 disponível: estratégia de escrita incremental (deduplicação, merge, compactação)
        - [ ] Resultado da Etapa 6 disponível: validação de equivalência (batch vs streaming)
        - [ ] Ferramentas: `kafka-consumer-groups`, `kafka-console-consumer`, `spark-submit`, `curl`, editor de YAML, `git`
        - [ ] Permissão para criar tópicos DLQ no Relay
        - [ ] Permissão para resetar offsets do consumer group (coordenar com time de Relay)
        - [ ] Permissão para executar jobs de replay/backfill em produção
        - [ ] Acesso a alertas e dashboards de monitoramento (Prometheus, Grafana, PagerDuty)
        - [ ] Política de retenção de dados no DW (ex: 90 dias)
        - [ ] Política de retenção de logs (ex: 30 dias)

        ---

        ## 1. Classifique tipos de falha e defina resposta para cada uma

        **Ação:** Criar matriz de classificação de falhas com critérios de detecção e resposta automática/manual.

        **Onde:** Arquivo `forge/config/failure-classification.md` (novo) no repositório do Forge.

        **Procedimento:**

        ```markdown
        # Classificação de Falhas e Respostas — Forge Streaming

        ## Matriz de Classificação

        ### Tipo 1: Evento Inválido (Erro de Dados)
        **Definição:** Evento não passa em validação de schema ou regras de negócio.

        **Exemplos:**
        - Campo obrigatório ausente (ex: `tenant_id` é NULL)
        - Tipo de dado incorreto (ex: `timestamp` é string em vez de long)
        - Valor fora de intervalo (ex: `metric_value` é negativo)
        - Schema mismatch (ex: novo campo sem default)

        **Detecção:**
        ```python
        # Erro durante desserialização ou validação
        try:
            df_parsed = df.select(from_json(col("value"), EVENT_SCHEMA))
        except Exception as e:
            if "schema" in str(e).lower() or "null" in str(e).lower():
                return "INVALID_EVENT"
        ```

        **Métrica:**
        ```
        forge_invalid_events_total (counter)
        forge_invalid_events_by_reason (histogram: schema_mismatch, null_field, type_error, value_error)
        ```

        **Resposta Automática:**
        1. Enviar evento para DLQ (`forge-events-invalid`)
        2. Incrementar métrica `forge_invalid_events_total`
        3. Continuar processando próximos eventos (não bloquear)
        4. Alertar se taxa > 100 eventos/min (possível problema de schema)

        **Resposta Manual (On-Call):**
        1. Inspecionar DLQ para entender padrão de erro
        2. Se schema mismatch: coordenar com time de Relay para validar schema
        3. Se valor inválido: investigar origem dos dados (cliente enviando dados ruins?)
        4. Reprocessar DLQ após correção (ver seção 3: Replay)

        **Exemplo de Implementação:**
        ```python
        def handle_invalid_event(df, batch_id):
            """Separar eventos inválidos para DLQ"""
            # Tentar desserializar
            try:
                df_valid = df.select(from_json(col("value"), EVENT_SCHEMA).alias("event"))
                df_valid = df_valid.filter(col("event").isNotNull())
            except:
                df_valid = spark.createDataFrame([], df.schema)
            
            # Eventos inválidos = todos os que não passaram
            df_invalid = df.exceptAll(df_valid)
            
            # Enviar para DLQ
            if df_invalid.count() > 0:
                df_invalid.write.format("kafka") \
                    .option("kafka.bootstrap.servers", "<relay-broker>") \
                    .option("topic", "forge-events-invalid") \
                    .mode("append") \
                    .save()
                logger.warning(f"Batch {batch_id}: {df_invalid.count()} eventos inválidos enviados para DLQ")
            
            return df_valid
        ```

        ---

        ### Tipo 2: Falha Transitória (Erro Temporário)
        **Definição:** Erro que é provável que desapareça se reprocessado (ex: timeout de rede, recurso temporariamente indisponível).

        **Exemplos:**
        - Timeout ao conectar no DW (connection timeout)
        - Disco cheio temporariamente (espaço liberado após compactação)
        - Memória insuficiente (GC pause, depois recupera)
        - Broker do Relay indisponível (falha de nó, depois recupera)
        - Rate limit do DW (muitas queries simultâneas)

        **Detecção:**
        ```python
        # Erro é transitório se:
        # 1. Mensagem contém "timeout", "temporarily", "unavailable", "connection refused"
        # 2. Erro é de I/O (não de lógica)
        # 3. Retry anterior foi bem-sucedido
        def is_transient_error(exception):
            msg = str(exception).lower()
            transient_keywords = ["timeout", "temporarily", "unavailable", "connection refused", "try again"]
            return any(keyword in msg for keyword in transient_keywords)
        ```

        **Métrica:**
        ```
        forge_transient_errors_total (counter)
        forge_transient_errors_by_type (histogram: timeout, unavailable, connection_refused, rate_limit)
        forge_transient_error_retry_attempts (histogram)
        ```

        **Resposta Automática:**
        1. Implementar retry com backoff exponencial (1s, 2s, 4s, 8s, 16s)
        2. Máximo 5 tentativas
        3. Se todas as tentativas falharem, enviar para DLQ (`forge-events-retry-exhausted`)
        4. Alertar se taxa de retry > 10% de eventos

        **Resposta Manual (On-Call):**
        1. Verificar status do DW (CPU, memória, conexões)
        2. Verificar status do Relay (brokers, network)
        3. Se problema persiste > 5 min, escalar para time de infraestrutura
        4. Reprocessar DLQ após resolução (ver seção 3: Replay)

        **Exemplo de Implementação:**
        ```python
        def retry_with_backoff(func, max_retries=5):
            """Retry com backoff exponencial"""
            for attempt in range(max_retries):
                try:
                    return func()
                except Exception as e:
                    if not is_transient_error(e):
                        raise  # Não é transitório, falhar imediatamente
                    
                    if attempt == max_retries - 1:
                        logger.error(f"Falha após {max_retries} tentativas: {e}")
                        raise
                    
                    wait_time = 2 ** attempt  # 1, 2, 4, 8, 16 segundos
                    logger.warning(f"Tentativa {attempt + 1}/{max_retries} falhou, aguardando {wait_time}s: {e}")
                    time.sleep(wait_time)

        # Usar em escrita
        def write_with_retry(df, table_name):
            retry_with_backoff(
                lambda: df.write.mode("append").parquet(f"/data/forge/{table_name}")
            )
        ```

        ---

        ### Tipo 3: Falha de Dependência (Erro Externo)
        **Definição:** Erro causado por falha em sistema externo (DW, Relay, Schema Registry, etc).

        **Exemplos:**
        - DW está offline (manutenção programada)
        - Relay está offline (falha de cluster)
        - Schema Registry está offline
        - Elasticsearch (Cerebro) está offline
        - Banco de dados de configuração está offline

        **Detecção:**
        ```python
        # Erro é de dependência se:
        # 1. Mensagem contém nome de serviço externo
        # 2. Erro é de conectividade (não de lógica)
        # 3. Afeta múltiplos eventos (não apenas um)
        def is_dependency_error(exception, service_name):
            msg = str(exception).lower()
            return service_name.lower() in msg or "connection refused" in msg
        ```

        **Métrica:**
        ```
        forge_dependency_errors_total (counter, label: service)
        forge_dependency_errors_by_service (histogram: dw, relay, schema_registry, cerebro, config_db)
        forge_dependency_error_duration_seconds (gauge, label: service)
        ```

        **Resposta Automática:**
        1. Parar processamento (não enviar para DLQ, pois pode ser transitório)
        2. Aguardar recuperação da dependência (com timeout de 5 min)
        3. Se dependência não recupera em 5 min, alertar on-call
        4. Manter offsets no Relay (não fazer commit) para reprocessar depois

        **Resposta Manual (On-Call):**
        1. Verificar status da dependência (dashboard, logs, health check)
        2. Se manutenção programada: aguardar conclusão
        3. Se falha não programada: escalar para time responsável
        4. Após recuperação: job de streaming retoma automaticamente (offsets não foram commitados)

        **Exemplo de Implementação:**
        ```python
        def check_dependency_health(service_name, health_check_url):
            """Verificar saúde de dependência"""
            try:
                response = requests.get(health_check_url, timeout=5)
                return response.status_code == 200
            except:
                return False

        def wait_for_dependency(service_name, health_check_url, max_wait_seconds=300):
            """Aguardar recuperação de dependência"""
            start_time = time.time()
            while time.time() - start_time < max_wait_seconds:
                if check_dependency_health(service_name, health_check_url):
                    logger.info(f"{service_name} recuperado")
                    return True
                logger.warning(f"{service_name} ainda indisponível, aguardando...")
                time.sleep(10)
            
            logger.error(f"{service_name} não recuperou em {max_wait_seconds}s")
            return False

        # Usar em escrita
        def write_with_dependency_check(df, table_name, dw_health_url):
            if not wait_for_dependency("DW", dw_health_url):
                raise Exception("DW indisponível, não commitando offsets")
            
            df.write.mode("append").parquet(f"/data/forge/{table_name}")
        ```

        ---

        ### Tipo 4: Falha de Deploy (Erro de Código)
        **Definição:** Erro causado por bug no código ou configuração incorreta.

        **Exemplos:**
        - NullPointerException em transformação
        - Divisão por zero em cálculo
        - Índice fora de intervalo em array
        - Configuração incorreta (ex: caminho de arquivo errado)
        - Incompatibilidade de versão de biblioteca

        **Detecção:**
        ```python
        # Erro é de deploy se:
        # 1. Mensagem contém "NullPointerException", "IndexOutOfBoundsException", "ZeroDivisionError"
        # 2. Erro é de lógica (não de I/O)
        # 3. Afeta todos os eventos (não apenas alguns)
        def is_deploy_error(exception):
            msg = str(exception).lower()
            deploy_keywords = ["nullpointer", "indexoutofbounds", "zerodivision", "attributeerror", "keyerror"]
            return any(keyword in msg for keyword in deploy_keywords)
        ```

        **Métrica:**
        ```
        forge_deploy_errors_total (counter)
        forge_deploy_errors_by_type (histogram: nullpointer, indexoutofbounds, zerodivision, etc)
        ```

        **Resposta Automática:**
        1. Parar processamento imediatamente (não continuar, pois vai falhar em todos os eventos)
        2. Alertar on-call com severidade CRITICAL
        3. Não enviar para DLQ (pois reprocessamento também falhará)
        4. Não fazer commit de offsets (para reprocessar depois de fix)

        **Resposta Manual (On-Call):**
        1. Verificar logs de erro para entender causa
        2. Fazer rollback para versão anterior (se possível)
        3. Ou fazer fix rápido e redeploy
        4. Após fix: job de streaming retoma automaticamente (offsets não foram commitados)

        **Exemplo de Implementação:**
        ```python
        def safe_transform(df, transform_func):
            """Executar transformação com detecção de erro de deploy"""
            try:
                return transform_func(df)
            except Exception as e:
                if is_deploy_error(e):
                    logger.critical(f"Deploy error detectado: {e}")
                    # Alertar on-call
                    send_alert("CRITICAL", f"Deploy error: {e}")
                    # Parar processamento
                    raise
                else:
                    # Outro tipo de erro, continuar
                    logger.warning(f"Erro não-crítico: {e}")
                    return df
        ```

        ---

        ### Tipo 5: Falha de Lógica de Negócio (Erro de Regra)
        **Definição:** Evento viola regra de negócio (ex: tenant não existe, métrica não é conhecida).

        **Exemplos:**
        - Tenant não existe no banco de dados de configuração
        - Métrica não é conhecida (não está em lista de métricas válidas)
        - Valor de métrica viola SLA (ex: latência > 1 hora)
        - Evento é duplicado (mesmo `event_id` já foi processado)

        **Detecção:**
        ```python
        # Erro é de lógica de negócio se:
        # 1. Validação de regra falha (ex: tenant não existe)
        # 2. Evento é duplicado
        # 3. Valor viola SLA
        def validate_business_logic(event, config):
            """Validar regras de negócio"""
            # Verificar se tenant existe
            if event["tenant_id"] not in config["valid_tenants"]:
                return False, "UNKNOWN_TENANT"
            
            # Verificar se métrica é conhecida
            if event["metric_name"] not in config["valid_metrics"]:
                return False, "UNKNOWN_METRIC"
            
            # Verificar se valor viola SLA
            if event["timestamp"] < (time.time() - 3600):  # > 1 hora atrás
                return False, "EVENT_TOO_OLD"
            
            return True, None
        ```

        **Métrica:**
        ```
        forge_business_logic_errors_total (counter)
        forge_business_logic_errors_by_reason (histogram: unknown_tenant, unknown_metric, event_too_old, duplicate)
        ```

        **Resposta Automática:**
        1. Enviar evento para DLQ (`forge-events-business-logic-error`)
        2. Incrementar métrica
        3. Continuar processando próximos eventos
        4. Alertar se taxa > 1000 eventos/min (possível problema de configuração)

        **Resposta Manual (On-Call):**
        1. Inspecionar DLQ para entender padrão de erro
        2. Se tenant desconhecido: verificar se tenant foi criado corretamente
        3. Se métrica desconhecida: verificar se métrica foi registrada no config
        4. Se evento muito antigo: verificar se há atraso no pipeline
        5. Reprocessar DLQ após correção (ver seção 3: Replay)

        ---

        ## Resumo de Classificação

        | Tipo | Causa | Detecção | Resposta Automática | Resposta Manual |
        |------|-------|----------|-------------------|-----------------|
        | **1. Evento Inválido** | Dados ruins | Schema validation | → DLQ | Inspecionar, corrigir origem, replay |
        | **2. Falha Transitória** | Erro temporário | Timeout, unavailable | Retry com backoff | Verificar infraestrutura, replay |
        | **3. Falha de Dependência** | Serviço externo offline | Connection refused | Aguardar, não commit | Verificar serviço, aguardar recuperação |
        | **4. Falha de Deploy** | Bug no código | NullPointer, IndexError | Parar, alertar CRITICAL | Rollback ou fix, redeploy |
        | **5. Falha de Lógica** | Regra de negócio | Validação falha | → DLQ | Inspecionar, corrigir config, replay |

        ---

        ## Matriz de Decisão

        ```python
        def classify_and_respond_to_failure(exception, event, config):
            """Classificar falha e executar resposta automática"""
            
            # Tipo 1: Evento Inválido
            if is_invalid_event(event):
                send_to_dlq(event, "forge-events-invalid", "INVALID_EVENT")
                increment_metric("forge_invalid_events_total")
                return "SKIP"  # Continuar processando
            
            # Tipo 2: Falha Transitória
            if is_transient_error(exception):
                try:
                    return retry_with_backoff(lambda: process_event(event))
                except:
                    send_to_dlq(event, "forge-events-retry-exhausted", "TRANSIENT_ERROR")
                    increment_metric("forge_transient_errors_total")
                    return "SKIP"
            
            # Tipo 3: Falha de Dependência
            if is_dependency_error(exception):
                if wait_for_dependency(get_service_name(exception)):
                    return retry_with_backoff(lambda: process_event(event))
                else:
                    logger.error("Dependência não recuperou, não commitando offsets")
                    return "STOP"  # Parar processamento
            
            # Tipo 4: Falha de Deploy
            if is_deploy_error(exception):
                send_alert("CRITICAL", f"Deploy error: {exception}")
                return "STOP"  # Parar processamento
            
            # Tipo 5: Falha de Lógica de Negócio
            if is_business_logic_error(event, config):
                send_to_dlq(event, "forge-events-business-logic-error", "BUSINESS_LOGIC_ERROR")
                increment_metric("forge_business_logic_errors_total")
                return "SKIP"
            
            # Erro desconhecido
            logger.error(f"Erro desconhecido: {exception}")
            send_to_dlq(event, "forge-events-unknown-error", "UNKNOWN_ERROR")
            return "SKIP"
        ```

        **Verificação:**

        ```bash
        # Confirmar que classificação está documentada
        grep -E "Tipo [1-5]:|Resposta Automática:|Resposta Manual:" forge/config/failure-classification.md | wc -l
        # Esperado: > 30 linhas
        ```

