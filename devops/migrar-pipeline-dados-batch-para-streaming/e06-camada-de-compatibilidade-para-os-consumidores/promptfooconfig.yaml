        ## 9. Crie testes de escrita e leitura consistente

        **Ação:** Implemente testes para validar escrita incremental e leitura consistente.

        **Onde:** Arquivo `forge/tests/test_write_consistency.py` (novo) no repositório do Forge.

        **Procedimento:**

        ```python
        #!/usr/bin/env python3
        """
        Testes de Escrita e Leitura Consistente
        Valida que escrita incremental não cria duplicatas e leitura é consistente.
        """
        import pytest
        from pyspark.sql import SparkSession
        from pyspark.sql.functions import col, count, sum as spark_sum
        from datetime import datetime, timedelta
        import time
        import logging

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        @pytest.fixture(scope="session")
        def spark():
            """Cria sessão Spark para testes"""
            return SparkSession.builder \
                .appName("forge-write-consistency-tests") \
                .master("local[4]") \
                .getOrCreate()

        class TestWriteConsistency:
            """Testes de escrita e leitura consistente"""
            
            def test_no_duplicates_after_write(self, spark):
                """Teste: Escrita não cria duplicatas"""
                logger.info("Teste: No Duplicates After Write")
                
                # Dados de entrada
                input_data = [
                    {"window_start": "2024-01-15-10", "tenant_id": "t1", "total_value": 100},
                    {"window_start": "2024-01-15-10", "tenant_id": "t1", "total_value": 110},  # Duplicata
                    {"window_start": "2024-01-15-10", "tenant_id": "t2", "total_value": 200},
                ]
                df_input = spark.createDataFrame(input_data)
                
                # Deduplicar (simular escrita com merge)
                df_deduplicated = df_input.dropDuplicates(["window_start", "tenant_id"])
                
                # Validar
                assert df_deduplicated.count() == 2, "Deve remover duplicatas"
                logger.info("✅ Teste passou")
            
            def test_idempotent_write(self, spark):
                """Teste: Escrita é idempotente (2× escrita = 1× escrita)"""
                logger.info("Teste: Idempotent Write")
                
                # Dados de entrada
                input_data = [
                    {"window_start": "2024-01-15-10", "tenant_id": "t1", "total_value": 100},
                    {"window_start": "2024-01-15-10", "tenant_id": "t2", "total_value": 200},
                ]
                df_input = spark.createDataFrame(input_data)
                
                # Escrever 1×
                df_result_1 = df_input.dropDuplicates(["window_start", "tenant_id"])
                count_1 = df_result_1.count()
                
                # Duplicar dados (simular reprocessamento)
                df_duplicated = df_input.union(df_input)
                
                # Escrever 2×
                df_result_2 = df_duplicated.dropDuplicates(["window_start", "tenant_id"])
                count_2 = df_result_2.count()
                
                # Validar
                assert count_1 == count_2, f"Contagem diferente: {count_1} vs {count_2}"
                logger.info("✅ Teste passou")
            
            def test_read_consistency_closed_partition(self, spark):
                """Teste: Leitura de partição fechada é consistente"""
                logger.info("Teste: Read Consistency Closed Partition")
                
                # Dados de entrada (partição fechada)
                input_data = [
                    {"hour": "2024-01-15-10", "tenant_id": "t1", "total_value": 100},
                    {"hour": "2024-01-15-10", "tenant_id": "t2", "total_value": 200},
                ]
                df_input = spark.createDataFrame(input_data)
                
                # Ler 1×
                df_read_1 = df_input.filter(col("hour") < "2024-01-15-11")
                count_1 = df_read_1.count()
                
                # Ler 2× (sem mudanças)
                df_read_2 = df_input.filter(col("hour") < "2024-01-15-11")
                count_2 = df_read_2.count()
                
                # Validar
                assert count_1 == count_2, f"Contagem diferente: {count_1} vs {count_2}"
                logger.info("✅ Teste passou")
            
            def test_aggregation_correctness(self, spark):
                """Teste: Agregação está correta após escrita"""
                logger.info("Teste: Aggregation Correctness")
                
                # Dados de entrada
                input_data = [
                    {"window_start": "2024-01-15-10", "tenant_id": "t1", "metric_value": 10},
                    {"window_start": "2024-01-15-10", "tenant_id": "t1", "metric_value": 20},
                    {"window_start": "2024-01-15-10", "tenant_id": "t1", "metric_value": 30},
                ]
                df_input = spark.createDataFrame(input_data)
                
                # Agregar
                df_agg = df_input.groupBy("window_start", "tenant_id").agg(
                    spark_sum("metric_value").alias("total_value"),
                    count("*").alias("event_count")
                )
                
                # Validar
                result = df_agg.collect()[0]
                assert result["total_value"] == 60, "SUM deve ser 60"
                assert result["event_count"] == 3, "COUNT deve ser 3"
                logger.info("✅ Teste passou")
            
            def test_billing_deduplication(self, spark):
                """Teste: Billing é deduplicated corretamente"""
                logger.info("Teste: Billing Deduplication")
                
                # Dados de entrada (com duplicatas)
                input_data = [
                    {"day": "2024-01-15", "tenant_id": "t1", "unique_event_count": 100},
                    {"day": "2024-01-15", "tenant_id": "t1", "unique_event_count": 110},  # Duplicata (mais recente)
                    {"day": "2024-01-15", "tenant_id": "t2", "unique_event_count": 200},
                ]
                df_input = spark.createDataFrame(input_data)
                
                # Deduplicar (manter última linha)
                from pyspark.sql.window import Window
                from pyspark.sql.functions import row_number
                
                window_spec = Window.partitionBy("day", "tenant_id").orderBy(col("unique_event_count").desc())
                df_with_rn = df_input.withColumn("rn", row_number().over(window_spec))
                df_deduplicated = df_with_rn.filter(col("rn") == 1).drop("rn")
                
                # Validar
                assert df_deduplicated.count() == 2, "Deve ter 2 linhas"
                t1_row = df_deduplicated.filter(col("tenant_id") == "t1").collect()[0]
                assert t1_row["unique_event_count"] == 110, "Deve manter última linha (110)"
                logger.info("✅ Teste passou")
            
            def test_partition_closure(self, spark):
                """Teste: Partição é fechada corretamente"""
                logger.info("Teste: Partition Closure")
                
                # Simular fechamento de partição
                from datetime import datetime, timedelta
                
                hour_start = datetime(2024, 1, 15, 10, 0, 0)
                hour_end = hour_start + timedelta(hours=1)
                watermark_time = hour_end + timedelta(seconds=45)
                close_time = watermark_time + timedelta(seconds=60)
                
                # Verificar se agora > close_time
                now = datetime.utcnow()
                
                # Simular: agora é 1 hora depois
                simulated_now = hour_start + timedelta(hours=2)
                
                # Validar
                assert simulated_now > close_time, "Partição deve estar fechada"
                logger.info("✅ Teste passou")

        if __name__ == "__main__":
            pytest.main([__file__, "-v"])
        ```

