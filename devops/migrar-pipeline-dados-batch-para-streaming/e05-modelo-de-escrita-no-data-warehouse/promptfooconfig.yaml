        df_billing = df_watermarked.groupBy(
            window(col("timestamp"), "1 day"),
            col("tenant_id")
        ).agg(
            count(distinct("event_id")).alias("unique_event_count"),
            count("*").alias("total_event_count")
        )
        query = df_billing.writeStream \
            .format("parquet") \
            .option("path", "/data/forge/billing_events") \
            .option("checkpointLocation", "/data/forge/checkpoint/billing") \
            .outputMode("update") \
            .trigger(processingTime="1 hour") \
            .start()
        ```

