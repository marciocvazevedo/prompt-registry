            ## 2. Implemente job de reconciliação: comparações, frequência, granularidade

            **Ação:** Criar job que compara batch vs streaming com múltiplas estratégias de comparação.

            **Onde:** Arquivo `forge/jobs/reconciliation_job.py` (novo) no repositório do Forge.

            **Procedimento:**

            ```python
            #!/usr/bin/env python3
            """
            Job de Reconciliação — Dual-Run Batch vs Streaming
            Compara saídas de batch e streaming com múltiplas estratégias.
            Executa a cada 1 hora.
            """
            from pyspark.sql import SparkSession
            from pyspark.sql.functions import (
                col, count, sum as spark_sum, avg, max as spark_max, min as spark_min,
                abs as spark_abs, when, coalesce, lit, current_timestamp, datediff
            )
            from pyspark.sql.window import Window
            import logging
            from datetime import datetime, timedelta
            import json
            import os

            logging.basicConfig(level=logging.INFO)
            logger = logging.getLogger(__name__)

            class ReconciliationJob:
                """Job de reconciliação batch vs streaming"""
                
                def __init__(self, spark):
                    self.spark = spark
                    self.logger = logger
                    self.report = {
                        "timestamp": datetime.utcnow().isoformat(),
                        "comparisons": {},
                        "divergences": [],
                        "metrics": {},
                        "status": "PENDING"
                    }
                
                # ========== Estratégia 1: Comparação Exata (Row-by-Row) ==========
                def compare_exact(self, table_name, key_cols):
                    """
                    Comparação exata: cada linha de batch deve ter correspondente em streaming.
                    Granularidade: por linha (chave natural)
                    Frequência: a cada 1 hora
                    """
                    self.logger.info(f"Comparação Exata: {table_name}")
                    
                    try:
                        # Ler batch
                        df_batch = self.spark.read.parquet(f"/data/forge/batch/{table_name}")
                        
                        # Ler streaming
                        df_streaming = self.spark.read.parquet(f"/data/forge/streaming/{table_name}")
                        
                        # Adicionar marcador de origem
                        df_batch_marked = df_batch.withColumn("source", lit("batch"))
                        df_streaming_marked = df_streaming.withColumn("source", lit("streaming"))
                        
                        # Unir por chave natural
                        df_joined = df_batch_marked.join(
                            df_streaming_marked,
                            on=key_cols,
                            how="full_outer"
                        )
                        
                        # Encontrar divergências
                        df_divergences = df_joined.filter(
                            (col("source_batch").isNull()) | (col("source_streaming").isNull())
                        )
                        
                        divergence_count = df_divergences.count()
                        batch_count = df_batch.count()
                        streaming_count = df_streaming.count()
                        
                        divergence_rate = (divergence_count / batch_count * 100) if batch_count > 0 else 0
                        
                        result = {
                            "table": table_name,
                            "strategy": "exact",
                            "batch_count": batch_count,
                            "streaming_count": streaming_count,
                            "divergence_count": divergence_count,
                            "divergence_rate_percent": divergence_rate,
                            "status": "PASS" if divergence_rate < 0.1 else "FAIL"
                        }
                        
                        self.logger.info(f"  Batch: {batch_count}, Streaming: {streaming_count}, Divergências: {divergence_count} ({divergence_rate:.2f}%)")
                        
                        return result, df_divergences
                    
                    except Exception as e:
                        self.logger.error(f"Erro em comparação exata: {e}")
                        return {
                            "table": table_name,
                            "strategy": "exact",
                            "status": "ERROR",
                            "error": str(e)
                        }, None
                
                # ========== Estratégia 2: Comparação de Agregações ==========
                def compare_aggregations(self, table_name, group_cols, agg_cols):
                    """
                    Comparação de agregações: SUM, COUNT, AVG por grupo.
                    Granularidade: por grupo (ex: por tenant, por service)
                    Frequência: a cada 1 hora
                    """
                    self.logger.info(f"Comparação de Agregações: {table_name}")
                    
                    try:
                        # Ler batch
                        df_batch = self.spark.read.parquet(f"/data/forge/batch/{table_name}")
                        
                        # Ler streaming
                        df_streaming = self.spark.read.parquet(f"/data/forge/streaming/{table_name}")
                        
                        # Agregar batch
                        agg_dict = {col: "sum" for col in agg_cols}
                        df_batch_agg = df_batch.groupBy(*group_cols).agg(agg_dict)
                        df_batch_agg = df_batch_agg.withColumn("source", lit("batch"))
                        
                        # Agregar streaming
                        df_streaming_agg = df_streaming.groupBy(*group_cols).agg(agg_dict)
                        df_streaming_agg = df_streaming_agg.withColumn("source", lit("streaming"))
                        
                        # Unir
                        df_joined = df_batch_agg.join(
                            df_streaming_agg,
                            on=group_cols,
                            how="full_outer"
                        )
                        
                        # Calcular diferenças
                        df_diff = df_joined.select(
                            *group_cols,
                            *[
                                when(
                                    col(f"{col}_batch").isNull(),
                                    lit(None)
                                ).otherwise(
                                    spark_abs(col(f"{col}_batch") - coalesce(col(f"{col}_streaming"), lit(0)))
                                ).alias(f"{col}_diff")
                                for col in agg_cols
                            ]
                        )
                        
                        # Encontrar divergências (diferença > 1%)
                        df_divergences = df_diff.filter(
                            (col(f"{agg_cols[0]}_diff") > 0.01 * col(f"{agg_cols[0]}_batch"))
                        )
                        
                        divergence_count = df_divergences.count()
                        group_count = df_batch_agg.count()
                        divergence_rate = (divergence_count / group_count * 100) if group_count > 0 else 0
                        
                        result = {
                            "table": table_name,
                            "strategy": "aggregations",
                            "group_count": group_count,
                            "divergence_count": divergence_count,
                            "divergence_rate_percent": divergence_rate,
                            "status": "PASS" if divergence_rate < 0.1 else "FAIL"
                        }
                        
                        self.logger.info(f"  Grupos: {group_count}, Divergências: {divergence_count} ({divergence_rate:.2f}%)")
                        
                        return result, df_divergences
                    
                    except Exception as e:
                        self.logger.error(f"Erro em comparação de agregações: {e}")
                        return {
                            "table": table_name,
                            "strategy": "aggregations",
                            "status": "ERROR",
                            "error": str(e)
                        }, None
                
                # ========== Estratégia 3: Comparação de Distribuição ==========
                def compare_distribution(self, table_name, value_col, bucket_count=10):
                    """
                    Comparação de distribuição: histograma de valores.
                    Granularidade: por bucket (ex: latência 0-10ms, 10-20ms, etc)
                    Frequência: a cada 1 hora
                    """
                    self.logger.info(f"Comparação de Distribuição: {table_name}")
                    
                    try:
                        # Ler batch
                        df_batch = self.spark.read.parquet(f"/data/forge/batch/{table_name}")
                        
                        # Ler streaming
                        df_streaming = self.spark.read.parquet(f"/data/forge/streaming/{table_name}")
                        
                        # Calcular min/max
                        batch_min = df_batch.agg({value_col: "min"}).collect()[0][0]
                        batch_max = df_batch.agg({value_col: "max"}).collect()[0][0]
                        streaming_min = df_streaming.agg({value_col: "min"}).collect()[0][0]
                        streaming_max = df_streaming.agg({value_col: "max"}).collect()[0][0]
                        
                        # Usar range comum
                        min_val = min(batch_min, streaming_min)
                        max_val = max(batch_max, streaming_max)
                        bucket_size = (max_val - min_val) / bucket_count
                        
                        # Criar buckets
                        df_batch_bucketed = df_batch.withColumn(
                            "bucket",
                            ((col(value_col) - lit(min_val)) / lit(bucket_size)).cast("int")
                        )
                        df_streaming_bucketed = df_streaming.withColumn(
                            "bucket",
                            ((col(value_col) - lit(min_val)) / lit(bucket_size)).cast("int")
                        )
                        
                        # Contar por bucket
                        df_batch_dist = df_batch_bucketed.groupBy("bucket").count().withColumn("source", lit("batch"))
                        df_streaming_dist = df_streaming_bucketed.groupBy("bucket").count().withColumn("source", lit("streaming"))
                        
                        # Unir
                        df_joined = df_batch_dist.join(
                            df_streaming_dist,
                            on="bucket",
                            how="full_outer"
                        )
                        
                        # Calcular diferenças percentuais
                        df_diff = df_joined.select(
                            col("bucket"),
                            coalesce(col("count_batch"), lit(0)).alias("count_batch"),
                            coalesce(col("count_streaming"), lit(0)).alias("count_streaming"),
                            when(
                                col("count_batch") == 0,
                                lit(0)
                            ).otherwise(
                                spark_abs(col("count_batch") - col("count_streaming")) / col("count_batch") * 100
                            ).alias("diff_percent")
                        )
                        
                        # Encontrar divergências (diferença > 10%)
                        df_divergences = df_diff.filter(col("diff_percent") > 10)
                        
                        divergence_count = df_divergences.count()
                        bucket_count_total = df_diff.count()
                        divergence_rate = (divergence_count / bucket_count_total * 100) if bucket_count_total > 0 else 0
                        
                        result = {
                            "table": table_name,
                            "strategy": "distribution",
                            "bucket_count": bucket_count_total,
                            "divergence_count": divergence_count,
                            "divergence_rate_percent": divergence_rate,
                            "status": "PASS" if divergence_rate < 0.1 else "FAIL"
                        }
                        
                        self.logger.info(f"  Buckets: {bucket_count_total}, Divergências: {divergence_count} ({divergence_rate:.2f}%)")
                        
                        return result, df_divergences
                    
                    except Exception as e:
                        self.logger.error(f"Erro em comparação de distribuição: {e}")
                        return {
                            "table": table_name,
                            "strategy": "distribution",
                            "status": "ERROR",
                            "error": str(e)
                        }, None
                
                # ========== Estratégia 4: Comparação de Timing ==========
                def compare_timing(self, table_name, timestamp_col):
                    """
                    Comparação de timing: latência entre batch e streaming.
                    Granularidade: por hora
                    Frequência: a cada 1 hora
                    """
                    self.logger.info(f"Comparação de Timing: {table_name}")
                    
                    try:
                        # Ler batch
                        df_batch = self.spark.read.parquet(f"/data/forge/batch/{table_name}")
                        
                        # Ler streaming
                        df_streaming = self.spark.read.parquet(f"/data/forge/streaming/{table_name}")
                        
                        # Calcular latência média
                        batch_latency = df_batch.agg({timestamp_col: "avg"}).collect()[0][0]
                        streaming_latency = df_streaming.agg({timestamp_col: "avg"}).collect()[0][0]
                        
                        latency_diff = abs(batch_latency - streaming_latency) if batch_latency and streaming_latency else None
                        
                        result = {
                            "table": table_name,
                            "strategy": "timing",
                            "batch_avg_latency_ms": batch_latency,
                            "streaming_avg_latency_ms": streaming_latency,
                            "latency_diff_ms": latency_diff,
                            "status": "PASS" if latency_diff is None or latency_diff < 1000 else "FAIL"  # < 1 s
                        }
                        
                        self.logger.info(f"  Batch latência: {batch_latency}ms, Streaming latência: {streaming_latency}ms, Diferença: {latency_diff}ms")
                        
                        return result, None
                    
                    except Exception as e:
                        self.logger.error(f"Erro em comparação de timing: {e}")
                        return {
                            "table": table_name,
                            "strategy": "timing",
                            "status": "ERROR",
                            "error": str(e)
                        }, None
                
                def run_reconciliation(self):
                    """Executar reconciliação completa"""
                    self.logger.info("Iniciando reconciliação batch vs streaming")
                    
                    # Tabelas a reconciliar
                    tables = {
                        "aggregated": {
                            "key_cols": ["window_start", "window_end", "tenant_id"],
                            "agg_cols": ["request_count", "error_count"],
                            "value_col": "request_count",
                            "timestamp_col": "ingestion_timestamp"
                        },
                        "by_service": {
                            "key_cols": ["window_start", "window_end", "tenant_id", "service_id"],
                            "agg_cols": ["request_count", "error_count"],
                            "value_col": "request_count",
                            "timestamp_col": "ingestion_timestamp"
                        },
                        "billing_events": {
                            "key_cols": ["day_start", "tenant_id"],
                            "agg_cols": ["unique_event_count"],
                            "value_col": "unique_event_count",
                            "timestamp_col": "ingestion_timestamp"
                        },
                    }
                    
                    for table_name, config in tables.items():
                        self.logger.info(f"\n=== Reconciliando {table_name} ===")
                        
                        # Estratégia 1: Comparação Exata
                        result_exact, div_exact = self.compare_exact(table_name, config["key_cols"])
                        self.report["comparisons"][f"{table_name}_exact"] = result_exact
                        
                        # Estratégia 2: Comparação de Agregações
                        result_agg, div_agg = self.compare_aggregations(table_name, config["key_cols"][:2], config["agg_cols"])
                        self.report["comparisons"][f"{table_name}_agg"] = result_agg
                        
                        # Estratégia 3: Comparação de Distribuição
                        result_dist, div_dist = self.compare_distribution(table_name, config["value_col"])
                        self.report["comparisons"][f"{table_name}_dist"] = result_dist
                        
                        # Estratégia 4: Comparação de Timing
                        result_timing, _ = self.compare_timing(table_name, config["timestamp_col"])
                        self.report["comparisons"][f"{table_name}_timing"] = result_timing
                        
                        # Salvar divergências
                        if div_exact is not None and div_exact.count() > 0:
                            div_exact.write.mode("append").parquet(f"/data/forge/reconciliation/divergences/{table_name}_exact")
                        if div_agg is not None and div_agg.count() > 0:
                            div_agg.write.mode("append").parquet(f"/data/forge/reconciliation/divergences/{table_name}_agg")
                        if div_dist is not None and div_dist.count() > 0:
                            div_dist.write.mode("append").parquet(f"/data/forge/reconciliation/divergences/{table_name}_dist")
                    
                    # Determinar status geral
                    all_pass = all(
                        comp.get("status") == "PASS"
                        for comp in self.report["comparisons"].values()
                        if comp.get("status") in ["PASS", "FAIL"]
                    )
                    self.report["status"] = "PASS" if all_pass else "FAIL"
                    
                    self.logger.info(f"\nStatus geral: {self.report['status']}")
                    
                    return self.report
                
                def save_report(self, output_file):
                    """Salvar relatório em JSON"""
                    with open(output_file, "w") as f:
                        json.dump(self.report, f, indent=2, default=str)
                    self.logger.info(f"Relatório salvo em: {output_file}")

            def create_spark_session():
                """Cria sessão Spark"""
                return SparkSession.builder \
                    .appName("forge-reconciliation") \
                    .getOrCreate()

            def main():
                """Função principal"""
                spark = create_spark_session()
                reconciliation = ReconciliationJob(spark)
                
                # Executar reconciliação
                report = reconciliation.run_reconciliation()
                
                # Salvar relatório
                output_file = f"reconciliation_report_{datetime.utcnow().strftime('%Y%m%d_%H%M%S')}.json"
                reconciliation.save_report(output_file)
                
                # Retornar código de saída
                exit(0 if report["status"] == "PASS" else 1)

            if __name__ == "__main__":
                main()
            ```

