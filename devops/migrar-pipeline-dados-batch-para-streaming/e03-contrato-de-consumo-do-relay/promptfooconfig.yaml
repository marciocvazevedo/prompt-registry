        ### 1.4 Tempo de Recuperação (Recovery Time Objective — RTO)

        **Definição:** Tempo máximo para o Forge recuperar-se de uma falha e voltar a processar eventos.

        **Comando/Configuração:**

        ```markdown
        # SLO: Tempo de Recuperação (RTO — Recovery Time Objective)

        ## Definição
        Tempo decorrido desde a detecção de uma falha até o Forge voltar a processar 
        eventos e reduzir o lag (atraso) para < 1 min.

        ## Métrica
        - **Nome:** `forge_recovery_time_seconds`
        - **Fórmula:** timestamp_lag_reduzido - timestamp_falha_detectada
        - **Granularidade:** Por incidente
        - **Coleta:** Logs de job; métrica de lag do consumer group

        ## SLO
        | Cenário | RTO alvo | Justificativa |
        |---------|----------|---------------|
        | Falha de task (1 de N) | 30 s | Auto-restart rápido |
        | Falha de job (todos os tasks) | 5 min | Redeploy + rebalance |
        | Falha de DW (indisponibilidade) | 15 min | Fora do escopo do Forge; SLA do DW |
        | Falha de Relay (indisponibilidade) | 15 min | Fora do escopo do Forge; SLA do Relay |

        ## Baseline (Etapa 1)
        - RTO atual: ~60 min (próximo lote batch)
        - Causa: job falha, aguarda próximo agendamento

        ## Melhoria esperada
        - RTO: 60 min → 5 min (12× mais rápido)
        - Impacto: Sentinel não fica sem dados por > 5 min
        ```

