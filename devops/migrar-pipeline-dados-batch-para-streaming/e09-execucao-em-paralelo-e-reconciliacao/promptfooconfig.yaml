        ## 2. Implemente instrumentação de latência de ponta a ponta (E2E)

        **Ação:** Adicionar timestamps em pontos críticos (Relay, Streaming, DW) e calcular latência E2E.

        **Onde:** Arquivo `forge/jobs/streaming_instrumented.py` (novo) no repositório do Forge.

        **Procedimento:**

        ```python
        #!/usr/bin/env python3
        """
        Streaming com Instrumentação de Latência E2E
        Mede tempo desde chegada no Relay até consultável no DW.
        """
        from pyspark.sql import SparkSession
        from pyspark.sql.functions import (
            col, from_json, current_timestamp, unix_timestamp, 
            when, percentile_approx, window, count, sum as spark_sum
        )
        from pyspark.sql.types import StructType, StructField, StringType, LongType, DoubleType, MapType
        import logging
        from datetime import datetime
        import time

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        # Configuração
        RELAY_BROKER = "<relay-broker>"  # [SUPOSIÇÃO]
        RELAY_TOPIC = "forge-events-raw"
        CONSUMER_GROUP = "forge-streaming-v1"

        # Schema do evento
        EVENT_SCHEMA = StructType([
            StructField("event_id", StringType(), False),
            StructField("tenant_id", StringType(), False),
            StructField("timestamp", LongType(), False),  # Timestamp de chegada no Relay (ms)
            StructField("service_id", StringType(), False),
            StructField("metric_name", StringType(), False),
            StructField("metric_value", DoubleType(), False),
            StructField("tags", MapType(StringType(), StringType()), True),
        ])

        class StreamingInstrumented:
            """Streaming com instrumentação de latência E2E"""
            
            def __init__(self, spark):
                self.spark = spark
                self.logger = logger
                self.metrics = {}
            
            def stage_1_ingest_with_timestamps(self, df_raw):
                """
                Etapa 1: Ingestão com timestamps.
                Marca: T1 = timestamp de chegada no Relay (do evento)
                """
                self.logger.info("Etapa 1: Ingestão com timestamps")
                
                # Desserializar
                df_parsed = df_raw.select(
                    col("key").cast(StringType()).alias("partition_key"),
                    from_json(col("value").cast(StringType()), EVENT_SCHEMA).alias("event"),
                    col("timestamp").alias("kafka_timestamp_ms")  # Timestamp do Kafka (ms)
                ).select(
                    col("partition_key"),
                    col("event.*"),
                    col("kafka_timestamp_ms")
                )
                
                # Adicionar timestamps de instrumentação
                df_with_timestamps = df_parsed.withColumn(
                    "t1_relay_arrival_ms",
                    col("timestamp")  # Timestamp do evento (chegada no Relay)
                ).withColumn(
                    "t2_streaming_ingestion_ms",
                    unix_timestamp(current_timestamp()) * 1000  # Timestamp de ingestão no Streaming
                ).withColumn(
                    "latency_relay_to_streaming_ms",
                    col("t2_streaming_ingestion_ms") - col("t1_relay_arrival_ms")
                )
                
                # Registrar métrica
                self.logger.info(f"Latência Relay→Streaming: {df_with_timestamps.select('latency_relay_to_streaming_ms').describe().show()}")
                
                return df_with_timestamps
            
            def stage_2_transform_with_timestamps(self, df_ingested):
                """
                Etapa 2: Transformação com timestamps.
                Marca: T3 = timestamp após transformação
                """
                self.logger.info("Etapa 2: Transformação com timestamps")
                
                # Transformar (normalizar métrica, etc)
                df_transformed = df_ingested.withColumn(
                    "metric_name_normalized",
                    when(col("metric_name").contains("latency"), col("metric_name"))
                    .otherwise(col("metric_name"))
                ).withColumn(
                    "t3_streaming_transform_ms",
                    unix_timestamp(current_timestamp()) * 1000
                ).withColumn(
                    "latency_streaming_transform_ms",
                    col("t3_streaming_transform_ms") - col("t2_streaming_ingestion_ms")
                )
                
                return df_transformed
            
            def stage_3_aggregate_with_timestamps(self, df_transformed):
                """
                Etapa 3: Agregação com timestamps.
                Marca: T4 = timestamp após agregação
                """
                self.logger.info("Etapa 3: Agregação com timestamps")
                
                # Converter timestamp para Spark timestamp
                df_with_ts = df_transformed.withColumn(
                    "event_timestamp",
                    (col("timestamp") / 1000).cast("timestamp")
                )
                
                # Aplicar watermark
                df_watermarked = df_with_ts.withWatermark("event_timestamp", "45 seconds")
                
                # Agregar
                df_aggregated = df_watermarked.groupBy(
                    window(col("event_timestamp"), "30 seconds"),
                    col("tenant_id"),
                    col("service_id")
                ).agg(
                    col("window.start").alias("window_start"),
                    col("window.end").alias("window_end"),
                    col("tenant_id"),
                    col("service_id"),
                    spark_sum("metric_value").alias("total_value"),
                    count("*").alias("event_count"),
                    # Manter timestamps de instrumentação
                    col("t1_relay_arrival_ms"),
                    col("t2_streaming_ingestion_ms"),
                    col("t3_streaming_transform_ms"),
                ).withColumn(
                    "t4_streaming_aggregate_ms",
                    unix_timestamp(current_timestamp()) * 1000
                ).withColumn(
                    "latency_streaming_aggregate_ms",
                    col("t4_streaming_aggregate_ms") - col("t3_streaming_transform_ms")
                )
                
                return df_aggregated
            
            def stage_4_write_with_timestamps(self, df_aggregated, batch_id):
                """
                Etapa 4: Escrita no DW com timestamps.
                Marca: T5 = timestamp após escrita no DW
                """
                self.logger.info(f"Batch {batch_id}: Escrita no DW com timestamps")
                
                # Adicionar timestamp de escrita
                df_with_write_ts = df_aggregated.withColumn(
                    "t5_dw_write_ms",
                    unix_timestamp(current_timestamp()) * 1000
                ).withColumn(
                    "latency_streaming_write_ms",
                    col("t5_dw_write_ms") - col("t4_streaming_aggregate_ms")
                ).withColumn(
                    "latency_e2e_ms",
                    col("t5_dw_write_ms") - col("t1_relay_arrival_ms")
                )
                
                # Escrever no DW
                df_with_write_ts.write.mode("append") \
                    .parquet("/data/forge/aggregated_instrumented")
                
                # Registrar métricas de latência
                latency_stats = df_with_write_ts.select("latency_e2e_ms").describe().collect()
                self.logger.info(f"Batch {batch_id}: Latência E2E stats: {latency_stats}")
                
                # Calcular percentis
                percentiles = df_with_write_ts.approxQuantile("latency_e2e_ms", [0.5, 0.95, 0.99], 0.01)
                self.logger.info(f"Batch {batch_id}: Latência E2E percentis: p50={percentiles[0]:.0f}ms, p95={percentiles[1]:.0f}ms, p99={percentiles[2]:.0f}ms")
                
                return df_with_write_ts
            
            def emit_metrics_to_prometheus(self, df_with_latencies, batch_id):
                """
                Emitir métricas de latência para Prometheus.
                """
                self.logger.info(f"Batch {batch_id}: Emitindo métricas para Prometheus")
                
                # Calcular percentis
                percentiles = df_with_latencies.approxQuantile(
                    "latency_e2e_ms", 
                    [0.5, 0.95, 0.99], 
                    0.01
                )
                
                # Emitir para Prometheus (via Pushgateway)
                import requests
                
                metrics = f"""
        # HELP forge_latency_e2e_ms Latência de ponta a ponta (ms)
        # TYPE forge_latency_e2e_ms gauge
        forge_latency_e2e_ms{{percentile="p50"}} {percentiles[0]}
        forge_latency_e2e_ms{{percentile="p95"}} {percentiles[1]}
        forge_latency_e2e_ms{{percentile="p99"}} {percentiles[2]}

        # HELP forge_latency_relay_to_streaming_ms Latência Relay→Streaming (ms)
        # TYPE forge_latency_relay_to_streaming_ms gauge
        forge_latency_relay_to_streaming_ms {{}} {df_with_latencies.select('latency_relay_to_streaming_ms').rdd.map(lambda x: x[0]).mean()}

        # HELP forge_latency_streaming_transform_ms Latência Streaming Transform (ms)
        # TYPE forge_latency_streaming_transform_ms gauge
        forge_latency_streaming_transform_ms {{}} {df_with_latencies.select('latency_streaming_transform_ms').rdd.map(lambda x: x[0]).mean()}

        # HELP forge_latency_streaming_aggregate_ms Latência Streaming Aggregate (ms)
        # TYPE forge_latency_streaming_aggregate_ms gauge
        forge_latency_streaming_aggregate_ms {{}} {df_with_latencies.select('latency_streaming_aggregate_ms').rdd.map(lambda x: x[0]).mean()}

        # HELP forge_latency_streaming_write_ms Latência Streaming Write (ms)
        # TYPE forge_latency_streaming_write_ms gauge
        forge_latency_streaming_write_ms {{}} {df_with_latencies.select('latency_streaming_write_ms').rdd.map(lambda x: x[0]).mean()}
        """
                
                try:
                    response = requests.post(
                        "http://prometheus-pushgateway:9091/metrics/job/forge-streaming",
                        data=metrics
                    )
                    self.logger.info(f"Batch {batch_id}: Métricas emitidas para Prometheus (status={response.status_code})")
                except Exception as e:
                    self.logger.error(f"Batch {batch_id}: Erro ao emitir métricas: {e}")
            
            def run_pipeline(self, df_raw):
                """Executar pipeline com instrumentação"""
                self.logger.info("Iniciando pipeline com instrumentação")
                
                # Etapa 1: Ingestão
                df_ingested = self.stage_1_ingest_with_timestamps(df_raw)
                
                # Etapa 2: Transformação
                df_transformed = self.stage_2_transform_with_timestamps(df_ingested)
                
                # Etapa 3: Agregação
                df_aggregated = self.stage_3_aggregate_with_timestamps(df_transformed)
                
                # Etapa 4: Escrita (com foreachBatch para emitir métricas)
                query = df_aggregated.writeStream \
                    .foreachBatch(lambda df, batch_id: self._write_and_emit_metrics(df, batch_id)) \
                    .outputMode("update") \
                    .trigger(processingTime="30 seconds") \
                    .start()
                
                return query
            
            def _write_and_emit_metrics(self, df, batch_id):
                """Helper para escrever e emitir métricas"""
                df_written = self.stage_4_write_with_timestamps(df, batch_id)
                self.emit_metrics_to_prometheus(df_written, batch_id)

        def create_spark_session():
            """Cria sessão Spark"""
            return SparkSession.builder \
                .appName("forge-streaming-instrumented") \
                .config("spark.streaming.kafka.maxRatePerPartition", "2000") \
                .getOrCreate()

        def main():
            """Função principal"""
            spark = create_spark_session()
            
            # Ler do Relay
            df_raw = spark.readStream \
                .format("kafka") \
                .option("kafka.bootstrap.servers", RELAY_BROKER) \
                .option("subscribe", RELAY_TOPIC) \
                .option("startingOffsets", "earliest") \
                .option("kafka.group.id", CONSUMER_GROUP) \
                .load()
            
            # Executar pipeline com instrumentação
            instrumented = StreamingInstrumented(spark)
            query = instrumented.run_pipeline(df_raw)
            
            query.awaitTermination()

        if __name__ == "__main__":
            main()
        ```

        **Verificação:**

        ```bash
        # Testar instrumentação
        spark-submit \
        --master local[4] \
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.3.0,requests \
        forge/jobs/streaming_instrumented.py

        # Verificar que métricas foram emitidas
        curl -s http://prometheus-pushgateway:9091/metrics | grep forge_latency
        # Esperado: métricas de latência aparecem
        ```

