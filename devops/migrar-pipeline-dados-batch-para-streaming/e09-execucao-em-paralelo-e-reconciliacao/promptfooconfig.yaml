        ## Z. Critérios de conclusão

        - [ ] **Matriz de métricas:** 16 métricas mínimas definidas com tipo, granularidade, alerta (passo 1)
        - [ ] **Instrumentação E2E:** Latência de ponta a ponta medida em 5 pontos (Relay, Streaming, Transform, Aggregate, DW) (passo 2)
        - [ ] **Alertas:** 12 alertas implementados com condição, limiar, janela, severidade (passo 3)
        - [ ] **Dashboard:** Criado em Grafana com 12 painéis (batch vs streaming lado a lado) (passo 4)
        - [ ] **Testes de alertas:** 10 testes implementados para provocar cada alerta (passo 5)
        - [ ] **Silenciamento:** Configurado para silenciar alertas durante migração (7 dias) (passo 3)
        - [ ] **Documentação:** Todos os arquivos criados e verificados
        - [ ] **Validação:** Métricas são coletadas, alertas disparam, dashboard exibe dados
        - [ ] **Suposições:** Todas marcadas com `[SUPOSIÇÃO]` e justificadas
        - [ ] **Dados faltantes:** Lista de confirmações necessárias documentada

