                ## 10. Crie dashboard de baseline

                **Ação:** Consolide todas as métricas em um dashboard para referência durante a migração.

                **Onde:** Ferramenta de observabilidade (Grafana, Datadog, etc.).

                **Procedimento:**

                1. Crie um dashboard chamado `Forge Baseline — Etapa 1`.
                2. Adicione painéis:

                | Painel | Métrica | Query/Fórmula |
                |---|---|---|
                | Volume 24h | Eventos/dia | `rate(relay_messages_total[24h])` |
                | Taxa média | Eventos/s | `avg_rate_events_per_sec` |
