        ## 7. Crie código de escrita incremental com deduplicação

        **Ação:** Implemente escrita em Parquet com deduplicação e merge.

        **Onde:** Arquivo `forge/jobs/streaming_write.py` (novo) no repositório do Forge.

        **Procedimento:**

        ```python
        #!/usr/bin/env python3
        """
        Escrita Incremental com Deduplicação
        Implementa estratégia de escrita para streaming.
        """
        from pyspark.sql import SparkSession
        from pyspark.sql.functions import (
            col, row_number, max as spark_max, current_timestamp
        )
        from pyspark.sql.window import Window
        import logging
        from datetime import datetime

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        class StreamingWrite:
            """Estratégias de escrita para streaming"""
            
            def __init__(self, spark):
                self.spark = spark
                self.logger = logger
            
            # ========== Escrita com Upsert/Merge ==========
            def write_aggregation_with_merge(self, df, batch_id, table_name, key_cols):
                """
                Escrever agregações com merge (deduplicação por chave natural).
                
                Args:
                    df: DataFrame com agregações
                    batch_id: ID do batch
                    table_name: Nome da tabela (ex: "aggregated")
                    key_cols: Colunas de chave natural
                """
                self.logger.info(f"Batch {batch_id}: Escrevendo {table_name} com merge")
                
                # Deduplicar por chave natural (manter última linha)
                window_spec = Window.partitionBy(*key_cols).orderBy(col("window_end").desc())
                df_with_rn = df.withColumn("rn", row_number().over(window_spec))
                df_deduplicated = df_with_rn.filter(col("rn") == 1).drop("rn")
                
                # Escrever com overwrite (simula merge)
                df_deduplicated.write.mode("overwrite") \
                    .option("mergeSchema", "true") \
                    .parquet(f"/data/forge/{table_name}")
                
                self.logger.info(f"Batch {batch_id}: {df_deduplicated.count()} linhas escritas")
            
            # ========== Escrita com Staging + Merge ==========
            def write_billing_with_staging(self, df, batch_id):
                """
                Escrever billing com staging + merge.
                
                Args:
                    df: DataFrame com agregações de billing
                    batch_id: ID do batch
                """
                self.logger.info(f"Batch {batch_id}: Escrevendo billing com staging")
                
                # Deduplicar por (day, tenant_id)
                window_spec = Window.partitionBy("day_start", "tenant_id").orderBy(col("unique_event_count").desc())
                df_with_rn = df.withColumn("rn", row_number().over(window_spec))
                df_deduplicated = df_with_rn.filter(col("rn") == 1).drop("rn")
                
                # Escrever em staging
                df_deduplicated.write.mode("append") \
                    .parquet("/data/forge/billing_events_staging")
                
                self.logger.info(f"Batch {batch_id}: {df_deduplicated.count()} linhas escritas em staging")
            
            def merge_billing_staging_to_main(self):
                """
                Merge diário de staging para principal (executar 1× por dia em 02:00 UTC).
                """
                self.logger.info("Executando merge diário de billing")
                
                # Ler staging
                df_staging = self.spark.read.parquet("/data/forge/billing_events_staging")
                
                # Ler principal
                try:
                    df_main = self.spark.read.parquet("/data/forge/billing_events")
                except:
                    # Se principal não existe, criar
                    df_main = self.spark.createDataFrame([], df_staging.schema)
                
                # Merge: atualizar ou inserir
                df_merged = df_main.union(df_staging)
                
                # Deduplicar (manter última linha por chave)
                window_spec = Window.partitionBy("day_start", "tenant_id").orderBy(col("unique_event_count").desc())
                df_with_rn = df_merged.withColumn("rn", row_number().over(window_spec))
                df_final = df_with_rn.filter(col("rn") == 1).drop("rn")
                
                # Escrever principal
                df_final.write.mode("overwrite") \
                    .parquet("/data/forge/billing_events")
                
                # Limpar staging
                self.spark.sql("DELETE FROM parquet.`/data/forge/billing_events_staging`")
                
                self.logger.info(f"Merge concluído: {df_final.count()} linhas em principal")
            
            # ========== Escrita com Append + Deduplicação ==========
            def write_detection_with_dedup(self, df, batch_id, table_name, id_col):
                """
                Escrever detecções (anomalias, SLA, comportamento) com append + dedup.
                
                Args:
                    df: DataFrame com detecções
                    batch_id: ID do batch
                    table_name: Nome da tabela
                    id_col: Coluna de ID único
                """
                self.logger.info(f"Batch {batch_id}: Escrevendo {table_name} com append + dedup")
                
                # Deduplicar por ID
                df_deduplicated = df.dropDuplicates([id_col])
                
                # Append
                df_deduplicated.write.mode("append") \
                    .parquet(f"/data/forge/{table_name}")
                
                self.logger.info(f"Batch {batch_id}: {df_deduplicated.count()} linhas escritas")
            
            # ========== Escrita para Kafka (Cerebro) ==========
            def write_cerebro_with_dedup(self, df, batch_id):
                """
                Escrever para Cerebro com deduplicação.
                
                Args:
                    df: DataFrame com eventos
                    batch_id: ID do batch
                """
                self.logger.info(f"Batch {batch_id}: Escrevendo para Cerebro com dedup")
                
                # Deduplicar por event_id
                df_deduplicated = df.dropDuplicates(["event_id"])
                
                # Escrever para Kafka
                df_deduplicated.write.format("kafka") \
                    .option("kafka.bootstrap.servers", "<relay-broker>") \
                    .option("topic", "forge-events-indexed") \
                    .mode("append") \
                    .save()
                
                self.logger.info(f"Batch {batch_id}: {df_deduplicated.count()} eventos enviados para Cerebro")
            
            # ========== Fechar Partição ==========
            def close_partition_if_ready(self, df, batch_id, hour_col="window_start"):
                """
                Fechar partição se watermark passou.
                
                Args:
                    df: DataFrame
                    batch_id: ID do batch
                    hour_col: Coluna de hora
                """
                from datetime import datetime, timedelta
                import os
                
                # Obter hora mínima no batch
                min_hour = df.agg({hour_col: "min"}).collect()[0][0]
                
                if min_hour is None:
                    return
                
                # Calcular tempo de fechamento
                hour_end = min_hour + timedelta(hours=1)
                watermark_time = hour_end + timedelta(seconds=45)
                close_time = watermark_time + timedelta(seconds=60)
                
                # Verificar se agora > close_time
                now = datetime.utcnow()
                if now > close_time:
                    # Criar marcador de fechamento
                    hour_str = min_hour.strftime("%Y-%m-%d-%H")
                    marker_path = f"/data/forge/partition_metadata"
                    
                    # Escrever em tabela de metadados
                    self.spark.sql(f"""
                    INSERT INTO parquet.`{marker_path}`
                    VALUES ('{hour_str}', 'closed', current_timestamp())
                    """)
                    
                    self.logger.info(f"Partição {hour_str} fechada")

        def create_spark_session():
            """Cria sessão Spark"""
            return SparkSession.builder \
                .appName("forge-streaming-write") \
                .getOrCreate()

        def main():
            """Função principal"""
            spark = create_spark_session()
            writer = StreamingWrite(spark)
            
            # Exemplo: Escrever agregações
            df_aggregated = spark.read.parquet("/data/forge/aggregated_staging")
            writer.write_aggregation_with_merge(df_aggregated, 1, "aggregated", ["window_start", "window_end", "tenant_id"])
            
            # Exemplo: Escrever billing
            df_billing = spark.read.parquet("/data/forge/billing_events_staging")
            writer.write_billing_with_staging(df_billing, 1)
            
            # Exemplo: Merge diário de billing
            writer.merge_billing_staging_to_main()

        if __name__ == "__main__":
            main()
        ```

