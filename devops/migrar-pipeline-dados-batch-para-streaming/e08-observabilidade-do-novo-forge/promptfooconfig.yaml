        ### Etapa 11: Cálculo de Percentis
        **Tipo:** Agregação por janela (stateful)
        **Entrada:** Tabela `forge_events_aggregated`
        **Saída:** Tabela `forge_percentiles`
        **Lógica:**
        - Calcular percentis (p50, p95, p99) de `metric_value` por tenant/hora
        - Usar aproximação (ex: `percentile_approx`)

        **Código (batch):**
        \`\`\`python
        df_aggregated = spark.read.parquet("/data/forge/aggregated")
        df_percentiles = df_aggregated.groupBy(
            date_trunc("hour", col("timestamp")).alias("hour"),
            col("tenant_id")
        ).agg(
            percentile_approx("metric_value", 0.5).alias("p50"),
            percentile_approx("metric_value", 0.95).alias("p95"),
            percentile_approx("metric_value", 0.99).alias("p99")
        )
        df_percentiles.write.mode("overwrite").partitionBy("hour").parquet("/data/forge/percentiles")
        \`\`\`

        **Classificação:** ✅ Agregação por janela → Adequado para streaming (com watermark)

        ---

        ### Etapa 12: Detecção de Mudança de Comportamento
        **Tipo:** Agregação por janela + Enriquecimento por lookup (stateful)
        **Entrada:** Tabela `forge_events_aggregated`
        **Saída:** Tabela `forge_behavior_changes`
        **Lógica:**
        - Comparar `metric_value` atual com média histórica (últimas 7 dias)
        - Detectar mudanças > 50% como "behavior change"
        - Fazer join com histórico para evitar duplicatas

        **Código (batch):**
        \`\`\`python
        df_aggregated = spark.read.parquet("/data/forge/aggregated")
        df_history_7d = spark.read.parquet("/data/forge/aggregated_history_7d")  # Últimas 7 dias
        df_baseline = df_history_7d.groupBy("tenant_id").agg(
            avg("total_value").alias("baseline_value")
        )
        df_changes = df_aggregated.join(
            df_baseline,
            on="tenant_id"
        ).withColumn(
            "change_pct",
            abs(col("total_value") - col("baseline_value")) / col("baseline_value") * 100
        ).filter(
            col("change_pct") > 50
        )
        df_changes.write.mode("overwrite").parquet("/data/forge/behavior_changes")
        \`\`\`

        **Classificação:** ⚠️ Agregação + Lookup → Requer estado (histórico de 7 dias)

        ---

        ### Etapa 13: Agregação para Billing
        **Tipo:** Agregação por janela (stateful)
        **Entrada:** Tabela `forge_events_normalized`
        **Saída:** Tabela `forge_billing_events`
        **Lógica:**
        - Agrupar por `tenant_id`, `day`
        - Calcular: `SUM(event_count)` (para billing por evento)
        - Particionar por dia
        - Deduplicar por `event_id` (para evitar overcharging)

        **Código (batch):**
        \`\`\`python
        df_normalized = spark.read.parquet("/data/forge/normalized")
        df_billing = df_normalized.groupBy(
            date_trunc("day", col("timestamp")).alias("day"),
            col("tenant_id")
        ).agg(
            count(distinct("event_id")).alias("unique_event_count"),
            count("*").alias("total_event_count")
        )
        df_billing.write.mode("overwrite").partitionBy("day").parquet("/data/forge/billing_events")
        \`\`\`

        **Classificação:** ✅ Agregação por janela → Adequado para streaming (com watermark)

