        ## 3. Documente contrato de leitura para Cerebro (indexação contínua sem duplicatas)

        **Ação:** Crie documento que especifica como Cerebro deve ingerir eventos de streaming sem indexar duas vezes.

        **Onde:** Arquivo `forge/docs/cerebro-compatibility.md` (novo) no repositório do Forge.

        **Procedimento:**

        ```markdown
        # Compatibilidade com Cerebro — Contrato de Ingestão

        ## Resumo Executivo
        Cerebro passa de "lote pronto" (1× por hora) para "fluxo contínuo" (a cada 30 s).
        Indexação é **52× mais rápida** (105 min → 2 min).
        Deduplicação por `event_id` garante que eventos não são indexados 2×.

        ## Mudanças Visíveis para Cerebro

        ### Antes (Batch)
        ```
        10:00 — Eventos chegam no Relay
        11:00 — Batch processa (60 min de latência)
        11:05 — Cerebro recebe lote de eventos
        11:10 — Cerebro indexa (1 lote/hora)
        11:15 — Eventos aparecem em buscas
        ```

        ### Depois (Streaming)
        ```
        10:00 — Eventos chegam no Relay
        10:02 — Streaming processa (2 min de latência p95)
        10:03 — Cerebro recebe eventos (a cada 30 s)
        10:04 — Cerebro indexa (contínuo)
        10:05 — Eventos aparecem em buscas
        ```

        **Diferença:** Eventos aparecem em buscas 10 min mais rápido (11:15 → 10:05)

        ---

        ## Contrato de Ingestão: Regras para Cerebro

        ### Regra 1: Consumir de Tópico Kafka (Não de Parquet)
        **Definição:** Cerebro deve consumir de tópico Kafka `forge-events-indexed`, não ler Parquet diretamente.

        **Razão:** Kafka garante:
        - Entrega at-least-once (sem perda de eventos)
        - Offset management (rastreamento de progresso)
        - Deduplicação automática por `event_id` (se configurado)

        **Implementação:**
        ```python
        # ❌ ANTES (lê Parquet em batch)
        def ingest_batch():
        df = spark.read.parquet("/data/forge/enriched")
        for event in df.collect():
            index_event(event)

        # ✅ DEPOIS (consome Kafka em streaming)
        def ingest_stream():
        df = spark.readStream.format("kafka") \
            .option("kafka.bootstrap.servers", "<relay-broker>") \
            .option("subscribe", "forge-events-indexed") \
            .option("startingOffsets", "latest") \
            .load()
        
        df.writeStream \
            .foreachBatch(lambda batch_df, batch_id: index_batch(batch_df)) \
            .outputMode("append") \
            .trigger(processingTime="30 seconds") \
            .start()

        def index_batch(df):
        """Indexar batch de eventos"""
        for event in df.collect():
            index_event(event)
        ```

        ### Regra 2: Deduplicar por `event_id` Antes de Indexar
        **Definição:** Se evento é reprocessado, deduplicar por `event_id` antes de enviar para Elasticsearch.

        **Razão:** Semântica at-least-once permite duplicatas. Deduplicação garante que cada evento é indexado 1×.

        **Implementação:**
        ```python
        def index_batch(df):
        """Indexar batch com deduplicação"""
        # Deduplicar por event_id (manter última linha)
        from pyspark.sql.window import Window
        from pyspark.sql.functions import row_number
        
        window_spec = Window.partitionBy("event_id").orderBy(col("ingestion_timestamp").desc())
        df_with_rn = df.withColumn("rn", row_number().over(window_spec))
        df_deduplicated = df_with_rn.filter(col("rn") == 1).drop("rn")
        
        # Indexar
        for event in df_deduplicated.collect():
            index_event(event)

        def index_event(event):
        """Indexar evento em Elasticsearch"""
        es_client.index(
            index="forge-events",
            id=event["event_id"],  # Usar event_id como ID (garante idempotência)
            body={
            "tenant_id": event["tenant_id"],
            "service_id": event["service_id"],
            "timestamp": event["timestamp"],
            "request_count": event["request_count"],
            "error_count": event["error_count"],
            "latency_ms": event["latency_ms"],
            "status_code": event["status_code"],
            "version": event["version"],
            "environment": event["environment"],
            }
        )
        ```

        ### Regra 3: Usar `event_id` como ID em Elasticsearch
        **Definição:** Elasticsearch deve usar `event_id` como ID do documento (não auto-generated).

        **Razão:** Se evento é reprocessado, Elasticsearch atualiza documento existente (idempotência).

        **Implementação:**
        ```python
        # ❌ ANTES (sem ID explícito, cria duplicatas)
        es_client.index(
        index="forge-events",
        body=event_dict
        )
        # Resultado: Mesmo event_id pode ter 2 documentos em Elasticsearch

        # ✅ DEPOIS (com ID explícito)
        es_client.index(
        index="forge-events",
        id=event["event_id"],  # Usar event_id como ID
        body=event_dict
        )
        # Resultado: Mesmo event_id tem 1 documento (atualizado se reprocessado)
        ```

        ### Regra 4: Monitorar Lag de Indexação
        **Definição:** Lag = `CURRENT_TIMESTAMP() - MAX(event.timestamp)` em Elasticsearch.

        **Razão:** Detectar se indexação está atrasada (problema de performance).

        **Implementação:**
        ```python
        def monitor_indexation_lag():
        """Monitorar lag de indexação"""
        # Obter timestamp mais recente em Elasticsearch
        result = es_client.search(
            index="forge-events",
            body={
            "aggs": {
                "max_timestamp": {
                "max": {"field": "timestamp"}
                }
            }
            }
        )
        max_timestamp = result["aggregations"]["max_timestamp"]["value"]
        
        # Calcular lag
        lag_seconds = (datetime.utcnow() - max_timestamp).total_seconds()
        
        # Alertar se lag > 5 min
        if lag_seconds > 300:
            send_alert(f"Cerebro indexation lag: {lag_seconds} seconds")
        
        return lag_seconds

        # Agendar monitoramento a cada 1 min
        schedule_job(monitor_indexation_lag, interval_seconds=60)
        ```

        ### Regra 5: Não Reindexar Dados Históricos
        **Definição:** Cerebro deve consumir apenas eventos novos (offset = latest), não reprocessar histórico.

        **Razão:** Reprocessar histórico é caro e desnecessário (dados já estão indexados).

        **Implementação:**
        ```python
        # ❌ ANTES (reprocessa histórico)
        df = spark.readStream.format("kafka") \
        .option("startingOffsets", "earliest")  # Começa do início
        .load()

        # ✅ DEPOIS (consome apenas novos)
        df = spark.readStream.format("kafka") \
        .option("startingOffsets", "latest")  # Começa do fim
        .load()
        ```

