        ### Tabela de Exportação Cerebro (cerebro)
        **Características:**
        - Chave natural: `event_id`
        - Modo de saída: Append (eventos são imutáveis)
        - Frequência de escrita: A cada 30 s
        - Tamanho de linha: ~500 bytes
        - **Nota:** Escrita é para Kafka, não para Parquet

        **Estratégia:** **Append com Deduplicação**
        - Deduplicar por `event_id` antes de enviar para Kafka
        - Kafka garante que cada `event_id` é processado pelo menos 1×
        - Consumidor (Cerebro) deve deduplicar por `event_id`

        **Implementação:**
