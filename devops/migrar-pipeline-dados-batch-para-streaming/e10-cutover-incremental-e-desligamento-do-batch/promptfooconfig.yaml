            ## Decisão de Cutover

            **Aprovado para Cutover:** Todos os critérios têm status ✅

            **Não Aprovado:** Qualquer critério tem status ❌

            **Ação se Não Aprovado:**
            1. Investigar critério que falhou
            2. Corrigir problema em streaming
            3. Estender dual-run por mais 7 dias
            4. Reavaliação ao fim de 14 dias (total 21 dias)

