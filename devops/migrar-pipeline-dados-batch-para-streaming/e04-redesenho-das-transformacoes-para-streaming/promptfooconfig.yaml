        ## W. Riscos e mitigação

        | Risco | Probabilidade | Impacto | Mitigação |
        |-------|---------------|--------|-----------|
        | Retenção no Relay é insuficiente (< 2 dias) | Baixa | Alto | Validar retenção atual; aumentar se necessário (coordenar com Relay) |
        | Número de partições é insuficiente (< 32) | Baixa | Médio | Aumentar partições do Relay (rebalance necessário) |
        | Chave de particionamento não é `tenant_id` | Baixa | Alto | Validar chave atual; mudar se necessário (reprocessamento) |
        | Throughput do Forge excede limite (> 500 MB/s) | Baixa | Alto | Reduzir taxa de ingestão; aumentar capacidade do Relay |
        | Desserialização falha (schema mismatch) | Média | Médio | Validar schema; usar Schema Registry com compatibilidade BACKWARD |
        | Watermark é muito agressivo (< 45 s) | Média | Médio | Aumentar watermark; aceitar latência adicional |
        | Consumer group rebalanceia frequentemente | Média | Médio | Aumentar session.timeout.ms; investigar instabilidade |
        | Offset commit falha | Baixa | Alto | Investigar causa; rollback imediato |
        | Checkpoint falha | Baixa | Alto | Investigar causa; rollback imediato |
        | Consumidores não conseguem lidar com duplicatas | Média | Alto | Implementar deduplicação em consumidores; testar com dados reais |
        | Latência p95 excede 120 s | Média | Alto | Aumentar paralelismo; otimizar transformações; rollback se necessário |
        | Completude < 99.9% | Média | Alto | Investigar causa; aumentar retenção; rollback se necessário |

