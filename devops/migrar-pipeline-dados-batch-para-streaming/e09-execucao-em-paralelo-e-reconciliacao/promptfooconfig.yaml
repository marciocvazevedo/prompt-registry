        ## 4. Crie dashboard de acompanhamento da migração (Batch vs Streaming)

        **Ação:** Criar dashboard Grafana com métricas lado a lado de batch vs streaming.

        **Onde:** Arquivo `forge/monitoring/migration-dashboard.json` (novo) no repositório do Forge.

        **Procedimento:**

        ```json
        {
        "dashboard": {
            "title": "Forge Migration: Batch vs Streaming",
            "description": "Acompanhamento da migração de batch para streaming",
            "tags": ["forge", "migration"],
