        ---

        ## X. Ponto de não-retorno

        **Ponto de não-retorno:** Após o passo 5 (deploy em staging com views criadas), consumidores começam a ler dados de streaming.

        **Por quê:** Uma vez que views estão em produção e consumidores estão lendo delas, voltar atrás requer:
        1. Parar job de streaming
        2. Remover views
        3. Reativar job de batch
        4. Atualizar queries de consumidores para ler tabelas de batch
        5. Validar que consumidores estão funcionando novamente

        **Mitigação:** Antes do passo 5, executar testes completos em staging (passos 1–4).

        ---

        ## Y. Rollback

        **Procedimento de rollback (se necessário após passo 5):**

        ```bash
        #!/bin/bash
        # Script de rollback: voltar para batch
        set -e

        echo "=== Rollback: Forge Streaming → Batch ==="

        # 1. Parar job de streaming
        echo "1. Parando job de streaming..."
        kubectl delete deployment forge-streaming-transform -n forge
        kubectl delete deployment forge-streaming-write -n forge
        sleep 30

        # 2. Remover views de compatibilidade
        echo "2. Removendo views de compatibilidade..."
        psql -h <dw-host> -U <user> -d forge -c "
        DROP VIEW IF EXISTS forge.aggregated_hourly;
        DROP VIEW IF EXISTS forge.by_service_hourly;
        DROP VIEW IF EXISTS forge.by_version_hourly;
        DROP VIEW IF EXISTS forge.percentiles_hourly;
        DROP VIEW IF EXISTS forge.sla_violations_hourly;
        DROP VIEW IF EXISTS forge.anomalies_hourly;
        DROP VIEW IF EXISTS forge.behavior_changes_daily;
        DROP VIEW IF EXISTS forge.billing_events_daily;
        DROP VIEW IF EXISTS forge.error_rates_hourly;
        DROP VIEW IF EXISTS forge.enriched_events;
        DROP VIEW IF EXISTS forge.partition_status;
        "

        # 3. Ativar job de batch
        echo "3. Ativando job de batch..."
        airflow dags trigger forge-batch-transform
        sleep 60

        # 4. Validar que batch está processando
        echo "4. Validando que batch está processando..."
        airflow dags list | grep forge-batch-transform
        if [ $? -eq 0 ]; then
        echo "✅ Batch está processando"
        else
        echo "❌ Batch não está processando"
        exit 1
        fi

        # 5. Notificar consumidores
        echo "5. Notificando consumidores..."
        curl -X POST <slack-webhook> \
        -H "Content-Type: application/json" \
        -d '{"text": "✅ Rollback concluído. Forge voltou para batch."}'

        echo "=== Rollback concluído ==="
        ```

