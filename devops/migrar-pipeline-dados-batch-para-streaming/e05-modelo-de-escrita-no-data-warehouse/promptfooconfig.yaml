        ## W. Riscos e mitigação

        | Risco | Probabilidade | Impacto | Mitigação |
        |-------|---------------|--------|-----------|
        | Tamanho de estado em RocksDB excede limite (> 10 GB) | Média | Alto | Manter Etapas 7, 8, 12 em batch; monitorar tamanho de estado |
        | Latência de streaming excede SLO (> 120 s p95) | Média | Alto | Aumentar paralelismo; otimizar transformações; testar em staging |
        | Completude < 99.9% (eventos perdidos) | Baixa | Alto | Implementar deduplicação; validar com testes de equivalência |
        | Consumidores não conseguem lidar com modo `update` (atualização retroativa) | Média | Médio | Testar com Sentinel, Cerebro, Pepper; ajustar queries se necessário |
        | Broadcast de lookup é muito grande (> 100 MB) | Baixa | Médio | Particionar broadcast; usar state store em vez de broadcast |
        | Snapshot de lookup fica desatualizado (> 24h) | Baixa | Médio | Implementar recarregamento automático a cada 24h |
        | Etapas 7, 8, 12 em batch causam latência inaceitável | Baixa | Médio | Aumentar frequência de batch (1× por hora em vez de 1× por dia) |
        | Testes de equivalência falham (streaming ≠ batch) | Média | Alto | Investigar causa raiz; ajustar transformações; revalidar |
        | Código de streaming tem bugs (ex: off-by-one em agregação) | Média | Alto | Testes unitários rigorosos; validação com dados reais em staging |
        | Rollback é necessário (streaming não é viável) | Baixa | Alto | Procedimento de rollback documentado; dados de batch preservados |

