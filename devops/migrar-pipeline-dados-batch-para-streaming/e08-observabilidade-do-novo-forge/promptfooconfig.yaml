        ### 3.2 Implementação de validação

        **Ação:** Crie script de validação que compara batch vs streaming.

        **Onde:** Arquivo `forge/scripts/validate_equivalence.py` (novo) no repositório do Forge.

        **Comando/Configuração:**

        ```python
        #!/usr/bin/env python3
        """
        Script de validação de equivalência: Streaming ≡ Batch

        Compara resultados de Forge em streaming vs batch para as últimas 24 horas.
        Gera relatório com métricas de completude, corretude e schema.
        """

        import sys
        import json
        from datetime import datetime, timedelta
        from typing import Dict, List, Tuple
        import logging

        # [SUPOSIÇÃO] Usando Snowflake como DW; adaptar para BigQuery/Redshift conforme necessário
        import snowflake.connector

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        class EquivalenceValidator:
            def __init__(self, dw_connection_string: str):
                """Inicializa conexão com DW."""
                self.conn = snowflake.connector.connect(dw_connection_string)
                self.cursor = self.conn.cursor()
                self.report = {
                    "timestamp": datetime.utcnow().isoformat(),
                    "period": "last_24_hours",
                    "tables": {},
                    "overall_status": "PASS",
                    "errors": []
                }

            def validate_completeness(self, table_name: str, batch_suffix: "_batch", streaming_suffix: "_streaming") -> Dict:
                """Valida completude (row count) entre batch e streaming."""
                logger.info(f"Validando completude: {table_name}")
                
                batch_table = f"{table_name}{batch_suffix}"
                streaming_table = f"{table_name}{streaming_suffix}"
                
                try:
                    # Contar linhas no batch
                    self.cursor.execute(f"""
                        SELECT COUNT(*) AS row_count
                        FROM {batch_table}
                        WHERE hour >= CURRENT_TIMESTAMP() - INTERVAL '24 hours'
                    """)
                    batch_count = self.cursor.fetchone()[0]
                    
                    # Contar linhas no streaming
                    self.cursor.execute(f"""
                        SELECT COUNT(*) AS row_count
                        FROM {streaming_table}
                        WHERE hour >= CURRENT_TIMESTAMP() - INTERVAL '24 hours'
                    """)
                    streaming_count = self.cursor.fetchone()[0]
                    
                    # Calcular completude
                    if batch_count == 0:
                        completeness_pct = 100.0
                        diff = 0
                    else:
                        completeness_pct = (streaming_count / batch_count) * 100
                        diff = abs(batch_count - streaming_count)
                    
                    status = "PASS" if completeness_pct >= 99.9 else "FAIL"
                    
                    result = {
                        "metric": "completeness",
                        "batch_rows": batch_count,
                        "streaming_rows": streaming_count,
                        "completeness_pct": round(completeness_pct, 2),
                        "diff_rows": diff,
                        "diff_pct": round((diff / batch_count * 100) if batch_count > 0 else 0, 2),
                        "status": status
                    }
                    
                    logger.info(f"  Completude: {completeness_pct:.2f}% ({diff} linhas de diferença)")
                    return result
                    
                except Exception as e:
                    logger.error(f"  Erro ao validar completude: {e}")
                    self.report["errors"].append(f"{table_name}: {str(e)}")
                    return {"metric": "completeness", "status": "ERROR", "error": str(e)}

            def validate_correctness(self, table_name: str, batch_suffix: "_batch", streaming_suffix: "_streaming", 
                                    group_by_cols: List[str], agg_cols: Dict[str, str]) -> Dict:
                """Valida corretude (valores de agregações) entre batch e streaming."""
                logger.info(f"Validando corretude: {table_name}")
                
                batch_table = f"{table_name}{batch_suffix}"
                streaming_table = f"{table_name}{streaming_suffix}"
                
                try:
                    # Construir query de agregação
                    group_by_clause = ", ".join(group_by_cols)
                    agg_clause_batch = ", ".join([f"{agg_func} AS {col}_{agg_func}" for col, agg_func in agg_cols.items()])
                    agg_clause_streaming = ", ".join([f"{agg_func} AS {col}_{agg_func}" for col, agg_func in agg_cols.items()])
                    
                    # Query batch
                    batch_query = f"""
                        SELECT
                          {group_by_clause},
                          {agg_clause_batch}
                        FROM {batch_table}
                        WHERE hour >= CURRENT_TIMESTAMP() - INTERVAL '24 hours'
                        GROUP BY {group_by_clause}
                        ORDER BY {group_by_clause}
                    """
                    
                    # Query streaming
                    streaming_query = f"""
                        SELECT
                          {group_by_clause},
                          {agg_clause_streaming}
                        FROM {streaming_table}
                        WHERE hour >= CURRENT_TIMESTAMP() - INTERVAL '24 hours'
                        GROUP BY {group_by_clause}
                        ORDER BY {group_by_clause}
                    """
                    
                    self.cursor.execute(batch_query)
                    batch_rows = self.cursor.fetchall()
                    
                    self.cursor.execute(streaming_query)
                    streaming_rows = self.cursor.fetchall()
                    
                    # Comparar
                    mismatches = 0
                    for batch_row, streaming_row in zip(batch_rows, streaming_rows):
                        if batch_row != streaming_row:
                            mismatches += 1
                            logger.warning(f"  Mismatch: {batch_row} vs {streaming_row}")
                    
                    correctness_pct = ((len(batch_rows) - mismatches) / len(batch_rows) * 100) if batch_rows else 100.0
                    status = "PASS" if correctness_pct == 100.0 else "FAIL"
                    
                    result = {
                        "metric": "correctness",
                        "batch_rows": len(batch_rows),
                        "streaming_rows": len(streaming_rows),
                        "mismatches": mismatches,
                        "correctness_pct": round(correctness_pct, 2),
                        "status": status
                    }
                    
                    logger.info(f"  Corretude: {correctness_pct:.2f}% ({mismatches} mismatches)")
                    return result
                    
                except Exception as e:
                    logger.error(f"  Erro ao validar corretude: {e}")
                    self.report["errors"].append(f"{table_name}: {str(e)}")
                    return {"metric": "correctness", "status": "ERROR", "error": str(e)}

            def validate_schema(self, table_name: str, batch_suffix: "_batch", streaming_suffix: "_streaming") -> Dict:
                """Valida schema (colunas e tipos) entre batch e streaming."""
                logger.info(f"Validando schema: {table_name}")
                
                batch_table = f"{table_name}{batch_suffix}"
                streaming_table = f"{table_name}{streaming_suffix}"
                
                try:
                    # Obter schema batch
                    self.cursor.execute(f"""
                        SELECT column_name, data_type
                        FROM information_schema.columns
                        WHERE table_name = '{batch_table}'
                        ORDER BY ordinal_position
                    """)
                    batch_schema = {row[0]: row[1] for row in self.cursor.fetchall()}
                    
                    # Obter schema streaming
                    self.cursor.execute(f"""
                        SELECT column_name, data_type
                        FROM information_schema.columns
                        WHERE table_name = '{streaming_table}'
                        ORDER BY ordinal_position
                    """)
                    streaming_schema = {row[0]: row[1] for row in self.cursor.fetchall()}
                    
                    # Comparar
                    mismatches = []
                    for col, type_batch in batch_schema.items():
                        type_streaming = streaming_schema.get(col)
                        if type_streaming != type_batch:
                            mismatches.append(f"{col}: {type_batch} vs {type_streaming}")
                    
                    for col in streaming_schema:
                        if col not in batch_schema:
                            mismatches.append(f"{col}: missing in batch")
                    
                    status = "PASS" if not mismatches else "FAIL"
                    
                    result = {
                        "metric": "schema",
                        "batch_columns": len(batch_schema),
                        "streaming_columns": len(streaming_schema),
                        "mismatches": mismatches,
                        "status": status
                    }
                    
                    logger.info(f"  Schema: {status} ({len(mismatches)} mismatches)")
                    return result
                    
                except Exception as e:
                    logger.error(f"  Erro ao validar schema: {e}")
                    self.report["errors"].append(f"{table_name}: {str(e)}")
                    return {"metric": "schema", "status": "ERROR", "error": str(e)}

            def run_validation(self) -> Dict:
                """Executa validação completa."""
                logger.info("Iniciando validação de equivalência...")
                
                # Tabelas a validar
                tables_config = {
                    "forge_events_aggregated": {
                        "group_by": ["hour", "tenant_id"],
                        "agg": {"request_count": "SUM", "error_count": "SUM"}
                    },
                    "forge_events_by_service": {
                        "group_by": ["hour", "tenant_id", "service_id"],
                        "agg": {"error_count": "SUM", "request_count": "SUM"}
                    },
                    "forge_sla_violations": {
                        "group_by": ["hour", "tenant_id", "service_id"],
                        "agg": {"sla_breached": "SUM"}
                    }
                }
                
                for table_name, config in tables_config.items():
                    logger.info(f"\nValidando tabela: {table_name}")
                    
                    table_report = {}
                    
                    # Completude
                    completeness = self.validate_completeness(table_name, "_batch", "_streaming")
                    table_report["completeness"] = completeness
                    
                    # Corretude
                    correctness = self.validate_correctness(
                        table_name, "_batch", "_streaming",
                        config["group_by"], config["agg"]
                    )
                    table_report["correctness"] = correctness
                    
                    # Schema
                    schema = self.validate_schema(table_name, "_batch", "_streaming")
                    table_report["schema"] = schema
                    
                    # Status da tabela
                    table_status = "PASS" if all(
                        v.get("status") == "PASS" for v in table_report.values()
                    ) else "FAIL"
                    table_report["status"] = table_status
                    
                    self.report["tables"][table_name] = table_report
                    
                    if table_status == "FAIL":
                        self.report["overall_status"] = "FAIL"
                
                logger.info("\nValidação concluída.")
                return self.report

            def save_report(self, output_file: str):
                """Salva relatório em arquivo JSON."""
                with open(output_file, "w") as f:
                    json.dump(self.report, f, indent=2)
                logger.info(f"Relatório salvo em: {output_file}")

            def print_summary(self):
                """Imprime resumo do relatório."""
                print("\n" + "="*80)
                print("RELATÓRIO DE EQUIVALÊNCIA: STREAMING ≡ BATCH")
                print("="*80)
                print(f"Timestamp: {self.report['timestamp']}")
                print(f"Período: {self.report['period']}")
                print(f"Status geral: {self.report['overall_status']}")
                print()
                
                for table_name, table_report in self.report["tables"].items():
                    print(f"Tabela: {table_name}")
                    print(f"  Status: {table_report['status']}")
                    print(f"  Completude: {table_report['completeness']['completeness_pct']}% "
                          f"({table_report['completeness']['diff_rows']} linhas de diferença)")
                    print(f"  Corretude: {table_report['correctness']['correctness_pct']}% "
                          f"({table_report['correctness']['mismatches']} mismatches)")
                    print(f"  Schema: {table_report['schema']['status']} "
                          f"({len(table_report['schema']['mismatches'])} mismatches)")
                    print()
                
                if self.report["errors"]:
                    print("Erros:")
                    for error in self.report["errors"]:
                        print(f"  - {error}")
                
                print("="*80)

        if __name__ == "__main__":
            # [SUPOSIÇÃO] Conexão com DW via variável de ambiente
            dw_conn_string = os.getenv("DW_CONNECTION_STRING")
            if not dw_conn_string:
                print("Erro: DW_CONNECTION_STRING não definida")
                sys.exit(1)
            
            validator = EquivalenceValidator(dw_conn_string)
            report = validator.run_validation()
            
            # Salvar relatório
            output_file = f"equivalence_report_{datetime.utcnow().strftime('%Y%m%d_%H%M%S')}.json"
            validator.save_report(output_file)
            
            # Imprimir resumo
            validator.print_summary()
            
            # Retornar código de saída
            sys.exit(0 if report["overall_status"] == "PASS" else 1)
        ```

        **Verificação:** Script criado e testável; gera relatório JSON com métricas de equivalência.

