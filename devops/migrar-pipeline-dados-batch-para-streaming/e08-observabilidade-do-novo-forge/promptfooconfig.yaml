        ## 3. Implemente deduplicação e idempotência de escrita

        **Ação:** Crie código para garantir que reprocessamento não cria duplicatas.

        **Onde:** Arquivo `forge/jobs/write_deduplication.py` (novo) no repositório do Forge.

        **Procedimento:**

        ```python
        #!/usr/bin/env python3
        """
        Deduplicação e Idempotência de Escrita
        Garante que reprocessamento não cria duplicatas.
        """
        from pyspark.sql import SparkSession
        from pyspark.sql.functions import (
            col, row_number, max as spark_max, min as spark_min
        )
        from pyspark.sql.window import Window
        import logging

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        class WriteDeduplication:
            """Estratégias de deduplicação para diferentes tipos de tabelas"""
            
            def __init__(self, spark):
                self.spark = spark
                self.logger = logger
            
            # ========== Deduplicação por Chave Natural ==========
            def deduplicate_by_key(self, df, key_cols, order_by_col=None):
                """
                Deduplicar por chave natural, mantendo última linha.
                
                Args:
                    df: DataFrame
                    key_cols: Lista de colunas que formam chave natural
                    order_by_col: Coluna para ordenar (ex: timestamp). Se None, usa dropDuplicates.
                
                Returns:
                    DataFrame deduplicated
                """
                self.logger.info(f"Deduplicando por chave: {key_cols}")
                
                if order_by_col is None:
                    # Usar dropDuplicates (mais rápido, mas não garante qual linha é mantida)
                    return df.dropDuplicates(key_cols)
                
                # Usar row_number para manter última linha
                window_spec = Window.partitionBy(*key_cols).orderBy(col(order_by_col).desc())
                df_with_rn = df.withColumn("rn", row_number().over(window_spec))
                df_deduplicated = df_with_rn.filter(col("rn") == 1).drop("rn")
                
                self.logger.info(f"Deduplicação concluída: {df_deduplicated.count()} linhas")
                return df_deduplicated
            
            # ========== Deduplicação para Agregações (by_service, aggregated, etc) ==========
            def deduplicate_aggregation(self, df, key_cols=None):
                """
                Deduplicar agregações por chave natural.
                Mantém última linha (com maior timestamp).
                
                Args:
                    df: DataFrame com agregações
                    key_cols: Colunas de chave natural (ex: ["window_start", "window_end", "tenant_id"])
                
                Returns:
                    DataFrame deduplicated
                """
                if key_cols is None:
                    # Inferir chave natural
                    key_cols = [c for c in df.columns if c.startswith("window") or c in ["tenant_id", "service_id", "version"]]
                
                self.logger.info(f"Deduplicando agregação por chave: {key_cols}")
                
                # Manter última linha por chave (maior window_end)
                window_spec = Window.partitionBy(*key_cols).orderBy(col("window_end").desc())
                df_with_rn = df.withColumn("rn", row_number().over(window_spec))
                df_deduplicated = df_with_rn.filter(col("rn") == 1).drop("rn")
                
                self.logger.info(f"Deduplicação concluída: {df_deduplicated.count()} linhas")
                return df_deduplicated
            
            # ========== Deduplicação para Billing ==========
            def deduplicate_billing(self, df):
                """
                Deduplicar billing por (day, tenant_id).
                Mantém última linha (com maior unique_event_count).
                
                Args:
                    df: DataFrame com agregações de billing
                
                Returns:
                    DataFrame deduplicated
                """
                self.logger.info("Deduplicando billing por (day, tenant_id)")
                
                key_cols = ["day_start", "tenant_id"]
                window_spec = Window.partitionBy(*key_cols).orderBy(col("unique_event_count").desc())
                df_with_rn = df.withColumn("rn", row_number().over(window_spec))
                df_deduplicated = df_with_rn.filter(col("rn") == 1).drop("rn")
                
                self.logger.info(f"Deduplicação concluída: {df_deduplicated.count()} linhas")
                return df_deduplicated
            
            # ========== Deduplicação para Anomalias/SLA/Comportamento ==========
            def deduplicate_detection(self, df, id_col):
                """
                Deduplicar detecções (anomalias, SLA violations, behavior changes) por ID.
                
                Args:
                    df: DataFrame com detecções
                    id_col: Coluna de ID único (ex: "anomaly_id", "violation_id", "change_id")
                
                Returns:
                    DataFrame deduplicated
                """
                self.logger.info(f"Deduplicando detecções por {id_col}")
                
                df_deduplicated = df.dropDuplicates([id_col])
                
                self.logger.info(f"Deduplicação concluída: {df_deduplicated.count()} linhas")
                return df_deduplicated
            
            # ========== Deduplicação para Eventos (Cerebro) ==========
            def deduplicate_events(self, df):
                """
                Deduplicar eventos por event_id.
                
                Args:
                    df: DataFrame com eventos
                
                Returns:
                    DataFrame deduplicated
                """
                self.logger.info("Deduplicando eventos por event_id")
                
                df_deduplicated = df.dropDuplicates(["event_id"])
                
                self.logger.info(f"Deduplicação concluída: {df_deduplicated.count()} linhas")
                return df_deduplicated
            
            # ========== Validação de Idempotência ==========
            def validate_idempotency(self, df1, df2, key_cols):
                """
                Validar que dois DataFrames são idênticos (idempotência).
                
                Args:
                    df1: Primeiro DataFrame
                    df2: Segundo DataFrame
                    key_cols: Colunas de chave natural
                
                Returns:
                    True se idênticos, False caso contrário
                """
                self.logger.info(f"Validando idempotência por chave: {key_cols}")
                
                # Comparar contagem
                count1 = df1.count()
                count2 = df2.count()
                if count1 != count2:
                    self.logger.error(f"Contagem diferente: {count1} vs {count2}")
                    return False
                
                # Comparar dados
                diff = df1.exceptAll(df2).count()
                if diff > 0:
                    self.logger.error(f"Dados diferentes: {diff} linhas")
                    return False
                
                self.logger.info("✅ Idempotência validada")
                return True
            
            # ========== Teste de Reprocessamento ==========
            def test_reprocessing(self, df_original, dedup_func):
                """
                Teste: Processar dados 2× e validar que resultado é idêntico.
                
                Args:
                    df_original: DataFrame original
                    dedup_func: Função de deduplicação
                
                Returns:
                    True se teste passou, False caso contrário
                """
                self.logger.info("Testando reprocessamento (2× execução)")
                
                # Executar 1×
                df_result_1 = dedup_func(df_original)
                
                # Duplicar dados (simular reprocessamento)
                df_duplicated = df_original.union(df_original)
                
                # Executar 2×
                df_result_2 = dedup_func(df_duplicated)
                
                # Validar
                if df_result_1.count() != df_result_2.count():
                    self.logger.error(f"Contagem diferente: {df_result_1.count()} vs {df_result_2.count()}")
                    return False
                
                self.logger.info("✅ Teste de reprocessamento passou")
                return True

        def create_spark_session():
            """Cria sessão Spark"""
            return SparkSession.builder \
                .appName("forge-write-deduplication") \
                .getOrCreate()

        def main():
            """Função principal"""
            spark = create_spark_session()
            dedup = WriteDeduplication(spark)
            
            # Exemplo: Deduplicar agregações
            df_aggregated = spark.read.parquet("/data/forge/aggregated")
            df_deduplicated = dedup.deduplicate_aggregation(df_aggregated)
            
            # Validar idempotência
            df_aggregated_2 = spark.read.parquet("/data/forge/aggregated")
            df_deduplicated_2 = dedup.deduplicate_aggregation(df_aggregated_2)
            
            dedup.validate_idempotency(df_deduplicated, df_deduplicated_2, ["window_start", "window_end", "tenant_id"])
            
            # Teste de reprocessamento
            dedup.test_reprocessing(df_aggregated, lambda df: dedup.deduplicate_aggregation(df))

        if __name__ == "__main__":
            main()
        ```

        **Verificação:**

        ```bash
        # Testar deduplicação
        spark-submit \
        --master local[4] \
        forge/jobs/write_deduplication.py
        # Esperado: deduplicação funciona, idempotência validada
        ```

