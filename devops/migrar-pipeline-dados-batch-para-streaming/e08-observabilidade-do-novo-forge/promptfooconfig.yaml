        ## 8. Crie job de compactação agendado

        **Ação:** Implemente job de compactação para executar 1× por dia.

        **Onde:** Arquivo `forge/jobs/daily_compaction.py` (novo) no repositório do Forge.

        **Procedimento:**

        ```python
        #!/usr/bin/env python3
        """
        Job de Compactação Diária
        Compacta partições antigas para reduzir número de arquivos.
        Executar 1× por dia em 02:00 UTC.
        """
        from pyspark.sql import SparkSession
        import logging
        from datetime import datetime, timedelta
        import os

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        class DailyCompaction:
            """Compactação diária de partições"""
            
            def __init__(self, spark):
                self.spark = spark
                self.logger = logger
            
            def compact_partition(self, table_name, hour_str):
                """
                Compactar uma partição por hora.
                
                Args:
                    table_name: Nome da tabela
                    hour_str: String de hora (ex: "2024-01-15-10")
                """
                try:
                    self.logger.info(f"Compactando {table_name}/{hour_str}")
                    
                    # Ler partição
                    path = f"/data/forge/{table_name}/hour={hour_str}"
                    df = self.spark.read.parquet(path)
                    
                    # Reescrever com 1 arquivo
                    df.coalesce(1).write.mode("overwrite") \
                        .parquet(path)
                    
                    self.logger.info(f"✅ {table_name}/{hour_str} compactado")
                    return True
                except Exception as e:
                    self.logger.error(f"❌ {table_name}/{hour_str} falhou: {e}")
                    return False
            
            def compact_day(self, table_name, day_str):
                """
                Compactar todas as partições de um dia.
                
                Args:
                    table_name: Nome da tabela
                    day_str: String de dia (ex: "2024-01-15")
                """
                self.logger.info(f"Compactando {table_name} para {day_str}")
                
                success_count = 0
                for hour in range(24):
                    hour_str = f"{day_str}-{hour:02d}"
                    if self.compact_partition(table_name, hour_str):
                        success_count += 1
                
                self.logger.info(f"{table_name}: {success_count}/24 partições compactadas")
                return success_count
            
            def compact_all_tables(self, days_back=7):
                """
                Compactar todas as tabelas para os últimos N dias.
                
                Args:
                    days_back: Número de dias para compactar (padrão: 7)
                """
                self.logger.info(f"Compactando todas as tabelas (últimos {days_back} dias)")
                
                tables = ["aggregated", "by_service", "by_version", "percentiles"]
                
                for day_offset in range(1, days_back + 1):
                    day = (datetime.utcnow() - timedelta(days=day_offset)).strftime("%Y-%m-%d")
                    
                    for table in tables:
                        self.compact_day(table, day)
                
                # Compactar billing (1 arquivo por dia)
                self.logger.info("Compactando billing_events")
                for day_offset in range(1, days_back + 1):
                    day = (datetime.utcnow() - timedelta(days=day_offset)).strftime("%Y-%m-%d")
                    try:
                        path = f"/data/forge/billing_events/day={day}"
                        df = self.spark.read.parquet(path)
                        df.coalesce(1).write.mode("overwrite").parquet(path)
                        self.logger.info(f"✅ billing_events/{day} compactado")
                    except Exception as e:
                        self.logger.error(f"❌ billing_events/{day} falhou: {e}")
            
            def monitor_file_sizes(self, table_name):
                """
                Monitorar tamanho de arquivos.
                
                Args:
                    table_name: Nome da tabela
                """
                self.logger.info(f"Monitorando tamanho de arquivos em {table_name}")
                
                path = f"/data/forge/{table_name}"
                
                # Contar arquivos
                files = []
                for root, dirs, filenames in os.walk(path):
                    for filename in filenames:
                        if filename.endswith(".parquet"):
                            filepath = os.path.join(root, filename)
                            try:
                                size = os.path.getsize(filepath)
                                files.append((filepath, size))
                            except:
                                pass
                
                if not files:
                    self.logger.warning(f"Nenhum arquivo encontrado em {table_name}")
                    return
                
                # Estatísticas
                total_size = sum(size for _, size in files)
                avg_size = total_size / len(files)
                min_size = min(size for _, size in files)
                max_size = max(size for _, size in files)
                
                self.logger.info(f"Tabela: {table_name}")
                self.logger.info(f"  Arquivos: {len(files)}")
                self.logger.info(f"  Tamanho total: {total_size / 1e9:.2f} GB")
                self.logger.info(f"  Tamanho médio: {avg_size / 1e6:.2f} MB")
                self.logger.info(f"  Tamanho mín: {min_size / 1e6:.2f} MB")
                self.logger.info(f"  Tamanho máx: {max_size / 1e6:.2f} MB")
                
                # Alertar se muitos arquivos pequenos
                small_files = [f for _, s in files if s < 10e6]  # < 10 MB
                if len(small_files) > 100:
                    self.logger.warning(f"⚠️  {len(small_files)} arquivos pequenos (< 10 MB)")

        def create_spark_session():
            """Cria sessão Spark"""
            return SparkSession.builder \
                .appName("forge-daily-compaction") \
                .getOrCreate()

        def main():
            """Função principal"""
            spark = create_spark_session()
            compactor = DailyCompaction(spark)
            
            # Compactar últimos 7 dias
            compactor.compact_all_tables(days_back=7)
            
            # Monitorar tamanho de arquivos
            for table in ["aggregated", "by_service", "by_version", "percentiles", "billing_events"]:
                compactor.monitor_file_sizes(table)
            
            logger.info("Compactação concluída")

        if __name__ == "__main__":
            main()
        ```

