        # Etapa 4 de 10: Redesenho das 14 Transformações — Procedimento Técnico

        **Depende de:** Etapas 2 e 3.

        ---

        ## 0. Pré-requisitos

        - [ ] Acesso de leitura ao código-fonte do Forge batch (`forge/jobs/batch_transform.py` ou equivalente)
        - [ ] Documentação das 14 etapas de transformação Spark (nomes, lógica, dependências)
        - [ ] Acesso ao repositório de configuração do Forge (`forge/config/`)
        - [ ] Resultado da Etapa 2 disponível: SLOs (latência p95 = 120 s, completude ≥ 99.9%), semântica ALO, critérios de equivalência
        - [ ] Resultado da Etapa 3 disponível: contrato de consumo do Relay (tópico, partições, paralelismo, watermark)
        - [ ] Acesso ao DW para inspecionar schema das tabelas de saída (14 tabelas ou agregações)
        - [ ] Acesso a logs de execução do batch (últimos 30 dias) para validar padrões de transformação
        - [ ] Ferramentas: editor de código, SQL client, `spark-submit`, `git`, planilha colaborativa
        - [ ] Permissão para criar branches de desenvolvimento e PRs no repositório
        - [ ] Acesso a cluster Spark em staging para testes de transformação
        - [ ] Acesso a dados históricos do Relay (últimos 7 dias) para teste com dados reais
        - [ ] Contato técnico confirmado em Sentinel, Cerebro, Pepper para validar saída de transformações

        ---

        ## 1. Mapeie e classifique as 14 etapas de transformação

        **Ação:** Extraia código do batch, documente cada etapa e classifique por tipo.

        **Onde:** Arquivo `forge/docs/transformation-stages.md` (novo) no repositório do Forge.

        **Procedimento:**

        ### 1.1 Extrair código do batch

        ```bash
        # Localizar arquivo de transformação batch
        find forge -name "*batch*transform*" -o -name "*ingest*" | grep -E "\.(py|scala|sql)$"
        # Exemplo de saída esperada:
        # forge/jobs/batch_transform.py
        # forge/jobs/batch_ingest.py

        # Inspecionar arquivo
        cat forge/jobs/batch_transform.py | head -200
        # Esperado: código Spark com 14 etapas encadeadas
        ```

        **Documentação:**

        Crie arquivo `forge/docs/transformation-stages.md`:

        ```markdown
        # Mapeamento das 14 Etapas de Transformação — Forge Batch → Streaming

        ## Resumo
        O Forge batch executa 14 etapas de transformação em sequência, totalizando ~40 min.
        Cada etapa é um job Spark que lê de uma tabela, transforma e escreve em outra.

        ## Etapas Mapeadas

        ### Etapa 1: Ingestão e Parsing
        **Tipo:** Sem estado (stateless)
        **Entrada:** Tópico Relay `forge-events-raw`
        **Saída:** Tabela `forge_events_parsed`
        **Lógica:**
        - Desserializar JSON/Avro
        - Validar schema
        - Adicionar timestamp de ingestão
        - Filtrar eventos inválidos

        **Código (batch):**
        \`\`\`python
        df_raw = spark.read.parquet("/data/relay/events")
        df_parsed = df_raw.select(
            col("event_id"),
            col("tenant_id"),
            col("timestamp"),
            col("service_id"),
            col("metric_name"),
            col("metric_value"),
            col("tags"),
            current_timestamp().alias("ingestion_time")
        ).filter(col("event_id").isNotNull())
        df_parsed.write.mode("overwrite").parquet("/data/forge/parsed")
        \`\`\`

        **Classificação:** ✅ Sem estado → Adequado para streaming

        ---

        ### Etapa 2: Enriquecimento com Metadados de Tenant
        **Tipo:** Enriquecimento por lookup (stateful)
        **Entrada:** Tabela `forge_events_parsed`
        **Saída:** Tabela `forge_events_enriched`
        **Lógica:**
        - Fazer join com tabela de metadados de tenant (ex: `tenant_metadata`)
        - Adicionar campos: `tenant_name`, `tenant_tier`, `region`
        - Filtrar tenants inativos

        **Código (batch):**
        \`\`\`python
        df_parsed = spark.read.parquet("/data/forge/parsed")
        df_tenant_meta = spark.read.parquet("/data/tenant_metadata")  # Snapshot diário
        df_enriched = df_parsed.join(
            df_tenant_meta,
            on="tenant_id",
            how="left"
        ).select(
            col("event_id"),
            col("tenant_id"),
            col("tenant_name"),
            col("tenant_tier"),
            col("region"),
            col("timestamp"),
            col("service_id"),
            col("metric_name"),
            col("metric_value"),
            col("tags")
        ).filter(col("tenant_name").isNotNull())
        df_enriched.write.mode("overwrite").parquet("/data/forge/enriched")
        \`\`\`

        **Classificação:** ⚠️ Enriquecimento por lookup → Requer estado (cache de metadados)

        ---

        ### Etapa 3: Normalização de Métrica
        **Tipo:** Sem estado (stateless)
        **Entrada:** Tabela `forge_events_enriched`
        **Saída:** Tabela `forge_events_normalized`
        **Lógica:**
        - Normalizar nome de métrica (ex: `http.requests` → `http_requests`)
        - Converter unidades (ex: ms → s)
        - Aplicar regras de transformação por tenant

        **Código (batch):**
        \`\`\`python
        df_enriched = spark.read.parquet("/data/forge/enriched")
        df_normalized = df_enriched.withColumn(
            "metric_name_normalized",
            regexp_replace(col("metric_name"), r"[.-]", "_")
        ).withColumn(
            "metric_value_normalized",
            when(col("metric_name").contains("latency"), col("metric_value") / 1000)
            .otherwise(col("metric_value"))
        )
        df_normalized.write.mode("overwrite").parquet("/data/forge/normalized")
        \`\`\`

        **Classificação:** ✅ Sem estado → Adequado para streaming

        ---

        ### Etapa 4: Agregação por Serviço (Janela de 1 Hora)
        **Tipo:** Agregação por janela (stateful)
        **Entrada:** Tabela `forge_events_normalized`
        **Saída:** Tabela `forge_events_by_service`
        **Lógica:**
        - Agrupar por `tenant_id`, `service_id`, `hour`
        - Calcular: `SUM(metric_value)`, `COUNT(*)`, `AVG(metric_value)`, `STDDEV(metric_value)`
        - Particionar por hora

        **Código (batch):**
        \`\`\`python
        df_normalized = spark.read.parquet("/data/forge/normalized")
        df_by_service = df_normalized.groupBy(
            date_trunc("hour", col("timestamp")).alias("hour"),
            col("tenant_id"),
            col("service_id")
        ).agg(
            sum("metric_value").alias("total_value"),
            count("*").alias("event_count"),
            avg("metric_value").alias("avg_value"),
            stddev("metric_value").alias("stddev_value")
        )
        df_by_service.write.mode("overwrite").partitionBy("hour").parquet("/data/forge/by_service")
        \`\`\`

        **Classificação:** ✅ Agregação por janela → Adequado para streaming (com watermark)

        ---

        ### Etapa 5: Agregação Global (Janela de 1 Hora)
        **Tipo:** Agregação por janela (stateful)
        **Entrada:** Tabela `forge_events_normalized`
        **Saída:** Tabela `forge_events_aggregated`
        **Lógica:**
        - Agrupar por `tenant_id`, `hour`
        - Calcular: `SUM(metric_value)`, `COUNT(*)`, `AVG(metric_value)`
        - Particionar por hora

        **Código (batch):**
        \`\`\`python
        df_normalized = spark.read.parquet("/data/forge/normalized")
        df_aggregated = df_normalized.groupBy(
            date_trunc("hour", col("timestamp")).alias("hour"),
            col("tenant_id")
        ).agg(
            sum("metric_value").alias("total_value"),
            count("*").alias("event_count"),
            avg("metric_value").alias("avg_value")
        )
        df_aggregated.write.mode("overwrite").partitionBy("hour").parquet("/data/forge/aggregated")
        \`\`\`

        **Classificação:** ✅ Agregação por janela → Adequado para streaming (com watermark)

        ---

        ### Etapa 6: Cálculo de Taxa de Erro
        **Tipo:** Sem estado (stateless) + Enriquecimento por lookup
        **Entrada:** Tabela `forge_events_by_service`
        **Saída:** Tabela `forge_error_rates`
        **Lógica:**
        - Filtrar eventos com `metric_name` = "error"
        - Calcular taxa de erro: `error_count / total_count`
        - Fazer join com SLA de tenant para comparar

        **Código (batch):**
        \`\`\`python
        df_by_service = spark.read.parquet("/data/forge/by_service")
        df_sla = spark.read.parquet("/data/sla_config")  # Snapshot diário
        df_error_rates = df_by_service.filter(
            col("metric_name") == "error"
        ).join(
            df_sla,
            on=["tenant_id", "service_id"],
            how="left"
        ).withColumn(
            "error_rate",
            col("total_value") / col("event_count")
        ).withColumn(
            "sla_breached",
            col("error_rate") > col("sla_threshold")
        )
        df_error_rates.write.mode("overwrite").parquet("/data/forge/error_rates")
        \`\`\`

        **Classificação:** ⚠️ Enriquecimento por lookup → Requer estado (cache de SLA)

        ---

        ### Etapa 7: Detecção de Anomalia
        **Tipo:** Agregação por janela + Enriquecimento por lookup (stateful)
        **Entrada:** Tabela `forge_events_aggregated`
        **Saída:** Tabela `forge_anomalies`
        **Lógica:**
        - Calcular média e desvio padrão de `metric_value` para cada tenant (últimas 24h)
        - Detectar valores > 3σ como anomalia
        - Fazer join com histórico de anomalias para evitar duplicatas

        **Código (batch):**
        \`\`\`python
        df_aggregated = spark.read.parquet("/data/forge/aggregated")
        df_history = spark.read.parquet("/data/forge/anomalies")  # Últimas 24h
        df_stats = df_aggregated.groupBy("tenant_id").agg(
            avg("total_value").alias("mean_value"),
            stddev("total_value").alias("stddev_value")
        )
        df_anomalies = df_aggregated.join(
            df_stats,
            on="tenant_id"
        ).withColumn(
            "z_score",
            (col("total_value") - col("mean_value")) / col("stddev_value")
        ).filter(
            abs(col("z_score")) > 3
        ).join(
            df_history,
            on=["tenant_id", "hour"],
            how="left_anti"  # Evitar duplicatas
        )
        df_anomalies.write.mode("overwrite").parquet("/data/forge/anomalies")
        \`\`\`

        **Classificação:** ⚠️ Agregação + Lookup → Requer estado (histórico de anomalias)

        ---

        ### Etapa 8: Cálculo de SLA Violations
        **Tipo:** Agregação por janela + Enriquecimento por lookup (stateful)
        **Entrada:** Tabela `forge_error_rates`
        **Saída:** Tabela `forge_sla_violations`
        **Lógica:**
        - Comparar `error_rate` com `sla_threshold` (de Etapa 6)
        - Registrar violações de SLA
        - Fazer join com histórico para evitar duplicatas

        **Código (batch):**
        \`\`\`python
        df_error_rates = spark.read.parquet("/data/forge/error_rates")
        df_violations_history = spark.read.parquet("/data/forge/sla_violations")  # Últimas 24h
        df_violations = df_error_rates.filter(
            col("sla_breached") == True
        ).join(
            df_violations_history,
            on=["tenant_id", "service_id", "hour"],
            how="left_anti"  # Evitar duplicatas
        ).select(
            col("hour"),
            col("tenant_id"),
            col("service_id"),
            col("error_rate"),
            col("sla_threshold"),
            lit(True).alias("sla_breached")
        )
        df_violations.write.mode("overwrite").parquet("/data/forge/sla_violations")
        \`\`\`

        **Classificação:** ⚠️ Agregação + Lookup → Requer estado (histórico de violações)

        ---

        ### Etapa 9: Enriquecimento com Contexto de Deployment
        **Tipo:** Enriquecimento por lookup (stateful)
        **Entrada:** Tabela `forge_events_enriched`
        **Saída:** Tabela `forge_events_with_deployment`
        **Lógica:**
        - Fazer join com tabela de deployment (ex: `deployment_info`)
        - Adicionar campos: `version`, `region`, `environment`
        - Filtrar eventos de deployments inativos

        **Código (batch):**
        \`\`\`python
        df_enriched = spark.read.parquet("/data/forge/enriched")
        df_deployment = spark.read.parquet("/data/deployment_info")  # Snapshot diário
        df_with_deployment = df_enriched.join(
            df_deployment,
            on=["tenant_id", "service_id"],
            how="left"
        ).select(
            col("event_id"),
            col("tenant_id"),
            col("service_id"),
            col("version"),
            col("region"),
            col("environment"),
            col("timestamp"),
            col("metric_name"),
            col("metric_value")
        )
        df_with_deployment.write.mode("overwrite").parquet("/data/forge/with_deployment")
        \`\`\`

        **Classificação:** ⚠️ Enriquecimento por lookup → Requer estado (cache de deployment)

        ---

        ### Etapa 10: Agregação por Versão
        **Tipo:** Agregação por janela (stateful)
        **Entrada:** Tabela `forge_events_with_deployment`
        **Saída:** Tabela `forge_events_by_version`
        **Lógica:**
        - Agrupar por `tenant_id`, `service_id`, `version`, `hour`
        - Calcular: `SUM(metric_value)`, `COUNT(*)`, `AVG(metric_value)`
        - Particionar por hora

        **Código (batch):**
        \`\`\`python
        df_with_deployment = spark.read.parquet("/data/forge/with_deployment")
        df_by_version = df_with_deployment.groupBy(
            date_trunc("hour", col("timestamp")).alias("hour"),
            col("tenant_id"),
            col("service_id"),
            col("version")
        ).agg(
            sum("metric_value").alias("total_value"),
            count("*").alias("event_count"),
            avg("metric_value").alias("avg_value")
        )
        df_by_version.write.mode("overwrite").partitionBy("hour").parquet("/data/forge/by_version")
        \`\`\`

        **Classificação:** ✅ Agregação por janela → Adequado para streaming (com watermark)

        ---

        ### Etapa 11: Cálculo de Percentis
        **Tipo:** Agregação por janela (stateful)
        **Entrada:** Tabela `forge_events_aggregated`
        **Saída:** Tabela `forge_percentiles`
        **Lógica:**
        - Calcular percentis (p50, p95, p99) de `metric_value` por tenant/hora
        - Usar aproximação (ex: `percentile_approx`)

        **Código (batch):**
        \`\`\`python
        df_aggregated = spark.read.parquet("/data/forge/aggregated")
        df_percentiles = df_aggregated.groupBy(
            date_trunc("hour", col("timestamp")).alias("hour"),
            col("tenant_id")
        ).agg(
            percentile_approx("metric_value", 0.5).alias("p50"),
            percentile_approx("metric_value", 0.95).alias("p95"),
            percentile_approx("metric_value", 0.99).alias("p99")
        )
        df_percentiles.write.mode("overwrite").partitionBy("hour").parquet("/data/forge/percentiles")
        \`\`\`

        **Classificação:** ✅ Agregação por janela → Adequado para streaming (com watermark)

        ---

        ### Etapa 12: Detecção de Mudança de Comportamento
        **Tipo:** Agregação por janela + Enriquecimento por lookup (stateful)
        **Entrada:** Tabela `forge_events_aggregated`
        **Saída:** Tabela `forge_behavior_changes`
        **Lógica:**
        - Comparar `metric_value` atual com média histórica (últimas 7 dias)
        - Detectar mudanças > 50% como "behavior change"
        - Fazer join com histórico para evitar duplicatas

        **Código (batch):**
        \`\`\`python
        df_aggregated = spark.read.parquet("/data/forge/aggregated")
        df_history_7d = spark.read.parquet("/data/forge/aggregated_history_7d")  # Últimas 7 dias
        df_baseline = df_history_7d.groupBy("tenant_id").agg(
            avg("total_value").alias("baseline_value")
        )
        df_changes = df_aggregated.join(
            df_baseline,
            on="tenant_id"
        ).withColumn(
            "change_pct",
            abs(col("total_value") - col("baseline_value")) / col("baseline_value") * 100
        ).filter(
            col("change_pct") > 50
        )
        df_changes.write.mode("overwrite").parquet("/data/forge/behavior_changes")
        \`\`\`

        **Classificação:** ⚠️ Agregação + Lookup → Requer estado (histórico de 7 dias)

        ---

        ### Etapa 13: Agregação para Billing
        **Tipo:** Agregação por janela (stateful)
        **Entrada:** Tabela `forge_events_normalized`
        **Saída:** Tabela `forge_billing_events`
        **Lógica:**
        - Agrupar por `tenant_id`, `day`
        - Calcular: `SUM(event_count)` (para billing por evento)
        - Particionar por dia
        - Deduplicar por `event_id` (para evitar overcharging)

        **Código (batch):**
        \`\`\`python
        df_normalized = spark.read.parquet("/data/forge/normalized")
        df_billing = df_normalized.groupBy(
            date_trunc("day", col("timestamp")).alias("day"),
            col("tenant_id")
        ).agg(
            count(distinct("event_id")).alias("unique_event_count"),
            count("*").alias("total_event_count")
        )
        df_billing.write.mode("overwrite").partitionBy("day").parquet("/data/forge/billing_events")
        \`\`\`

        **Classificação:** ✅ Agregação por janela → Adequado para streaming (com watermark)

        ---

        ### Etapa 14: Exportação para Cerebro (Índice de Logs)
        **Tipo:** Sem estado (stateless)
        **Entrada:** Tabela `forge_events_enriched`
        **Saída:** Tópico Kafka `forge-events-indexed` (ou índice Elasticsearch)
        **Lógica:**
        - Selecionar campos relevantes para busca
        - Serializar para JSON
        - Enviar para Cerebro (Kafka ou Elasticsearch)

        **Código (batch):**
        \`\`\`python
        df_enriched = spark.read.parquet("/data/forge/enriched")
        df_for_cerebro = df_enriched.select(
            col("event_id"),
            col("tenant_id"),
            col("service_id"),
            col("timestamp"),
            col("metric_name"),
            col("metric_value"),
            col("tags"),
            to_json(struct("*")).alias("json_payload")
        )
        df_for_cerebro.write.format("kafka") \
            .option("kafka.bootstrap.servers", "<relay-broker>") \
            .option("topic", "forge-events-indexed") \
            .mode("append") \
            .save()
        \`\`\`

        **Classificação:** ✅ Sem estado → Adequado para streaming

        ---

        ## Resumo de Classificação

        | Etapa | Nome | Tipo | Streaming? | Justificativa |
        |-------|------|------|-----------|---------------|
        | 1 | Parsing | Sem estado | ✅ Sim | Sem dependência de estado |
        | 2 | Enriquecimento Tenant | Lookup | ⚠️ Condicional | Requer cache de metadados (atualizar 1× por dia) |
        | 3 | Normalização | Sem estado | ✅ Sim | Sem dependência de estado |
        | 4 | Agregação por Serviço | Janela | ✅ Sim | Janela de 30 s em vez de 1h |
        | 5 | Agregação Global | Janela | ✅ Sim | Janela de 30 s em vez de 1h |
        | 6 | Taxa de Erro | Lookup | ⚠️ Condicional | Requer cache de SLA (atualizar 1× por dia) |
        | 7 | Detecção de Anomalia | Lookup | ⚠️ Condicional | Requer histórico de 24h (estado grande) |
        | 8 | SLA Violations | Lookup | ⚠️ Condicional | Requer histórico de 24h (estado grande) |
        | 9 | Enriquecimento Deployment | Lookup | ⚠️ Condicional | Requer cache de deployment (atualizar 1× por dia) |
        | 10 | Agregação por Versão | Janela | ✅ Sim | Janela de 30 s em vez de 1h |
        | 11 | Cálculo de Percentis | Janela | ✅ Sim | Janela de 30 s em vez de 1h |
        | 12 | Detecção de Mudança | Lookup | ❌ Não | Requer histórico de 7 dias (estado muito grande) |
        | 13 | Agregação para Billing | Janela | ✅ Sim | Janela de 1 dia em vez de 1 dia (sem mudança) |
        | 14 | Exportação Cerebro | Sem estado | ✅ Sim | Sem dependência de estado |

        ---

        ## Decisões de Implementação

        ### Etapas que permanecem em streaming (9 etapas):
        1, 3, 4, 5, 10, 11, 13, 14 + Etapa 2, 6, 9 com cache atualizado 1× por dia

        ### Etapas que permanecem em batch (2 etapas):
        7 (Detecção de Anomalia), 8 (SLA Violations), 12 (Detecção de Mudança)

        **Justificativa:** Etapas 7, 8, 12 requerem estado histórico grande (24h–7 dias) que não é viável em streaming com latência de 30 s. Essas etapas serão executadas em batch 1× por hora (ou 1× por dia) e seus resultados serão consumidos por Sentinel/Cerebro.

        ```

        **Verificação:**

        ```bash
        # Confirmar que documentação está completa
        grep -c "Etapa [0-9]" forge/docs/transformation-stages.md
        # Esperado: 14 etapas documentadas
        ```

