        ### 4.2 Gatilho de rollback

        **Ação:** Defina condições que disparam rollback automático.

        **Comando/Configuração:**

        ```markdown
        # Gatilhos de Rollback

        ## Definição
        Condições que, quando acionadas, disparam rollback automático do Forge de streaming para batch.

        ## Gatilhos Automáticos

        ### Gatilho 1: Completude Crítica
        **Condição:** Completude < 99.9% em 2 horas consecutivas.

        **Ação:**
        1. Alertar time de on-call (Slack, PagerDuty).
        2. Aguardar 5 min para confirmação manual.
        3. Se não confirmado, executar rollback automático.

        **Implementação:**
        ```python
        # Pseudocódigo de monitoramento
        def check_completeness_trigger():
            completeness_last_2h = get_completeness_last_2_hours()
            if all(c < 99.9 for c in completeness_last_2h):
                alert("COMPLETENESS_CRITICAL", completeness_last_2h)
                if not manual_override_within(minutes=5):
                    trigger_rollback("COMPLETENESS_CRITICAL")
        ```

        ### Gatilho 2: Corretude Crítica
        **Condição:** Corretude < 99.9% em 1 hora.

        **Ação:**
        1. Alertar time de on-call.
        2. Aguardar 5 min para confirmação manual.
        3. Se não confirmado, executar rollback automático.

        **Implementação:**
        ```python
        def check_correctness_trigger():
            correctness_last_1h = get_correctness_last_hour()
            if correctness_last_1h < 99.9:
                alert("CORRECTNESS_CRITICAL", correctness_last_1h)
                if not manual_override_within(minutes=5):
                    trigger_rollback("CORRECTNESS_CRITICAL")
        ```

        ### Gatilho 3: Latência Crítica
        **Condição:** > 5% de eventos com latência > 120 s em 1 hora.

        **Ação:**
        1. Alertar time de on-call.
        2. Aguardar 10 min para confirmação manual (latência pode ser transitória).
        3. Se não confirmado, executar rollback automático.

        **Implementação:**
        ```python
        def check_latency_trigger():
            latency_violation_pct = get_latency_violation_pct_last_hour()
            if latency_violation_pct > 5:
                alert("LATENCY_CRITICAL", latency_violation_pct)
                if not manual_override_within(minutes=10):
                    trigger_rollback("LATENCY_CRITICAL")
        ```

        ### Gatilho 4: Disponibilidade Crítica
        **Condição:** Disponibilidade < 99.0% em 1 dia.

        **Ação:**
        1. Alertar time de on-call.
        2. Aguardar 15 min para confirmação manual.
        3. Se não confirmado, executar rollback automático.

        **Implementação:**
        ```python
        def check_availability_trigger():
            availability_last_24h = get_availability_last_24_hours()
            if availability_last_24h < 99.0:
                alert("AVAILABILITY_CRITICAL", availability_last_24h)
                if not manual_override_within(minutes=15):
                    trigger_rollback("AVAILABILITY_CRITICAL")
        ```

        ### Gatilho 5: Erro de Consumidor
        **Condição:** Consumidor (Sentinel, Cerebro, Pepper) reporta erro ao ler dados do Forge.

        **Ação:**
        1. Alertar time de on-call.
        2. Aguardar 5 min para confirmação manual.
        3. Se não confirmado, executar rollback automático.

        **Implementação:**
        ```python
        def check_consumer_error_trigger():
            consumer_errors = get_consumer_errors_last_hour()
            if consumer_errors > 0:
                alert("CONSUMER_ERROR", consumer_errors)
                if not manual_override_within(minutes=5):
                    trigger_rollback("CONSUMER_ERROR")
        ```

        ## Gatilhos Manuais

        ### Gatilho Manual 1: Decisão de Negócio
        **Condição:** Time de produto/engenharia decide que streaming não é viável.

        **Ação:**
        1. Executar rollback imediatamente.
        2. Documentar razão em ticket.

        ### Gatilho Manual 2: Incidente Crítico
        **Condição:** Incidente crítico em produção (ex: perda de dados, corrupção).

        **Ação:**
        1. Executar rollback imediatamente.
        2. Investigar causa raiz.

        ## Resumo de Gatilhos

        | Gatilho | Condição | Ação | Tempo de confirmação |
        |---------|----------|------|----------------------|
