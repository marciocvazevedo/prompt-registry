            ## X. Ponto de não-retorno

            **Ponto de não-retorno:** Após o passo 3 (deploy de classificador de divergências em produção), o sistema começa a monitorar divergências e pode escalar automaticamente.

            **Por quê:** Uma vez que classificador está ativo, remover dual-run requer:
            1. Parar job de reconciliação
            2. Remover dados de divergências
            3. Perder histórico de comparação
            4. Impossível validar que streaming é equivalente a batch
            5. Risco de cutover sem validação adequada

            **Mitigação:** Antes do passo 3, testar reconciliação e classificação em staging (passos 1–2).

