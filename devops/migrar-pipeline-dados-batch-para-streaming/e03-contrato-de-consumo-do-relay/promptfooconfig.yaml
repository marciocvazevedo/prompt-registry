        ## 1. Defina SLOs do novo Forge (frescor, completude, disponibilidade, recuperação)

        **Ação:** Formalize os objetivos de nível de serviço para o Forge em streaming, baseado no objetivo de 2 min (p95) e nas necessidades dos consumidores.

