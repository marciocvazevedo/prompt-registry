        ## 6. Defina controle de vazão (backpressure) e proteção do Relay

        **Ação:** Configure limites de consumo para evitar sobrecarregar o Relay.

        **Onde:** Configuração do Forge (Spark, Kafka consumer).

        **Cálculo de limites:**

        ```python
        #!/usr/bin/env python3
        """
        Calcula limites de consumo para proteger o Relay.
        """

        # Dados do Relay (de Etapa 1)
        relay_broker_capacity_mb_per_sec = 1000  # [SUPOSIÇÃO] capacidade do broker
        relay_network_capacity_mb_per_sec = 500  # [SUPOSIÇÃO] capacidade de rede

        # Dados de volume (de Etapa 1)
        avg_rate_events_per_sec = 1000
        peak_rate_events_per_sec = 2000
        avg_event_size_bytes = 500

        # Cálculo de throughput
        avg_throughput_mb_per_sec = (avg_rate_events_per_sec * avg_event_size_bytes) / 1e6
        peak_throughput_mb_per_sec = (peak_rate_events_per_sec * avg_event_size_bytes) / 1e6

        print(f"Throughput do Forge:")
        print(f"  Médio: {avg_throughput_mb_per_sec:.2f} MB/s")
        print(f"  Pico: {peak_throughput_mb_per_sec:.2f} MB/s")

        # Cálculo de limite de consumo
        # Regra: não consumir mais de 50% da capacidade do Relay
        max_consumer_throughput_mb_per_sec = relay_broker_capacity_mb_per_sec * 0.5

        print(f"\nCapacidade do Relay:")
        print(f"  Broker: {relay_broker_capacity_mb_per_sec} MB/s")
        print(f"  Rede: {relay_network_capacity_mb_per_sec} MB/s")
        print(f"  Limite para Forge (50%): {max_consumer_throughput_mb_per_sec} MB/s")

        # Cálculo de fetch size
        # fetch.max.bytes = máximo de bytes a buscar por request
        # Regra: 1 segundo de dados em pico
        fetch_max_bytes = int(peak_throughput_mb_per_sec * 1e6)

        print(f"\nConfigurações de Kafka Consumer:")
        print(f"  fetch.max.bytes: {fetch_max_bytes} bytes ({fetch_max_bytes / 1e6:.2f} MB)")
        print(f"  fetch.min.bytes: 1 byte (buscar assim que houver dados)")
        print(f"  fetch.max.wait.ms: 500 ms (não esperar mais de 500 ms)")

        # Cálculo de max.poll.records
        # max.poll.records = máximo de registros a buscar por poll
        # Regra: 1 segundo de dados em pico
        max_poll_records = int(peak_rate_events_per_sec * 1)

        print(f"  max.poll.records: {max_poll_records} registros")

        # Cálculo de session.timeout.ms
        # session.timeout.ms = tempo máximo sem heartbeat antes de considerar consumer morto
        # Regra: 30 s (suficiente para processamento de 30 s)
        session_timeout_ms = 30000

        print(f"  session.timeout.ms: {session_timeout_ms} ms ({session_timeout_ms / 1000:.0f} s)")

        # Validação
        if peak_throughput_mb_per_sec <= max_consumer_throughput_mb_per_sec:
            print(f"\n✅ Throughput do Forge ({peak_throughput_mb_per_sec:.2f} MB/s) está dentro do limite ({max_consumer_throughput_mb_per_sec} MB/s)")
        else:
            print(f"\n❌ Throughput do Forge ({peak_throughput_mb_per_sec:.2f} MB/s) EXCEDE o limite ({max_consumer_throughput_mb_per_sec} MB/s)")
            print(f"   Considerar aumentar capacidade do Relay ou reduzir taxa de ingestão")
        ```

