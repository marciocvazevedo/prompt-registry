        ```markdown
        # Análise de Custo — Streaming vs Batch

        ## Suposições [SUPOSIÇÃO]
        - Volume de eventos: 1 bilhão/dia (11.6k eventos/s)
        - Tamanho médio de evento: 500 bytes
        - Retenção de dados: 90 dias
        - Custo de armazenamento: $0.023/GB/mês (S3 Standard)
        - Custo de compute: $0.50/hora por nó Spark
        - Cluster Spark: 4 nós (1 master + 3 workers)

        ## Cálculo de Armazenamento

        ### Batch (60 min)
        ```
        Volume/dia: 1B eventos × 500 bytes = 500 GB/dia
        Retenção: 90 dias × 500 GB = 45 TB
        Custo/mês: 45 TB × $0.023/GB = 45,000 GB × $0.023 = $1,035/mês
        ```

        ### Streaming (30 s)
        ```
        Volume/dia: 1B eventos × 500 bytes = 500 GB/dia
        Retenção: 90 dias × 500 GB = 45 TB
        Custo/mês: 45 TB × $0.023/GB = 45,000 GB × $0.023 = $1,035/mês

        Diferença: 0% (mesmo volume de dados)
        ```

        **Conclusão:** Armazenamento é idêntico

        ---

        ## Cálculo de Compute

        ### Batch (60 min)
        ```
        Frequência: 1 lote/hora × 24 horas = 24 lotes/dia
        Duração/lote: 40 min (transformação) + 10 min (escrita) = 50 min
        Tempo total/dia: 24 × 50 min = 1200 min = 20 horas
        Custo/dia: 4 nós × 20 horas × $0.50/hora = $40/dia
        Custo/mês: $40 × 30 = $1,200/mês
        ```

        ### Streaming (30 s)
        ```
        Frequência: Contínua (24/7)
        Duração: 24 horas/dia
        Custo/dia: 4 nós × 24 horas × $0.50/hora = $48/dia
        Custo/mês: $48 × 30 = $1,440/mês

        Diferença: $1,440 - $1,200 = $240/mês (20% mais caro)
        ```

        **Conclusão:** Streaming é 20% mais caro em compute

        ---

        ## Cálculo de Compactação

        ### Batch (60 min)
        ```
        Compactação: Não necessária (1 arquivo por hora)
        Custo: $0/mês
        ```

        ### Streaming (30 s)
        ```
        Arquivos/hora: 120 (1 a cada 30 s)
        Compactação: 1× por dia (24 partições)
        Tempo/compactação: 24 × 5 min = 120 min = 2 horas
        Custo/dia: 4 nós × 2 horas × $0.50/hora = $4/dia
        Custo/mês: $4 × 30 = $120/mês

        Diferença: $120/mês
        ```

        **Conclusão:** Compactação custa $120/mês

        ---

        ## Cálculo de Queries

        ### Batch (60 min)
        ```
        Queries/dia: 1000 (estimado)
        Tamanho/query: 10 GB (scan de 1 dia)
        Tempo/query: 30 s (com 4 nós)
        Custo/query: 4 nós × 30 s / 3600 s × $0.50/hora = $0.017
        Custo/dia: 1000 × $0.017 = $17/dia
        Custo/mês: $17 × 30 = $510/mês
        ```

        ### Streaming (30 s)
        ```
        Queries/dia: 1000 (estimado)
        Tamanho/query: 10 GB (scan de 1 dia)
        Tempo/query: 30 s (com 4 nós)
        Custo/query: 4 nós × 30 s / 3600 s × $0.50/hora = $0.017
        Custo/dia: 1000 × $0.017 = $17/dia
        Custo/mês: $17 × 30 = $510/mês

        Diferença: 0% (mesmo tempo de query)
        ```

        **Conclusão:** Queries têm mesmo custo

        ---

        ## Custo Total

        | Componente | Batch | Streaming | Diferença |
        |-----------|-------|-----------|-----------|
        | Armazenamento | $1,035 | $1,035 | $0 |
        | Compute | $1,200 | $1,440 | +$240 |
        | Compactação | $0 | $120 | +$120 |
        | Queries | $510 | $510 | $0 |
        | **Total** | **$2,745** | **$3,105** | **+$360 (13%)** |

        ---

        ## Benefícios Não-Monetários

        ### Latência
        - Batch: 60 min (dados chegam a cada hora)
        - Streaming: 2 min p95 (dados chegam em tempo real)
        - **Benefício:** Alertas mais rápidos, dashboards em tempo real

        ### Confiabilidade
        - Batch: Se um lote falha, o próximo processa 2× volume (risco de falha em cascata)
        - Streaming: Se um bloco falha, o próximo processa volume normal (mais resiliente)
        - **Benefício:** Menos falhas, menos reprocessamento

        ### Flexibilidade
        - Batch: Difícil adicionar novas transformações (requer reprocessamento de histórico)
        - Streaming: Fácil adicionar novas transformações (processa dados novos)
        - **Benefício:** Mais ágil para mudanças

