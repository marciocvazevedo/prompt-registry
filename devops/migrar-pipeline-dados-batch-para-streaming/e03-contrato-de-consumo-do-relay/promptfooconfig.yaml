                ## W. Riscos e mitigação

                | Risco | Probabilidade | Impacto | Mitigação |
                |---|---|---|---|
                | Dados de volume/latência inconsistentes entre fontes | Média | Médio | Validar com 2+ fontes independentes; reconciliar discrepâncias com time de Relay |
                | Acesso negado a logs/métricas de consumidores | Baixa | Alto | Solicitar acesso com antecedência; envolver líderes técnicos de Sentinel, Cerebro, Pepper |
                | Evento de teste não aparece no DW (falha de ingestão) | Baixa | Médio | Usar evento real em vez de injetado; verificar logs de erro do job |
                | Tabelas do DW foram dropadas/renomeadas recentemente | Baixa | Médio | Consultar histórico de DDL; validar com time de DW |
                | Custo mensal não está segregado por componente | Média | Baixo | Usar tags de billing; estimar proporção com base em logs de execução |
                | Causa raiz de falhas não está documentada em logs | Média | Médio | Entrevistar time de on-call; revisar tickets de incidente |

                ---

                ## Dados faltantes e confirmações necessárias

                ### Dados que faltam:

                1. **Retenção no Relay:** Quantos dias/horas de eventos estão disponíveis no Relay? (Necessário para validar se catch-up é possível.)
                2. **Tamanho de estado por tenant:** Qual é o maior tenant em termos de volume? (Necessário para dimensionar buffers em streaming.)
                3. **Distribuição de latência:** Qual é a distribuição completa (p50, p75, p90, p95, p99) de latência? (Necessário para SLA de 2 min.)
                4. **Configuração de retry:** Qual é a política de retry do job? (Necessário para entender impacto de falhas.)
                5. **Dependências de junção:** Quais tabelas de lookup são usadas nas etapas 3, 7, 12? Qual é o tamanho e frequência de atualização? (Necessário para streaming.)
                6. **SLA de Sentinel:** Qual é o SLA exato de latência para dashboards em tempo real? (Necessário para validar se 2 min é suficiente.)
                7. **Custo de Relay:** Qual é o custo de manter dados no Relay por mais tempo (para replay)? (Necessário para trade-off de retenção.)

                ### Confirmações que derrubariam/validariam escolhas futuras:

                - Se **taxa de falha > 5%**, a migração para streaming é crítica (reduz impacto de falhas).
                - Se **latência p95 > 120 min**, o SLA de 2 min é agressivo e requer validação com Sentinel.
                - Se **custo de Spark > 50% do total**, otimizar transformações é prioritário.
                - Se **tamanho de estado por tenant > 10 GB**, streaming com state store distribuído é necessário.
                - Se **retenção no Relay < 24h**, replay de falhas é limitado; necessário buffer local.

                ---

                ## Suposições marcadas

                | # | Suposição | Razão | Confirmação necessária |
                |---|---|---|---|
                | [SUPOSIÇÃO-1] | Relay é Kafka ou Pulsar | Padrão em arquiteturas de event streaming | Verificar tipo real de Relay |
                | [SUPOSIÇÃO-2] | Volume é 1M–100M eventos/dia | Típico para SaaS de observabilidade | Coletar métrica real de `relay_messages_total` |
                | [SUPOSIÇÃO-3] | Latência atual é ~105 min (60 min cron + 40 min Spark + 5 min escrita) | Baseado em descrição do problema | Medir com evento de teste |
                | [SUPOSIÇÃO-4] | DW é Snowflake, BigQuery ou Redshift | Padrão em SaaS | Verificar tipo real de DW |
                | [SUPOSIÇÃO-5] | Taxa de falha é 1–5% | Típico para jobs batch | Coletar histórico de 30 dias |
                | [SUPOSIÇÃO-6] | Custo mensal é $5k–$50k | Baseado em volume e latência | Coletar fatura real |
                | [SUPOSIÇÃO-7] | Sentinel lê a cada 30 s | Típico para dashboards em tempo real | Validar com time de Sentinel |
                | [SUPOSIÇÃO-8] | Cerebro lê a cada 60 s | Típico para indexação contínua | Validar com time de Cerebro |
                | [SUPOSIÇÃO-9] | Pepper roda uma vez por dia (02:00 UTC) | Típico para relatórios de billing | Validar com time de Pepper |

                ---

                ## Próximos passos (Etapa 2)

                Após conclusão desta etapa, os dados coletados alimentarão:

                - **Etapa 2:** Arquitetura de streaming (Kafka Streams, Flink, Spark Structured Streaming).
                - **Etapa 3:** Prototipagem de um bloco de 30 s.
                - **Etapa 4:** Validação de latência e custo do protótipo.
                - **Etapa 5–10:** Migração gradual com canary, validação de consumidores, rollback.
