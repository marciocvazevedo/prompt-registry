        ## Dados faltantes e confirmações necessárias

        ### Dados que faltam:
        1. **Retenção atual do Relay:** Qual é a retenção configurada? (Assumido 7 dias)
        2. **Número de partições:** Qual é o número exato de partições do tópico? (Assumido 32)
        3. **Chave de particionamento:** Qual é a chave atual? (Assumido `tenant_id`)
        4. **Capacidade do Relay:** Qual é a capacidade de throughput do broker? (Assumido 1000 MB/s)
        5. **Distribuição de atraso:** Qual é a distribuição real de latência de eventos? (Assumido p99 = 30 s)
        6. **Tamanho de estado por tenant:** Qual é o maior tenant em termos de volume? (Necessário para dimensionar buffers)
        7. **Custo de retenção:** Qual é o custo de manter dados no Relay por 7 dias? (Necessário para trade-off)

        ### Confirmações que derrubariam/validariam escolhas futuras:
        - Se **retenção < 2 dias**, aumentar para 7 dias (ou usar buffer local)
        - Se **partições < 16**, aumentar para 32 (ou reduzir paralelismo)
        - Se **chave ≠ tenant_id**, mudar para `tenant_id` (ou aceitar falta de ordem)
        - Se **throughput > 500 MB/s**, reduzir taxa ou aumentar capacidade do Relay
        - Se **p99 latência > 60 s**, aumentar watermark para 90 s (ou aceitar perda de eventos)
        - Se **tamanho de estado > 10 GB**, usar state store distribuído (ou reduzir retenção)
        - Se **custo de retenção > $1k/mês**, reduzir para 3 dias (ou usar buffer local)

