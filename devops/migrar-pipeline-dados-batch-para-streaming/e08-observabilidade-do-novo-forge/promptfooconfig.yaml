            col("version"),
            col("region"),
            col("environment"),
            col("timestamp"),
            col("metric_name"),
            col("metric_value")
        )
        df_with_deployment.write.mode("overwrite").parquet("/data/forge/with_deployment")
        \`\`\`

        **Classificação:** ⚠️ Enriquecimento por lookup → Requer estado (cache de deployment)

