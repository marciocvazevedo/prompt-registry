        ## 7. Defina versionamento e evolução de schema

        **Ação:** Formalize como mudanças de schema serão gerenciadas.

        **Onde:** Configuração do Forge e Schema Registry.

        **Análise de compatibilidade:**

        ```markdown
        # Versionamento e Evolução de Schema

        ## Schema Atual (v1.0)
        ```json
        {
          "type": "record",
          "name": "ForgeEvent",
          "namespace": "com.aegis.forge",
          "fields": [
            {"name": "event_id", "type": "string"},
            {"name": "tenant_id", "type": "string"},
            {"name": "timestamp", "type": "long"},
            {"name": "service_id", "type": "string"},
            {"name": "metric_name", "type": "string"},
            {"name": "metric_value", "type": "double"},
            {"name": "tags", "type": {"type": "map", "values": "string"}}
          ]
        }
        ```

        ## Política de Evolução
        ### Mudanças Compatíveis (Permitidas)
        - ✅ Adicionar campo com valor padrão
        - ✅ Remover campo (se não for crítico)
        - ✅ Renomear campo (com alias)
        - ✅ Mudar tipo de campo (se compatível, ex: int → long)

        ### Mudanças Incompatíveis (Requerem Versionamento)
        - ❌ Remover campo crítico (ex: event_id, tenant_id)
        - ❌ Mudar tipo de forma incompatível (ex: string → int)
        - ❌ Renomear campo sem alias
        - ❌ Mudar semântica de campo

        ## Processo de Evolução
        1. **Proposta:** Descrever mudança de schema em ADR
        2. **Validação:** Confirmar compatibilidade com consumidores (Sentinel, Cerebro, Pepper)
        3. **Registro:** Registrar nova versão no Schema Registry
        4. **Teste:** Testar com dados reais em staging
        5. **Deploy:** Fazer deploy de novo schema em produção
        6. **Monitoramento:** Monitorar taxa de erro de desserialização

        ## Exemplo: Adicionar Campo Novo
        ```json
        {
          "type": "record",
          "name": "ForgeEvent",
          "namespace": "com.aegis.forge",
          "fields": [
            {"name": "event_id", "type": "string"},
            {"name": "tenant_id", "type": "string"},
            {"name": "timestamp", "type": "long"},
            {"name": "service_id", "type": "string"},
            {"name": "metric_name", "type": "string"},
            {"name": "metric_value", "type": "double"},
            {"name": "tags", "type": {"type": "map", "values": "string"}},
            {"name": "trace_id", "type": ["null", "string"], "default": null}  // Novo campo
          ]
        }
        ```

        ## Validação
        - [ ] Schema Registry está configurado com compatibilidade BACKWARD
        - [ ] Consumidores conseguem lidar com novos campos
        - [ ] Testes de desserialização passam com ambas as versões
        ```

        **Verificação:**

        ```bash
