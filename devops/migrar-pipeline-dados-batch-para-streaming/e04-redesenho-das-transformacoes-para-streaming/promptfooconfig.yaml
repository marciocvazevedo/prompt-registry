        ```yaml
        # forge/k8s/streaming-job.yaml
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: forge-streaming-config
          namespace: forge
        data:
          relay-broker: "kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092"
          relay-topic: "forge-events-raw"
          consumer-group: "forge-streaming-v1"
          checkpoint-dir: "/data/forge/checkpoint"
          output-dir: "/data/forge/aggregated"
          processing-interval: "30s"
        ---
        apiVersion: batch/v1
        kind: Deployment
        metadata:
          name: forge-streaming-ingest
          namespace: forge
        spec:
          replicas: 1  # [SUPOSIÇÃO] 1 réplica; aumentar se necessário
          selector:
            matchLabels:
              app: forge-streaming-ingest
          template:
            metadata:
              labels:
                app: forge-streaming-ingest
            spec:
              containers:
              - name: spark-driver
                image: forge:streaming-v1  # [SUPOSIÇÃO] imagem Docker customizada
                imagePullPolicy: IfNotPresent
                command:
                - spark-submit
                - --master
                - k8s://https://kubernetes.default.svc.cluster.local:443
                - --deploy-mode
                - client
                - --driver-memory
                - 4g
                - --executor-memory
                - 4g
                - --executor-cores
                - 2
                - --num-executors
                - 16  # [SUPOSIÇÃO] 16 executores para 32 partições
                - --packages
                - org.apache.spark:spark-sql-kafka-0-10_2.12:3.3.0
                - /opt/forge/jobs/streaming_ingest.py
                env:
                - name: RELAY_BROKER
                  valueFrom:
                    configMapKeyRef:
                      name: forge-streaming-config
                      key: relay-broker
                - name: RELAY_TOPIC
                  valueFrom:
                    configMapKeyRef:
                      name: forge-streaming-config
                      key: relay-topic
                - name: CONSUMER_GROUP
                  valueFrom:
                    configMapKeyRef:
                      name: forge-streaming-config
                      key: consumer-group
                - name: CHECKPOINT_DIR
                  valueFrom:
                    configMapKeyRef:
                      name: forge-streaming-config
                      key: checkpoint-dir
                - name: OUTPUT_DIR
                  valueFrom:
                    configMapKeyRef:
                      name: forge-streaming-config
                      key: output-dir
                resources:
                  requests:
                    memory: "4Gi"
                    cpu: "2"
                  limits:
                    memory: "8Gi"
                    cpu: "4"
                livenessProbe:
