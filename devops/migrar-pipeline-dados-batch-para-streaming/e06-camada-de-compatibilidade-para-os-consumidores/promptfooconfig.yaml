        def write_anomalies(df_anomalies):
            """Escrever anomalias com deduplicação"""
            # Deduplicar por anomaly_id
            df_deduplicated = df_anomalies.dropDuplicates(["anomaly_id"])
            # Append
            df_deduplicated.write.mode("append") \
                .parquet("/data/forge/anomalies")
            print(f"{df_deduplicated.count()} anomalias escritas")
        ```

        **Validação:**
        - [ ] Cada `anomaly_id` aparece no máximo 1× na saída
        - [ ] Nenhuma anomalia é perdida

