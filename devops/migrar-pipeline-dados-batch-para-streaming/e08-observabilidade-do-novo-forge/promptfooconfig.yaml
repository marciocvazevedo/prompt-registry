        ## X. Ponto de não-retorno

        **Ponto de não-retorno:** Após o passo 7 (deploy do código de transformação em staging), o Forge começa a processar eventos em streaming.

        **Por quê:** Uma vez que o job de streaming está rodando e escrevendo no DW, voltar atrás requer:
        1. Parar o job de streaming
        2. Limpar dados parciais do DW
        3. Reexecutar batch para recuperar dados
        4. Validar equivalência novamente

        **Mitigação:** Antes do passo 7, executar testes completos em staging (passos 6–9).

