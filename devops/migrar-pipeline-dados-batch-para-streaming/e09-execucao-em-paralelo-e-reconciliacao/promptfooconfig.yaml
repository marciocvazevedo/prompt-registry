        ## 1. Defina métricas mínimas e instrumentação por etapa

        **Ação:** Criar matriz de métricas com ponto de instrumentação, tipo (gauge/counter/histogram), granularidade e retenção.

        **Onde:** Arquivo `forge/config/metrics-instrumentation.md` (novo) no repositório do Forge.

        **Procedimento:**

        ```markdown
        # Instrumentação de Métricas — Forge Streaming

        ## Matriz de Métricas Mínimas

        ### Categoria 1: Consumo do Relay

        #### Métrica 1.1: Consumer Lag (atraso de consumo)
        **Definição:** Diferença entre offset máximo no Relay e offset commitado pelo consumer group.
        **Tipo:** Gauge (valor instantâneo)
        **Fórmula:**
        ```
        lag_por_partição = max_offset_relay - offset_commitado_consumer
        lag_total = SUM(lag_por_partição) para todas as partições
        ```
        **Granularidade:** Por partição, por consumer group
        **Retenção:** 15 dias
        **Ponto de Instrumentação:** Consumer group do Kafka (nativo)
        **Métrica Prometheus:**
        ```
        kafka_consumergroup_lag{group="forge-streaming-v1", partition="0"}
        kafka_consumergroup_lag{group="forge-streaming-v1", partition="1"}
        ...
        ```
        **Alerta:**
        ```
        ForgeConsumerLagHigh: lag_total > 100k eventos por 5 min
        Severidade: WARNING
        Ação: Verificar taxa de consumo (Métrica 1.2)
        ```
        **Validação:**
        - [ ] Métrica é coletada a cada 30 s
        - [ ] Lag diminui quando job está processando
        - [ ] Lag aumenta quando job está parado

        ---

        #### Métrica 1.2: Throughput (taxa de consumo)
        **Definição:** Número de eventos consumidos por segundo.
        **Tipo:** Counter (incrementa monotonicamente)
        **Fórmula:**
        ```
        throughput = rate(kafka_consumergroup_offset_committed_total[5m])
        ```
        **Granularidade:** Por consumer group, por tópico
        **Retenção:** 15 dias
        **Ponto de Instrumentação:** Consumer group do Kafka (nativo)
        **Métrica Prometheus:**
        ```
        rate(kafka_consumergroup_offset_committed_total{group="forge-streaming-v1"}[5m])
        ```
        **Alerta:**
        ```
        ForgeConsumptionRateLow: throughput < 100 evt/s por 10 min
        Severidade: WARNING
        Ação: Verificar status do job (CPU, memória, logs)
        ```
        **Validação:**
        - [ ] Métrica é coletada a cada 30 s
        - [ ] Throughput é > 1000 evt/s em produção
        - [ ] Throughput cai quando há erro

        ---

        #### Métrica 1.3: Offset Commit Success Rate
        **Definição:** Percentual de commits bem-sucedidos.
        **Tipo:** Counter (commits bem-sucedidos e falhados)
        **Fórmula:**
        ```
        success_rate = commits_sucesso / (commits_sucesso + commits_falha) * 100
        ```
        **Granularidade:** Por consumer group
        **Retenção:** 15 dias
        **Ponto de Instrumentação:** Consumer group do Kafka (nativo)
        **Métrica Prometheus:**
        ```
        rate(kafka_consumergroup_commit_latency_total{group="forge-streaming-v1"}[5m])
        rate(kafka_consumergroup_commit_latency_count{group="forge-streaming-v1"}[5m])
        ```
        **Alerta:**
        ```
        ForgeOffsetCommitFailure: success_rate < 95% por 5 min
        Severidade: CRITICAL
        Ação: Verificar status do Relay e DW
        ```
        **Validação:**
        - [ ] Métrica é coletada a cada 30 s
        - [ ] Success rate é > 99% em produção
        - [ ] Success rate cai quando há erro de dependência

        ---

        ### Categoria 2: Processamento e Transformação

        #### Métrica 2.1: Latência de Processamento por Micro-lote
        **Definição:** Tempo decorrido desde a leitura do Relay até a escrita no DW.
        **Tipo:** Histogram (distribuição de valores)
        **Fórmula:**
        ```
        latência = timestamp_escrita_dw - timestamp_leitura_relay
        ```
        **Granularidade:** Por micro-lote (30 s), percentis (p50, p95, p99)
        **Retenção:** 15 dias
        **Ponto de Instrumentação:** Código de streaming (antes de ler, depois de escrever)
        **Métrica Prometheus:**
        ```
        forge_processing_latency_seconds_bucket{le="0.1"}
        forge_processing_latency_seconds_bucket{le="1"}
        forge_processing_latency_seconds_bucket{le="10"}
        forge_processing_latency_seconds_bucket{le="120"}
        forge_processing_latency_seconds_bucket{le="+Inf"}
        ```
        **Alerta:**
        ```
        ForgeProcessingLatencyHigh: p95 > 60 s por 5 min
        Severidade: WARNING
        Ação: Verificar tamanho de micro-lote, paralelismo
        ```
        **Validação:**
        - [ ] Métrica é coletada a cada micro-lote (30 s)
        - [ ] p95 é < 60 s em produção
        - [ ] p95 aumenta quando há erro de transformação

        ---

        #### Métrica 2.2: Taxa de Erro por Tipo
        **Definição:** Número de eventos que falharam em cada etapa de transformação.
        **Tipo:** Counter (incrementa monotonicamente)
        **Fórmula:**
        ```
        taxa_erro = rate(forge_errors_total{type="..."}[5m])
        ```
        **Granularidade:** Por tipo de erro (INVALID_EVENT, TRANSIENT_ERROR, DEPLOY_ERROR, etc)
        **Retenção:** 15 dias
        **Ponto de Instrumentação:** Código de streaming (em cada etapa de transformação)
        **Métrica Prometheus:**
        ```
        forge_errors_total{type="INVALID_EVENT"}
        forge_errors_total{type="TRANSIENT_ERROR"}
        forge_errors_total{type="DEPLOY_ERROR"}
        forge_errors_total{type="BUSINESS_LOGIC_ERROR"}
        ```
        **Alerta:**
        ```
        ForgeErrorRateHigh: taxa_erro > 1% por 5 min
        Severidade: WARNING
        Ação: Verificar tipo de erro, inspecionar DLQ
        ```
        **Validação:**
        - [ ] Métrica é coletada a cada erro
        - [ ] Taxa de erro é < 0.1% em produção
        - [ ] Taxa de erro aumenta quando há problema

        ---

        #### Métrica 2.3: Tamanho do Estado (RocksDB)
        **Definição:** Tamanho em bytes do estado mantido em memória/disco.
        **Tipo:** Gauge (valor instantâneo)
        **Fórmula:**
        ```
        tamanho_estado = tamanho_rocksdb_em_bytes
        ```
        **Granularidade:** Por executor, por tabela de estado
        **Retenção:** 15 dias
        **Ponto de Instrumentação:** Código de streaming (após cada operação stateful)
        **Métrica Prometheus:**
        ```
        forge_state_size_bytes{executor="0", table="anomalies"}
        forge_state_size_bytes{executor="1", table="anomalies"}
        ```
        **Alerta:**
        ```
        ForgeStateSizeHigh: tamanho_estado > 5 GB por 5 min
        Severidade: WARNING
        Ação: Verificar se há vazamento de memória, aumentar retenção
        ```
        **Validação:**
        - [ ] Métrica é coletada a cada 30 s
        - [ ] Tamanho de estado é < 2 GB em produção
        - [ ] Tamanho de estado cresce linearmente com tempo

        ---

        ### Categoria 3: Escrita no Data Warehouse

        #### Métrica 3.1: Taxa de Escrita (eventos/s)
        **Definição:** Número de eventos escritos no DW por segundo.
        **Tipo:** Counter (incrementa monotonicamente)
        **Fórmula:**
        ```
        taxa_escrita = rate(forge_events_written_total[5m])
        ```
        **Granularidade:** Por tabela, por partição
        **Retenção:** 15 dias
        **Ponto de Instrumentação:** Código de streaming (após escrever no DW)
        **Métrica Prometheus:**
        ```
        forge_events_written_total{table="aggregated"}
        forge_events_written_total{table="by_service"}
        ```
        **Alerta:**
        ```
        ForgeWriteRateLow: taxa_escrita < 100 evt/s por 10 min
        Severidade: WARNING
        Ação: Verificar status do DW, taxa de consumo
        ```
        **Validação:**
        - [ ] Métrica é coletada a cada escrita
        - [ ] Taxa de escrita é > 1000 evt/s em produção
        - [ ] Taxa de escrita cai quando há erro de DW

        ---

        #### Métrica 3.2: Latência de Escrita
        **Definição:** Tempo decorrido desde o início até o fim da escrita no DW.
        **Tipo:** Histogram (distribuição de valores)
        **Fórmula:**
        ```
        latência_escrita = timestamp_fim_escrita - timestamp_inicio_escrita
        ```
        **Granularidade:** Por tabela, percentis (p50, p95, p99)
        **Retenção:** 15 dias
        **Ponto de Instrumentação:** Código de streaming (antes e depois de escrever)
        **Métrica Prometheus:**
        ```
        forge_write_latency_seconds_bucket{table="aggregated", le="0.1"}
        forge_write_latency_seconds_bucket{table="aggregated", le="1"}
        forge_write_latency_seconds_bucket{table="aggregated", le="10"}
        ```
        **Alerta:**
        ```
        ForgeWriteLatencyHigh: p95 > 10 s por 5 min
        Severidade: WARNING
        Ação: Verificar performance do DW, tamanho de arquivo
        ```
        **Validação:**
        - [ ] Métrica é coletada a cada escrita
        - [ ] p95 é < 5 s em produção
        - [ ] p95 aumenta quando há problema de I/O

        ---

        #### Métrica 3.3: Taxa de Duplicatas
        **Definição:** Número de eventos duplicados detectados durante escrita.
        **Tipo:** Counter (incrementa monotonicamente)
        **Fórmula:**
        ```
        taxa_duplicatas = rate(forge_duplicates_detected_total[5m])
        ```
        **Granularidade:** Por tabela
        **Retenção:** 15 dias
        **Ponto de Instrumentação:** Código de deduplicação (ao remover duplicata)
        **Métrica Prometheus:**
        ```
        forge_duplicates_detected_total{table="aggregated"}
        forge_duplicates_detected_total{table="by_service"}
        ```
        **Alerta:**
        ```
        ForgeDuplicateRateHigh: taxa_duplicatas > 10 evt/s por 5 min
        Severidade: WARNING
        Ação: Verificar se há reprocessamento, validar deduplicação
        ```
        **Validação:**
        - [ ] Métrica é coletada a cada duplicata detectada
        - [ ] Taxa de duplicatas é < 1 evt/s em produção
        - [ ] Taxa de duplicatas aumenta durante replay

