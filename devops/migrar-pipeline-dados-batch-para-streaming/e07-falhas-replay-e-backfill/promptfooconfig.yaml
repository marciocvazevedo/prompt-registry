        ### Tabela de Comportamento (behavior_changes)
        **Características:**
        - Chave natural: `(window_start, tenant_id, change_id)`
        - Modo de saída: Batch (1× por dia)
        - Frequência de escrita: A cada 1 dia
        - Tamanho de linha: ~300 bytes

