        ## 5. Crie script de validação de compatibilidade com consumidores

        **Ação:** Implemente script que valida que Sentinel, Cerebro e Pepper conseguem ler dados de streaming.

        **Onde:** Arquivo `forge/scripts/validate_consumer_compatibility.py` (novo) no repositório do Forge.

        **Procedimento:**

        ```python
        #!/usr/bin/env python3
        """
        Validação de Compatibilidade com Consumidores
        Testa que Sentinel, Cerebro e Pepper conseguem ler dados de streaming.
        """
        import sys
        import json
        import time
        import logging
        from datetime import datetime, timedelta
        from typing import Dict, List, Tuple
        import subprocess

        # [SUPOSIÇÃO] Usando Snowflake como DW; adaptar para BigQuery/Redshift conforme necessário
        import snowflake.connector

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        class ConsumerCompatibilityValidator:
            """Valida compatibilidade com consumidores"""
            
            def __init__(self, dw_connection_string: str):
                """Inicializa conexão com DW"""
                self.conn = snowflake.connector.connect(dw_connection_string)
                self.cursor = self.conn.cursor()
                self.report = {
                    "timestamp": datetime.utcnow().isoformat(),
                    "consumers": {
                        "sentinel": {"status": "PENDING", "checks": []},
                        "cerebro": {"status": "PENDING", "checks": []},
                        "pepper": {"status": "PENDING", "checks": []}
                    },
                    "overall_status": "PENDING"
                }
            
            # ========== SENTINEL VALIDATION ==========
            def validate_sentinel_views(self) -> Dict:
                """Validar que views de Sentinel existem e retornam dados"""
                logger.info("Validando compatibilidade com Sentinel...")
                checks = []
                
                # Check 1: Views existem
                views = [
                    "aggregated_hourly",
                    "by_service_hourly",
                    "by_version_hourly",
                    "percentiles_hourly",
                    "sla_violations_hourly",
                    "anomalies_hourly",
                    "error_rates_hourly"
                ]
                
                for view in views:
                    try:
                        self.cursor.execute(f"SELECT COUNT(*) FROM forge.{view} LIMIT 1")
                        result = self.cursor.fetchone()
                        checks.append({
                            "check": f"View {view} exists",
                            "status": "PASS",
                            "details": f"View exists and returns data"
                        })
                        logger.info(f"  ✅ View {view} exists")
                    except Exception as e:
                        checks.append({
                            "check": f"View {view} exists",
                            "status": "FAIL",
                            "details": str(e)
                        })
                        logger.error(f"  ❌ View {view} failed: {e}")
                
                # Check 2: Lag é 5 min
                try:
                    self.cursor.execute("""
                        SELECT
                        MAX(window_end) as max_window_end,
                        CURRENT_TIMESTAMP() - INTERVAL '5 minutes' as cutoff
                        FROM forge.aggregated_hourly
                    """)
                    result = self.cursor.fetchone()
                    max_window_end = result[0]
                    cutoff = result[1]
                    
                    if max_window_end < cutoff:
                        checks.append({
                            "check": "Lag is 5 minutes",
                            "status": "PASS",
                            "details": f"Max window_end: {max_window_end}, Cutoff: {cutoff}"
                        })
                        logger.info(f"  ✅ Lag is 5 minutes")
                    else:
                        checks.append({
                            "check": "Lag is 5 minutes",
                            "status": "FAIL",
                            "details": f"Max window_end: {max_window_end} >= Cutoff: {cutoff}"
                        })
                        logger.error(f"  ❌ Lag is not 5 minutes")
                except Exception as e:
                    checks.append({
                        "check": "Lag is 5 minutes",
                        "status": "FAIL",
                        "details": str(e)
                    })
                    logger.error(f"  ❌ Lag check failed: {e}")
                
                # Check 3: Aggregations are correct
                try:
                    self.cursor.execute("""
                        SELECT
                        COUNT(*) as row_count,
                        SUM(request_count) as total_requests,
                        SUM(error_count) as total_errors
                        FROM forge.aggregated_hourly
                        WHERE window_end >= CURRENT_TIMESTAMP() - INTERVAL '24 hours'
                    """)
                    result = self.cursor.fetchone()
                    row_count, total_requests, total_errors = result
                    
                    if row_count > 0 and total_requests > 0:
                        checks.append({
                            "check": "Aggregations are correct",
                            "status": "PASS",
                            "details": f"Rows: {row_count}, Requests: {total_requests}, Errors: {total_errors}"
                        })
                        logger.info(f"  ✅ Aggregations are correct")
                    else:
                        checks.append({
                            "check": "Aggregations are correct",
                            "status": "FAIL",
                            "details": f"No data or invalid aggregations"
                        })
                        logger.error(f"  ❌ Aggregations are incorrect")
                except Exception as e:
                    checks.append({
                        "check": "Aggregations are correct",
                        "status": "FAIL",
                        "details": str(e)
                    })
                    logger.error(f"  ❌ Aggregations check failed: {e}")
                
                # Determine overall status
                status = "PASS" if all(c["status"] == "PASS" for c in checks) else "FAIL"
                
                return {
                    "status": status,
                    "checks": checks
                }
            
            # ========== CEREBRO VALIDATION ==========
            def validate_cerebro_kafka(self) -> Dict:
                """Validar que Kafka tem eventos para Cerebro"""
                logger.info("Validando compatibilidade com Cerebro...")
                checks = []
                
                # Check 1: Kafka topic exists
                try:
                    result = subprocess.run(
                        ["kafka-topics.sh", "--list", "--bootstrap-server", "<relay-broker>"],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    if "forge-events-indexed" in result.stdout:
                        checks.append({
                            "check": "Kafka topic forge-events-indexed exists",
                            "status": "PASS",
                            "details": "Topic exists"
                        })
                        logger.info(f"  ✅ Kafka topic exists")
                    else:
                        checks.append({
                            "check": "Kafka topic forge-events-indexed exists",
                            "status": "FAIL",
                            "details": "Topic not found"
                        })
                        logger.error(f"  ❌ Kafka topic not found")
                except Exception as e:
                    checks.append({
                        "check": "Kafka topic forge-events-indexed exists",
                        "status": "FAIL",
                        "details": str(e)
                    })
                    logger.error(f"  ❌ Kafka check failed: {e}")
                
                # Check 2: Kafka has events
                try:
                    result = subprocess.run(
                        ["kafka-console-consumer.sh",
                        "--bootstrap-server", "<relay-broker>",
                        "--topic", "forge-events-indexed",
                        "--max-messages", "1",
                        "--from-beginning"],
                        capture_output=True,
                        text=True,
                        timeout=10
                    )
                    if result.stdout:
                        checks.append({
                            "check": "Kafka has events",
                            "status": "PASS",
                            "details": "Events found in topic"
                        })
                        logger.info(f"  ✅ Kafka has events")
                    else:
                        checks.append({
                            "check": "Kafka has events",
                            "status": "FAIL",
                            "details": "No events in topic"
                        })
                        logger.error(f"  ❌ Kafka has no events")
                except Exception as e:
                    checks.append({
                        "check": "Kafka has events",
                        "status": "FAIL",
                        "details": str(e)
                    })
                    logger.error(f"  ❌ Kafka events check failed: {e}")
                
                # Check 3: Enriched events table has data
                try:
                    self.cursor.execute("""
                        SELECT COUNT(*) FROM forge.enriched
                        WHERE ingestion_timestamp >= CURRENT_TIMESTAMP() - INTERVAL '1 hour'
                    """)
                    result = self.cursor.fetchone()
                    count = result[0]
                    
                    if count > 0:
                        checks.append({
                            "check": "Enriched events table has data",
                            "status": "PASS",
                            "details": f"Found {count} events in last hour"
                        })
                        logger.info(f"  ✅ Enriched events table has data")
                    else:
                        checks.append({
                            "check": "Enriched events table has data",
                            "status": "FAIL",
                            "details": "No events in last hour"
                        })
                        logger.error(f"  ❌ Enriched events table has no data")
                except Exception as e:
                    checks.append({
                        "check": "Enriched events table has data",
                        "status": "FAIL",
                        "details": str(e)
                    })
                    logger.error(f"  ❌ Enriched events check failed: {e}")
                
                # Check 4: No duplicates in enriched events
                try:
                    self.cursor.execute("""
                        SELECT
                        COUNT(*) as total,
                        COUNT(DISTINCT event_id) as unique
                        FROM forge.enriched
                        WHERE ingestion_timestamp >= CURRENT_TIMESTAMP() - INTERVAL '1 hour'
                    """)
                    result = self.cursor.fetchone()
                    total, unique = result
                    
                    if total == unique:
                        checks.append({
                            "check": "No duplicates in enriched events",
                            "status": "PASS",
                            "details": f"Total: {total}, Unique: {unique}"
                        })
                        logger.info(f"  ✅ No duplicates")
                    else:
                        checks.append({
                            "check": "No duplicates in enriched events",
                            "status": "FAIL",
                            "details": f"Total: {total}, Unique: {unique} (duplicates found)"
                        })
                        logger.error(f"  ❌ Duplicates found")
                except Exception as e:
                    checks.append({
                        "check": "No duplicates in enriched events",
                        "status": "FAIL",
                        "details": str(e)
                    })
                    logger.error(f"  ❌ Duplicates check failed: {e}")
                
                # Determine overall status
                status = "PASS" if all(c["status"] == "PASS" for c in checks) else "FAIL"
                
                return {
                    "status": status,
                    "checks": checks
                }
            
            # ========== PEPPER VALIDATION ==========
            def validate_pepper_billing(self) -> Dict:
                """Validar que Pepper pode ler dados de billing"""
                logger.info("Validando compatibilidade com Pepper...")
                checks = []
                
                # Check 1: Billing view exists
                try:
                    self.cursor.execute("SELECT COUNT(*) FROM forge.billing_events_daily LIMIT 1")
                    result = self.cursor.fetchone()
                    checks.append({
                        "check": "Billing view exists",
                        "status": "PASS",
                        "details": "View exists"
                    })
                    logger.info(f"  ✅ Billing view exists")
                except Exception as e:
                    checks.append({
                        "check": "Billing view exists",
                        "status": "FAIL",
                        "details": str(e)
                    })
                    logger.error(f"  ❌ Billing view failed: {e}")
                
                # Check 2: Completude >= 99.9%
                try:
                    self.cursor.execute("""
                        SELECT
                        COUNT(DISTINCT event_id) as billing_count,
                        (SELECT COUNT(*) FROM relay_events WHERE day = CURRENT_DATE - 1) as relay_count
                        FROM forge.billing_events_daily
                        WHERE day_start < CURRENT_DATE()
                    """)
                    result = self.cursor.fetchone()
                    billing_count, relay_count = result
                    
                    if relay_count > 0:
                        completeness = (billing_count / relay_count) * 100
                        if completeness >= 99.9:
                            checks.append({
                                "check": "Completude >= 99.9%",
                                "status": "PASS",
                                "details": f"Completude: {completeness:.2f}%"
                            })
                            logger.info(f"  ✅ Completude: {completeness:.2f}%")
                        else:
                            checks.append({
                                "check": "Completude >= 99.9%",
                                "status": "FAIL",
                                "details": f"Completude: {completeness:.2f}% (< 99.9%)"
                            })
                            logger.error(f"  ❌ Completude: {completeness:.2f}%")
                    else:
                        checks.append({
                            "check": "Completude >= 99.9%",
                            "status": "FAIL",
                            "details": "No relay events found"
                        })
                        logger.error(f"  ❌ No relay events")
                except Exception as e:
                    checks.append({
                        "check": "Completude >= 99.9%",
                        "status": "FAIL",
                        "details": str(e)
                    })
                    logger.error(f"  ❌ Completude check failed: {e}")
                
                # Check 3: No duplicates in billing
                try:
                    self.cursor.execute("""
                        SELECT
                        COUNT(*) as total,
                        COUNT(DISTINCT event_id) as unique
                        FROM forge.billing_events_daily
                        WHERE day_start < CURRENT_DATE()
                    """)
                    result = self.cursor.fetchone()
                    total, unique = result
                    
                    if total == unique:
                        checks.append({
                            "check": "No duplicates in billing",
                            "status": "PASS",
                            "details": f"Total: {total}, Unique: {unique}"
                        })
                        logger.info(f"  ✅ No duplicates")
                    else:
                        checks.append({
                            "check": "No duplicates in billing",
                            "status": "FAIL",
                            "details": f"Total: {total}, Unique: {unique} (duplicates found)"
                        })
                        logger.error(f"  ❌ Duplicates found")
                except Exception as e:
                    checks.append({
                        "check": "No duplicates in billing",
                        "status": "FAIL",
                        "details": str(e)
                    })
                    logger.error(f"  ❌ Duplicates check failed: {e}")
                
                # Check 4: Billing data is from previous days only
                try:
                    self.cursor.execute("""
                        SELECT
                        MAX(day_start) as max_day,
                        CURRENT_DATE() - 1 as expected_max_day
                        FROM forge.billing_events_daily
                    """)
                    result = self.cursor.fetchone()
                    max_day, expected_max_day = result
                    
                    if max_day < datetime.now().date():
                        checks.append({
                            "check": "Billing data is from previous days only",
                            "status": "PASS",
                            "details": f"Max day: {max_day}"
                        })
                        logger.info(f"  ✅ Billing data is from previous days")
                    else:
                        checks.append({
                            "check": "Billing data is from previous days only",
                            "status": "FAIL",
                            "details": f"Max day: {max_day} (includes today)"
                        })
                        logger.error(f"  ❌ Billing data includes today")
                except Exception as e:
                    checks.append({
                        "check": "Billing data is from previous days only",
                        "status": "FAIL",
                        "details": str(e)
                    })
                    logger.error(f"  ❌ Billing data check failed: {e}")
                
                # Determine overall status
                status = "PASS" if all(c["status"] == "PASS" for c in checks) else "FAIL"
                
                return {
                    "status": status,
                    "checks": checks
                }
            
            def run_validation(self) -> Dict:
                """Executar validação completa"""
                logger.info("Iniciando validação de compatibilidade com consumidores...")
                
                # Validar Sentinel
                self.report["consumers"]["sentinel"] = self.validate_sentinel_views()
                
                # Validar Cerebro
                self.report["consumers"]["cerebro"] = self.validate_cerebro_kafka()
                
                # Validar Pepper
                self.report["consumers"]["pepper"] = self.validate_pepper_billing()
                
                # Determinar status geral
                all_pass = all(
                    consumer["status"] == "PASS"
                    for consumer in self.report["consumers"].values()
                )
                self.report["overall_status"] = "PASS" if all_pass else "FAIL"
                
                logger.info("\nValidação concluída.")
                return self.report
            
            def save_report(self, output_file: str):
                """Salvar relatório em arquivo JSON"""
                with open(output_file, "w") as f:
                    json.dump(self.report, f, indent=2)
                logger.info(f"Relatório salvo em: {output_file}")
            
            def print_summary(self):
                """Imprimir resumo do relatório"""
                print("\n" + "="*80)
                print("RELATÓRIO DE COMPATIBILIDADE COM CONSUMIDORES")
                print("="*80)
                print(f"Timestamp: {self.report['timestamp']}")
                print(f"Status geral: {self.report['overall_status']}")
                print()
                
                for consumer_name, consumer_report in self.report["consumers"].items():
                    print(f"Consumidor: {consumer_name.upper()}")
                    print(f"  Status: {consumer_report['status']}")
                    for check in consumer_report["checks"]:
                        status_icon = "✅" if check["status"] == "PASS" else "❌"
                        print(f"  {status_icon} {check['check']}: {check['details']}")
                    print()
                
                print("="*80)

        def main():
            """Função principal"""
            import os
            
            # [SUPOSIÇÃO] Conexão com DW via variável de ambiente
            dw_conn_string = os.getenv("DW_CONNECTION_STRING")
            if not dw_conn_string:
                print("Erro: DW_CONNECTION_STRING não definida")
                sys.exit(1)
            
            validator = ConsumerCompatibilityValidator(dw_conn_string)
            report = validator.run_validation()
            
            # Salvar relatório
            output_file = f"consumer_compatibility_report_{datetime.utcnow().strftime('%Y%m%d_%H%M%S')}.json"
            validator.save_report(output_file)
            
            # Imprimir resumo
            validator.print_summary()
            
            # Retornar código de saída
            sys.exit(0 if report["overall_status"] == "PASS" else 1)

        if __name__ == "__main__":
            main()
        ```

