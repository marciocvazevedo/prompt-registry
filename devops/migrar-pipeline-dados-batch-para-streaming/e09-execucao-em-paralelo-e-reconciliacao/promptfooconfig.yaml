        ### Tabela de Anomalias (anomalies)
        **Características:**
        - Chave natural: `(window_start, tenant_id, anomaly_id)`
        - Modo de saída: Batch (1× por hora)
        - Frequência de escrita: A cada 1 hora
        - Tamanho de linha: ~300 bytes

        **Estratégia:** **Append com Deduplicação**
        - Deduplicar por `anomaly_id` antes de escrever
        - Usar `dropDuplicates` para remover duplicatas de reprocessamento
        - Append é seguro porque anomalias são imutáveis (uma vez detectada, não muda)

        **Implementação:**
        ```python
        def write_anomalies(df_anomalies):
            """Escrever anomalias com deduplicação"""
            # Deduplicar por anomaly_id
            df_deduplicated = df_anomalies.dropDuplicates(["anomaly_id"])
            # Append
            df_deduplicated.write.mode("append") \
                .parquet("/data/forge/anomalies")
            print(f"{df_deduplicated.count()} anomalias escritas")
        ```

        **Validação:**
        - [ ] Cada `anomaly_id` aparece no máximo 1× na saída
        - [ ] Nenhuma anomalia é perdida

        ---

        ### Tabela de SLA Violations (sla_violations)
        **Características:**
        - Chave natural: `(window_start, tenant_id, service_id, violation_id)`
        - Modo de saída: Batch (1× por hora)
        - Frequência de escrita: A cada 1 hora
        - Tamanho de linha: ~250 bytes

        **Estratégia:** **Append com Deduplicação**
        - Idêntica à tabela de anomalias
        - Deduplicar por `violation_id`

        ---

        ### Tabela de Comportamento (behavior_changes)
        **Características:**
        - Chave natural: `(window_start, tenant_id, change_id)`
        - Modo de saída: Batch (1× por dia)
        - Frequência de escrita: A cada 1 dia
        - Tamanho de linha: ~300 bytes

        **Estratégia:** **Append com Deduplicação**
        - Idêntica às tabelas de anomalias e SLA violations
        - Deduplicar por `change_id`

        ---

        ### Tabela de Exportação Cerebro (cerebro)
        **Características:**
        - Chave natural: `event_id`
        - Modo de saída: Append (eventos são imutáveis)
        - Frequência de escrita: A cada 30 s
        - Tamanho de linha: ~500 bytes
        - **Nota:** Escrita é para Kafka, não para Parquet

        **Estratégia:** **Append com Deduplicação**
        - Deduplicar por `event_id` antes de enviar para Kafka
        - Kafka garante que cada `event_id` é processado pelo menos 1×
        - Consumidor (Cerebro) deve deduplicar por `event_id`

        **Implementação:**
        ```python
        def write_cerebro(df_cerebro, batch_id):
            """Escrever para Cerebro com deduplicação"""
            # Deduplicar por event_id
            df_deduplicated = df_cerebro.dropDuplicates(["event_id"])
            # Escrever para Kafka
            df_deduplicated.write.format("kafka") \
                .option("kafka.bootstrap.servers", "<relay-broker>") \
                .option("topic", "forge-events-indexed") \
                .mode("append") \
                .save()
            print(f"Batch {batch_id}: {df_deduplicated.count()} eventos enviados para Cerebro")

        query = df_for_cerebro.writeStream \
            .foreachBatch(lambda df, batch_id: write_cerebro(df, batch_id)) \
            .outputMode("append") \
            .trigger(processingTime="30 seconds") \
            .start()
        ```

        ---

        ## Resumo de Estratégia de Escrita

        | Tabela | Chave Natural | Modo | Frequência | Estratégia | Dedup? |
        |--------|---------------|------|-----------|-----------|--------|
        | by_service | window + tenant + service | update | 30 s | Upsert/Merge | Sim |
        | aggregated | window + tenant | update | 30 s | Upsert/Merge | Sim |
        | by_version | window + tenant + service + version | update | 30 s | Upsert/Merge | Sim |
        | percentiles | window + tenant | update | 30 s | Upsert/Merge | Sim |
        | billing_events | day + tenant | update | 1 h | Staging + Merge | Sim |
        | anomalies | window + tenant + anomaly_id | append | 1 h | Append + Dedup | Sim |
        | sla_violations | window + tenant + service + violation_id | append | 1 h | Append + Dedup | Sim |
        | behavior_changes | window + tenant + change_id | append | 1 d | Append + Dedup | Sim |
        | cerebro | event_id | append | 30 s | Append + Dedup (Kafka) | Sim |
        | error_rates | window + tenant + service | update | 30 s | Upsert/Merge | Sim |
        | enriched | event_id | append | 30 s | Append + Dedup | Sim |

        ```

