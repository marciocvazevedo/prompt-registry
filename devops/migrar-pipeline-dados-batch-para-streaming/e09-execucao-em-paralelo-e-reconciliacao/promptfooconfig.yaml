        ### Latência de Busca
        | Tipo de Busca | Antes (Batch) | Depois (Streaming) | Melhoria |
        |---------------|---------------|-------------------|----------|
        | Busca por tenant | 105 min | 2 min | 52× mais rápido |
        | Busca por service | 105 min | 2 min | 52× mais rápido |
        | Busca por timestamp | 105 min | 2 min | 52× mais rápido |
        | Busca por erro | 105 min | 2 min | 52× mais rápido |

        ### Tamanho do Índice
        ```
        Antes (batch):
        - 1 lote/hora × 24 horas = 24 lotes/dia
        - Tamanho: 24 × 100 GB = 2.4 TB/dia
        - Sem duplicatas (batch é idempotente)

        Depois (streaming):
        - 120 blocos/hora × 24 horas = 2880 blocos/dia
        - Tamanho: 2.4 TB/dia (mesmo volume)
        - Sem duplicatas (deduplicação por event_id)
        ```

        **Conclusão:** Tamanho do índice é idêntico, mas dados chegam 52× mais rápido.

